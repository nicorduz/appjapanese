rt>わら<\/rt><\/ruby>っていよう<\/p><p class=\"lp\">- Sustantivo + より + Predicado<\/p><p class=\"lp\">(La partícula “より” aquí indica el agente que realiza la acción. Esto también suena como una expresión ligeramente más formal y rígida. Para una expresión informal o coloquial, se utiliza más “から” en su lugar.)<\/p><p class=\"lp\"><ruby>山田<rt>やまだ<\/rt><\/ruby><ruby>様<rt>さま<\/rt><\/ruby>よりがありました ・  ・ ロシアより<ruby>攻撃<rt>こうげき<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>けた ・  ・ <ruby>市<rt>し<\/rt><\/ruby><ruby>役所<rt>やくしょ<\/rt><\/ruby>よりが<ruby>届<rt>とど<\/rt><\/ruby>いた<\/p><p class=\"lp\"><ruby>山田<rt>やまだ<\/rt><\/ruby><ruby>様<rt>さま<\/rt><\/ruby>から・・・ ・  ・  ・ ロシアから・・・ ・  ・ <ruby>市<rt>し<\/rt><\/ruby><ruby>役所<rt>やくしょ<\/rt><\/ruby>から・・・<\/p><p class=\"lp\">- より + Verbo / Adjetivo<\/p><p class=\"lp\">(La partícula “より” aquí se utiliza en un sentido como “<ruby>一<rt>いち<\/rt><\/ruby><ruby>段<rt>だん<\/rt><\/ruby>と(aún más)”, “いっそう(más allá)” o “さらに(todavía más)”. Aquí, a diferencia de los casos anteriores, el acento recae en la “り” de “より”.)<\/p><p class=\"lp\">より<ruby>良<rt>よ<\/rt><\/ruby>い<ruby>社会<rt>しゃかい<\/rt><\/ruby>になる ・  ・ <ruby>夜<rt>よる<\/rt><\/ruby>はより<ruby>寒<rt>さむ<\/rt><\/ruby>くなってきた ・  ・ より<ruby>勉強<rt>べんきょう<\/rt><\/ruby>すれば<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>が<ruby>上手<rt>じょうず<\/rt><\/ruby>になる<\/p><p class=\"lp\">オリンピックのモットーは「より<ruby>速<rt>はや<\/rt><\/ruby>く、より<ruby>高<rt>たか<\/rt><\/ruby>く、より<ruby>強<rt>つよ<\/rt><\/ruby>く」です<\/p>","text":"助詞じょし「より」の復習ふくしゅう - Sustantivo + より + Predicado(La partícula “より” aquí indica la base para la comparación o selección. La forma “AよりBのほうが” o “BのほうがAより” se utiliza para expresar la evaluación más concreta.)わたし私わたくしはがブドウより好すきだ ・ わたし私わたくしはブドウより桃もものほうが好すきだ ・ 　わたし私わたくしはのほうがブドウより好すきだ東京とうきょうはロンドンより暑あつい ・ ロンドンより東京とうきょうのほうが暑あつい ・ 　東京とうきょうのほうがロンドンより暑あつい日本にっぽんにた時ときより日本にっぽん語ごを話はなせる ・ 日本にっぽんにた時ときより今いまのほうが日本にっぽん語ごを話はなせる- Sustantivo + より + Predicado(La partícula “より” aquí indica el tiempo o lugar del comienzo o del punto de partida de algo. Esto suena como una expresión ligeramente más formal y rígida. Para una expresión informal o coloquial, se utiliza más “から” en su lugar.)結婚式けっこんしきが２じ時じより行おこなわれる ・ そのは横浜港よこはまこうより出港しゅっこうした ・ 多摩たまがわ川かわよりこうは東京とうきょうです・・・午後ごご２時じから・・・ ・  ・ 　・・・横浜よこはま港こうから・・・ ・ 多摩たま川かわから・・・- Sustantivo / Verbo (en forma diccionario) + より + Predicado(La partícula “より” aquí se utiliza en el sentido de seleccionar una cosa entre varias opciones disponibles o rechazar otras.)マンガより小説しょうせつを読よむべきだ ・  ・ 薬くすりをむより運動うんどうしなさい ・ 泣ないているより笑わらっていよう- Sustantivo + より + Predicado(La partícula “より” aquí indica el agente que realiza la acción. Esto también suena como una expresión ligeramente más formal y rígida. Para una expresión informal o coloquial, se utiliza más “から” en su lugar.)山田やまだ様さまよりがありました ・  ・ ロシアより攻撃こうげきを受うけた ・  ・ 市し役所やくしょよりが届とどいた山田やまだ様さまから・・・ ・  ・  ・ ロシアから・・・ ・  ・ 市し役所やくしょから・・・- より + Verbo / Adjetivo(La partícula “より” aquí se utiliza en un sentido como “一いち段だんと(aún más)”, “いっそう(más allá)” o “さらに(todavía más)”. Aquí, a diferencia de los casos anteriores, el acento recae en la “り” de “より”.)より良よい社会しゃかいになる ・  ・ 夜よるはより寒さむくなってきた ・  ・ より勉強べんきょうすれば日本にっぽん語ごが上手じょうずになるオリンピックのモットーは「より速はやく、より高たかく、より強つよく」です"},{"id":"L012","file":"20260330_Particula__BAKARI_.docx","cat":"part","catLabel":"Partículas","title":"助詞「ばかり」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「ばかり」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivo / Verbo en forma diccionario o en forma-て + ばかり + Predicado<\/p><p class=\"lp\">(La partícula “ばかり” tiene una función restrictiva, indicando que el elemento enfatizado es el único, o que un contenido específico se repite varias veces, excluyendo así otras posibilidades. A menudo esta expresión indica la actitud crítica del hablante. En el lenguaje hablado, “ばっかり” también se utiliza.)<\/p><p class=\"lp\"><ruby>兄弟<rt>きょうだい<\/rt><\/ruby>げんかになると、ばかり<ruby>怒<rt>おこ<\/rt><\/ruby>られる ・ <ruby>冷蔵庫<rt>れいぞうこ<\/rt><\/ruby>にはビールばっかり<ruby>入<rt>はい<\/rt><\/ruby>っている<\/p><p class=\"lp\"><ruby>十分<rt>じゅうぶん<\/rt><\/ruby>にしたので、あとは<ruby>祈<rt>いの<\/rt><\/ruby>るばかりだ ・ <ruby>夫<rt>おっと<\/rt><\/ruby>はべるばっかりで、<ruby>自分<rt>じぶん<\/rt><\/ruby>では<ruby>料理<rt>りょうり<\/rt><\/ruby>をしない<\/p><p class=\"lp\"><ruby>赤<rt>あか<\/rt><\/ruby>ちゃんはミルクをむと<ruby>眠<rt>ねむ<\/rt><\/ruby>ってばかりだ ・ うちのは<ruby>遊<rt>あそ<\/rt><\/ruby>んでばっかりで、<ruby>勉強<rt>べんきょう<\/rt><\/ruby>しません<\/p><p class=\"lp\">- Sustantivo (palabra numérica) + ばかり + Predicado<\/p><p class=\"lp\">(La partícula “ばかり” se utiliza después de palabras relacionadas con la cantidad para indicar un grado o extensión aproximados. “ばかり” de este uso puede reformularse como “ほど” o “くらい”. Sin embargo, “ばかり” transimite una sensación de cortesía más que “ほど” o “くらい”, añadiendo mayor grado de vaguedad.)<\/p><p class=\"lp\">20ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>ばかりれてしまいました ・  ・  ・ <ruby>夜<rt>よる<\/rt><\/ruby>のに<ruby>雪<rt>ゆき<\/rt><\/ruby>が50cmばかりもりました<\/p><p class=\"lp\">20ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>ほど・・・ ・ 20ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>くらい・・・ ・ 50cmほど・・・　　　50cmくらい・・・<\/p><p class=\"lp\">- Verbo en forma informal pretérito + ばかり + Predicado<\/p><p class=\"lp\">(La partícula “ばかり” se utiliza para indicar que la acción acaba de completarse. En el lenguaje hablado, “ばっかり” también se utiliza. Cuando el verbo que sigue es “だ/だった/です/でした”, “ばかり” de este uso puede reformularse como “ところ”.)<\/p><p class=\"lp\"><ruby>山田<rt>やまだ<\/rt><\/ruby>さんはたった<ruby>今<rt>いま<\/rt><\/ruby>、<ruby>帰<rt>かえ<\/rt><\/ruby>ったばかりです ・  ・ <ruby>先<rt>さき<\/rt><\/ruby>ほどべたばっかりで、おなか<ruby>腹<rt>はら<\/rt><\/ruby>はすいていません<\/p><p class=\"lp\">・・・<ruby>帰<rt>かえ<\/rt><\/ruby>ったところです ・  ・ ・・・<ruby>食<rt>た<\/rt><\/ruby>べたところで、・・・<\/p><p class=\"lp\">これは<ruby>今日<rt>きょう<\/rt><\/ruby>ったばっかりの<ruby>帽子<rt>ぼうし<\/rt><\/ruby>です ・  ・ <ruby>日本<rt>にっぽん<\/rt><\/ruby>にたばかりの<ruby>頃<rt>ころ<\/rt><\/ruby>は、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>はできませんでした<\/p><p class=\"lp\">- Verbo en forma informal pretérito + ばかり + に + Predicado<\/p><p class=\"lp\">(La partícula “ばかり”, utilizándose en la forma “～たばかりに”, indica causa del predicado. Se puede reformular como “～たせいで”. Normalmente transmite la idea de que ha ocurrido algo malo. “ばっかり” también se utiliza.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>がうそを<ruby>言<rt>い<\/rt><\/ruby>ったばかりに、<ruby>皆<rt>みな<\/rt><\/ruby>が<ruby>困惑<rt>こんわく<\/rt><\/ruby>した ・ カニを<ruby>食<rt>た<\/rt><\/ruby>べたばっかりに、アレルギーの<ruby>症状<rt>しょうじょう<\/rt><\/ruby>が<ruby>出<rt>で<\/rt><\/ruby>た<\/p><p class=\"lp\">・・・<ruby>言<rt>い<\/rt><\/ruby>ったせいで、・・・ ・  ・  ・ ・・・<ruby>食<rt>た<\/rt><\/ruby>べたせいで、・・・<\/p>","text":"助詞じょし「ばかり」の復習ふくしゅう - Sustantivo / Verbo en forma diccionario o en forma-て + ばかり + Predicado(La partícula “ばかり” tiene una función restrictiva, indicando que el elemento enfatizado es el único, o que un contenido específico se repite varias veces, excluyendo así otras posibilidades. A menudo esta expresión indica la actitud crítica del hablante. En el lenguaje hablado, “ばっかり” también se utiliza.)兄弟きょうだいげんかになると、ばかり怒おこられる ・ 冷蔵庫れいぞうこにはビールばっかり入はいっている十分じゅうぶんにしたので、あとは祈いのるばかりだ ・ 夫おっとはべるばっかりで、自分じぶんでは料理りょうりをしない赤あかちゃんはミルクをむと眠ねむってばかりだ ・ うちのは遊あそんでばっかりで、勉強べんきょうしません- Sustantivo (palabra numérica) + ばかり + Predicado(La partícula “ばかり” se utiliza después de palabras relacionadas con la cantidad para indicar un grado o extensión aproximados. “ばかり” de este uso puede reformularse como “ほど” o “くらい”. Sin embargo, “ばかり” transimite una sensación de cortesía más que “ほど” o “くらい”, añadiendo mayor grado de vaguedad.)20ぷん分ぶんばかりれてしまいました ・  ・  ・ 夜よるのに雪ゆきが50cmばかりもりました20ぷん分ぶんほど・・・ ・ 20ぷん分ぶんくらい・・・ ・ 50cmほど・・・　　　50cmくらい・・・- Verbo en forma informal pretérito + ばかり + Predicado(La partícula “ばかり” se utiliza para indicar que la acción acaba de completarse. En el lenguaje hablado, “ばっかり” también se utiliza. Cuando el verbo que sigue es “だ/だった/です/でした”, “ばかり” de este uso puede reformularse como “ところ”.)山田やまださんはたった今いま、帰かえったばかりです ・  ・ 先さきほどべたばっかりで、おなか腹はらはすいていません・・・帰かえったところです ・  ・ ・・・食たべたところで、・・・これは今日きょうったばっかりの帽子ぼうしです ・  ・ 日本にっぽんにたばかりの頃ころは、日本にっぽん語ごはできませんでした- Verbo en forma informal pretérito + ばかり + に + Predicado(La partícula “ばかり”, utilizándose en la forma “～たばかりに”, indica causa del predicado. Se puede reformular como “～たせいで”. Normalmente transmite la idea de que ha ocurrido algo malo. “ばっかり” también se utiliza.)彼かれがうそを言いったばかりに、皆みなが困惑こんわくした ・ カニを食たべたばっかりに、アレルギーの症状しょうじょうが出でた・・・言いったせいで、・・・ ・  ・  ・ ・・・食たべたせいで、・・・"},{"id":"L013","file":"20260406_Particula__SAE_.docx","cat":"part","catLabel":"Partículas","title":"助詞「さえ」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「さえ」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivo + (で) さえ + Predicado<\/p><p class=\"lp\">(La partícula “さえ” se utiliza para enfatizar que todos los demás asuntos están incluidos citando un ejemplo extremo. La partícula “さえ” de este uso, cuando va seguida de palabras que denotan seres vivos o números, se utiliza a veces junto con la partícula “で” en formula de “でさえ”.)<\/p><p class=\"lp\"><ruby>歯<rt>は<\/rt><\/ruby>がくて、<ruby>柔<rt>やわ<\/rt><\/ruby>らかいパンさえ<ruby>食<rt>た<\/rt><\/ruby>べられない ・ <ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>をし<ruby>勉強<rt>べんきょう<\/rt><\/ruby>したけど、ひらがなさえ<ruby>読<rt>よ<\/rt><\/ruby>めない<\/p><p class=\"lp\">サル(で)さえを<ruby>使<rt>つか<\/rt><\/ruby>うことができる ・  ・ <ruby>気<rt>き<\/rt><\/ruby>のい<ruby>山本<rt>やまもと<\/rt><\/ruby>さんは１０ぷん<ruby>分<rt>で<\/rt><\/ruby>さえつことができない<\/p><p class=\"lnote\">Nota : La partículas “と”, “に”, o otras, que se coloca antes de los verbos en las oraciones estándar, también se puede utilizar antes de “さえ” formando expresiones “Sustantivo+とさえ”, “Sustantivo+にさえ”, etc.<\/p><p class=\"lp\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>はとさえ<ruby>会話<rt>かいわ<\/rt><\/ruby>ができるそうだ ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>はおりにさえ<ruby>優<rt>やさ<\/rt><\/ruby>しくできない<\/p><p class=\"lp\">- [Sustantivo / Adjetivo en forma de adverbio / Verbo en forma-ます] + さえ + Verbo en forma hipotética + ば、 + Cláusula Principal<\/p><p class=\"lp\">(La partícula “さえ” en la forma “〜さえ～ば” expresa que, si se cumple la condición mínima mencionada en la cláusula subordinada, ocurrirá lo mencionado en la cláusula principal.)<\/p><p class=\"lp\"><ruby>時間<rt>じかん<\/rt><\/ruby>さえあれば、もっと<ruby>漢字<rt>かんじ<\/rt><\/ruby>の<ruby>勉強<rt>べんきょう<\/rt><\/ruby>ができるのに ・ <ruby>優<rt>やさ<\/rt><\/ruby>しくさえすれば、<ruby>犬<rt>いぬ<\/rt><\/ruby>は<ruby>吠<rt>ほ<\/rt><\/ruby>えません<\/p><p class=\"lp\"><ruby>健康<rt>けんこう<\/rt><\/ruby>でさえいてくれれば、た<ruby>他<rt>ほか<\/rt><\/ruby>の<ruby>心配<rt>しんぱい<\/rt><\/ruby>はない ・ <ruby>途中<rt>とちゅう<\/rt><\/ruby>でを<ruby>飲<rt>の<\/rt><\/ruby>みさえすれば、マラソンを<ruby>完走<rt>かんそう<\/rt><\/ruby>できる<\/p><p class=\"lp\">- Expresiones fijas con “さえ”<\/p><p class=\"lp\">- ただでさえ～ ・ (Cuando una circunstancia adicional se superpone a una ya existente, se utiliza con “〜のに” para enfatizar algo aún más.)<\/p><p class=\"lp\">ただでさえ<ruby>忙<rt>いそが<\/rt><\/ruby>しいのに、さらに<ruby>仕事<rt>しごと<\/rt><\/ruby>が<ruby>増<rt>ふ<\/rt><\/ruby>えた ・ ただでさえ<ruby>給料<rt>きゅうりょう<\/rt><\/ruby>が<ruby>安<rt>やす<\/rt><\/ruby>いのに、ボーナスも<ruby>出<rt>で<\/rt><\/ruby>ない<\/p><p class=\"lp\">ただでさえ<ruby>暑<rt>しょ<\/rt><\/ruby>いのに、エアコンが<ruby>壊<rt>こわ<\/rt><\/ruby>れた ・ <ruby>彼<rt>かれ<\/rt><\/ruby>はただでさえ<ruby>金持<rt>かねも<\/rt><\/ruby>ちなのに、<ruby>宝<rt>たから<\/rt><\/ruby>くじも<ruby>当<rt>あ<\/rt><\/ruby>たったらしい<\/p>","text":"助詞じょし「さえ」の復習ふくしゅう - Sustantivo + (で) さえ + Predicado(La partícula “さえ” se utiliza para enfatizar que todos los demás asuntos están incluidos citando un ejemplo extremo. La partícula “さえ” de este uso, cuando va seguida de palabras que denotan seres vivos o números, se utiliza a veces junto con la partícula “で” en formula de “でさえ”.)歯はがくて、柔やわらかいパンさえ食たべられない ・ 日本にっぽん語ごをし勉強べんきょうしたけど、ひらがなさえ読よめないサル(で)さえを使つかうことができる ・  ・ 気きのい山本やまもとさんは１０ぷん分でさえつことができないNota : La partículas “と”, “に”, o otras, que se coloca antes de los verbos en las oraciones estándar, también se puede utilizar antes de “さえ” formando expresiones “Sustantivo+とさえ”, “Sustantivo+にさえ”, etc.彼女かのじょはとさえ会話かいわができるそうだ ・  ・ 彼かれはおりにさえ優やさしくできない- [Sustantivo / Adjetivo en forma de adverbio / Verbo en forma-ます] + さえ + Verbo en forma hipotética + ば、 + Cláusula Principal(La partícula “さえ” en la forma “〜さえ～ば” expresa que, si se cumple la condición mínima mencionada en la cláusula subordinada, ocurrirá lo mencionado en la cláusula principal.)時間じかんさえあれば、もっと漢字かんじの勉強べんきょうができるのに ・ 優やさしくさえすれば、犬いぬは吠ほえません健康けんこうでさえいてくれれば、た他ほかの心配しんぱいはない ・ 途中とちゅうでを飲のみさえすれば、マラソンを完走かんそうできる- Expresiones fijas con “さえ”- ただでさえ～ ・ (Cuando una circunstancia adicional se superpone a una ya existente, se utiliza con “〜のに” para enfatizar algo aún más.)ただでさえ忙いそがしいのに、さらに仕事しごとが増ふえた ・ ただでさえ給料きゅうりょうが安やすいのに、ボーナスも出でないただでさえ暑しょいのに、エアコンが壊こわれた ・ 彼かれはただでさえ金持かねもちなのに、宝たからくじも当あたったらしい"},{"id":"L014","file":"20260406_Particula__SURA_.docx","cat":"part","catLabel":"Partículas","title":"助詞「すら」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「すら」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivo + (で) すら + Predicado<\/p><p class=\"lp\">(La partícula “すら” se utiliza para expresar un estado extremo que el oyente considera inesperado. La partícula “すら”, cuando va seguida de palabras que denotan seres vivos o números, se utiliza a veces junto con la partícula “で” en formula de “ですら”. La partícula “すら” tiene mismo significado que la partícula “さえ”. Sin embargo, en comparación con “さえ”, “すら” da la impresión de ser una forma más antigua y se utiliza a menudo en la escritura formal. Además, “すら” tiene un énfasis más fuerte, y transmite un sentimiento mucho más negativo o suena bastante sarcástico.<\/p><p class=\"lp\"><ruby>体調<rt>たいちょう<\/rt><\/ruby>がく、<ruby>食事<rt>しょくじ<\/rt><\/ruby>すらできない ・  ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>はがいと、あいさつすらしない<\/p><p class=\"lp\"><ruby>試験<rt>しけん<\/rt><\/ruby>のは、１じかん<ruby>時間<rt>で<\/rt><\/ruby>すらにしたくない ・  ・ <ruby>最近<rt>さいきん<\/rt><\/ruby>、<ruby>日本人<rt>で<\/rt><\/ruby>すらめない<ruby>漢字<rt>かんじ<\/rt><\/ruby>の<ruby>名前<rt>なまえ<\/rt><\/ruby>が<ruby>多<rt>おお<\/rt><\/ruby>い<\/p><p class=\"lnote\">Nota 1: La partículas “と”, “に”, o otras, que se coloca antes de los verbos en las oraciones estándar, también se puede utilizar antes de “すら” formando expresiones “Sustantivo+とすら”, “Sustantivo+にすら”, etc.<\/p><p class=\"lp\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>は<ruby>旅<rt>たび<\/rt><\/ruby>が<ruby>好<rt>す<\/rt><\/ruby>きで、<ruby>家族<rt>かぞく<\/rt><\/ruby>とすら<ruby>旅行<rt>りょこう<\/rt><\/ruby>しない ・  ・ ここで<ruby>君<rt>きみ<\/rt><\/ruby>に<ruby>会<rt>あ<\/rt><\/ruby>えるとは<ruby>夢<rt>ゆめ<\/rt><\/ruby>にすら<ruby>思<rt>おも<\/rt><\/ruby>わなかった<\/p><p class=\"lnote\">Nota 2: La partícula “さえ” en la forma “〜さえ～ば” expresa que, si se cumple la condición mínima mencionada en la cláusula subordinada, ocurrirá lo mencionado en la cláusula principal. En cambio, la partícula “すら” no tiene esta función.<\/p>","text":"助詞じょし「すら」の復習ふくしゅう - Sustantivo + (で) すら + Predicado(La partícula “すら” se utiliza para expresar un estado extremo que el oyente considera inesperado. La partícula “すら”, cuando va seguida de palabras que denotan seres vivos o números, se utiliza a veces junto con la partícula “で” en formula de “ですら”. La partícula “すら” tiene mismo significado que la partícula “さえ”. Sin embargo, en comparación con “さえ”, “すら” da la impresión de ser una forma más antigua y se utiliza a menudo en la escritura formal. Además, “すら” tiene un énfasis más fuerte, y transmite un sentimiento mucho más negativo o suena bastante sarcástico.体調たいちょうがく、食事しょくじすらできない ・  ・  ・ 彼かれはがいと、あいさつすらしない試験しけんのは、１じかん時間ですらにしたくない ・  ・ 最近さいきん、日本人ですらめない漢字かんじの名前なまえが多おおいNota 1: La partículas “と”, “に”, o otras, que se coloca antes de los verbos en las oraciones estándar, también se puede utilizar antes de “すら” formando expresiones “Sustantivo+とすら”, “Sustantivo+にすら”, etc.彼女かのじょは旅たびが好すきで、家族かぞくとすら旅行りょこうしない ・  ・ ここで君きみに会あえるとは夢ゆめにすら思おもわなかったNota 2: La partícula “さえ” en la forma “〜さえ～ば” expresa que, si se cumple la condición mínima mencionada en la cláusula subordinada, ocurrirá lo mencionado en la cláusula principal. En cambio, la partícula “すら” no tiene esta función."},{"id":"L015","file":"20260420_Particula__TARI_.docx","cat":"part","catLabel":"Partículas","title":"助詞「たり」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「たり」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivo1 / Adjetivo1 / Verbo1 + たり+ Sustantivo2 / Adjetivo2 / Verbo2 + たり + Verbo “する” / Partícula “で”, “と”, “の”, “を”, etc. + Verbo<\/p><p class=\"lp\">(La partícula “たり” se utiliza para indicar múltiples acciones o estados en paralelo. Se suele utilizar en conjuntos de dos o más, como en “〜たり、〜たりする”. Después de los sustantivos sigue “だったり” en vez de “たり”. Los adjetivos o verbos que preceden a “たり” siempre son en forma pasado sin “た”, pero es más fácil recordarlos como expresiones en las que “り” acompaña a los adjetivos o verbos en forma completa del pasado.)<\/p><p class=\"lp\"><ruby>朝食<rt>ちょうしょく<\/rt><\/ruby>はパンだったりごはん<ruby>飯<rt>めし<\/rt><\/ruby>だったりします ・ <ruby>電車<rt>でんしゃ<\/rt><\/ruby>のは<ruby>暑<rt>あつ<\/rt><\/ruby>かったり<ruby>寒<rt>さむ<\/rt><\/ruby>かったりする<\/p><p class=\"lp\"><ruby>花見<rt>はなみ<\/rt><\/ruby>では、の<ruby>下<rt>した<\/rt><\/ruby>で<ruby>食<rt>た<\/rt><\/ruby>べたり<ruby>飲<rt>の<\/rt><\/ruby>んだりする ・ <ruby>昨日<rt>きのう<\/rt><\/ruby>は、と<ruby>歌<rt>うた<\/rt><\/ruby>ったり<ruby>踊<rt>おど<\/rt><\/ruby>ったりして<ruby>楽<rt>たの<\/rt><\/ruby>しんだ<\/p><p class=\"lp\">ウーバーのは<ruby>行<rt>い<\/rt><\/ruby>ったり<ruby>来<rt>き<\/rt><\/ruby>たりで<ruby>忙<rt>いそが<\/rt><\/ruby>しい ・ <ruby>映画<rt>えいが<\/rt><\/ruby>をて、<ruby>泣<rt>な<\/rt><\/ruby>いたり<ruby>笑<rt>わら<\/rt><\/ruby>ったりを<ruby>繰<rt>く<\/rt><\/ruby>り<ruby>返<rt>かえ<\/rt><\/ruby>した<\/p><p class=\"lp\">- Sustantivo / Adjetivo / Verbo + たり + Verbo “する”<\/p><p class=\"lp\">(También existe un uso en el que la partícula “たり” se emplea solo una vez para citar una acción o un estado como ejemplo, lo que implica que existen otros asuntos similares. Después de los sustantivos sigue “だったり” en vez de “たり”. Los adjetivos o verbos que preceden a “たり” siempre son en forma pasado sin “た”, pero es más fácil recordarlos como expresiones en las que “り” acompaña a los adjetivos o verbos en forma completa del pasado.)<\/p><p class=\"lp\"><ruby>今度<rt>こんど<\/rt><\/ruby>の<ruby>日曜日<rt>にちようび<\/rt><\/ruby>は<ruby>暇<rt>ひま<\/rt><\/ruby>だったりします？ ・  ・ <ruby>教室<rt>きょうしつ<\/rt><\/ruby>が<ruby>静<rt>しず<\/rt><\/ruby>かだったりすると、<ruby>誰<rt>だれ<\/rt><\/ruby>もいないと<ruby>思<rt>おも<\/rt><\/ruby>った<\/p><p class=\"lp\"><ruby>遅<rt>おく<\/rt><\/ruby>れたりすると<ruby>大変<rt>たいへん<\/rt><\/ruby>だから、<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>家<rt>いえ<\/rt><\/ruby>をでよう ・ <ruby>着替<rt>きが<\/rt><\/ruby>えますので、<ruby>部屋<rt>へや<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>って<ruby>来<rt>き<\/rt><\/ruby>たりしないでください<\/p>","text":"助詞じょし「たり」の復習ふくしゅう - Sustantivo1 / Adjetivo1 / Verbo1 + たり+ Sustantivo2 / Adjetivo2 / Verbo2 + たり + Verbo “する” / Partícula “で”, “と”, “の”, “を”, etc. + Verbo(La partícula “たり” se utiliza para indicar múltiples acciones o estados en paralelo. Se suele utilizar en conjuntos de dos o más, como en “〜たり、〜たりする”. Después de los sustantivos sigue “だったり” en vez de “たり”. Los adjetivos o verbos que preceden a “たり” siempre son en forma pasado sin “た”, pero es más fácil recordarlos como expresiones en las que “り” acompaña a los adjetivos o verbos en forma completa del pasado.)朝食ちょうしょくはパンだったりごはん飯めしだったりします ・ 電車でんしゃのは暑あつかったり寒さむかったりする花見はなみでは、の下したで食たべたり飲のんだりする ・ 昨日きのうは、と歌うたったり踊おどったりして楽たのしんだウーバーのは行いったり来きたりで忙いそがしい ・ 映画えいがをて、泣ないたり笑わらったりを繰くり返かえした- Sustantivo / Adjetivo / Verbo + たり + Verbo “する”(También existe un uso en el que la partícula “たり” se emplea solo una vez para citar una acción o un estado como ejemplo, lo que implica que existen otros asuntos similares. Después de los sustantivos sigue “だったり” en vez de “たり”. Los adjetivos o verbos que preceden a “たり” siempre son en forma pasado sin “た”, pero es más fácil recordarlos como expresiones en las que “り” acompaña a los adjetivos o verbos en forma completa del pasado.)今度こんどの日曜日にちようびは暇ひまだったりします？ ・  ・ 教室きょうしつが静しずかだったりすると、誰だれもいないと思おもった遅おくれたりすると大変たいへんだから、早はやく家いえをでよう ・ 着替きがえますので、部屋へやに入はいって来きたりしないでください"},{"id":"L016","file":"20260427_Particula__BA_.docx","cat":"part","catLabel":"Partículas","title":"助詞「ば」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「ば」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Cláusula Subordinada (con verbo en forma hipotética) + ば + Cláusula Principal<\/p><p class=\"lp\">(La partícula “ば” aquí se utiliza cuando se establece una condición hipotética para un evento que aún no ha ocurrido. Es una relación en la que una consecuencia lógica expresada en la cláusula principal se deriva de una premisa hipotética expresada en la cláusula subordinada.)<\/p><p class=\"lp\">あした<ruby>明日<rt>あす<\/rt><\/ruby>、<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>れば、<ruby>試合<rt>しあい<\/rt><\/ruby>は<ruby>中止<rt>ちゅうし<\/rt><\/ruby>になります ・ <ruby>駅<rt>えき<\/rt><\/ruby>からバスがなければ、タクシーに<ruby>乗<rt>の<\/rt><\/ruby>りましょう<\/p><p class=\"lp\"><ruby>暇<rt>ひま<\/rt><\/ruby>であれば、<ruby>映画<rt>えいが<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>きませんか ・  ・ <ruby>一度<rt>いちど<\/rt><\/ruby>Del Marのパエリヤを<ruby>食<rt>た<\/rt><\/ruby>べれば、また<ruby>食<rt>た<\/rt><\/ruby>べたくなる<\/p><p class=\"lp\">- Cláusula Subordinada (con verbo en forma hipotética) + ば + Cláusula Principal<\/p><p class=\"lp\">(La partícula “ば” aquí indica ciertas circunstancias o condiciones bajo las cuales asuntos de la cláusula principal ocurren invariablemente. Es una relación en la que una consecuencia lógica expresada en la cláusula principal se deriva de un hecho establecido expresado en la cláusula subordinada. La partícula “ば” de este uso puede sustituirse por la partícula “と”.)<\/p><p class=\"lp\"><ruby>春<rt>はる<\/rt><\/ruby>がくれば、<ruby>桜<rt>さくら<\/rt><\/ruby>が<ruby>咲<rt>さ<\/rt><\/ruby>きます ・  ・  ・ このボタンを<ruby>押<rt>お<\/rt><\/ruby>せば、ドアが<ruby>開<rt>ひら<\/rt><\/ruby>きます<\/p><p class=\"lp\"><ruby>春<rt>はる<\/rt><\/ruby>がくると、・・・ ・  ・  ・  ・ 　　　・・・<ruby>押<rt>お<\/rt><\/ruby>すと、・・・<\/p><p class=\"lp\"><ruby>夜空<rt>よぞら<\/rt><\/ruby>を<ruby>見上<rt>みあ<\/rt><\/ruby>げれば、<ruby>星<rt>ほし<\/rt><\/ruby>が<ruby>見<rt>み<\/rt><\/ruby>える ・  ・  ・ <ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>信号<rt>しんごう<\/rt><\/ruby>を<ruby>右<rt>みぎ<\/rt><\/ruby>に<ruby>曲<rt>ま<\/rt><\/ruby>がれば、<ruby>市<rt>し<\/rt><\/ruby><ruby>役所<rt>やくしょ<\/rt><\/ruby>があります<\/p><p class=\"lp\">・・・<ruby>見上<rt>みあ<\/rt><\/ruby>げると、・・・ ・  ・  ・  ・ ・・・<ruby>曲<rt>ま<\/rt><\/ruby>がると、・・・<\/p><p class=\"lp\">- Sustantivo1 + も + Verbo (en forma hipotética) + ば + Sustantivo2 + も + Verbo (en forma terminal)<\/p><p class=\"lp\">(La partícula “ば” aquí se utiliza para enumerar acciones, movimientos o estados de cosas que coexisten. Este caso, los sustantivos enumerados conlleva la partícula “も”.)<\/p><p class=\"lp\"><ruby>人生<rt>じんせい<\/rt><\/ruby>には、<ruby>山<rt>やま<\/rt><\/ruby>もあれば<ruby>谷<rt>たに<\/rt><\/ruby>もある ・  ・  ・ こう<ruby>公園<rt>こうえん<\/rt><\/ruby>では、<ruby>野球<rt>やきゅう<\/rt><\/ruby>もすればサッカーもします<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>頭<rt>あたま<\/rt><\/ruby>もよければスポーツも<ruby>得意<rt>とくい<\/rt><\/ruby>だ ・  ・ <ruby>図書館<rt>としょかん<\/rt><\/ruby>では、<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>む<ruby>人<rt>ひと<\/rt><\/ruby>もいれば<ruby>勉強<rt>べんきょう<\/rt><\/ruby>する<ruby>人<rt>ひと<\/rt><\/ruby>もいる<\/p><p class=\"lp\">- [Verbo / Adjetivo (en forma hipotética)] + ば + [Verbo/Adjetivo (en forma diccionario)] + ほど + Predicado<\/p><p class=\"lp\">(Esta expresión con la partícula “ば” se utiliza para expresar que, a medida que algo progresa, otra cosa también progresa.)<\/p><p class=\"lp\">ガムはかめばかむほどおいしくなる ・  ・ <ruby>暑<rt>あつ<\/rt><\/ruby>ければ<ruby>暑<rt>あつ<\/rt><\/ruby>いほどアイスクリームが<ruby>売<rt>う<\/rt><\/ruby>れます<\/p><p class=\"lp\"><ruby>歩<rt>ある<\/rt><\/ruby>けば<ruby>歩<rt>ある<\/rt><\/ruby>くほど<ruby>足<rt>あし<\/rt><\/ruby>が<ruby>痛<rt>いた<\/rt><\/ruby>くなりました ・  ・ <ruby>静<rt>しず<\/rt><\/ruby>かならば<ruby>静<rt>しず<\/rt><\/ruby>かなほど<ruby>外<rt>そと<\/rt><\/ruby>の<ruby>雨<rt>あめ<\/rt><\/ruby>の<ruby>音<rt>おと<\/rt><\/ruby>がよく<ruby>聞<rt>き<\/rt><\/ruby>こえる<\/p>","text":"助詞じょし「ば」の復習ふくしゅう - Cláusula Subordinada (con verbo en forma hipotética) + ば + Cláusula Principal(La partícula “ば” aquí se utiliza cuando se establece una condición hipotética para un evento que aún no ha ocurrido. Es una relación en la que una consecuencia lógica expresada en la cláusula principal se deriva de una premisa hipotética expresada en la cláusula subordinada.)あした明日あす、雨あめが降ふれば、試合しあいは中止ちゅうしになります ・ 駅えきからバスがなければ、タクシーに乗のりましょう暇ひまであれば、映画えいがを見みに行いきませんか ・  ・ 一度いちどDel Marのパエリヤを食たべれば、また食たべたくなる- Cláusula Subordinada (con verbo en forma hipotética) + ば + Cláusula Principal(La partícula “ば” aquí indica ciertas circunstancias o condiciones bajo las cuales asuntos de la cláusula principal ocurren invariablemente. Es una relación en la que una consecuencia lógica expresada en la cláusula principal se deriva de un hecho establecido expresado en la cláusula subordinada. La partícula “ば” de este uso puede sustituirse por la partícula “と”.)春はるがくれば、桜さくらが咲さきます ・  ・  ・ このボタンを押おせば、ドアが開ひらきます春はるがくると、・・・ ・  ・  ・  ・ 　　　・・・押おすと、・・・夜空よぞらを見上みあげれば、星ほしが見みえる ・  ・  ・ 次つぎの信号しんごうを右みぎに曲まがれば、市し役所やくしょがあります・・・見上みあげると、・・・ ・  ・  ・  ・ ・・・曲まがると、・・・- Sustantivo1 + も + Verbo (en forma hipotética) + ば + Sustantivo2 + も + Verbo (en forma terminal)(La partícula “ば” aquí se utiliza para enumerar acciones, movimientos o estados de cosas que coexisten. Este caso, los sustantivos enumerados conlleva la partícula “も”.)人生じんせいには、山やまもあれば谷たにもある ・  ・  ・ こう公園こうえんでは、野球やきゅうもすればサッカーもします彼かれは頭あたまもよければスポーツも得意とくいだ ・  ・ 図書館としょかんでは、本ほんを読よむ人ひともいれば勉強べんきょうする人ひともいる- [Verbo / Adjetivo (en forma hipotética)] + ば + [Verbo/Adjetivo (en forma diccionario)] + ほど + Predicado(Esta expresión con la partícula “ば” se utiliza para expresar que, a medida que algo progresa, otra cosa también progresa.)ガムはかめばかむほどおいしくなる ・  ・ 暑あつければ暑あついほどアイスクリームが売うれます歩あるけば歩あるくほど足あしが痛いたくなりました ・  ・ 静しずかならば静しずかなほど外そとの雨あめの音おとがよく聞きこえる"},{"id":"L017","file":"20260427_Particula__NARA_.docx","cat":"part","catLabel":"Partículas","title":"助詞「なら」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「なら」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- [Sustantivo / Cláusula Subordinada (no pasado)] + なら + [Verbo / Adjetivo / Cláusula Principal]<\/p><p class=\"lp\">(La partícula “なら” expresa una condición hipotética. Se utiliza a menudo para responder a la afirmación o situación de otra persona ofreciendo una opinión, un consejo o un juicio. Frecuentemente, la partícula “なら” se utiliza junto con “もし” de una forma como “もし～なら”. Cuando un adjetivo de tipo-い o un verbo de forma diccionario precede a la partícula “なら”, se puede añadir “の” entre el adjetivo / verbo y “なら”.)<\/p><p class=\"lp\">あした<ruby>明日<rt>あす<\/rt><\/ruby>、なら<ruby>試合<rt>しあい<\/rt><\/ruby>は<ruby>中止<rt>ちゅうし<\/rt><\/ruby>になります ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>ならを<ruby>手伝<rt>てつだ<\/rt><\/ruby>ってくれると<ruby>思<rt>おも<\/rt><\/ruby>う<\/p><p class=\"lp\"><ruby>駅<rt>えき<\/rt><\/ruby>からい(の)なら、バスに<ruby>乗<rt>の<\/rt><\/ruby>りましょう ・ スペインを<ruby>食<rt>た<\/rt><\/ruby>べたい(の)なら、Del Marをめます<\/p><p class=\"lp\">(もし)<ruby>暇<rt>ひま<\/rt><\/ruby>ならを<ruby>見<rt>み<\/rt><\/ruby>にいきませんか ・  ・ (もし)にほん<ruby>日本<rt>にっぽん<\/rt><\/ruby>にく(の)なら、<ruby>京都<rt>きょうと<\/rt><\/ruby>もいいですよ<\/p><p class=\"lp\">- [Sustantivo / Verbo (no pasado)] + なら + Verbo<\/p><p class=\"lp\">(La partícula “なら” introduce un tema específico o recoge un tema al que la otra parte se refiere, y añade información relacionada con ese tema. A menudo conlleva una connotación de contraste.)<\/p><p class=\"lp\">(<ruby>山田<rt>やまだ<\/rt><\/ruby>さんはどこですか？) ・ ⇒　さんなら、<ruby>少<rt>すこ<\/rt><\/ruby>し<ruby>前<rt>まえ<\/rt><\/ruby>に<ruby>帰<rt>かえ<\/rt><\/ruby>りました<\/p><p class=\"lp\">(<ruby>犬<rt>いぬ<\/rt><\/ruby>はきですか？) ・  ・ ⇒　なら<ruby>好<rt>す<\/rt><\/ruby>きですよ<\/p><p class=\"lp\">(<ruby>彼<rt>かれ<\/rt><\/ruby>はパーティーにくそうだ) ・ ⇒　が<ruby>行<rt>い<\/rt><\/ruby>く(の)なら、わたし<ruby>私<rt>わたくし<\/rt><\/ruby>も<ruby>行<rt>い<\/rt><\/ruby>きたい<\/p><p class=\"lnote\">Nota : En lenguaje hablado, la expresión “〜だったら” se usa también en vez de “〜なら”. En caso de que un adjetivo o verbo precede a “だったら”, se añade sin falta “の” o “ん (expresión informal)” entre el adjetivo / verbo y “だったら”.<\/p><p class=\"lp\">あした<ruby>明日<rt>あす<\/rt><\/ruby>、だったら<ruby>試合<rt>しあい<\/rt><\/ruby>は<ruby>中止<rt>ちゅうし<\/rt><\/ruby>になります ・  ・ もしだったら<ruby>映画<rt>えいが<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>にいきませんか<\/p><p class=\"lp\"><ruby>駅<rt>えき<\/rt><\/ruby>からいのだったら、バスに<ruby>乗<rt>の<\/rt><\/ruby>りましょう ・ o  ・ <ruby>駅<rt>えき<\/rt><\/ruby>からいんだったら、バスに<ruby>乗<rt>の<\/rt><\/ruby>りましょう<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>がくのだったら、わたし<ruby>私<rt>わたくし<\/rt><\/ruby>も<ruby>行<rt>い<\/rt><\/ruby>きたい ・  ・ o ・ <ruby>彼<rt>かれ<\/rt><\/ruby>がくんだったら、わたし<ruby>私<rt>わたくし<\/rt><\/ruby>も<ruby>行<rt>い<\/rt><\/ruby>きたい<\/p><p class=\"lp\">- Sustantivo + ならでは + だ/です ・ Sustantivo + ならでは + の + Sustantivo<\/p><p class=\"lp\">(La expresión “ならでは” se utiliza para resaltar características o cualidades únicas específicas de una persona, un lugar o una situación y enfatiza algo especial que solo posee ese sustantivo.)<\/p><p class=\"lp\">この<ruby>海<rt>うみ<\/rt><\/ruby>の<ruby>美<rt>うつく<\/rt><\/ruby>しさは<ruby>沖縄<rt>おきなわ<\/rt><\/ruby>ならではです ・  ・ あのドリブル<ruby>技術<rt>ぎじゅつ<\/rt><\/ruby>はメッシならではだ<\/p><p class=\"lp\"><ruby>梅干<rt>うめぼ<\/rt><\/ruby>しは<ruby>日本<rt>にっぽん<\/rt><\/ruby>ならではの<ruby>食<rt>た<\/rt><\/ruby>べ<ruby>物<rt>もの<\/rt><\/ruby>です ・  ・ <ruby>旅行<rt>りょこう<\/rt><\/ruby>するとき、その<ruby>土地<rt>とち<\/rt><\/ruby>ならではのスィーツを<ruby>試<rt>ため<\/rt><\/ruby>したい<\/p>","text":"助詞じょし「なら」の復習ふくしゅう - [Sustantivo / Cláusula Subordinada (no pasado)] + なら + [Verbo / Adjetivo / Cláusula Principal](La partícula “なら” expresa una condición hipotética. Se utiliza a menudo para responder a la afirmación o situación de otra persona ofreciendo una opinión, un consejo o un juicio. Frecuentemente, la partícula “なら” se utiliza junto con “もし” de una forma como “もし～なら”. Cuando un adjetivo de tipo-い o un verbo de forma diccionario precede a la partícula “なら”, se puede añadir “の” entre el adjetivo / verbo y “なら”.)あした明日あす、なら試合しあいは中止ちゅうしになります ・  ・ 彼かれならを手伝てつだってくれると思おもう駅えきからい(の)なら、バスに乗のりましょう ・ スペインを食たべたい(の)なら、Del Marをめます(もし)暇ひまならを見みにいきませんか ・  ・ (もし)にほん日本にっぽんにく(の)なら、京都きょうともいいですよ- [Sustantivo / Verbo (no pasado)] + なら + Verbo(La partícula “なら” introduce un tema específico o recoge un tema al que la otra parte se refiere, y añade información relacionada con ese tema. A menudo conlleva una connotación de contraste.)(山田やまださんはどこですか？) ・ ⇒　さんなら、少すこし前まえに帰かえりました(犬いぬはきですか？) ・  ・ ⇒　なら好すきですよ(彼かれはパーティーにくそうだ) ・ ⇒　が行いく(の)なら、わたし私わたくしも行いきたいNota : En lenguaje hablado, la expresión “〜だったら” se usa también en vez de “〜なら”. En caso de que un adjetivo o verbo precede a “だったら”, se añade sin falta “の” o “ん (expresión informal)” entre el adjetivo / verbo y “だったら”.あした明日あす、だったら試合しあいは中止ちゅうしになります ・  ・ もしだったら映画えいがを見みにいきませんか駅えきからいのだったら、バスに乗のりましょう ・ o  ・ 駅えきからいんだったら、バスに乗のりましょう彼かれがくのだったら、わたし私わたくしも行いきたい ・  ・ o ・ 彼かれがくんだったら、わたし私わたくしも行いきたい- Sustantivo + ならでは + だ/です ・ Sustantivo + ならでは + の + Sustantivo(La expresión “ならでは” se utiliza para resaltar características o cualidades únicas específicas de una persona, un lugar o una situación y enfatiza algo especial que solo posee ese sustantivo.)この海うみの美うつくしさは沖縄おきなわならではです ・  ・ あのドリブル技術ぎじゅつはメッシならではだ梅干うめぼしは日本にっぽんならではの食たべ物ものです ・  ・ 旅行りょこうするとき、その土地とちならではのスィーツを試ためしたい"},{"id":"L018","file":"20260511_Particula__KEDO__KEREDO__o_KEREDOMO_.docx","cat":"conc","catLabel":"Contraste y concesión","title":"助詞「けど、けれど、けれども」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「けど、けれど、けれども」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">La partícula “けれど” también tiene expresiones sinónimas como “けど” y “けれども”. Estas palabras se utilizan según el grado de cortesía requerido. La expresión “けど” es más informal y se utiliza con frecuencia en el lenguaje hablado. La expresión “けれど” es cortés y se utiliza tanto en el lenguaje hablado como en el lenguaje excrito. Por último, la expresión “けれども” es más cortés y es común en el lenguaje escrito.<\/p><p class=\"lp\">- Cláusula Subordinada + けど/けれど/けれども + Cláusula Principal<\/p><p class=\"lp\">(La partícula “けど” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrastante al hecho mencionado en la cláusula subordinada.)<\/p><p class=\"lp\"><ruby>旅行<rt>りょこう<\/rt><\/ruby>にきたいけれど、おかね<ruby>金<rt>きん<\/rt><\/ruby>がない ・ 　　　<ruby>彼<rt>かれ<\/rt><\/ruby>はスペイン<ruby>人<rt>ひと<\/rt><\/ruby>だけど、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>が<ruby>上手<rt>じょうず<\/rt><\/ruby>だ<\/p><p class=\"lp\"><ruby>昨日<rt>きのう<\/rt><\/ruby>はかったけど、<ruby>今日<rt>きょう<\/rt><\/ruby>は<ruby>暖<rt>あたた<\/rt><\/ruby>かい ・ 　　　ペンギンはを<ruby>飛<rt>と<\/rt><\/ruby>べないけれども、<ruby>海<rt>うみ<\/rt><\/ruby>を<ruby>泳<rt>およ<\/rt><\/ruby>ぐことができます<\/p><p class=\"lp\">- Cláusula Subordinada + けど/けれど/けれども + Cláusula Principal<\/p><p class=\"lp\">(La partícula “けど” también se puede utilizar para enumerar varios elementos en secuencia, transmitiendo un significado similar a “〜て” o “〜し”.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>はもできるけど、スペイン<ruby>語<rt>ご<\/rt><\/ruby>もできる ・  ・ <ruby>昨日<rt>きのう<\/rt><\/ruby>カレーをべたけれど、<ruby>今日<rt>きょう<\/rt><\/ruby>も<ruby>食<rt>た<\/rt><\/ruby>べた<\/p><p class=\"lp\">・・・できて、・・・　・・・できるし、・・・ ・  ・ ・・・べて、・・・　・・・べたし、・・・<\/p><p class=\"lp\">- Sustantivo / Adjetivo / Verbo (+ だoです) + けど + Verbo<\/p><p class=\"lp\">(La partícula “けど” se utiliza, en una conversación, como prefacio cuando se cambia de tema o cuando se desea pedir algo. Para este uso, es común la expresión “けど”, y apenas se usa “けれど” o “けれども”.)<\/p><p class=\"lp\"><ruby>昨日<rt>きのう<\/rt><\/ruby><ruby>読<rt>よ<\/rt><\/ruby>んだだけど、とても<ruby>面白<rt>おもしろ<\/rt><\/ruby>かった ・  ・ 　　　<ruby>悪<rt>わる<\/rt><\/ruby>いけど、しょうゆを<ruby>取<rt>と<\/rt><\/ruby>ってくれる？<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>にいたんだけど、<ruby>宝<rt>たから<\/rt><\/ruby>くじが<ruby>当<rt>あ<\/rt><\/ruby>たったそうだ ・ 　　　<ruby>歯<rt>は<\/rt><\/ruby>がいんですけど、いい<ruby>歯<rt>は<\/rt><\/ruby><ruby>医者<rt>いしゃ<\/rt><\/ruby>を<ruby>知<rt>し<\/rt><\/ruby>りませんか？<\/p><p class=\"lp\">- Cláusula + けど・・・<\/p><p class=\"lp\">(En japonés, colocar “けど” al final de una oración puede crear una expresión que da a entender que hay algo que no se ha dicho. Se utiliza para animar al oyente a seguir hablando o para transmitir la propia opinión de forma reservada.)<\/p><p class=\"lp\"><ruby>聞<rt>き<\/rt><\/ruby>きたいことがあるんだけど・・・ ・ （⇒ <ruby>聞<rt>き<\/rt><\/ruby>いてもいいかな？）<\/p><p class=\"lp\"><ruby>疲<rt>つか<\/rt><\/ruby>れているようだけど・・・？ ・  ・ （⇒ だいじょうぶ？）<\/p><p class=\"lp\">ドアがあ<ruby>開<rt>かい<\/rt><\/ruby>いていると<ruby>寒<rt>さむ<\/rt><\/ruby>いんだけど・・・ ・ （⇒ ドアを<ruby>閉<rt>し<\/rt><\/ruby>めてくれる？）<\/p>","text":"助詞じょし「けど、けれど、けれども」の復習ふくしゅう La partícula “けれど” también tiene expresiones sinónimas como “けど” y “けれども”. Estas palabras se utilizan según el grado de cortesía requerido. La expresión “けど” es más informal y se utiliza con frecuencia en el lenguaje hablado. La expresión “けれど” es cortés y se utiliza tanto en el lenguaje hablado como en el lenguaje excrito. Por último, la expresión “けれども” es más cortés y es común en el lenguaje escrito.- Cláusula Subordinada + けど/けれど/けれども + Cláusula Principal(La partícula “けど” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrastante al hecho mencionado en la cláusula subordinada.)旅行りょこうにきたいけれど、おかね金きんがない ・ 　　　彼かれはスペイン人ひとだけど、日本にっぽん語ごが上手じょうずだ昨日きのうはかったけど、今日きょうは暖あたたかい ・ 　　　ペンギンはを飛とべないけれども、海うみを泳およぐことができます- Cláusula Subordinada + けど/けれど/けれども + Cláusula Principal(La partícula “けど” también se puede utilizar para enumerar varios elementos en secuencia, transmitiendo un significado similar a “〜て” o “〜し”.)彼かれはもできるけど、スペイン語ごもできる ・  ・ 昨日きのうカレーをべたけれど、今日きょうも食たべた・・・できて、・・・　・・・できるし、・・・ ・  ・ ・・・べて、・・・　・・・べたし、・・・- Sustantivo / Adjetivo / Verbo (+ だoです) + けど + Verbo(La partícula “けど” se utiliza, en una conversación, como prefacio cuando se cambia de tema o cuando se desea pedir algo. Para este uso, es común la expresión “けど”, y apenas se usa “けれど” o “けれども”.)昨日きのう読よんだだけど、とても面白おもしろかった ・  ・ 　　　悪わるいけど、しょうゆを取とってくれる？彼かれにいたんだけど、宝たからくじが当あたったそうだ ・ 　　　歯はがいんですけど、いい歯は医者いしゃを知しりませんか？- Cláusula + けど・・・(En japonés, colocar “けど” al final de una oración puede crear una expresión que da a entender que hay algo que no se ha dicho. Se utiliza para animar al oyente a seguir hablando o para transmitir la propia opinión de forma reservada.)聞ききたいことがあるんだけど・・・ ・ （⇒ 聞きいてもいいかな？）疲つかれているようだけど・・・？ ・  ・ （⇒ だいじょうぶ？）ドアがあ開かいいていると寒さむいんだけど・・・ ・ （⇒ ドアを閉しめてくれる？）"},{"id":"L019","file":"20260525_Particula__NONI_.docx","cat":"conc","catLabel":"Contraste y concesión","title":"助詞「のに」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「のに」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- [Sustantivo + な / Adjetivo / Verbo / Cláusula Subordinada] + のに + Cláusula Principal<\/p><p class=\"lp\">(La partícula “のに” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrasta al hecho mencionado en la cláusula subordinada. La diferencia con otras partículas de conjunción adversativa es que la partícula “のに” conecta dos asuntos transmitiendo una sensación de sorpresa o insatisfacción. Sin embargo, la cláusula principal después de la partícula “のに” no puede expresar órdenes, peticiones, intenciones, preguntas ni el juicio del hablante.)<\/p><p class=\"lp\"><ruby>東京<rt>とうきょう<\/rt><\/ruby>はれなのに<ruby>大阪<rt>おおさか<\/rt><\/ruby>は<ruby>雨<rt>あめ<\/rt><\/ruby>だ ・ 　　　 ・  ・ うちのは、<ruby>肉<rt>にく<\/rt><\/ruby>は<ruby>喜<rt>よろこ<\/rt><\/ruby>んで<ruby>食<rt>た<\/rt><\/ruby>べるのに、<ruby>魚<rt>さかな<\/rt><\/ruby>は<ruby>嫌<rt>きら<\/rt><\/ruby>いだ<\/p><p class=\"lp\"><ruby>今日<rt>きょう<\/rt><\/ruby>はいのに、<ruby>冷蔵庫<rt>れいぞうこ<\/rt><\/ruby>にビールがない ・  ・ <ruby>詳<rt>くわ<\/rt><\/ruby>しくしたのに、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>理解<rt>りかい<\/rt><\/ruby>してくれなかった<\/p><p class=\"lp\">- Cláusula + のに・・・<\/p><p class=\"lp\">(En japonés, colocar “のに” al final de una oración puede crear una expresión que da a entender que hay algo que no se ha dicho. Se utiliza para expresar sentimientos como descontento, insatisfacción, resentimiento o crítica.)<\/p><p class=\"lp\"><ruby>山田<rt>やまだ<\/rt><\/ruby>さんはまだ<ruby>仕事<rt>しごと<\/rt><\/ruby>している。もう<ruby>夜<rt>よる<\/rt><\/ruby>なのに・・・ ・ （⇒もう<ruby>遅<rt>おそ<\/rt><\/ruby>いから、<ruby>仕事<rt>しごと<\/rt><\/ruby>をやめた<ruby>方<rt>ほう<\/rt><\/ruby>がよい）<\/p><p class=\"lp\">もうあきらめれば<ruby>良<rt>よ<\/rt><\/ruby>いのに・・・　　　（⇒ まだあきらめない）<\/p><p class=\"lp\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>が<ruby>喜<rt>よろこ<\/rt><\/ruby>ぶと<ruby>思<rt>おもう<\/rt><\/ruby>ったのに・・・　　　（⇒ <ruby>喜<rt>よろこ<\/rt><\/ruby>んでくれなかった）<\/p><p class=\"lp\">「わたし<ruby>私<rt>わたくし<\/rt><\/ruby>が<ruby>戻<rt>もど<\/rt><\/ruby>るまで<ruby>待<rt>ま<\/rt><\/ruby>ってください」と<ruby>言<rt>げん<\/rt><\/ruby>ったのに・・・　　　（⇒ <ruby>待<rt>ま<\/rt><\/ruby>っていなかった）<\/p>","text":"助詞じょし「のに」の復習ふくしゅう - [Sustantivo + な / Adjetivo / Verbo / Cláusula Subordinada] + のに + Cláusula Principal(La partícula “のに” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrasta al hecho mencionado en la cláusula subordinada. La diferencia con otras partículas de conjunción adversativa es que la partícula “のに” conecta dos asuntos transmitiendo una sensación de sorpresa o insatisfacción. Sin embargo, la cláusula principal después de la partícula “のに” no puede expresar órdenes, peticiones, intenciones, preguntas ni el juicio del hablante.)東京とうきょうはれなのに大阪おおさかは雨あめだ ・ 　　　 ・  ・ うちのは、肉にくは喜よろこんで食たべるのに、魚さかなは嫌きらいだ今日きょうはいのに、冷蔵庫れいぞうこにビールがない ・  ・ 詳くわしくしたのに、彼かれは理解りかいしてくれなかった- Cláusula + のに・・・(En japonés, colocar “のに” al final de una oración puede crear una expresión que da a entender que hay algo que no se ha dicho. Se utiliza para expresar sentimientos como descontento, insatisfacción, resentimiento o crítica.)山田やまださんはまだ仕事しごとしている。もう夜よるなのに・・・ ・ （⇒もう遅おそいから、仕事しごとをやめた方ほうがよい）もうあきらめれば良よいのに・・・　　　（⇒ まだあきらめない）彼女かのじょが喜よろこぶと思おもうったのに・・・　　　（⇒ 喜よろこんでくれなかった）「わたし私わたくしが戻もどるまで待まってください」と言げんったのに・・・　　　（⇒ 待まっていなかった）"},{"id":"L020","file":"20260525_Particula__TEMO__DEMO_.docx","cat":"conc","catLabel":"Contraste y concesión","title":"助詞「ても/でも」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「ても/でも」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Cláusula Subordinada + ても/でも + Cláusula Principal<\/p><p class=\"lp\">(La partícula “ても/でも” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrastante al hecho mencionado en la cláusula subordinada.)<\/p><p class=\"lp\"><ruby>旅行<rt>りょこう<\/rt><\/ruby>にきたくても、おかね<ruby>金<rt>きん<\/rt><\/ruby>がない ・  ・ あした<ruby>明日<rt>あす<\/rt><\/ruby>はみでも、<ruby>会社<rt>かいしゃ<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>くことになっている<\/p><p class=\"lp\"><ruby>病院<rt>びょういん<\/rt><\/ruby>がくても、タクシーで<ruby>行<rt>い<\/rt><\/ruby>きました ・ <ruby>薬<rt>くすり<\/rt><\/ruby>をまなくても、<ruby>熱<rt>ねつ<\/rt><\/ruby>が<ruby>下<rt>さ<\/rt><\/ruby>がった<\/p><p class=\"lp\">- Cláusula Subordinada + ても/でも + Cláusula Principal<\/p><p class=\"lp\">(La partícula “ても/でも” se utiliza como conjunción adversativa también para introducir una situación hipotética en la que un evento aún no ha ocurrido en la cláusula subordinada, y luego en la cláusula principal lleva a una conclusión que contradice el resultado esperado. Con frecuencia, se agrega “たとえ” al inicio de la cláusula subordinada.)<\/p><p class=\"lp\">あした<ruby>明日<rt>あす<\/rt><\/ruby>がでも、<ruby>試合<rt>しあい<\/rt><\/ruby>は<ruby>中止<rt>ちゅうし<\/rt><\/ruby>になりません ・  ・  ・ たとえしても、また<ruby>挑戦<rt>ちょうせん<\/rt><\/ruby>しようと<ruby>思<rt>おも<\/rt><\/ruby>う<\/p><p class=\"lp\"><ruby>映画<rt>えいが<\/rt><\/ruby>がおもしろくなくても、<ruby>最後<rt>さいご<\/rt><\/ruby>まで<ruby>観<rt>み<\/rt><\/ruby>るつもりだ ・ たとえおがあっても、その<ruby>車<rt>くるま<\/rt><\/ruby>は<ruby>買<rt>か<\/rt><\/ruby>わない<\/p><p class=\"lp\">- Cláusula Subordinada 1 + ても/でも + Cláusula Subordinada 2 + ても/でも + Cláusula Principal<\/p><p class=\"lp\">(Al repetir la partícula “ても/でも” en dos cláusulas subordinadas distintas, se indica que, aunque se cumplan las condiciones de los dos ejemplos, el resultado sigue siendo el mismo.)<\/p><p class=\"lp\"><ruby>勝<rt>か<\/rt><\/ruby>っても<ruby>負<rt>ま<\/rt><\/ruby>けても、<ruby>次<rt>つぎ<\/rt><\/ruby>が<ruby>最後<rt>さいご<\/rt><\/ruby>の<ruby>試合<rt>しあい<\/rt><\/ruby>です ・  ・ コーヒーをんでも<ruby>頼<rt>たの<\/rt><\/ruby>まなくても、<ruby>料金<rt>りょうきん<\/rt><\/ruby>は<ruby>同<rt>おな<\/rt><\/ruby>じです<\/p><p class=\"lp\"><ruby>夜<rt>よる<\/rt><\/ruby>になっても、<ruby>翌朝<rt>よくあさ<\/rt><\/ruby>になっても、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>帰<rt>かえ<\/rt><\/ruby>ってこなかった<\/p><p class=\"lp\">- Cláusula Subordinada + ても/でも + Misma Cláusula Subordinada + ても/でも + Cláusula Principal<\/p><p class=\"lp\">(Al repetir la misma cláusula con “ても/でも”, se indica que, por mucho que se realice lo mencionado en esa cláusula, el resultado sigue siendo igual. Se puede expresar mismo sentido en formula de “いくら〜ても+ Cláusula Principal” también.)<\/p><p class=\"lp\"><ruby>食<rt>た<\/rt><\/ruby>べても<ruby>食<rt>た<\/rt><\/ruby>べても、すぐにおなか<ruby>腹<rt>はら<\/rt><\/ruby>がすく ・  ・ <ruby>洗<rt>あら<\/rt><\/ruby>っても<ruby>洗<rt>あら<\/rt><\/ruby>っても、シャツについた<ruby>油<rt>あぶら<\/rt><\/ruby><ruby>汚<rt>よご<\/rt><\/ruby>れが<ruby>落<rt>お<\/rt><\/ruby>ちません<\/p><p class=\"lp\">いくらべても、すぐにおなか<ruby>腹<rt>はら<\/rt><\/ruby>がすく ・  ・ いくらっても、シャツについた<ruby>油<rt>あぶら<\/rt><\/ruby><ruby>汚<rt>よご<\/rt><\/ruby>れが<ruby>落<rt>お<\/rt><\/ruby>ちません<\/p><p class=\"lp\">このは、<ruby>書<rt>か<\/rt><\/ruby>いても<ruby>書<rt>か<\/rt><\/ruby>いても<ruby>覚<rt>おぼ<\/rt><\/ruby>えられない ・ <ruby>探<rt>さが<\/rt><\/ruby>しても<ruby>探<rt>さが<\/rt><\/ruby>しても、<ruby>鍵<rt>かぎ<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>つけることができなかった<\/p><p class=\"lp\">このは、いくら<ruby>書<rt>か<\/rt><\/ruby>いても<ruby>覚<rt>おぼ<\/rt><\/ruby>えられない ・ いくらしても、<ruby>鍵<rt>かぎ<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>つけることができなかった<\/p><p class=\"lp\">- Sustantivo + でも + Verbo para expresar propuesta o invitación<\/p><p class=\"lp\">(La partícula “でも” aquí se utiliza cuando se propone una opción como ejemplo entre varias alternativas disponibles.)<\/p><p class=\"lp\"><ruby>今度<rt>こんど<\/rt><\/ruby>、でも<ruby>見<rt>み<\/rt><\/ruby>にいきませんか ・ <ruby>会議<rt>かいぎ<\/rt><\/ruby>のでコーヒーでも<ruby>飲<rt>の<\/rt><\/ruby>みましょう<\/p><p class=\"lp\">- Sustantivo + でも + Predicado<\/p><p class=\"lp\">(La partícula “でも” se utiliza, por medio de citar un ejemplo extremo que precede, para enfatizar que otras cosas serían así naturalmente.)<\/p><p class=\"lp\">そんなは<ruby>子<rt>こ<\/rt><\/ruby>どもでも<ruby>分<rt>わ<\/rt><\/ruby>かる ・  ・ <ruby>漢字<rt>かんじ<\/rt><\/ruby>は<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>人<rt>にん<\/rt><\/ruby>でも<ruby>難<rt>むずか<\/rt><\/ruby>しい ・  ・ <ruby>中村<rt>なかむら<\/rt><\/ruby>さんはにでも<ruby>優<rt>やさ<\/rt><\/ruby>しい<\/p><p class=\"lp\">- Expresiones fijas con “ても”<\/p><p class=\"lp\">- どうしても～ ・ (Se utiliza cuando se desea fervientemente una acción o petición y se espera sinceramente que se haga realidad. Se utiliza con predicado negativo para enfatizar que, por mucho esfuerzo que se haga, el resultado sigue siendo el mismo.)<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は、どうしても<ruby>自分<rt>じぶん<\/rt><\/ruby>の<ruby>車<rt>くるま<\/rt><\/ruby>が<ruby>欲<rt>ほ<\/rt><\/ruby>しい ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>のうことが、どうしても<ruby>理解<rt>りかい<\/rt><\/ruby>できない<\/p><p class=\"lp\">- <ruby>何<rt>なん<\/rt><\/ruby>としても～ ・ (Expresa una fuerte determinación para alcanzar un objetivo a pesar de las circunstancias difíciles o los obstáculos.)<\/p><p class=\"lp\"><ruby>何<rt>なん<\/rt><\/ruby>としてもになりたい ・  ・ わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は、としても、サグラダ・ファミリアを<ruby>見<rt>み<\/rt><\/ruby>たい<\/p><p class=\"lp\">- だとしても～ ・ (Es una expresión que se utiliza para indicar que, aunque se supusiera que un determinado asunto fuera cierto, la conclusión o situación posterior seguiría siendo la misma.)<\/p><p class=\"lp\">A: <ruby>彼<rt>かれ<\/rt><\/ruby>はあなたをしませないためにうそを<ruby>言<rt>い<\/rt><\/ruby>った。B: だとしても、わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は<ruby>彼<rt>かれ<\/rt><\/ruby>を<ruby>許<rt>ゆる<\/rt><\/ruby>すことができない。<\/p><p class=\"lp\">- それにしても〜 ・ (Es una expresión que se utiliza para reconocer la afirmación anterior al tiempo que se expresa la propia opinión o pensamiento, y significa “aunque ese sea el caso”.)<\/p><p class=\"lp\">A: <ruby>山田<rt>やまだ<\/rt><\/ruby><ruby>君<rt>くん<\/rt><\/ruby>はとてもい。B: それにしても、<ruby>彼<rt>かれ<\/rt><\/ruby>が<ruby>東京<rt>とうきょう<\/rt><\/ruby><ruby>大学<rt>だいがく<\/rt><\/ruby>に<ruby>合格<rt>ごうかく<\/rt><\/ruby>したと<ruby>聞<rt>き<\/rt><\/ruby>いて<ruby>驚<rt>おどろ<\/rt><\/ruby>いた。<\/p><p class=\"lp\">- どっちにしても〜、いずれにしても　　(Es una expresión que significa “en cualquier caso” o “elijas la opción que elijas”, y que el resultado será el mismo.)<\/p><p class=\"lp\"><ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>るかもしれないから、どっちにしても<ruby>傘<rt>かさ<\/rt><\/ruby>を<ruby>持<rt>も<\/rt><\/ruby>っていった<ruby>方<rt>ほう<\/rt><\/ruby>がいい。<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>が<ruby>来<rt>く<\/rt><\/ruby>るかどうか<ruby>分<rt>わ<\/rt><\/ruby>からないが、いずれにしても、<ruby>準備<rt>じゅんび<\/rt><\/ruby>はしておくべきだ。<\/p>","text":"助詞じょし「ても/でも」の復習ふくしゅう - Cláusula Subordinada + ても/でも + Cláusula Principal(La partícula “ても/でも” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrastante al hecho mencionado en la cláusula subordinada.)旅行りょこうにきたくても、おかね金きんがない ・  ・ あした明日あすはみでも、会社かいしゃに行いくことになっている病院びょういんがくても、タクシーで行いきました ・ 薬くすりをまなくても、熱ねつが下さがった- Cláusula Subordinada + ても/でも + Cláusula Principal(La partícula “ても/でも” se utiliza como conjunción adversativa también para introducir una situación hipotética en la que un evento aún no ha ocurrido en la cláusula subordinada, y luego en la cláusula principal lleva a una conclusión que contradice el resultado esperado. Con frecuencia, se agrega “たとえ” al inicio de la cláusula subordinada.)あした明日あすがでも、試合しあいは中止ちゅうしになりません ・  ・  ・ たとえしても、また挑戦ちょうせんしようと思おもう映画えいががおもしろくなくても、最後さいごまで観みるつもりだ ・ たとえおがあっても、その車くるまは買かわない- Cláusula Subordinada 1 + ても/でも + Cláusula Subordinada 2 + ても/でも + Cláusula Principal(Al repetir la partícula “ても/でも” en dos cláusulas subordinadas distintas, se indica que, aunque se cumplan las condiciones de los dos ejemplos, el resultado sigue siendo el mismo.)勝かっても負まけても、次つぎが最後さいごの試合しあいです ・  ・ コーヒーをんでも頼たのまなくても、料金りょうきんは同おなじです夜よるになっても、翌朝よくあさになっても、彼かれは帰かえってこなかった- Cláusula Subordinada + ても/でも + Misma Cláusula Subordinada + ても/でも + Cláusula Principal(Al repetir la misma cláusula con “ても/でも”, se indica que, por mucho que se realice lo mencionado en esa cláusula, el resultado sigue siendo igual. Se puede expresar mismo sentido en formula de “いくら〜ても+ Cláusula Principal” también.)食たべても食たべても、すぐにおなか腹はらがすく ・  ・ 洗あらっても洗あらっても、シャツについた油あぶら汚よごれが落おちませんいくらべても、すぐにおなか腹はらがすく ・  ・ いくらっても、シャツについた油あぶら汚よごれが落おちませんこのは、書かいても書かいても覚おぼえられない ・ 探さがしても探さがしても、鍵かぎを見みつけることができなかったこのは、いくら書かいても覚おぼえられない ・ いくらしても、鍵かぎを見みつけることができなかった- Sustantivo + でも + Verbo para expresar propuesta o invitación(La partícula “でも” aquí se utiliza cuando se propone una opción como ejemplo entre varias alternativas disponibles.)今度こんど、でも見みにいきませんか ・ 会議かいぎのでコーヒーでも飲のみましょう- Sustantivo + でも + Predicado(La partícula “でも” se utiliza, por medio de citar un ejemplo extremo que precede, para enfatizar que otras cosas serían así naturalmente.)そんなは子こどもでも分わかる ・  ・ 漢字かんじは日本にっぽん人にんでも難むずかしい ・  ・ 中村なかむらさんはにでも優やさしい- Expresiones fijas con “ても”- どうしても～ ・ (Se utiliza cuando se desea fervientemente una acción o petición y se espera sinceramente que se haga realidad. Se utiliza con predicado negativo para enfatizar que, por mucho esfuerzo que se haga, el resultado sigue siendo el mismo.)わたし私わたくしは、どうしても自分じぶんの車くるまが欲ほしい ・  ・ 彼かれのうことが、どうしても理解りかいできない- 何なんとしても～ ・ (Expresa una fuerte determinación para alcanzar un objetivo a pesar de las circunstancias difíciles o los obstáculos.)何なんとしてもになりたい ・  ・ わたし私わたくしは、としても、サグラダ・ファミリアを見みたい- だとしても～ ・ (Es una expresión que se utiliza para indicar que, aunque se supusiera que un determinado asunto fuera cierto, la conclusión o situación posterior seguiría siendo la misma.)A: 彼かれはあなたをしませないためにうそを言いった。B: だとしても、わたし私わたくしは彼かれを許ゆるすことができない。- それにしても〜 ・ (Es una expresión que se utiliza para reconocer la afirmación anterior al tiempo que se expresa la propia opinión o pensamiento, y significa “aunque ese sea el caso”.)A: 山田やまだ君くんはとてもい。B: それにしても、彼かれが東京とうきょう大学だいがくに合格ごうかくしたと聞きいて驚おどろいた。- どっちにしても〜、いずれにしても　　(Es una expresión que significa “en cualquier caso” o “elijas la opción que elijas”, y que el resultado será el mismo.)雨あめが降ふるかもしれないから、どっちにしても傘かさを持もっていった方ほうがいい。彼かれが来くるかどうか分わからないが、いずれにしても、準備じゅんびはしておくべきだ。"},{"id":"L021","file":"20260601_Regla__GA____KEDO____NONI____TEMO_.docx","cat":"conc","catLabel":"Contraste y concesión","title":"助詞「が」「けど」「のに」「ても」のルール","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「が」「けど」「のに」「ても」のルール","html":"<p class=\"lp\">Cada una de Las partículas “が”, “けど”, “のに” y “ても” se utiliza para las expresiones de conjunción adversativa en japonés, formando las cláusulas compuestas al unir cláusulas subordinadas y cláusulas principales en una relación de contradicción u oposición. Sin embargo, estas difieren en términos de su conexión y significado.<\/p><p class=\"lp\">- La partícula “が”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">La partícla “が” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que lo mencionado en la cláusula principal es reverso o contrastante a lo mencionado en la cláusula subordinada. Se utiliza en situaciones relativamente formales. Sobre todo, cuando la cláusula subordinada tiene forma informal, normalmente es un lenguaje escrito.<\/p><p class=\"lp\">- Regla de conexión a la partícula<\/p><p class=\"lp\">La partícla “が” viene después de a) Verbo: tanto en forma cortés como en forma informal, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de diccionario tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaだ tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoだ tanto en tiempo no-pretérito como en tiempo pasado.<\/p><p class=\"lp\">- Regla de la cláusula principal<\/p><p class=\"lp\">La cláusula principal puede contener órdenes, peticiones, intenciones o el juicio del hablante.<\/p><p class=\"lp\">このは<ruby>短<rt>みじか<\/rt><\/ruby>いがおもしろい ・ 　　　 ・  ・ ドアをノックしましたが<ruby>返事<rt>へんじ<\/rt><\/ruby>がありませんでした<\/p><p class=\"lp\"><ruby>今日<rt>きょう<\/rt><\/ruby>はだが、あした<ruby>明日<rt>あす<\/rt><\/ruby>はよく<ruby>晴<rt>は<\/rt><\/ruby>れそうだ ・  ・ ペンギンはを<ruby>飛<rt>と<\/rt><\/ruby>べませんが、<ruby>海<rt>うみ<\/rt><\/ruby>を<ruby>泳<rt>およ<\/rt><\/ruby>ぐことができます<\/p><p class=\"lp\">- La partícula “けど/けれど/けれども”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">La partícla “けど/けれど/けれども” también se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que lo mencionado en la cláusula principal es reverso o contrastante a lo mencionado en la cláusula subordinada. Se utiliza en situaciones tanto formales como informales. Sobre todo, “けど” se usa normalmente es un lenguaje hablado.<\/p><p class=\"lp\">- Regla de conexión a la partícula<\/p><p class=\"lp\">La partícla “けど/けれど/けれども” viene después de a) Verbo: tanto en forma cortés como en forma informal, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de diccionario tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaだ tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoだ tanto en tiempo no-pretérito como en tiempo pasado.<\/p><p class=\"lp\">- Regla de la cláusula principal<\/p><p class=\"lp\">La cláusula principal puede contener órdenes, peticiones, intenciones o el juicio del hablante.<\/p><p class=\"lp\">このは<ruby>短<rt>みじか<\/rt><\/ruby>いけどおもしろい ・  ・ ドアをノックしましたけれども<ruby>返事<rt>へんじ<\/rt><\/ruby>がありませんでした<\/p><p class=\"lp\"><ruby>旅行<rt>りょこう<\/rt><\/ruby>にきたいけど、おかね<ruby>金<rt>きん<\/rt><\/ruby>がない ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>はスペイン<ruby>人<rt>ひと<\/rt><\/ruby>だけれど、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>が<ruby>上手<rt>じょうず<\/rt><\/ruby>だ<\/p><p class=\"lp\">- La partícula “のに”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">La partícla “のに” también se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal lo mencionado en la cláusula principal es reverso o contrasta a lo mencionado en la cláusula subordinada. La partícula “のに” conecta dos asuntos, transmitiendo una sensación de sorpresa o insatisfacción. Sin embargo, la cláusula principal después de la partícula “のに” no puede expresar órdenes, peticiones, intenciones, preguntas ni el juicio del hablante.<\/p><p class=\"lp\">- Regla de conexión a la partícula<\/p><p class=\"lp\">La partícla “のに” viene después de a) Verbo: en forma informal, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de diccionario tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaな tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoなen tiempo no-pretérito o だった en tiempo pasado.<\/p><p class=\"lp\">- Regla de la cláusula principal<\/p><p class=\"lp\">La cláusula principal no puede expresar órdenes, peticiones, intenciones, preguntas ni el juicio del hablante.<\/p><p class=\"lp\">このは<ruby>短<rt>みじか<\/rt><\/ruby>いのにおもしろい ・  ・ <ruby>旅行<rt>りょこう<\/rt><\/ruby>にきたいのに、おかね<ruby>金<rt>きん<\/rt><\/ruby>がない<\/p><p class=\"lp\"><ruby>東京<rt>とうきょう<\/rt><\/ruby>はれなのに<ruby>大阪<rt>おおさか<\/rt><\/ruby>は<ruby>雨<rt>あめ<\/rt><\/ruby>だ ・  ・  ・ <ruby>詳<rt>くわ<\/rt><\/ruby>しくしたのに、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>理解<rt>りかい<\/rt><\/ruby>してくれませんでした<\/p><p class=\"lp\">- La partícula “ても/でも”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">La partícla “ても/でも” también se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que lo mencionado en la cláusula principal es reverso o contrastante a lo mencionado en la cláusula subordinada. A diferencia de “が”, “けど” y “のに”, la partícla “ても/でも”, se utiliza para introducir en la cláusula subordinada una situación hipotética en la que un evento aún no ha ocurrido, y luego en la cláusula principal lleva a una conclusión que contradice el resultado esperado. En este caso, a menudo se agrega “たとえ” al inicio de la oración. Además, la partícla “ても/でも” puede usarse repetidamente en una oración.<\/p><p class=\"lp\">- Regla de conexión a la partícula<\/p><p class=\"lp\">La partícla “ても/でも” viene después de a) Verbo: en forma-て informal y no-pretérito, b) Adjetivo tipo-い: en forma-く no- pretérito, c) Adjetivo tipo-な:  en forma-でno- pretérito, y d) Sustantivo: sin agregar nada y sigue “でも”.<\/p><p class=\"lp\">- Regla de la cláusula principal<\/p><p class=\"lp\">La cláusula principal puede contener órdenes, peticiones, intenciones o el juicio del hablante.<\/p><p class=\"lp\">この<ruby>映画<rt>えいが<\/rt><\/ruby>は<ruby>短<rt>みじか<\/rt><\/ruby>くてもおもしろい ・  ・ ドアをノックしても<ruby>返事<rt>へんじ<\/rt><\/ruby>がありませんでした<\/p><p class=\"lp\">あした<ruby>明日<rt>あす<\/rt><\/ruby>が<ruby>雨<rt>あめ<\/rt><\/ruby>でも、<ruby>試合<rt>しあい<\/rt><\/ruby>は<ruby>中止<rt>ちゅうし<\/rt><\/ruby>になりません ・  ・ たとえおかね<ruby>金<rt>きん<\/rt><\/ruby>があっても、その<ruby>車<rt>くるま<\/rt><\/ruby>は<ruby>買<rt>か<\/rt><\/ruby>わないだろう<\/p><p class=\"lp\"><ruby>右<rt>みぎ<\/rt><\/ruby>の<ruby>道<rt>みち<\/rt><\/ruby>でも<ruby>左<rt>ひだり<\/rt><\/ruby>の<ruby>道<rt>みち<\/rt><\/ruby>でも、<ruby>駅<rt>えき<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>けますよ ・ そのドアは<ruby>押<rt>お<\/rt><\/ruby>しても<ruby>引<rt>ひ<\/rt><\/ruby>いても<ruby>開<rt>ひら<\/rt><\/ruby>かなかった<\/p>","text":"助詞じょし「が」「けど」「のに」「ても」のルール Cada una de Las partículas “が”, “けど”, “のに” y “ても” se utiliza para las expresiones de conjunción adversativa en japonés, formando las cláusulas compuestas al unir cláusulas subordinadas y cláusulas principales en una relación de contradicción u oposición. Sin embargo, estas difieren en términos de su conexión y significado.- La partícula “が”- Método de usoLa partícla “が” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que lo mencionado en la cláusula principal es reverso o contrastante a lo mencionado en la cláusula subordinada. Se utiliza en situaciones relativamente formales. Sobre todo, cuando la cláusula subordinada tiene forma informal, normalmente es un lenguaje escrito.- Regla de conexión a la partículaLa partícla “が” viene después de a) Verbo: tanto en forma cortés como en forma informal, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de diccionario tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaだ tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoだ tanto en tiempo no-pretérito como en tiempo pasado.- Regla de la cláusula principalLa cláusula principal puede contener órdenes, peticiones, intenciones o el juicio del hablante.このは短みじかいがおもしろい ・ 　　　 ・  ・ ドアをノックしましたが返事へんじがありませんでした今日きょうはだが、あした明日あすはよく晴はれそうだ ・  ・ ペンギンはを飛とべませんが、海うみを泳およぐことができます- La partícula “けど/けれど/けれども”- Método de usoLa partícla “けど/けれど/けれども” también se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que lo mencionado en la cláusula principal es reverso o contrastante a lo mencionado en la cláusula subordinada. Se utiliza en situaciones tanto formales como informales. Sobre todo, “けど” se usa normalmente es un lenguaje hablado.- Regla de conexión a la partículaLa partícla “けど/けれど/けれども” viene después de a) Verbo: tanto en forma cortés como en forma informal, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de diccionario tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaだ tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoだ tanto en tiempo no-pretérito como en tiempo pasado.- Regla de la cláusula principalLa cláusula principal puede contener órdenes, peticiones, intenciones o el juicio del hablante.このは短みじかいけどおもしろい ・  ・ ドアをノックしましたけれども返事へんじがありませんでした旅行りょこうにきたいけど、おかね金きんがない ・  ・ 彼かれはスペイン人ひとだけれど、日本にっぽん語ごが上手じょうずだ- La partícula “のに”- Método de usoLa partícla “のに” también se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal lo mencionado en la cláusula principal es reverso o contrasta a lo mencionado en la cláusula subordinada. La partícula “のに” conecta dos asuntos, transmitiendo una sensación de sorpresa o insatisfacción. Sin embargo, la cláusula principal después de la partícula “のに” no puede expresar órdenes, peticiones, intenciones, preguntas ni el juicio del hablante.- Regla de conexión a la partículaLa partícla “のに” viene después de a) Verbo: en forma informal, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de diccionario tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaな tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoなen tiempo no-pretérito o だった en tiempo pasado.- Regla de la cláusula principalLa cláusula principal no puede expresar órdenes, peticiones, intenciones, preguntas ni el juicio del hablante.このは短みじかいのにおもしろい ・  ・ 旅行りょこうにきたいのに、おかね金きんがない東京とうきょうはれなのに大阪おおさかは雨あめだ ・  ・  ・ 詳くわしくしたのに、彼かれは理解りかいしてくれませんでした- La partícula “ても/でも”- Método de usoLa partícla “ても/でも” también se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que lo mencionado en la cláusula principal es reverso o contrastante a lo mencionado en la cláusula subordinada. A diferencia de “が”, “けど” y “のに”, la partícla “ても/でも”, se utiliza para introducir en la cláusula subordinada una situación hipotética en la que un evento aún no ha ocurrido, y luego en la cláusula principal lleva a una conclusión que contradice el resultado esperado. En este caso, a menudo se agrega “たとえ” al inicio de la oración. Además, la partícla “ても/でも” puede usarse repetidamente en una oración.- Regla de conexión a la partículaLa partícla “ても/でも” viene después de a) Verbo: en forma-て informal y no-pretérito, b) Adjetivo tipo-い: en forma-く no- pretérito, c) Adjetivo tipo-な:  en forma-でno- pretérito, y d) Sustantivo: sin agregar nada y sigue “でも”.- Regla de la cláusula principalLa cláusula principal puede contener órdenes, peticiones, intenciones o el juicio del hablante.この映画えいがは短みじかくてもおもしろい ・  ・ ドアをノックしても返事へんじがありませんでしたあした明日あすが雨あめでも、試合しあいは中止ちゅうしになりません ・  ・ たとえおかね金きんがあっても、その車くるまは買かわないだろう右みぎの道みちでも左ひだりの道みちでも、駅えきに行いけますよ ・ そのドアは押おしても引ひいても開ひらかなかった"},{"id":"L022","file":"20260601_Tabla__GA____KEDO____NONI____TEMO_.docx","cat":"conc","catLabel":"Contraste y concesión","title":"助詞「が」「けど/けれど」「のに」「ても」のルール","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「が」「けど/けれど」「のに」「ても」のルール","html":"<div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal. このは<ruby>短<rt>みじか<\/rt><\/ruby>い**が**/<ruby>短<rt>みじか<\/rt><\/ruby>い**けど**/<ruby>短<rt>みじか<\/rt><\/ruby>い**のに**/<ruby>短<rt>みじか<\/rt><\/ruby>く**ても**おもしろい。<\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “が”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “けど” “けれど”, “けれども”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “のに”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “ても” “でも”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Para introducir en la cláusula subordinada una situación hipotética en la que un evento aún no ha ocurrido おがあっ**ても**、その<ruby>車<rt>くるま<\/rt><\/ruby>は<ruby>買<rt>か<\/rt><\/ruby>わないだろう。 （”お<ruby>金<rt>きん<\/rt><\/ruby>がある**が**”, “お<ruby>金<rt>きん<\/rt><\/ruby>がある**けど**” y “お<ruby>金<rt>きん<\/rt><\/ruby>がある**のに**” se pueden decir como un hecho solamente y no como una hipotéca.）<\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “が”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “けど” “けれど”, “けれども”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “のに”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “ても” “でも”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Para utilizar, en una conversación, como prefacio cuando se cambia de tema o cuando se desea pedir algo <ruby>確認<rt>かくにん<\/rt><\/ruby>しました**が**/<ruby>確認<rt>かくにん<\/rt><\/ruby>しました**けど**/<ruby>確認<rt>かくにん<\/rt><\/ruby>しましたのに/<ruby>確認<rt>かくにん<\/rt><\/ruby>しましても、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>豚肉<rt>ぶたにく<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べないそうです。<\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “が”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “けど” “けれど”, “けれども”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “のに”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “ても” “でも”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Para insinuar una sensación de sorpresa o insatisfacción. <ruby>今日<rt>きょう<\/rt><\/ruby>はい**のに**、<ruby>冷蔵庫<rt>れいぞうこ<\/rt><\/ruby>にビールがない。 (“<ruby>暑<rt>しょ<\/rt><\/ruby>い**が**”, “<ruby>暑<rt>しょ<\/rt><\/ruby>い**けど**”, y “<ruby>暑<rt>しょ<\/rt><\/ruby>く**ても**” se pueden decir, pero no insinua una sensación de sorpresa ni insatisfacción.)<\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “が”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “けど” “けれど”, “けれども”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “のに”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “ても” “でも”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Para expresar órdenes, peticiones, intenciones, preguntas o el juicio del hablante en la cláusula principal. <ruby>今日<rt>きょう<\/rt><\/ruby>はい**が**/<ruby>寒<rt>さむ<\/rt><\/ruby>い**けど**/<ruby>寒<rt>さむ<\/rt><\/ruby>いのに/<ruby>寒<rt>さむ<\/rt><\/ruby>く**ても**、で<ruby>練習<rt>れんしゅう<\/rt><\/ruby>しましょう。<\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “が”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “けど” “けれど”, “けれども”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “のに”<\/span><span class=\"jp\">No se utiliza<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Partícula “ても” “でも”<\/span><span class=\"jp\">Sí, se utiliza<\/span><\/div><\/div><\/div>","text":"助詞じょし「が」「けど/けれど」「のに」「ても」のルール Como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal. このは短みじかい**が**/短みじかい**けど**/短みじかい**のに**/短みじかく**ても**おもしろい。Partícula “が”Sí, se utilizaPartícula “けど” “けれど”, “けれども”Sí, se utilizaPartícula “のに”Sí, se utilizaPartícula “ても” “でも”Sí, se utilizaPara introducir en la cláusula subordinada una situación hipotética en la que un evento aún no ha ocurrido おがあっ**ても**、その車くるまは買かわないだろう。 （”お金きんがある**が**”, “お金きんがある**けど**” y “お金きんがある**のに**” se pueden decir como un hecho solamente y no como una hipotéca.）Partícula “が”No se utilizaPartícula “けど” “けれど”, “けれども”No se utilizaPartícula “のに”No se utilizaPartícula “ても” “でも”Sí, se utilizaPara utilizar, en una conversación, como prefacio cuando se cambia de tema o cuando se desea pedir algo 確認かくにんしました**が**/確認かくにんしました**けど**/確認かくにんしましたのに/確認かくにんしましても、彼かれは豚肉ぶたにくを食たべないそうです。Partícula “が”Sí, se utilizaPartícula “けど” “けれど”, “けれども”Sí, se utilizaPartícula “のに”No se utilizaPartícula “ても” “でも”No se utilizaPara insinuar una sensación de sorpresa o insatisfacción. 今日きょうはい**のに**、冷蔵庫れいぞうこにビールがない。 (“暑しょい**が**”, “暑しょい**けど**”, y “暑しょく**ても**” se pueden decir, pero no insinua una sensación de sorpresa ni insatisfacción.)Partícula “が”No se utilizaPartícula “けど” “けれど”, “けれども”No se utilizaPartícula “のに”Sí, se utilizaPartícula “ても” “でも”No se utilizaPara expresar órdenes, peticiones, intenciones, preguntas o el juicio del hablante en la cláusula principal. 今日きょうはい**が**/寒さむい**けど**/寒さむいのに/寒さむく**ても**、で練習れんしゅうしましょう。Partícula “が”Sí, se utilizaPartícula “けど” “けれど”, “けれども”Sí, se utilizaPartícula “のに”No se utilizaPartícula “ても” “でも”Sí, se utiliza"},{"id":"L023","file":"20260601__SOU___1_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「そう」の色々な使い方（１）","titleRuby":"「そう」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>（１）","html":"<p class=\"lp\">- Q: Oración Interrogativa ⇒ A: （はい、）そうです<\/p><p class=\"lp\">(“（はい、）そうです” se utiliza como respuesta afirmativa a una pregunta con un predicado sustantivo. En caso de respuesta negativa, generalmente no se responde con “そう”, sino en la mayoría de los casos, se usa “ちがいます” o se expresa la respuesta correcta.)<\/p><p class=\"lp\">Q: あなたは<ruby>国大<rt>こくだい<\/rt><\/ruby>のりゅう<ruby>留<rt>とめ<\/rt><\/ruby><ruby>学生<rt>がくせい<\/rt><\/ruby>ですか？ ・ ⇒ ・ A: （はい、）そうです。 o （いいえ、）ちがいます。<\/p><p class=\"lp\">Q: <ruby>初<rt>はじ<\/rt><\/ruby>めてった<ruby>外国<rt>がいこく<\/rt><\/ruby>は<ruby>日本<rt>にっぽん<\/rt><\/ruby>ですか？ ・ ⇒ ・ A: （はい、）そうです。 o （いいえ、）<ruby>中国<rt>ちゅうごく<\/rt><\/ruby>です。<\/p><p class=\"lp\">- Q: Oración Interrogativa ⇒ A: そうですね、+ Oración de Respuesta<\/p><p class=\"lp\">(La expresión “そうですね” indica que el hablante está pensando en una respuesta a la pregunta hecha por la otra parte. Es algo equivalente a “Bueno”, “Pues”, etc.)<\/p><p class=\"lp\">Q: <ruby>日本<rt>にっぽん<\/rt><\/ruby>の<ruby>勉強<rt>べんきょう<\/rt><\/ruby>はどうですか？ ・ ⇒ ・ A: そうですね。<ruby>難<rt>むずか<\/rt><\/ruby>しいですが、おもしろいです。<\/p><p class=\"lp\">Q: <ruby>今日<rt>きょう<\/rt><\/ruby>のは<ruby>厳<rt>きび<\/rt><\/ruby>しかったですか？ ・ ⇒ ・ A: そうですね。<ruby>厳<rt>きび<\/rt><\/ruby>しかったですが、<ruby>勝<rt>か<\/rt><\/ruby>ててうれしいです。<\/p><p class=\"lp\">- A: Oración ⇒ B: そうですね<\/p><p class=\"lp\">(La expresión “そうですね” se usa para indicar consentimiento o aquiescencia con lo que la otra parte ha dicho y el hablante también pensaba o ya tenía conocimiento.)<\/p><p class=\"lp\">A: <ruby>日本<rt>にっぽん<\/rt><\/ruby>のフルーツは<ruby>高<rt>たか<\/rt><\/ruby>いですね。 ・ ⇒ ・ B: そうですね。（わたし<ruby>私<rt>わたくし<\/rt><\/ruby>もそういます。）<\/p><p class=\"lp\">A: <ruby>来週<rt>らいしゅう<\/rt><\/ruby>のは<ruby>祝日<rt>しゅくじつ<\/rt><\/ruby>ですね。 ・ ⇒ ・ B: そうですね。（<ruby>祝日<rt>しゅくじつ<\/rt><\/ruby>ですね。）<\/p><p class=\"lp\">- A: Oración ⇒ B: そうですよ⤵<\/p><p class=\"lp\">(La expresión “そうですよ⤵” se usa cuando se afirma con rotundidad que la afirmación de la otra parte es correcta.  Se usa incluso en situaciones en las que se busca tranquilizar las inquietudes o dudas de la otra parte diciendo “Todo irá bien” o “Tienes toda la razón”.  Se pronuncia con la entonación descendente.)<\/p><p class=\"lp\">A: <ruby>日本<rt>にっぽん<\/rt><\/ruby>のフルーツは<ruby>高<rt>たか<\/rt><\/ruby>いですね。 ・ ⇒ ・ B: そうですよ⤵。（あなたのい<ruby>言<rt>げん<\/rt><\/ruby>う<ruby>通<rt>とお<\/rt><\/ruby>りです。）<\/p><p class=\"lp\">A: これでの<ruby>会議<rt>かいぎ<\/rt><\/ruby>は<ruby>成功<rt>せいこう<\/rt><\/ruby>しますね。 ・ ⇒ ・ B: そうですよ⤵。（きっと<ruby>大丈夫<rt>だいじょうぶ<\/rt><\/ruby>ですよ。）<\/p><p class=\"lp\">- A: Oración ⇒ B: そうですよ⤴<\/p><p class=\"lp\">(La expresión “そうですよ⤴” se usa para indicar la afrimación a la conversación de la otra parte enfatizando que el hablante ya lo sabía.  Se pronuncia con la entonación ascendente.)<\/p><p class=\"lp\">A: <ruby>日本<rt>にっぽん<\/rt><\/ruby>のフルーツは<ruby>高<rt>たか<\/rt><\/ruby>いですね。 ・ ⇒ ・ B: そうですよ⤴。（<ruby>知<rt>し<\/rt><\/ruby>らなかったのですか？）<\/p><p class=\"lp\">A: <ruby>日本<rt>にっぽん<\/rt><\/ruby>のは<ruby>暑<rt>あつ<\/rt><\/ruby>いですね。 ・  ・ ⇒ ・ B: そうですよ⤴。（はい、とても<ruby>暑<rt>あつ<\/rt><\/ruby>いですよ。）<\/p><p class=\"lp\">- A: Oración ⇒ B: そうですか⤵<\/p><p class=\"lp\">(La expresión “そうですか⤵” se emplea para manifestar interjecciones de que el hablante ha entendido la infromación recibida.  Se pronuncia con la entonación descendente.)<\/p><p class=\"lp\">A: <ruby>日本<rt>にっぽん<\/rt><\/ruby>のフルーツは<ruby>高<rt>たか<\/rt><\/ruby>いですね。 ・ ⇒ ・ B: そうですか⤵。（<ruby>知<rt>し<\/rt><\/ruby>りませんでした。）<\/p><p class=\"lp\">A: <ruby>先週<rt>せんしゅう<\/rt><\/ruby>、アメリカにしました。 ・ ⇒ ・ B: そうですか⤵。（あなたのを<ruby>聞<rt>き<\/rt><\/ruby>いていますよ。）<\/p><p class=\"lp\">- A: Oración ⇒ B: そうですか⤴<\/p><p class=\"lp\">(La expresión “そうですか⤴” se emplea para indicar implicitamente la duda o el desacuerdo de lo que la otra parte habla.  Se pronuncia con la entonación ascendente.)<\/p><p class=\"lp\">A: <ruby>日本<rt>にっぽん<\/rt><\/ruby>のフルーツは<ruby>高<rt>たか<\/rt><\/ruby>いですね。 ・ ⇒ ・ B: そうですか⤴。（はそう<ruby>思<rt>おも<\/rt><\/ruby>いませんが。）<\/p><p class=\"lp\">A: アーセナルはバルサより<ruby>強<rt>つよ<\/rt><\/ruby>いですよ。⇒ ・ B: そうですか⤴。（<ruby>本当<rt>ほんとう<\/rt><\/ruby>ですか？）<\/p><p class=\"lp\">- A: Oración ⇒ B: そう + Verbo<\/p><p class=\"lp\">(La expresión “そう+Verbo” se usa para referirse a mismos elementos mencionados en las locuciones de la otra parte o en un texto.)<\/p><p class=\"lp\">A: <ruby>少<rt>すこ<\/rt><\/ruby>しんだ<ruby>方<rt>ほう<\/rt><\/ruby>がいいですよ。 ・ ⇒ ・ B: はい、そうします。<\/p><p class=\"lp\">A: <ruby>横浜<rt>よこはま<\/rt><\/ruby>はしい<ruby>街<rt>まち<\/rt><\/ruby>でしたね。 ・  ・ ⇒ ・ B: わたし<ruby>私<rt>わたくし<\/rt><\/ruby>もそう<ruby>思<rt>おも<\/rt><\/ruby>いました。<\/p><p class=\"lp\">- ・・・そう + [ですが / だが / であるように、] + Frase<\/p><p class=\"lp\">(Aquí, “そう” se usa para referirse a la parte después de la comma, con ejemplos dados antes de “そう”.)<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>もそうでしたが、<ruby>初<rt>はじ<\/rt><\/ruby>めてナイアガラを<ruby>見<rt>み<\/rt><\/ruby>ると<ruby>感動<rt>かんどう<\/rt><\/ruby>しますよ。<\/p><p class=\"lp\">この<ruby>地域<rt>ちいき<\/rt><\/ruby>では、<ruby>昔<rt>むかし<\/rt><\/ruby>からそうだが、<ruby>共同<rt>きょうどう<\/rt><\/ruby>で<ruby>田植<rt>たう<\/rt><\/ruby>えをする。<\/p><p class=\"lp\"><ruby>柔道<rt>じゅうどう<\/rt><\/ruby>がそうであるように、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>人<rt>にん<\/rt><\/ruby>はスポーツにおいて<ruby>礼儀<rt>れいぎ<\/rt><\/ruby>を<ruby>大切<rt>たいせつ<\/rt><\/ruby>にします。<\/p>","text":"「そう」の色々いろいろな使しい方ほう（１） - Q: Oración Interrogativa ⇒ A: （はい、）そうです(“（はい、）そうです” se utiliza como respuesta afirmativa a una pregunta con un predicado sustantivo. En caso de respuesta negativa, generalmente no se responde con “そう”, sino en la mayoría de los casos, se usa “ちがいます” o se expresa la respuesta correcta.)Q: あなたは国大こくだいのりゅう留とめ学生がくせいですか？ ・ ⇒ ・ A: （はい、）そうです。 o （いいえ、）ちがいます。Q: 初はじめてった外国がいこくは日本にっぽんですか？ ・ ⇒ ・ A: （はい、）そうです。 o （いいえ、）中国ちゅうごくです。- Q: Oración Interrogativa ⇒ A: そうですね、+ Oración de Respuesta(La expresión “そうですね” indica que el hablante está pensando en una respuesta a la pregunta hecha por la otra parte. Es algo equivalente a “Bueno”, “Pues”, etc.)Q: 日本にっぽんの勉強べんきょうはどうですか？ ・ ⇒ ・ A: そうですね。難むずかしいですが、おもしろいです。Q: 今日きょうのは厳きびしかったですか？ ・ ⇒ ・ A: そうですね。厳きびしかったですが、勝かててうれしいです。- A: Oración ⇒ B: そうですね(La expresión “そうですね” se usa para indicar consentimiento o aquiescencia con lo que la otra parte ha dicho y el hablante también pensaba o ya tenía conocimiento.)A: 日本にっぽんのフルーツは高たかいですね。 ・ ⇒ ・ B: そうですね。（わたし私わたくしもそういます。）A: 来週らいしゅうのは祝日しゅくじつですね。 ・ ⇒ ・ B: そうですね。（祝日しゅくじつですね。）- A: Oración ⇒ B: そうですよ⤵(La expresión “そうですよ⤵” se usa cuando se afirma con rotundidad que la afirmación de la otra parte es correcta.  Se usa incluso en situaciones en las que se busca tranquilizar las inquietudes o dudas de la otra parte diciendo “Todo irá bien” o “Tienes toda la razón”.  Se pronuncia con la entonación descendente.)A: 日本にっぽんのフルーツは高たかいですね。 ・ ⇒ ・ B: そうですよ⤵。（あなたのい言げんう通とおりです。）A: これでの会議かいぎは成功せいこうしますね。 ・ ⇒ ・ B: そうですよ⤵。（きっと大丈夫だいじょうぶですよ。）- A: Oración ⇒ B: そうですよ⤴(La expresión “そうですよ⤴” se usa para indicar la afrimación a la conversación de la otra parte enfatizando que el hablante ya lo sabía.  Se pronuncia con la entonación ascendente.)A: 日本にっぽんのフルーツは高たかいですね。 ・ ⇒ ・ B: そうですよ⤴。（知しらなかったのですか？）A: 日本にっぽんのは暑あついですね。 ・  ・ ⇒ ・ B: そうですよ⤴。（はい、とても暑あついですよ。）- A: Oración ⇒ B: そうですか⤵(La expresión “そうですか⤵” se emplea para manifestar interjecciones de que el hablante ha entendido la infromación recibida.  Se pronuncia con la entonación descendente.)A: 日本にっぽんのフルーツは高たかいですね。 ・ ⇒ ・ B: そうですか⤵。（知しりませんでした。）A: 先週せんしゅう、アメリカにしました。 ・ ⇒ ・ B: そうですか⤵。（あなたのを聞きいていますよ。）- A: Oración ⇒ B: そうですか⤴(La expresión “そうですか⤴” se emplea para indicar implicitamente la duda o el desacuerdo de lo que la otra parte habla.  Se pronuncia con la entonación ascendente.)A: 日本にっぽんのフルーツは高たかいですね。 ・ ⇒ ・ B: そうですか⤴。（はそう思おもいませんが。）A: アーセナルはバルサより強つよいですよ。⇒ ・ B: そうですか⤴。（本当ほんとうですか？）- A: Oración ⇒ B: そう + Verbo(La expresión “そう+Verbo” se usa para referirse a mismos elementos mencionados en las locuciones de la otra parte o en un texto.)A: 少すこしんだ方ほうがいいですよ。 ・ ⇒ ・ B: はい、そうします。A: 横浜よこはまはしい街まちでしたね。 ・  ・ ⇒ ・ B: わたし私わたくしもそう思おもいました。- ・・・そう + [ですが / だが / であるように、] + Frase(Aquí, “そう” se usa para referirse a la parte después de la comma, con ejemplos dados antes de “そう”.)わたし私わたくしもそうでしたが、初はじめてナイアガラを見みると感動かんどうしますよ。この地域ちいきでは、昔むかしからそうだが、共同きょうどうで田植たうえをする。柔道じゅうどうがそうであるように、日本にっぽん人にんはスポーツにおいて礼儀れいぎを大切たいせつにします。"},{"id":"L024","file":"20260601__SOU___2_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「そう」の色々な使い方（２）","titleRuby":"「そう」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>（２）","html":"<p class=\"lp\">- [Verbo forma sencilla / Adjetivo tipo-い / Adjetivo tipo-な en forma-だ / Sustantivoだ] + そうです/そうだ<\/p><p class=\"lp\">(Esta expresión se usa para transimitir información que se ha obtenido de alguna fuente sin añadir el punto de vista del propio hablante.  Verbo / Adjetivo que precede a “そう” tiene entonación descendiente.)<\/p><p class=\"lp\"><ruby>来週<rt>らいしゅう<\/rt><\/ruby>はより<ruby>寒<rt>さむ<\/rt><\/ruby>くなる⤵そうです。 ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>子<rt>こ<\/rt><\/ruby>どもの、フランスに<ruby>住<rt>す<\/rt><\/ruby>んでいた⤵そうです。<\/p><p class=\"lp\"><ruby>隣<rt>となり<\/rt><\/ruby>ののパエリヤを<ruby>見<rt>み<\/rt><\/ruby>て、<ruby>彼<rt>かれ<\/rt><\/ruby>も<ruby>食<rt>た<\/rt><\/ruby>べた⤵そうです。 ・ よしのや<ruby>吉野<rt>よしの<\/rt><\/ruby><ruby>家<rt>いえ<\/rt><\/ruby>のはおいしい⤵そうですよ。<\/p><p class=\"lp\">リーさんによると、<ruby>先生<rt>せんせい<\/rt><\/ruby>の<ruby>恋人<rt>こいびと<\/rt><\/ruby>は<ruby>真面目<rt>まじめ<\/rt><\/ruby>だ⤵そうだ。 ・ 　　　　<ruby>天気<rt>てんき<\/rt><\/ruby><ruby>予報<rt>よほう<\/rt><\/ruby>によれば、は<ruby>雨<rt>あめ<\/rt><\/ruby>だ⤵そうだ。<\/p><p class=\"lp\">- Verbo en forma-ます sin ます + [そうです/そうだ / そうな + Sustantivo / そうに + Predicado]<\/p><p class=\"lp\">(Esta expresión se usa para expresar indicios o señales de cambios y movimientos indicados por el verbo que precede.  No se trata de una hipótesis, sino que se utiliza para describir la situación actual de forma subjetiva basándose en las circunstancias que la rodean.  Verbo que precede a “そう” tiene entonación ascendiente.)<\/p><p class=\"lp\"><ruby>来週<rt>らいしゅう<\/rt><\/ruby>はより<ruby>寒<rt>さむ<\/rt><\/ruby>くなり⤴そうです。 ・  ・ <ruby>道<rt>みち<\/rt><\/ruby>がんでいるので、<ruby>約束<rt>やくそく<\/rt><\/ruby>の<ruby>時間<rt>じかん<\/rt><\/ruby>に<ruby>遅<rt>おく<\/rt><\/ruby>れ⤴そうだ。<\/p><p class=\"lp\"><ruby>将来<rt>しょうらい<\/rt><\/ruby>、<ruby>日本<rt>にっぽん<\/rt><\/ruby>でく<ruby>外国人<rt>がいこくじん<\/rt><\/ruby>が<ruby>増<rt>ふ<\/rt><\/ruby>え⤴そうです。 ・ <ruby>急<rt>きゅう<\/rt><\/ruby>にが<ruby>暗<rt>くら<\/rt><\/ruby>くなって、<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>り⤴そうでした。<\/p><p class=\"lp\"><ruby>雨<rt>あめ<\/rt><\/ruby>がり⤴そうなは、<ruby>洗濯<rt>せんたく<\/rt><\/ruby>をしません。 ・ <ruby>酔<rt>よ<\/rt><\/ruby>っいがホームで<ruby>倒<rt>たお<\/rt><\/ruby>れ⤴そうに<ruby>歩<rt>ある<\/rt><\/ruby>いていた。<\/p><p class=\"lp\">- [Verbo Estativo en forma-ます sin ます / Adjetivo tipo-い sinい / Adjetivo tipo-なsinな] + [そうです/そうだ / そうな + Sustantivo / そうに + Predicado]<\/p><p class=\"lp\">(Esta expresión se usa cuando se realiza una suposición juzgando la apariencia o el aspecto de algo, aunque no se haya confirmado su naturaleza.  Verbo / Adjetivo que precede a “そう” tiene entonación ascendiente.)<\/p><p class=\"lnote\">Nota: A pesar de la regla de conjugación explicado arriba, el verbo “ない” conjuga a “なさそう” y el adjetivo “いい/よい” conjuga a “よさそう”.<\/p><p class=\"lp\"><ruby>外車<rt>がいしゃ<\/rt><\/ruby>が3<ruby>台<rt>だい<\/rt><\/ruby>あるので、このはおかね<ruby>金<rt>きん<\/rt><\/ruby>があり⤴そうだ。 ・ このだと、<ruby>今日<rt>きょう<\/rt><\/ruby>の<ruby>試合<rt>しあい<\/rt><\/ruby>はなさ⤴そうです。<\/p><p class=\"lp\"><ruby>隣<rt>となり<\/rt><\/ruby>ののパエリヤを<ruby>見<rt>み<\/rt><\/ruby>て、<ruby>彼<rt>かれ<\/rt><\/ruby>も<ruby>食<rt>た<\/rt><\/ruby>べた⤴そうです。 ・ <ruby>話<rt>はな<\/rt>
