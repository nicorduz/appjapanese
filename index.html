\/rt><\/ruby>めてナイアガラを<ruby>見<rt>み<\/rt><\/ruby>ると<ruby>感動<rt>かんどう<\/rt><\/ruby>しますよ。"},{"id":"gp095","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」の色々な使い方（２）","pattern":"[Verbo forma sencilla / Adjetivo tipo-い / Adjetivo tipo-な en forma-だ / Sustantivoだ] + そうです/そうだ","patternRuby":"[Verbo forma sencilla / Adjetivo tipo-い / Adjetivo tipo-な en forma-だ / Sustantivoだ] + そうです/そうだ","rule":"Esta expresión se usa para transimitir información que se ha obtenido de alguna fuente sin añadir el punto de vista del propio hablante.  Verbo / Adjetivo que precede a “そう” tiene entonación descendiente.","ruleRuby":"Esta expresión se usa para transimitir información que se ha obtenido de alguna fuente sin añadir el punto de vista del propio hablante.  Verbo / Adjetivo que precede a “そう” tiene entonación descendiente.","exJp":"らいしゅう来週はよりさむ寒くなる⤵そうです。","exJpRuby":"<ruby>来週<rt>らいしゅう<\/rt><\/ruby>はより<ruby>寒<rt>さむ<\/rt><\/ruby>くなる⤵そうです。"},{"id":"gp096","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」の色々な使い方（２）","pattern":"Verbo en forma-ます sin ます + [そうです/そうだ / そうな + Sustantivo / そうに + Predicado]","patternRuby":"Verbo en forma-ます sin ます + [そうです/そうだ / そうな + Sustantivo / そうに + Predicado]","rule":"Esta expresión se usa para expresar indicios o señales de cambios y movimientos indicados por el verbo que precede.  No se trata de una hipótesis, sino que se utiliza para describir la situación actual de forma subjetiva basándose en las circunstancias que la rodean.  Verbo que precede a “そう” tiene entonación ascendiente.","ruleRuby":"Esta expresión se usa para expresar indicios o señales de cambios y movimientos indicados por el verbo que precede.  No se trata de una hipótesis, sino que se utiliza para describir la situación actual de forma subjetiva basándose en las circunstancias que la rodean.  Verbo que precede a “そう” tiene entonación ascendiente.","exJp":"らいしゅう来週はよりさむ寒くなり⤴そうです。","exJpRuby":"<ruby>来週<rt>らいしゅう<\/rt><\/ruby>はより<ruby>寒<rt>さむ<\/rt><\/ruby>くなり⤴そうです。"},{"id":"gp097","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」の色々な使い方（２）","pattern":"[Verbo Estativo en forma-ます sin ます / Adjetivo tipo-い sinい / Adjetivo tipo-なsinな] + [そうです/そうだ / そうな + Sustantivo / そうに + Predicado]","patternRuby":"[Verbo Estativo en forma-ます sin ます / Adjetivo tipo-い sinい / Adjetivo tipo-なsinな] + [そうです/そうだ / そうな + Sustantivo / そうに + Predicado]","rule":"Esta expresión se usa cuando se realiza una suposición juzgando la apariencia o el aspecto de algo, aunque no se haya confirmado su naturaleza.  Verbo / Adjetivo que precede a “そう” tiene entonación ascendiente.","ruleRuby":"Esta expresión se usa cuando se realiza una suposición juzgando la apariencia o el aspecto de algo, aunque no se haya confirmado su naturaleza.  Verbo / Adjetivo que precede a “そう” tiene entonación ascendiente.","exJp":"Nota: A pesar de la regla de conjugación explicado arriba, el verbo “ない” conjuga a “なさそう” y el adjetivo “いい/よい” conjuga a “よさそう”.","exJpRuby":"Nota: A pesar de la regla de conjugación explicado arriba, el verbo “ない” conjuga a “なさそう” y el adjetivo “いい/よい” conjuga a “よさそう”."},{"id":"gp098","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」の色々な使い方（２）","pattern":"Verbo en forma-ます sin ます + そうもない/そうにない","patternRuby":"Verbo en forma-ます sin ます + そうもない/そうにない","rule":"Esta expresión se usa para indicar que hay baja probabilidad de que suceda lo que se menciona con el Verbo.","ruleRuby":"Esta expresión se usa para indicar que hay baja probabilidad de que suceda lo que se menciona con el Verbo.","exJp":"じゅうたい渋滞で２じ時までにかいしゃ会社へもど戻れそうにありません。　　かぜ風邪なので、パーティーにはさんか参加できそうもない。","exJpRuby":"<ruby>渋滞<rt>じゅうたい<\/rt><\/ruby>で２じ<ruby>時<rt>じ<\/rt><\/ruby>までに<ruby>会社<rt>かいしゃ<\/rt><\/ruby>へ<ruby>戻<rt>もど<\/rt><\/ruby>れそうにありません。　　<ruby>風邪<rt>かぜ<\/rt><\/ruby>なので、パーティーには<ruby>参加<rt>さんか<\/rt><\/ruby>できそうもない。"},{"id":"gp099","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（１）","pattern":"Sustantivo + の + [“ような+ Sustantivo” / “ように+ Predicado”]","patternRuby":"Sustantivo + の + [“ような+ Sustantivo” / “ように+ Predicado”]","rule":"“Sustantivo1のようなSustantivo2” se usa para modificar un Sustantivo 2 citando al Sustantivo1 como ejemplo semejante.  También, se puede usar “Sustantivo1はSustantivo2のようにPredicado” para describir que el Sustantivo1 tiene caracteristicas mencionadas en el Predicado citando al Sustantivo 2 como ejemplo semejante.","ruleRuby":"“Sustantivo1のようなSustantivo2” se usa para modificar un Sustantivo 2 citando al Sustantivo1 como ejemplo semejante.  También, se puede usar “Sustantivo1はSustantivo2のようにPredicado” para describir que el Sustantivo1 tiene caracteristicas mencionadas en el Predicado citando al Sustantivo 2 como ejemplo semejante.","exJp":"かのじょ彼女のようなうつく美しさがほ欲しい。","exJpRuby":"<ruby>彼女<rt>かのじょ<\/rt><\/ruby>のような<ruby>美<rt>うつく<\/rt><\/ruby>しさが<ruby>欲<rt>ほ<\/rt><\/ruby>しい。"},{"id":"gp100","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（１）","pattern":"Sustantivo1 / Frase +というような / といったような + Sustantivo2","patternRuby":"Sustantivo1 / Frase +というような / といったような + Sustantivo2","rule":"Esta expresión se usa para explicar el Sustantivo2 citando el Sustantivo1 o Frase como ejemplo específico.  Es una expresión similar al uso No.1, pero es un estilo de expresión más erudito o académico.","ruleRuby":"Esta expresión se usa para explicar el Sustantivo2 citando el Sustantivo1 o Frase como ejemplo específico.  Es una expresión similar al uso No.1, pero es un estilo de expresión más erudito o académico.","exJp":"わたし私はきんかくじ金閣寺というようなはで派手なてら寺がす好きです。   　でんしゃ電車がおく遅れたというようない言いわけ訳はしんよう信用できません。","exJpRuby":"わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は<ruby>金閣寺<rt>きんかくじ<\/rt><\/ruby>というような<ruby>派手<rt>はで<\/rt><\/ruby>な<ruby>寺<rt>てら<\/rt><\/ruby>が<ruby>好<rt>す<\/rt><\/ruby>きです。   　<ruby>電車<rt>でんしゃ<\/rt><\/ruby>が<ruby>遅<rt>おく<\/rt><\/ruby>れたというような<ruby>言<rt>い<\/rt><\/ruby>い<ruby>訳<rt>わけ<\/rt><\/ruby>は<ruby>信用<rt>しんよう<\/rt><\/ruby>できません。"},{"id":"gp101","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（１）","pattern":"[Verbo / Adjetivo en forma sencilla] + [ような+ Sustantivo / ように+ Predicado]","patternRuby":"[Verbo / Adjetivo en forma sencilla] + [ような+ Sustantivo / ように+ Predicado]","rule":"En esta expresión, “ような/ように” se usa para modificar un sustantivo o predicado posterior citando las características o maneras expresadas por el verbo o adjetivo que precede.","ruleRuby":"En esta expresión, “ような/ように” se usa para modificar un sustantivo o predicado posterior citando las características o maneras expresadas por el verbo o adjetivo que precede.","exJp":"かれ彼がも持っているようなかばん鞄がほ欲しい。","exJpRuby":"<ruby>彼<rt>かれ<\/rt><\/ruby>が<ruby>持<rt>も<\/rt><\/ruby>っているような<ruby>鞄<rt>かばん<\/rt><\/ruby>が<ruby>欲<rt>ほ<\/rt><\/ruby>しい。"},{"id":"gp102","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（１）","pattern":"(まるで +) Sustantivo + の + [ようだ/ようです / ような+ Sustantivo / ように+ Predicado]","patternRuby":"(まるで +) Sustantivo + の + [ようだ/ようです / ような+ Sustantivo / ように+ Predicado]","rule":"“Sustantivo1はSustantivo2のようだ/ようです” se usa para expresar las características del Sustantivo 1 citando al Sustantivo2 como metáforo.  Hay casos en que se usa “Sustantivo1のようなSustantivo2” para modificar un Sustantivo 2 citando al Sustantivo1 como metáforo.  También, se puede usar “Sustantivo1はSustantivo2のようにPredicado” para describir que el Sustantivo1 tiene características mencionadas en el Predicado citando al Sustantivo 2 como metáforo.  Con frecuencia se agrega “まるで” antes del sustantivo metafórico.","ruleRuby":"“Sustantivo1はSustantivo2のようだ/ようです” se usa para expresar las características del Sustantivo 1 citando al Sustantivo2 como metáforo.  Hay casos en que se usa “Sustantivo1のようなSustantivo2” para modificar un Sustantivo 2 citando al Sustantivo1 como metáforo.  También, se puede usar “Sustantivo1はSustantivo2のようにPredicado” para describir que el Sustantivo1 tiene características mencionadas en el Predicado citando al Sustantivo 2 como metáforo.  Con frecuencia se agrega “まるで” antes del sustantivo metafórico.","exJp":"じんせい人生は（まるで）ジェットコースターのようだ。　　　セビリアのきゅうしがい旧市街は（まるで）めいろ迷路のようです。","exJpRuby":"<ruby>人生<rt>じんせい<\/rt><\/ruby>は（まるで）ジェットコースターのようだ。　　　セビリアの<ruby>旧市街<rt>きゅうしがい<\/rt><\/ruby>は（まるで）<ruby>迷路<rt>めいろ<\/rt><\/ruby>のようです。"},{"id":"gp103","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（１）","pattern":"(まるで +) [Verbo / Adjetivo en forma sencilla] (+かの) + [ようだ/ようです / ような+ Sustantivo / ように+ Predicado]","patternRuby":"(まるで +) [Verbo / Adjetivo en forma sencilla] (+かの) + [ようだ/ようです / ような+ Sustantivo / ように+ Predicado]","rule":"En esta expresión, “ようだ/ような/ように” se usa para modificar un sustantivo o predicado posterior citando los aspectos metafóricos expresados con el verbo o adjetivo que precede.  Con frecuencia se agrega “まるで” antes o “かの” después del verbo o adjetivo metafórico.","ruleRuby":"En esta expresión, “ようだ/ような/ように” se usa para modificar un sustantivo o predicado posterior citando los aspectos metafóricos expresados con el verbo o adjetivo que precede.  Con frecuencia se agrega “まるで” antes o “かの” después del verbo o adjetivo metafórico.","exJp":"このえ絵のうま馬は（まるで）い生きているようだ。","exJpRuby":"この<ruby>絵<rt>え<\/rt><\/ruby>の<ruby>馬<rt>うま<\/rt><\/ruby>は（まるで）<ruby>生<rt>い<\/rt><\/ruby>きているようだ。"},{"id":"gp104","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（２）","pattern":"[Sustantivo + の / Adjetivo / Verbo en forma sencilla] + ようだ/ようです","patternRuby":"[Sustantivo + の / Adjetivo / Verbo en forma sencilla] + ようだ/ようです","rule":"Esta expresión se utiliza cuando el hablante hace un juicio a partir de las circunstancias de un determinado momento sin poder afirmarlo categóricamente.  Con frecuencia, se agrega “どうも” o “どうやら” antes del Sustantivo, Adjetivo or Verbo.","ruleRuby":"Esta expresión se utiliza cuando el hablante hace un juicio a partir de las circunstancias de un determinado momento sin poder afirmarlo categóricamente.  Con frecuencia, se agrega “どうも” o “どうやら” antes del Sustantivo, Adjetivo or Verbo.","exJp":"くも雲のをみ見ると、にし西のほう方は（どうも）のようだ。","exJpRuby":"<ruby>雲<rt>くも<\/rt><\/ruby>のを<ruby>見<rt>み<\/rt><\/ruby>ると、<ruby>西<rt>にし<\/rt><\/ruby>の<ruby>方<rt>ほう<\/rt><\/ruby>は（どうも）のようだ。"},{"id":"gp105","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（２）","pattern":"Verbo1 en forma diccionario o en forma negativa + ように+ Verbo2","patternRuby":"Verbo1 en forma diccionario o en forma negativa + ように+ Verbo2","rule":"Esta expresión se usa para expresar la realización de la situación que precede a “ように” como objetivo o propósito del Verbo 2.","ruleRuby":"Esta expresión se usa para expresar la realización de la situación que precede a “ように” como objetivo o propósito del Verbo 2.","exJp":"みんなにかるように、せつめい説明してください。","exJpRuby":"みんなにかるように、<ruby>説明<rt>せつめい<\/rt><\/ruby>してください。"},{"id":"gp106","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（２）","pattern":"Verbo en forma diccionario o o en forma negativa + ようにする/ようにします","patternRuby":"Verbo en forma diccionario o o en forma negativa + ようにする/ようにします","rule":"Esta expresión se usa para expresar que uno realiza esfuerzos para hacer algo una costumbre o hábito.","ruleRuby":"Esta expresión se usa para expresar que uno realiza esfuerzos para hacer algo una costumbre o hábito.","exJp":"けんこう健康のため、できるだけくようにします。","exJpRuby":"<ruby>健康<rt>けんこう<\/rt><\/ruby>のため、できるだけくようにします。"},{"id":"gp107","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（２）","pattern":"Verbo en forma diccionario o o en forma negativa + ようになる/ようになります","patternRuby":"Verbo en forma diccionario o o en forma negativa + ようになる/ようになります","rule":"Esta expresión se usa para hacer referencia a una situación imposible o irrealizable que se convierte en possible o realizable, o para exprear que se ha adquirido una costumbre o hábito que antes no se tenia.","ruleRuby":"Esta expresión se usa para hacer referencia a una situación imposible o irrealizable que se convierte en possible o realizable, o para exprear que se ha adquirido una costumbre o hábito que antes no se tenia.","exJp":"れんしゅう練習したら、およ泳げるようになります。　　　こ子どもがまれると、かぞく家族のたいせつ大切さがわ分かるようになります。","exJpRuby":"<ruby>練習<rt>れんしゅう<\/rt><\/ruby>したら、<ruby>泳<rt>およ<\/rt><\/ruby>げるようになります。　　　<ruby>子<rt>こ<\/rt><\/ruby>どもがまれると、<ruby>家族<rt>かぞく<\/rt><\/ruby>の<ruby>大切<rt>たいせつ<\/rt><\/ruby>さが<ruby>分<rt>わ<\/rt><\/ruby>かるようになります。"},{"id":"gp108","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（２）","pattern":"Verbo en forma diccionario o o en forma negativa + よう(に) + い言う/たの頼む/つた伝える/すす勧める, etc.","patternRuby":"Verbo en forma diccionario o o en forma negativa + よう(に) + い<ruby>言<rt>げん<\/rt><\/ruby>う/<ruby>頼<rt>たの<\/rt><\/ruby>む/<ruby>伝<rt>つた<\/rt><\/ruby>える/<ruby>勧<rt>すす<\/rt><\/ruby>める, etc.","rule":"Esta expresión se usa para aludir indirectamente a los detalles de una instrucción, solicitud, orden, recomendación, etc.","ruleRuby":"Esta expresión se usa para aludir indirectamente a los detalles de una instrucción, solicitud, orden, recomendación, etc.","exJp":"せんせい先生はにしゅくだい宿題をやるよう(に)い言いました。","exJpRuby":"<ruby>先生<rt>せんせい<\/rt><\/ruby>はに<ruby>宿題<rt>しゅくだい<\/rt><\/ruby>をやるよう(に)<ruby>言<rt>い<\/rt><\/ruby>いました。"},{"id":"gp109","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「よう」の色々な使い方（２）","pattern":"Verbo en forma-ますsin ます + ようがない/ようがありません","patternRuby":"Verbo en forma-ますsin ます + ようがない/ようがありません","rule":"Esta expresión se utiliza para enfatizar que algo es imposible por no tener manera o medios para hacerlo.  Para convertir una frase “SustantivoをVerbo” a este estilo, se usa la partícula “の” detrás del sustantivo seguido al verbo + “ようがない”.","ruleRuby":"Esta expresión se utiliza para enfatizar que algo es imposible por no tener manera o medios para hacerlo.  Para convertir una frase “SustantivoをVerbo” a este estilo, se usa la partícula “の” detrás del sustantivo seguido al verbo + “ようがない”.","exJp":"でんしゃ電車がと止まったので、かえ帰りようがありません。","exJpRuby":"<ruby>電車<rt>でんしゃ<\/rt><\/ruby>が<ruby>止<rt>と<\/rt><\/ruby>まったので、<ruby>帰<rt>かえ<\/rt><\/ruby>りようがありません。"},{"id":"gp110","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「みたい」の色々な使い方","pattern":"“Sustantivo 1 + みたいな + Sustantivo2” / “Sustantivo + みたいに + Predicado” / “Sustantivo + みたいだ”","patternRuby":"“Sustantivo 1 + みたいな + Sustantivo2” / “Sustantivo + みたいに + Predicado” / “Sustantivo + みたいだ”","rule":"“Sustantivo1みたいなSustantivo2” se usa para modificar un Sustantivo 2 citando al Sustantivo1 como ejemplo semejante o metáforo.  También, se puede usar “Sustantivo1はSustantivo2みたいにPredicado” para describir que el Sustantivo1 tiene caracteristicas mencionadas en el Predicado citando al Sustantivo 2 como ejemplo semejante o metáforo.  “Sustantivo1はSustantivo2みたいだ” se usa para expresar las características del Sustantivo 1 citando al Sustantivo2 como metáforo.  Como hemos visto, “のよう” y “みたい” significan lo mismo, pero “みたい” se emplea de una forma menos formal.","ruleRuby":"“Sustantivo1みたいなSustantivo2” se usa para modificar un Sustantivo 2 citando al Sustantivo1 como ejemplo semejante o metáforo.  También, se puede usar “Sustantivo1はSustantivo2みたいにPredicado” para describir que el Sustantivo1 tiene caracteristicas mencionadas en el Predicado citando al Sustantivo 2 como ejemplo semejante o metáforo.  “Sustantivo1はSustantivo2みたいだ” se usa para expresar las características del Sustantivo 1 citando al Sustantivo2 como metáforo.  Como hemos visto, “のよう” y “みたい” significan lo mismo, pero “みたい” se emplea de una forma menos formal.","exJp":"かのじょ彼女みたいなうつく美しさがほ欲しい。","exJpRuby":"<ruby>彼女<rt>かのじょ<\/rt><\/ruby>みたいな<ruby>美<rt>うつく<\/rt><\/ruby>しさが<ruby>欲<rt>ほ<\/rt><\/ruby>しい。"},{"id":"gp111","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「みたい」の色々な使い方","pattern":"[Sustantivo / Adjetivo en forma sencilla / Verbo en forma sencilla] + みたいだ","patternRuby":"[Sustantivo / Adjetivo en forma sencilla / Verbo en forma sencilla] + みたいだ","rule":"Esta expresión indica una conjetura a partir de determinada situación, como una apariencia externa, etc.  “〜みたいだ/みたいです” significa lo mismo que “〜ようだ/ようです”, pero en el lenguaje excrito o en discursos formales, normalmente se usa “〜ようだ/ようです”.","ruleRuby":"Esta expresión indica una conjetura a partir de determinada situación, como una apariencia externa, etc.  “〜みたいだ/みたいです” significa lo mismo que “〜ようだ/ようです”, pero en el lenguaje excrito o en discursos formales, normalmente se usa “〜ようだ/ようです”.","exJp":"くも雲のようす様子をみ見ると、にし西のほう方はあめ雨みたいだ。","exJpRuby":"<ruby>雲<rt>くも<\/rt><\/ruby>の<ruby>様子<rt>ようす<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>ると、<ruby>西<rt>にし<\/rt><\/ruby>の<ruby>方<rt>ほう<\/rt><\/ruby>は<ruby>雨<rt>あめ<\/rt><\/ruby>みたいだ。"},{"id":"gp112","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「らしい」の色々な使い方","pattern":"“Sustantivo 1 + らしい + Sustantivo2” / “Sustantivo + らしく + Predicado” / “Sustantivo + らしい”","patternRuby":"“Sustantivo 1 + らしい + Sustantivo2” / “Sustantivo + らしく + Predicado” / “Sustantivo + らしい”","rule":"La fórmula “sustantivo +らしい” o “sustantivo +らしく” se utiliza para formar adjetivos o adverbios significando que posee una cualidad o propiedad típica del sustantivo que precede.  También, “Sustantivo +らしい” puede ser el predicado de una oración.  En una expresión coloquial que refleja la impresión intuitiva del hablante, “らしい” se puede sustituir por “っぽい”.","ruleRuby":"La fórmula “sustantivo +らしい” o “sustantivo +らしく” se utiliza para formar adjetivos o adverbios significando que posee una cualidad o propiedad típica del sustantivo que precede.  También, “Sustantivo +らしい” puede ser el predicado de una oración.  En una expresión coloquial que refleja la impresión intuitiva del hablante, “らしい” se puede sustituir por “っぽい”.","exJp":"あき秋らしい","exJpRuby":"<ruby>秋<rt>あき<\/rt><\/ruby>らしい"},{"id":"gp113","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「らしい」の色々な使い方","pattern":"[Sustantivo / Adjetivo en forma sencilla / Verbo en forma sencilla] + らしい","patternRuby":"[Sustantivo / Adjetivo en forma sencilla / Verbo en forma sencilla] + らしい","rule":"Esta expresión indica que es una información leída o escuchada (un rumor), o pue ada guarda la forma-た, es decir, la forma pretérito.","exJp":"きょうしつ教室にはい入ったとき、でんき電気をつけます。","exJpRuby":"<ruby>教室<rt>きょうしつ<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>ったとき、<ruby>電気<rt>でんき<\/rt><\/ruby>をつけます。"},{"id":"gp122","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」「よう」「みたい」「らしい」の比較","pattern":"**〜****そう**","patternRuby":"**〜****そう**","rule":"*S**uposición** **objetiva** **basada** **únicamente** **en** la **apariencia*","ruleRuby":"*S**uposición** **objetiva** **basada** **únicamente** **en** la **apariencia*","exJp":"Verbo en forma-ます sin ます 〜","exJpRuby":"Verbo en forma-ます sin ます 〜"},{"id":"gp123","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」「よう」「みたい」「らしい」の比較","pattern":"**〜****よう**","patternRuby":"**〜****よう**","rule":"*S**uposición** **subjetiva** **basada** no solo **en** la **apariencia**, **sino** también **en** **diversos** **factores** **como** la **situación**, la **experiencia** y **los** **conocimientos*","ruleRuby":"*S**uposición** **subjetiva** **basada** no solo **en** la **apariencia**, **sino** también **en** **diversos** **factores** **como** la **situación**, la **experiencia** y **los** **conocimientos*","exJp":"Sustantivo +の 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜","exJpRuby":"Sustantivo +の 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜"},{"id":"gp124","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」「よう」「みたい」「らしい」の比較","pattern":"**〜****みたい**","patternRuby":"**〜****みたい**","rule":"*S**uposición** **subjetiva** **basadas** **en** **“**lo **que** ha visto y **sentido** **el **hablante**”**.*","ruleRuby":"*S**uposición** **subjetiva** **basadas** **en** **“**lo **que** ha visto y **sentido** **el **hablante**”**.*","exJp":"Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜","exJpRuby":"Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜"},{"id":"gp125","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」「よう」「みたい」「らしい」の比較","patte ","ruleRuby":"“<ruby>後<rt>あと<\/rt><\/ruby> (あと)” se utiliza como un sustantivo que indica un momento o un punto en el tiempo, y significa algo así como “después”, “momento posterior” o “la vez posterior.","exJp":"えど江戸じだい時代のはめいじ明治じだい時代です。　きゅうこう急行はのでんしゃ電車のあと後にく来る。　アメリカのはにゅうがく入学したあと後がたいへん大変だ。","exJpRuby":"<ruby>江戸<rt>えど<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>のは<ruby>明治<rt>めいじ<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>です。　<ruby>急行<rt>きゅうこう<\/rt><\/ruby>はの<ruby>電車<rt>でんしゃ<\/rt><\/ruby>の<ruby>後<rt>あと<\/rt><\/ruby>に<ruby>来<rt>く<\/rt><\/ruby>る。　アメリカのは<ruby>入学<rt>にゅうがく<\/rt><\/ruby>した<ruby>後<rt>あと<\/rt><\/ruby>が<ruby>大変<rt>たいへん<\/rt><\/ruby>だ。"},{"id":"gp143","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「後（あと/ご/のち）/後ろ (うしろ)」の使い方","pattern":"あと","patternRuby":"あと","rule":"“あと” se utiliza para expresar “restar” o “quedar”, o para continuar el relato, al igual que “luego”, “adicionalmente” o “además”.  En este uso, se expresa generalmente en Hiragana.","ruleRuby":"“あと” se utiliza para expresar “restar” o “quedar”, o para continuar el relato, al igual que “luego”, “adicionalmente” o “además”.  En este uso, se expresa generalmente en Hiragana.","exJp":"あと5ふん分でがき来ます。　 あと、しつもん質問が三つあります。　 べんとう弁当をください。あと、おちゃ茶もおねが願いします。","exJpRuby":"あと5<ruby>分<rt>ふん<\/rt><\/ruby>でが<ruby>来<rt>き<\/rt><\/ruby>ます。　 あと、<ruby>質問<rt>しつもん<\/rt><\/ruby>が<ruby>三<rt>さん<\/rt><\/ruby>つあります。　 <ruby>弁当<rt>べんとう<\/rt><\/ruby>をください。あと、お<ruby>茶<rt>ちゃ<\/rt><\/ruby>もお<ruby>願<rt>ねが<\/rt><\/ruby>いします。"},{"id":"gp144","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「後（あと/ご/のち）/後ろ (うしろ)」の使い方","pattern":"Sustantivo Cuantitficador (el período del tiempo) + 後 (ご)","patternRuby":"Sustantivo Cuantitficador (el período del tiempo) + <ruby>後<rt>あと<\/rt><\/ruby> (ご)","rule":"Esta expresión indica “cuánto tiempo ha/había/habrá pasado desde ahora o desde el momento ante-especificado”, y significa algo así como “dentro de (Sustantivo Cuantificador)”, o “(Sustantivo Cuantificador) después”.","ruleRuby":"Esta expresión indica “cuánto tiempo ha/había/habrá pasado desde ahora o desde el momento ante-especificado”, y significa algo así como “dentro de (Sustantivo Cuantificador)”, o “(Sustantivo Cuantificador) después”.","exJp":"30ぷん分ご後にしましょう。　　10ねん年ご後はがそら空をと飛ぶじだい時代になる。　　かのじょ彼女とって３ねん年ご後にけっこん結婚した。","exJpRuby":"30ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>ご<ruby>後<rt>あと<\/rt><\/ruby>にしましょう。　　10<ruby>年<rt>ねん<\/rt><\/ruby>ご<ruby>後<rt>あと<\/rt><\/ruby>はが<ruby>空<rt>そら<\/rt><\/ruby>を<ruby>飛<rt>と<\/rt><\/ruby>ぶ<ruby>時代<rt>じだい<\/rt><\/ruby>になる。　　<ruby>彼女<rt>かのじょ<\/rt><\/ruby>とって３<ruby>年<rt>ねん<\/rt><\/ruby>ご<ruby>後<rt>あと<\/rt><\/ruby>に<ruby>結婚<rt>けっこん<\/rt><\/ruby>した。"},{"id":"gp145","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「後（あと/ご/のち）/後ろ (うしろ)」の使い方","pattern":"[Sustantivo + の / Verbo en forma-た] + 後 (あと)  (+で) + Cláusula Principal","patternRuby":"[Sustantivo + の / Verbo en forma-た] + <ruby>後<rt>あと<\/rt><\/ruby> (あと)  (+で) + Cláusula Principal","rule":"Se utiliza para expresar que se realiza la acción o el hecho indicado por el verbo en la Cláusula Principal tuvo/tiene/tendrá lugar después de que hubiera/haya ocurrido la acción o el hecho indicado por el Sustantivo o Verbo que precede a “後 (あと).  El verbo que precede a “後 (あと) se usa siempre en la forma-たaunque la Cláusula Principal esté en pretérito o no pretérito.  En este contexto, se puede omitir la partícula “で” después de “後 (あと).","ruleRuby":"Se utiliza para expresar que se realiza la acción o el hecho indicado por el verbo en la Cláusula Principal tuvo/tiene/tendrá lugar después de que hubiera/haya ocurrido la acción o el hecho indicado por el Sustantivo o Verbo que precede a “<ruby>後<rt>あと<\/rt><\/ruby> (あと).  El verbo que precede a “<ruby>後<rt>あと<\/rt><\/ruby> (あと) se usa siempre en la forma-たaunque la Cláusula Principal esté en pretérito o no pretérito.  En este contexto, se puede omitir la partícula “で” después de “<ruby>後<rt>あと<\/rt><\/ruby> (あと).","exJp":"しょくじ食事の（で）さんぽ散歩にきませんか。","exJpRuby":"<ruby>食事<rt>しょくじ<\/rt><\/ruby>の（で）<ruby>散歩<rt>さんぽ<\/rt><\/ruby>にきませんか。"},{"id":"gp146","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「後（あと/ご/のち）/後ろ (うしろ)」の使い方","pattern":"[Sustantivo + の / Verbo en forma-た] + 後 (あと) + Cláusula Principal","patternRuby":"[Sustantivo + の / Verbo en forma-た] + <ruby>後<rt>あと<\/rt><\/ruby> (あと) + Cláusula Principal","rule":"Se utiliza para describir las consecuencias o el estado denotado en la Cláusula Principal que se produce tras la acción o el hecho indicado por Sustantivo o Verbo anterior a “後 (あと)” que ya ha terminado.  Con diferencia al uso 5 anterior, no viene la partícula “で” después de “後 (あと)”.  Y en la Cláusula Principal se utiliza un verbo que expresa un estado.  El verbo que precede a “後 (あと) se usa siempre en la forma-たaunque la Cláusula Principal esté en pretérito o no pretérito.","ruleRuby":"Se utiliza para describir las consecuencias o el estado denotado en la Cláusula Principal que se produce tras la acción o el hecho indicado por Sustantivo o Verbo anterior a “<ruby>後<rt>あと<\/rt><\/ruby> (あと)” que ya ha terminado.  Con diferencia al uso 5 anterior, no viene la partícula “で” después de “<ruby>後<rt>あと<\/rt><\/ruby> (あと)”.  Y en la Cláusula Principal se utiliza un verbo que expresa un estado.  El verbo que precede a “<ruby>後<rt>あと<\/rt><\/ruby> (あと) se usa siempre en la forma-たaunque la Cláusula Principal esté en pretérito o no pretérito.","exJp":"しょくじ食事の、ねむ眠ってしまいました。","exJpRuby":"<ruby>食事<rt>しょくじ<\/rt><\/ruby>の、<ruby>眠<rt>ねむ<\/rt><\/ruby>ってしまいました。"},{"id":"gp147","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「前（まえ）」の使い方","pattern":"前 (まえ)","patternRuby":"<ruby>前<rt>まえ<\/rt><\/ruby> (まえ)","rule":"“前 (まえ)” se utiliza como un sustantivo que indica una posición o un lugar, y significa algo así como “delante” o “frente”.","ruleRuby":"“<ruby>前<rt>まえ<\/rt><\/ruby> (まえ)” se utiliza como un sustantivo que indica una posición o un lugar, y significa algo así como “delante” o “frente”.","exJp":"Aぎんこう銀行はのまえ前にあります。　　がっこう学校のでともだち友達をま待っていた。","exJpRuby":"A<ru verbo que expresa una acción.  El verbo anterior a “前 (まえ) se usa siempre en la forma de diccionario aunque la Cláusula Principal esté en pretérito o no pretérito.","ruleRuby":"Se utiliza para expresar que se realiza la acción del verbo en la Cláusula Principal en un momento anterior al del hecho referido en el Sustantivo o Verbo anterior a “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ).  Por lo tanto, en la Cláusula Principal se utiliza un verbo que expresa una acción.  El verbo anterior a “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ) se usa siempre en la forma de diccionario aunque la Cláusula Principal esté en pretérito o no pretérito.","exJp":"テストのにぶんぽう文法のふくしゅう復習をしました。","exJpRuby":"テストのに<ruby>文法<rt>ぶんぽう<\/rt><\/ruby>の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>をしました。"},{"id":"gp151","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「前（まえ）」の使い方","pattern":"[Sustantivo + の / Verbo en forma diccionario] + 前 (まえ) (+は) + Cláusula Principal","patternRuby":"[Sustantivo + の / Verbo en forma diccionario] + <ruby>前<rt>まえ<\/rt><\/ruby> (まえ) (+は) + Cláusula Principal","rule":"Se utiliza para expresar la situación o estado denotado en la Cláusula Principal antes del hecho referido en el Sustantivo o Verbo anterior a “前 (まえ).  Con diferencia al uso 4 anterior, no viene “に” despues de “前 (まえ)” pero puede venir “は”.  Y en la Cláusula Principal se utiliza un verbo que expresa un estado.  El verbo anterior a “前 (まえ) se usa siempre en la forma de diccionario aunque la Cláusula Principal esté en pretérito o no pretérito.","ruleRuby":"Se utiliza para expresar la situación o estado denotado en la Cláusula Principal antes del hecho referido en el Sustantivo o Verbo anterior a “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ).  Con diferencia al uso 4 anterior, no viene “に” despues de “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ)” pero puede venir “は”.  Y en la Cláusula Principal se utiliza un verbo que expresa un estado.  El verbo anterior a “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ) se usa siempre en la forma de diccionario aunque la Cláusula Principal esté en pretérito o no pretérito.","exJp":"めいじ明治じだい時代の、日本はさこく鎖国していた。","exJpRuby":"<ruby>明治<rt>めいじ<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>の、<ruby>日本<rt>にっぽん<\/rt><\/ruby>は<ruby>鎖国<rt>さこく<\/rt><\/ruby>していた。"},{"id":"gp152","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo en forma-て+しまう/しまいます","patternRuby":"Verbo en forma-て+しまう/しまいます","rule":"Indica que una acción se ha completado por completo.","ruleRuby":"Indica que una acción se ha completado por completo.","exJp":"きょう今日、からか借りたほん本をよ読んでしまいます。","exJpRuby":"<ruby>今日<rt>きょう<\/rt><\/ruby>、から<ruby>借<rt>か<\/rt><\/ruby>りた<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>んでしまいます。"},{"id":"gp153","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo en forma-て+しまう/しまいます","patternRuby":"Verbo en forma-て+しまう/しまいます","rule":"Se utiliza cuando se ha cometido un acto sin querer y se lamenta o se arrepiente.","ruleRuby":"Se utiliza cuando se ha cometido un acto sin querer y se lamenta o se arrepiente.","exJp":"きのう昨日か買ったばかりのをでんしゃ電車にわす忘れてしまった。","exJpRuby":"<ruby>昨日<rt>きのう<\/rt><\/ruby><ruby>買<rt>か<\/rt><\/ruby>ったばかりのを<ruby>電車<rt>でんしゃ<\/rt><\/ruby>に<ruby>忘<rt>わす<\/rt><\/ruby>れてしまった。"},{"id":"gp154","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo volitivo en forma-て+みる/みます","patternRuby":"Verbo volitivo en forma-て+みる/みます","rule":"Significa \"probar a hacer algo\" o \"hacerlo para ver cómo sale\".","ruleRuby":"Significa &quot;probar a hacer algo&quot; o &quot;hacerlo para ver cómo sale&quot;.","exJp":"このコートをき着てみてもいいですか。","exJpRuby":"このコートを<ruby>着<rt>き<\/rt><\/ruby>てみてもいいですか。"},{"id":"gp155","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo volitivo en forma-て+みせる/みせます","patternRuby":"Verbo volitivo en forma-て+みせる/みせます","rule":"Es una forma de expresar la voluntad o la determinación del hablante, con matiz de demostrárselo al interloctor.","ruleRuby":"Es una forma de expresar la voluntad o la determinación del hablante, con matiz de demostrárselo al interloctor.","exJp":"けっこん結婚したら、をしあわ幸せにしてみせます。","exJpRuby":"<ruby>結婚<rt>けっこん<\/rt><\/ruby>したら、を<ruby>幸<rt>しあわ<\/rt><\/ruby>せにしてみせます。"},{"id":"gp156","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo en forma-て+いく/いきます","patternRuby":"Verbo en forma-て+いく/いきます","rule":"Indica un movimiento o estado que se aleja del hablante.","ruleRuby":"Indica un movimiento o estado que se aleja del hablante.","exJp":"ふくおか福岡へはにの乗っていくほうがべんり便利だ。","exJpRuby":"<ruby>福岡<rt>ふくおか<\/rt><\/ruby>へはに<ruby>乗<rt>の<\/rt><\/ruby>っていくほうが<ruby>便利<rt>べんり<\/rt><\/ruby>だ。"},{"id":"gp157","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo en forma-て+いく/いきます","patternRuby":"Verbo en forma-て+いく/いきます","rule":"Indica un movimiento o una evolución de un estado desde el momento actual hacia el futuro.","ruleRuby":"Indica un movimiento o una evolución de un estado desde el momento actual hacia el futuro.","exJp":"これからものべんきょう勉強をつづ続けていきます。","exJpRuby":"これからもの<ruby>勉強<rt>べんきょう<\/rt><\/ruby>を<ruby>続<rt>つづ<\/rt><\/ruby>けていきます。"},{"id":"gp158","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo vollitivo en forma-て+くる/きます","patternRuby":"Verbo vollitivo en forma-て+くる/きます","rule":"Se utiliza cuando el hablante va a algún lugar, hace la acción expresada por el verbo volitivo y vuelve.","ruleRuby":"Se utiliza cuando el hablante va a algún lugar, hace la acción expresada por el verbo volitivo y vuelve.","exJp":"コンビニでをか買ってくるから、ま待って。","exJpRuby":"コンビニでを<ruby>買<rt>か<\/rt><\/ruby>ってくるから、<ruby>待<rt>ま<\/rt><\/ruby>って。"},{"id":"gp159","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo en forma-て+くる/きます","patternRuby":"Verbo en forma-て+くる/きます","rule":"Indica movimientos o estados de que algo aparece, se desplaza o cambia en dirección al hablante.","ruleRuby":"Indica movimientos o estados de que algo aparece, se desplaza o cambia en dirección al hablante.","exJp":"や焼きをや焼く、いいにおいがしてきた。","exJpRuby":"<ruby>焼<rt>や<\/rt><\/ruby>きを<ruby>焼<rt>や<\/rt><\/ruby>く、いいにおいがしてきた。"},{"id":"gp160","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (2)","pattern":"Verbo en forma-て+くる/きます","patternRuby":"Verbo en forma-て+くる/きます","rule":"Indica que una acción o un estado se ha prolongado desde el pasado hasta el presente.","ruleRuby":"Indica que una acción o un estado se ha prolongado desde el pasado hasta el presente.","exJp":"かんこう観光でするがいこくじん外国人がふ増えてきました。","exJpRuby":"<ruby>観光<rt>かんこう<\/rt><\/ruby>でする<ruby>外国人<rt>がいこくじん<\/rt><\/ruby>が<ruby>増<rt>ふ<\/rt><\/ruby>えてきました。"},{"id":"gp161","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「あいだ/間」の色々な使い方","pattern":"[Sustantivo1 +と+ Sustantivo2 +の / Sustantivos3 (plural) + の] + 間 (あいだ) + に/を/で/の/・・・","patternRuby":"[Sustantivo1 +と+ Sustantivo2 +の / Sustantivos3 (plural) + の] + <ruby>間<rt>ま<\/rt><\/ruby> (あいだ) + に/を/で/の/・・・","rule":"“間 (あいだ)” es un sustantivo que denota la posición, extensión o la distancia entre el Sustantivo1 y el Sustantivo 2 o entre los Sustantivos3 (plural).","ruleRuby":"“<ruby>間<rt>ま<\/rt><\/ruby> (あいだ)” es un sustantivo que denota la posición, extensión o la distancia entre el Sustantivo1 y el Sustantivo 2 o entre los Sustantivos3 (plural).","exJp":"ほんや本屋はにくや肉屋とパンや屋のあいだ間にあります。","exJpRuby":"<ruby>本屋<rt>ほんや<\/rt><\/ruby>は<ruby>肉屋<rt>にくや<\/rt><\/ruby>とパン<ruby>屋<rt>や<\/rt><\/ruby>のあいだ<ruby>間<rt>ま<\/rt><\/ruby>にあります。"},{"id":"gp162","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「あいだ/間」の色々な使い方","pattern":"[Sustantivo +の / Adjetivo / Verbo en forma diccionario o en forma-て+いる] + あいだ(は) + Cláusula Principal","patternRuby":"[Sustantivo +の / Adjetivo / Verbo en forma diccionario o en forma-て+いる] + あいだ(は) + Cláusula Principal","rule":"Esta expresión se utiliza para mostrar que tanto la acción o situación que precede a “あいだ” como la acción o situación denotada en la Cláusula Principal se mantienen simultaneamente durante cierto período de tiempo.","ruleRuby":"Esta expresión se utiliza para mostrar que tanto la acción o situación que precede a “あいだ” como la acción o situación denotada en la Cláusula Principal se mantienen simultaneamente durante cierto período de tiempo.","exJp":"わたし私がびょうき病気のあいだ、はは母はしごと仕事をやす休んだ。","exJpRuby":"わたし<ruby>私<rt>わたくし<\/rt><\/ruby>が<ruby>病気<rt>びょうき<\/rt><\/ruby>のあいだ、<ruby>母<rt>はは<\/rt><\/ruby>は<ruby>仕事<rt>しごと<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>んだ。"},{"id":"gp163","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「あいだ/間」の色々な使い方","pattern":"[Sustantivo +の / Adjetivo / Verbo en forma diccionario o en forma-て+いる] + あいだに + Cláusula Principal","patternRuby":"[Sustantivo +の / Adjetivo / Verbo en forma diccionario o en forma-て+いる] + あいだに + Cláusula Principal","rule":"Esta expresión se utiliza para mostrar que, mientras la acción o la situación que precede a “あいだ” se mantiene por cierto período de tiempo, la acción denotada en la Cláusula Principal se toma o el suceso denotado en la Cláusula Principal surge.","ruleRuby":"Esta expresión se utiliza para mostrar que, mientras la acción o la situación que precede a “あいだ” se mantiene por cierto período de tiempo, la acción denotada en la Cláusula Principal se toma o el suceso denotado en la Cláusula Principal surge.","exJp":"なつやす夏休みのあいだに、おきなわ沖縄にりょこう旅行した。","exJpRuby":"<ruby>夏休<rt>なつやす<\/rt><\/ruby>みのあいだに、<ruby>沖縄<rt>おきなわ<\/rt><\/ruby>に<ruby>旅行<rt>りょこう<\/rt><\/ruby>した。"},{"id":"gp164","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「うち」の色々な使い方","pattern":"[Sustantivo +の / Adjetivo / Verbo en forma sencilla] + うち + は/が/に/を/で/の/・・・","patternRuby":"[Sustantivo +の / Adjetivo / Verbo en forma sencilla] + うち + は/が/に/を/で/の/・・・","rule":"“うち” es un sustantivo que designa la casa.  Cuando se refiere a la casa de otra persona en el lenguaje coloquial, a veces se utiliza la forma abreviada “〜んち”, como en “おばあちゃんち” o “山田んち”.  Cuando se habla de la casa de una persona del mayor rango, es más cortés usar “お宅(おたく)” que “うち”.  Depende del contexto, “うち” puede designar el grupo que pertenece el hablante.","ruleRuby":"“うち” es un sustantivo que designa la casa.  Cuando se refiere a la casa de otra persona en el lenguaje coloquial, a veces se utiliza la forma abreviada “〜んち”, como en “おばあちゃんち” o “<ruby>山田<rt>やまだ<\/rt><\/ruby>んち”.  Cuando se habla de la casa de una persona del mayor rango, es más cortés usar “お<ruby>宅<rt>おたく<\/rt><\/ruby>” que “うち”.  Depende del contexto, “うち” puede designar el grupo que pertenece el hablante.","exJp":"わたし私のうちはよこはまし横浜市あおばく青葉区にあります。","exJpRuby":"わたし<ruby>私<rt>わたくし<\/rt><\/ruby>のうちは<ruby>横浜市<rt>よこはまし<\/rt><\/ruby><ruby>青葉区<rt>あおばく<\/rt><\/ruby>にあります。"},{"id":"gp165","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「うち」の色々な使い方","pattern":"Sustantivo (Numérico o Colectivo) +の + うち(で)","patternRuby":"Sustantivo (Numérico o Colectivo) +の + うち(で)","rule":"“〜のうち(で)” se utiliza como sustantivo para indicar un rango específico y se emplea cuando se extrae una parte del conjunto al que se refiere “〜”.  Tiene un significado similar al de “〜の中で”.","ruleRuby":"“〜のうち(で)” se utiliza como sustantivo para indicar un rango específico y se emplea cuando se extrae una parte del conjunto al que se refiere “〜”.  Tiene un significado similar al de “〜の<ruby>中<rt>なか<\/rt><\/ruby>で”.","exJp":"かぞく家族のうちで、うんてん運転できるのはわたし私だけです。","exJpRuby":"<ruby>家族<rt>かぞく<\/rt><\/ruby>のうちで、<ruby>運転<rt>うんてん<\/rt><\/ruby>できるのはわたし<ruby>私<rt>わたくし<\/rt><\/ruby>だけです。"},{"id":"gp166","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「うち」の色々な使い方","pattern":"[Sustantivo +の / Adjetivo / Verbo en forma diccionario, en forma-て +いる o en forma-ない] + うちに + Cláusula Principal","patternRuby":"[Sustantivo +の / Adjetivo / Verbo en forma diccionario, en forma-て +いる o en forma-ない] + うちに + Cláusula Principal","rule":"Esta expresión se utiliza para indicar que, mientras se mantiene una situación determinada, se produce algún cambio de forma gradual o sin que se de cuenta.","ruleRuby":"Esta expresión se utiliza para indicar que, mientras se mantiene una situación determinada, se produce algún cambio de forma gradual o sin que se de cuenta.","exJp":"るす留守のうちに、ゆうびんう郵便受けがあふれていた。","exJpRuby":"<ruby>留守<rt>るす<\/rt><\/ruby>のうちに、<ruby>郵便受<rt>ゆうびんう<\/rt><\/ruby>けがあふれていた。"},{"id":"gp167","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「うち」の色々な使い方","pattern":"[Sustantivo +の / Adjetivo / Verbo en forma diccionario, en forma-て +いる o en forma-ない] + うちに + Cláusula Principal","patternRuby":"[Sustantivo +の / Adjetivo / Verbo en forma diccionario, en forma-て +いる o en forma-ない] + うちに + Cláusula Principal","rule":"Esta expresión se utiliza para indicar la intención del hablante de que se debe hacer algo mientras persiste una determinada situación.  En el caso del Verbo en forma-ない, se expresa la intención de que se debe hacer algo antes de que se produzca la situación denotada por el verbo.  De todos modos, implica que, si se deja pasar ese plazo, es posible que ya no se pueda realizar esa acción o que se produzcan perjuicios.","ruleRuby":"Esta expresión se utiliza para indicar la intención del hablante de que se debe hacer algo mientras persiste una determinada situación.  En el caso del Verbo en forma-ない, se expresa la intención de que se debe hacer algo antes de que se produzca la situación denotada por el verbo.  De todos modos, implica que, si se deja pasar ese plazo, es posible que ya no se pueda realizar esa acción o que se produzcan perjuicios.","exJp":"どくしん独身のうちに、たくさんあそ遊んでおきたい。","exJpRuby":"<ruby>独身<rt>どくしん<\/rt><\/ruby>のうちに、たくさん<ruby>遊<rt>あそ<\/rt><\/ruby>んでおきたい。"},{"id":"gp168","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「うち」の色々な使い方","pattern":"Verbo en forma diccionario +か + Verbo en forma-ない +か + の + うちに + Cláusula Principal","patternRuby":"Verbo en forma diccionario +か + Verbo en forma-ない +か + の + うちに + Cláusula Principal","rule":"Esta expresión se utiliza para indicar el significado de “en cuanto...”, enfatizando que el evento denotado en la Cláusula Principal ocurre poco después de la acción del Verbo antes de \"うちに\" o casi al mismo tiempo.  Como esta estructura se utiliza para cosas que ya han ocurrido, la Cláusula Principal siempre va con un verbo en forma-た, es decir, en forma pretérito.","ruleRuby":"Esta expresión se utiliza para indicar el significado de “en cuanto...”, enfatizando que el evento denotado en la Cláusula Principal ocurre poco después de la acción del Verbo antes de &quot;うちに&quot; o casi al mismo tiempo.  Como esta estructura se utiliza para cosas que ya han ocurrido, la Cláusula Principal siempre va con un verbo en forma-た, es decir, en forma pretérito.","exJp":"えき駅につ着くかつ着かないかのうちにあめ雨がふ降り出した。　　た食べおわ終わるかおわ終わらないかのうちに、つぎ次のりょうり料理がき来た。","exJpRuby":"<ruby>駅<rt>えき<\/rt><\/ruby>に<ruby>着<rt>つ<\/rt><\/ruby>くか<ruby>着<rt>つ<\/rt><\/ruby>かないかのうちに<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>り<ruby>出<rt>で<\/rt><\/ruby>した。　　<ruby>食<rt>た<\/rt><\/ruby>べおわ<ruby>終<rt>おわり<\/rt><\/ruby>わるかおわ<ruby>終<rt>おわり<\/rt><\/ruby>わらないかのうちに、<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>料理<rt>りょうり<\/rt><\/ruby>が<ruby>来<rt>き<\/rt><\/ruby>た。"},{"id":"gp169","cat":"vaux","catLabel":"Verbos auxiliares","lesson":"補助動詞・Verbos Auxiliares (3)","pattern":"Verbo volitivo en forma-て+もらう/もらいます","patternRuby":"Verbo volitivo en forma-て+もらう/もらいます","rule":"Denota el favor que se recibe el sujeto cuando alguien hace algo por él. Es la otra persona la que actúa, y el sujeto es quien se beneficia de esa acción.","ruleRuby":"Denota el favor que se recibe el sujeto cuando alguien hace algo por él. Es la otra persona la que actúa, y el sujeto es quien se beneficia de esa acción.","exJp":"そのははは母おや親にがっこう学校へくるま車でおく送ってもらった。 だいがく大学のににほんご日本語をおし教えていただきます。","exJpRuby":"そのは<ruby>母<rt>はは<\/rt><\/ruby><ruby>親<rt>おや<\/rt><\/ruby>に<ruby>学校<rt>がっこう<\/rt><\/ruby>へ<ruby>車<rt>くるま<\/rt><\/ruby>で<ruby>送<rt>おく<\/rt><\/ruby>ってもらった。 <ruby>大学<rt>だいがく<\/rt><\/ruby>のににほんご<ruby>日本<rt>にっ >人<rt>ひと<\/rt><\/ruby>にまでの<ruby>道<rt>みち<\/rt><\/ruby>を<ruby>教<rt>おし<\/rt><\/ruby>えてあげました。 おりに<ruby>席<rt>せき<\/rt><\/ruby>を<ruby>譲<rt>ゆず<\/rt><\/ruby>ってさしあげました。"},{"id":"gp173","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「途中（とちゅう）」の使い方","pattern":"途中 (とちゅう)","patternRuby":"<ruby>途中<rt>とちゅう<\/rt><\/ruby> (とちゅう)","rule":"“途中 (とちゅう)” se utiliza como un sustantivo que designa “la parte comprendida entre el inicio y el final de un lugar o una acción” o “el trayecto o el camino hacia algún lugar”.  Se utiliza tanto para referirse al trayecto de un desplazamiento como a la mitad de una acción.","ruleRuby":"“<ruby>途中<rt>とちゅう<\/rt><\/ruby> (とちゅう)” se utiliza como un sustantivo que designa “la parte comprendida entre el inicio y el final de un lugar o una acción” o “el trayecto o el camino hacia algún lugar”.  Se utiliza tanto para referirse al trayecto de un desplazamiento como a la mitad de una acción.","exJp":"かんばん看板のがよご汚れていてよ読めない。","exJpRuby":"<ruby>看板<rt>かんばん<\/rt><\/ruby>のが<ruby>汚<rt>よご<\/rt><\/ruby>れていて<ruby>読<rt>よ<\/rt><\/ruby>めない。"},{"id":"gp174","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「途中（とちゅう）」の使い方","pattern":"[Sustantivo +の / Verbo en forma diccionario o en forma-て +いる] + 途中 (とちゅう) (+に) + Cláusula Principal","patternRuby":"[Sustantivo +の / Verbo en forma diccionario o en forma-て +いる] + <ruby>途中<rt>とちゅう<\/rt><\/ruby> (とちゅう) (+に) + Cláusula Principal","rule":"Se suele utilizar para indicar una ubicación o un hecho en la mitad de periodo del tiempo o desplazamiento, enfocando en un “momento concreto” o un “periodo” de tiempo de una acción o un estado.  Aunque la Cláusula Principal esté en pretérito o no pretérito, el verbo que precede a “途中” se utiliza en forma diccionario o en forma-て +いる.  La partícula “に” antes de la Cláusula Principal se puede omitir.","ruleRuby":"Se suele utilizar para indicar una ubicación o un hecho en la mitad de periodo del tiempo o desplazamiento, enfocando en un “momento concreto” o un “periodo” de tiempo de una acción o un estado.  Aunque la Cláusula Principal esté en pretérito o no pretérito, el verbo que precede a “<ruby>途中<rt>とちゅう<\/rt><\/ruby>” se utiliza en forma diccionario o en forma-て +いる.  La partícula “に” antes de la Cláusula Principal se puede omitir.","exJp":"かいぎ会議のとちゅう途中 (に)、でんわ電話がな鳴りはじ始めた。","exJpRuby":"<ruby>会議<rt>かいぎ<\/rt><\/ruby>の<ruby>途中<rt>とちゅう<\/rt><\/ruby> (に)、<ruby>電話<rt>でんわ<\/rt><\/ruby>が<ruby>鳴<rt>な<\/rt><\/ruby>り<ruby>始<rt>はじ<\/rt><\/ruby>めた。"},{"id":"gp175","cat":"tiempo","catLabel":"Tiempo y momento","lesson":"「途中（とちゅう）」の使い方","pattern":"[Sustantivo +の / Verbo en forma diccionario o en forma-て +いる]+ 途中 (とちゅう) (+で) + Cláusula Principal","patternRuby":"[Sustantivo +の / Verbo en forma diccionario o en forma-て +いる]+ <ruby>途中<rt>とちゅう<\/rt><\/ruby> (とちゅう) (+で) + Cláusula Principal","rule":"Se utiliza para expresar que, mientras que se realiza una acción o un desplazamiento indicado por el Sustantivo o Verbo que precede a “途中”, ocurre o se hace lo indicado en la Cláusula Principal.  Es una imagen en la que, en el transcurso de una acción, se pasa por un lugar o una situación determinados y, a continuación, se produce otra acción.  Aunque la Cláusula Principal esté en pretérito o no pretérito, el verbo que precede a “途中” se utiliza en forma diccionario en el caso de un desplazamiento,, y el verbo que precede a “途中” se utiliza en forma-て +いる en el caso de una acción.  En ambos casos, la partícula “で” se puede omitir.","ruleRuby":"Se utiliza para expresar que, mientras que se realiza una acción o un desplazamiento indicado por el Sustantivo o Verbo que precede a “<ruby>途中<rt>とちゅう<\/rt><\/ruby>”, ocurre o se hace lo indicado en la Cláusula Principal.  Es una imagen en la que, en el transcurso de una acción, se pasa por un lugar o una situación determinados y, a continuación, se produce otra acción.  Aunque la Cláusula Principal esté en pretérito o no pretérito, el verbo que precede a “<ruby>途中<rt>とちゅう<\/rt><\/ruby>” se utiliza en forma diccionario en el caso de un desplazamiento,, y el verbo que precede a “<ruby>途中<rt>とちゅう<\/rt><\/ruby>” se utiliza en forma-て +いる en el caso de una acción.  En ambos casos, la partícula “で” se puede omitir.","exJp":"そうじ掃除のとちゅう途中 (で)、むかし昔のしゃしん写真をみ見つけました。","exJpRuby":"<ruby>掃除<rt>そうじ<\/rt><\/ruby>の<ruby>途中<rt>とちゅう<\/rt><\/ruby> (で)、<ruby>昔<rt>むかし<\/rt><\/ruby>の<ruby>写真<rt>しゃしん<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>つけました。"},{"id":"gp176","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (1)","pattern":"Verbo en forma-ます+はじ始める/はじ始めます","patternRuby":"Verbo en forma-ます+<ruby>始<rt>はじ<\/rt><\/ruby>める/<ruby>始<rt>はじ<\/rt><\/ruby>めます","rule":"Indica el momento en que comienza la acción expresada por el verbo anterior. Se corresponde aproximadamente con \"empezar a hacerla\".","ruleRuby":"Indica el momento en que comienza la acción expresada por el verbo anterior. Se corresponde aproximadamente con &quot;empezar a hacerla&quot;.","exJp":"せんたくもの洗濯物をしているとき、あめ雨がふ降りはじ始めた。","exJpRuby":"<ruby>洗濯物<rt>せんたくもの<\/rt><\/ruby>をしているとき、<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>り<ruby>始<rt>はじ<\/rt><\/ruby>めた。"},{"id":"gp177","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (1)","pattern":"Verbo en forma-ます+だ出す/だ出します","patternRuby":"Verbo en forma-ます+<ruby>出<rt>だ<\/rt><\/ruby>す/<ruby>出<rt>だ<\/rt><\/ruby>します","rule":"Expresa que la acción expresada por el verbo anterior \"comienza de repente o a partir de un momento determinado\".","ruleRuby":"Expresa que la acción expresada por el verbo anterior &quot;comienza de repente o a partir de un momento determinado&quot;.","exJp":"せんせい先生のクシャミでたちがわら笑いだ出した。","exJpRuby":"<ruby>先生<rt>せんせい<\/rt><\/ruby>のクシャミでたちが<ruby>笑<rt>わら<\/rt><\/ruby>い<ruby>出<rt>だ<\/rt><\/ruby>した。"},{"id":"gp178","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (1)","pattern":"Verbo en forma-ます+つづ続ける/つづ続けます","patternRuby":"Verbo en forma-ます+<ruby>続<rt>つづ<\/rt><\/ruby>ける/<ruby>続<rt>つづ<\/rt><\/ruby>けます","rule":"Indica que la acción expresada por el verbo anterior se prolonga durante mucho tiempo o continua sin parar.","ruleRuby":"Indica que la acción expresada por el verbo anterior se prolonga durante mucho tiempo o continua sin parar.","exJp":"かのじょ彼女は２０もおな同じかいしゃ会社ではたら働きつづ続けている。","exJpRuby":"<ruby>彼女<rt>かのじょ<\/rt><\/ruby>は２０も<ruby>同<rt>おな<\/rt><\/ruby>じ<ruby>会社<rt>かいしゃ<\/rt><\/ruby>で<ruby>働<rt>はたら<\/rt><\/ruby>き<ruby>続<rt>つづ<\/rt><\/ruby>けている。"},{"id":"gp179","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (1)","pattern":"Verbo en forma-ます+とお通す/とお通します","patternRuby":"Verbo en forma-ます+<ruby>通<rt>とお<\/rt><\/ruby>す/<ruby>通<rt>とお<\/rt><\/ruby>します","rule":"significa continuar la acción expresada por el verbo anterior hasta el final sin interrumpirlo.","ruleRuby":"significa continuar la acción expresada por el verbo anterior hasta el final sin interrumpirlo.","exJp":"なに何があっても、はかぞく家族とのやくそく約束をまも守りとお通した。","exJpRuby":"<ruby>何<rt>なに<\/rt><\/ruby>があっても、は<ruby>家族<rt>かぞく<\/rt><\/ruby>との<ruby>約束<rt>やくそく<\/rt><\/ruby>を<ruby>守<rt>まも<\/rt><\/ruby>り<ruby>通<rt>とお<\/rt><\/ruby>した。"},{"id":"gp180","cat":"cambio","catLabel":"Cambio・なる・する","lesson":"「〜なる」の色々な使い方","pattern":"[Sustantivo+に / Adjetivo tipo-い en forma-く / Adjetivo tipo-な en forma-に] +なる","patternRuby":"[Sustantivo+に / Adjetivo tipo-い en forma-く / Adjetivo tipo-な en forma-に] +なる","rule":"Esta expresión se utiliza para convertir sustantivos o adjetivos en verbos intransitivos que representa la alteración del estado o cualidad de las cosas, personas, etc. y significa “convertirse en ...“, “volverse …”, “hacerse …”, etc.","ruleRuby":"Esta expresión se utiliza para convertir sustantivos o adjetivos en verbos intransitivos que representa la alteración del estado o cualidad de las cosas, personas, etc. y significa “convertirse en ...“, “volverse …”, “hacerse …”, etc.","exJp":"たなか田中さんは４がつ月からぶちょう部長になります。","exJpRuby":"<ruby>田中<rt>たなか<\/rt><\/ruby>さんは４<ruby>月<rt>がつ<\/rt><\/ruby>から<ruby>部長<rt>ぶちょう<\/rt><\/ruby>になります。"},{"id":"gp181","cat":"cambio","catLabel":"Cambio・なる・する","lesson":"「〜なる」の色々な使い方","pattern":"Sustantivo +と +なる","patternRuby":"Sustantivo +と +なる","rule":"Esta expresión se utiliza en la misma manera que “Sustantivo +に +なる” explicada en el 1. arriva.  Sin embargo, cuando se quiere expresar un cambio natural en las cosas o en el tiempo, la expresión “Sustantivo +に +なる” resulta más adecuada.  Por el contrario, la expresión “Sustantivo +と +なる” se utiliza más cuando se quiere destacar cambios o resultados inesperados, o cuando se quiere comunicar de manera formal cambios de carácter humano, como decisiones o directrices.","ruleRuby":"Esta expresión se utiliza en la misma manera que “Sustantivo +に +なる” explicada en el 1. arriva.  Sin embargo, cuando se quiere expresar un cambio natural en las cosas o en el tiempo, la expresión “Sustantivo +に +なる” resulta más adecuada.  Por el contrario, la expresión “Sustantivo +と +なる” se utiliza más cuando se quiere destacar cambios o resultados inesperados, o cuando se quiere comunicar de manera formal cambios de carácter humano, como decisiones o directrices.","exJp":"たなか田中さんがとなることがき決まりました。","exJpRuby":"<ruby>田中<rt>たなか<\/rt><\/ruby>さんがとなることが<ruby>決<rt>き<\/rt><\/ruby>まりました。"},{"id":"gp182","cat":"cambio","catLabel":"Cambio・なる・する","lesson":"「〜なる」の色々な使い方","pattern":"Sustantivo +から +なる","patternRuby":"Sustantivo +から +なる","rule":"Esta estructura es una forma de expresar que varios elementos o partes se unen para formar un todo, y se utiliza para explicar que algo está compuesto por determinados materiales o elementos.","ruleRuby":"Esta estructura es una forma de expresar que varios elementos o partes se unen para formar un todo, y se utiliza para explicar que algo está compuesto por determinados materiales o elementos.","exJp":"このレポートは、よっ四つのしょう章からなる。","exJpRuby":"このレポートは、よっ<ruby>四<rt>よん<\/rt><\/ruby>つの<ruby>章<rt>しょう<\/rt><\/ruby>からなる。"},{"id":"gp183","cat":"cambio","catLabel":"Cambio・なる・する","lesson":"「〜する」の色々な使い方","pattern":"Sustantivo +を +する","patternRuby":"Sustantivo +を +する","rule":"El verbo “する” adopta como objetos sustantivos de una amplia gama, y significa que la acción indicada por el objeto es ejecutada.","ruleRuby":"El verbo “する” adopta como objetos sustantivos de una amplia gama, y significa que la acción indicada por el objeto es ejecutada.","exJp":"サッカーをする","exJpRuby":"サッカーをする"},{"id":"gp184","cat":"cambio","catLabel":"Cambio・なる・する","lesson":"「〜する」の色々な使い方","pattern":"Sustantivo +する","patternRuby":"Sustantivo +する","rule":"Es un Grupo de verbos formados con sustantivo del tipo acción y “する”.","ruleRuby":"Es un Grupo de verbos formados con sustantivo del tipo acción y “する”.","exJp":"うんてん運転する","exJpRuby":"<ruby>運転<rt>うんてん<\/rt><\/ruby>する"},{"id":"gp185","cat":"cambio","catLabel":"Cambio・なる・する","lesson":"「〜する」の色々な使い方","pattern":"[Sustantivo+に / Adjetivo tipo-い en forma-く / Adjetivo tipo-な en forma-に] +する","patternRuby":"[Sustantivo+に / Adjetivo tipo-い en forma-く / Adjetivo tipo-な en forma-に] +する","rule":"Esta expresión se utiliza para convertir sustantivos o adjetivos en verbos transitivos para expresar que se hace que un objeto sufra algún tipo de cambio o transformación.","ruleRuby":"Esta expresión se utiliza para convertir sustantivos o adjetivos en verbos transitivos para expresar que se hace que un objeto sufra algún tipo de cambio o transformación.","exJp":"かれ彼をリーダーにするつもりです。","exJpRuby":"<ruby>彼<rt>かれ<\/rt><\/ruby>をリーダーにするつもりです。"},{"id":"gp186","cat":"cambio","catLabel":"Cambio・なる・する","lesson":"「〜する」の色々な使い方","pattern":"Sustantivo +に +する","patternRuby":"Sustantivo +に +する","rule":"Esta expresión se utiliza para indicar una selección y/o decision del hablante.","ruleRuby":"Esta expresión se utiliza para indicar una selección y/o decision del hablante.","exJp":"ことし今年ののりょこうさき旅行先はほっかいどう北海道にしました。","exJpRuby":"<ruby>今年<rt>ことし<\/rt><\/ruby>のの<ruby>旅行先<rt>りょこうさき<\/rt><\/ruby>は<ruby>北海道<rt>ほっかいどう<\/rt><\/ruby>にしました。"},{"id":"gp187","cat":"cambio","catLabel":"Cambio・なる・する","lesson":"「〜する」の色々な使い方","patte
