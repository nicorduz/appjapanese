<\/ruby>しからして、<ruby>彼女<rt>かのじょ<\/rt><\/ruby>は<ruby>頭<rt>あたま<\/rt><\/ruby>がよさ⤴そうだ。<\/p><p class=\"lp\"><ruby>昨日<rt>きのう<\/rt><\/ruby><ruby>彼<rt>かれ<\/rt><\/ruby>にったが、<ruby>元気<rt>げんき<\/rt><\/ruby>⤴そうな<ruby>表情<rt>ひょうじょう<\/rt><\/ruby>だった。 　 ・ <ruby>子<rt>こ<\/rt><\/ruby>どもたちがで<ruby>楽<rt>たの<\/rt><\/ruby>し⤴そうに<ruby>遊<rt>あそ<\/rt><\/ruby>んでいる。<\/p><p class=\"lp\">- Verbo en forma-ます sin ます + そうもない/そうにない<\/p><p class=\"lp\">(Esta expresión se usa para indicar que hay baja probabilidad de que suceda lo que se menciona con el Verbo.)<\/p><p class=\"lp\"><ruby>渋滞<rt>じゅうたい<\/rt><\/ruby>で２じ<ruby>時<rt>じ<\/rt><\/ruby>までに<ruby>会社<rt>かいしゃ<\/rt><\/ruby>へ<ruby>戻<rt>もど<\/rt><\/ruby>れそうにありません。　　<ruby>風邪<rt>かぜ<\/rt><\/ruby>なので、パーティーには<ruby>参加<rt>さんか<\/rt><\/ruby>できそうもない。<\/p><p class=\"lp\">マリノスでも、アーセナルには<ruby>勝<rt>か<\/rt><\/ruby>てそうもない。 ・ 　　この<ruby>論文<rt>ろんぶん<\/rt><\/ruby>は、あと１ヶ<ruby>月<rt>つき<\/rt><\/ruby>では<ruby>終<rt>お<\/rt><\/ruby>わりそうにないです。<\/p>","text":"「そう」の色々いろいろな使しい方ほう（２） - [Verbo forma sencilla / Adjetivo tipo-い / Adjetivo tipo-な en forma-だ / Sustantivoだ] + そうです/そうだ(Esta expresión se usa para transimitir información que se ha obtenido de alguna fuente sin añadir el punto de vista del propio hablante.  Verbo / Adjetivo que precede a “そう” tiene entonación descendiente.)来週らいしゅうはより寒さむくなる⤵そうです。 ・  ・ 彼かれは子こどもの、フランスに住すんでいた⤵そうです。隣となりののパエリヤを見みて、彼かれも食たべた⤵そうです。 ・ よしのや吉野よしの家いえのはおいしい⤵そうですよ。リーさんによると、先生せんせいの恋人こいびとは真面目まじめだ⤵そうだ。 ・ 　　　　天気てんき予報よほうによれば、は雨あめだ⤵そうだ。- Verbo en forma-ます sin ます + [そうです/そうだ / そうな + Sustantivo / そうに + Predicado](Esta expresión se usa para expresar indicios o señales de cambios y movimientos indicados por el verbo que precede.  No se trata de una hipótesis, sino que se utiliza para describir la situación actual de forma subjetiva basándose en las circunstancias que la rodean.  Verbo que precede a “そう” tiene entonación ascendiente.)来週らいしゅうはより寒さむくなり⤴そうです。 ・  ・ 道みちがんでいるので、約束やくそくの時間じかんに遅おくれ⤴そうだ。将来しょうらい、日本にっぽんでく外国人がいこくじんが増ふえ⤴そうです。 ・ 急きゅうにが暗くらくなって、雨あめが降ふり⤴そうでした。雨あめがり⤴そうなは、洗濯せんたくをしません。 ・ 酔よっいがホームで倒たおれ⤴そうに歩あるいていた。- [Verbo Estativo en forma-ます sin ます / Adjetivo tipo-い sinい / Adjetivo tipo-なsinな] + [そうです/そうだ / そうな + Sustantivo / そうに + Predicado](Esta expresión se usa cuando se realiza una suposición juzgando la apariencia o el aspecto de algo, aunque no se haya confirmado su naturaleza.  Verbo / Adjetivo que precede a “そう” tiene entonación ascendiente.)Nota: A pesar de la regla de conjugación explicado arriba, el verbo “ない” conjuga a “なさそう” y el adjetivo “いい/よい” conjuga a “よさそう”.外車がいしゃが3台だいあるので、このはおかね金きんがあり⤴そうだ。 ・ このだと、今日きょうの試合しあいはなさ⤴そうです。隣となりののパエリヤを見みて、彼かれも食たべた⤴そうです。 ・ 話はなしからして、彼女かのじょは頭あたまがよさ⤴そうだ。昨日きのう彼かれにったが、元気げんき⤴そうな表情ひょうじょうだった。 　 ・ 子こどもたちがで楽たのし⤴そうに遊あそんでいる。- Verbo en forma-ます sin ます + そうもない/そうにない(Esta expresión se usa para indicar que hay baja probabilidad de que suceda lo que se menciona con el Verbo.)渋滞じゅうたいで２じ時じまでに会社かいしゃへ戻もどれそうにありません。　　風邪かぜなので、パーティーには参加さんかできそうもない。マリノスでも、アーセナルには勝かてそうもない。 ・ 　　この論文ろんぶんは、あと１ヶ月つきでは終おわりそうにないです。"},{"id":"L025","file":"20260618__YOU___1_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「よう」の色々な使い方（１）","titleRuby":"「よう」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>（１）","html":"<p class=\"lp\">- Sustantivo + の + [“ような+ Sustantivo” / “ように+ Predicado”]<\/p><p class=\"lp\">(“Sustantivo1のようなSustantivo2” se usa para modificar un Sustantivo 2 citando al Sustantivo1 como ejemplo semejante.  También, se puede usar “Sustantivo1はSustantivo2のようにPredicado” para describir que el Sustantivo1 tiene caracteristicas mencionadas en el Predicado citando al Sustantivo 2 como ejemplo semejante.)<\/p><p class=\"lp\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>のような<ruby>美<rt>うつく<\/rt><\/ruby>しさが<ruby>欲<rt>ほ<\/rt><\/ruby>しい。 ・  ・ <ruby>野球<rt>やきゅう<\/rt><\/ruby>のようなチームスポーツが<ruby>苦手<rt>にがて<\/rt><\/ruby>です。<\/p><p class=\"lp\"><ruby>田中<rt>たなか<\/rt><\/ruby>さんのように<ruby>速<rt>はや<\/rt><\/ruby>く<ruby>走<rt>はし<\/rt><\/ruby>りたい。 ・  ・ <ruby>人生<rt>じんせい<\/rt><\/ruby>を<ruby>数学<rt>すうがく<\/rt><\/ruby>のように<ruby>理論的<rt>りろんてき<\/rt><\/ruby>に<ruby>考<rt>かんが<\/rt><\/ruby>えることは<ruby>難<rt>むずか<\/rt><\/ruby>しい。<\/p><p class=\"lp\">- Sustantivo1 / Frase +というような / といったような + Sustantivo2<\/p><p class=\"lp\">(Esta expresión se usa para explicar el Sustantivo2 citando el Sustantivo1 o Frase como ejemplo específico.  Es una expresión similar al uso No.1, pero es un estilo de expresión más erudito o académico.)<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は<ruby>金閣寺<rt>きんかくじ<\/rt><\/ruby>というような<ruby>派手<rt>はで<\/rt><\/ruby>な<ruby>寺<rt>てら<\/rt><\/ruby>が<ruby>好<rt>す<\/rt><\/ruby>きです。   　<ruby>電車<rt>でんしゃ<\/rt><\/ruby>が<ruby>遅<rt>おく<\/rt><\/ruby>れたというような<ruby>言<rt>い<\/rt><\/ruby>い<ruby>訳<rt>わけ<\/rt><\/ruby>は<ruby>信用<rt>しんよう<\/rt><\/ruby>できません。<\/p><p class=\"lp\">ケーキやクッキーといったような<ruby>甘<rt>あま<\/rt><\/ruby>いものは<ruby>控<rt>ひか<\/rt><\/ruby>えてください。<\/p><p class=\"lp\"><ruby>移民<rt>いみん<\/rt><\/ruby>をどのように<ruby>受<rt>う<\/rt><\/ruby>け<ruby>入<rt>い<\/rt><\/ruby>れるかといったような<ruby>問題<rt>もんだい<\/rt><\/ruby>が<ruby>議論<rt>ぎろん<\/rt><\/ruby>されている。<\/p><p class=\"lp\">- [Verbo / Adjetivo en forma sencilla] + [ような+ Sustantivo / ように+ Predicado]<\/p><p class=\"lp\">(En esta expresión, “ような/ように” se usa para modificar un sustantivo o predicado posterior citando las características o maneras expresadas por el verbo o adjetivo que precede.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>が<ruby>持<rt>も<\/rt><\/ruby>っているような<ruby>鞄<rt>かばん<\/rt><\/ruby>が<ruby>欲<rt>ほ<\/rt><\/ruby>しい。 ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>小学生<rt>しょうがくせい<\/rt><\/ruby>なのに、<ruby>大人<rt>おとな<\/rt><\/ruby>が<ruby>読<rt>よ<\/rt><\/ruby>むような<ruby>難<rt>むずか<\/rt><\/ruby>しい<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>む。<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>が<ruby>説明<rt>せつめい<\/rt><\/ruby>したように、<ruby>椅子<rt>いす<\/rt><\/ruby>を<ruby>並<rt>なら<\/rt><\/ruby>べてください。 ・ <ruby>彼女<rt>かのじょ<\/rt><\/ruby>がかわいいように、<ruby>彼女<rt>かのじょ<\/rt><\/ruby>の<ruby>娘<rt>むすめ<\/rt><\/ruby>もかわいいだろう。<\/p><p class=\"lp\">- (まるで +) Sustantivo + の + [ようだ/ようです / ような+ Sustantivo / ように+ Predicado]<\/p><p class=\"lp\">(“Sustantivo1はSustantivo2のようだ/ようです” se usa para expresar las características del Sustantivo 1 citando al Sustantivo2 como metáforo.  Hay casos en que se usa “Sustantivo1のようなSustantivo2” para modificar un Sustantivo 2 citando al Sustantivo1 como metáforo.  También, se puede usar “Sustantivo1はSustantivo2のようにPredicado” para describir que el Sustantivo1 tiene características mencionadas en el Predicado citando al Sustantivo 2 como metáforo.  Con frecuencia se agrega “まるで” antes del sustantivo metafórico.)<\/p><p class=\"lp\"><ruby>人生<rt>じんせい<\/rt><\/ruby>は（まるで）ジェットコースターのようだ。　　　セビリアの<ruby>旧市街<rt>きゅうしがい<\/rt><\/ruby>は（まるで）<ruby>迷路<rt>めいろ<\/rt><\/ruby>のようです。<\/p><p class=\"lp\">（まるで）わた<ruby>綿<rt>めん<\/rt><\/ruby>のような<ruby>雪<rt>ゆき<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>っています。 ・ マラソンの<ruby>後<rt>あと<\/rt><\/ruby>、<ruby>彼<rt>かれ<\/rt><\/ruby>は（まるで）<ruby>滝<rt>たき<\/rt><\/ruby>のような<ruby>汗<rt>あせ<\/rt><\/ruby>をかいていた。<\/p><p class=\"lp\"><ruby>母<rt>はは<\/rt><\/ruby>は<ruby>怒<rt>おこ<\/rt><\/ruby>ると、（まるで）<ruby>鬼<rt>おに<\/rt><\/ruby>のようにこわい。 ・ <ruby>彼<rt>かれ<\/rt><\/ruby>らは（まるで）アリのように<ruby>働<rt>はたら<\/rt><\/ruby>いています。<\/p><p class=\"lp\">- (まるで +) [Verbo / Adjetivo en forma sencilla] (+かの) + [ようだ/ようです / ような+ Sustantivo / ように+ Predicado]<\/p><p class=\"lp\">(En esta expresión, “ようだ/ような/ように” se usa para modificar un sustantivo o predicado posterior citando los aspectos metafóricos expresados con el verbo o adjetivo que precede.  Con frecuencia se agrega “まるで” antes o “かの” después del verbo o adjetivo metafórico.)<\/p><p class=\"lp\">この<ruby>絵<rt>え<\/rt><\/ruby>の<ruby>馬<rt>うま<\/rt><\/ruby>は（まるで）<ruby>生<rt>い<\/rt><\/ruby>きているようだ。 ・ <ruby>下<rt>した<\/rt><\/ruby>から<ruby>見<rt>み<\/rt><\/ruby>ると、ペンギンが<ruby>空<rt>そら<\/rt><\/ruby>を<ruby>飛<rt>と<\/rt><\/ruby>んでいる（かの）ようだ。<\/p><p class=\"lp\">（まるで）サウナの<ruby>中<rt>なか<\/rt><\/ruby>にいるような<ruby>天気<rt>てんき<\/rt><\/ruby>だ。 ・ <ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>何<rt>なに<\/rt><\/ruby>も<ruby>知<rt>し<\/rt><\/ruby>らなかった（かの）ような<ruby>表情<rt>ひょうじょう<\/rt><\/ruby>だった。<\/p><p class=\"lp\"><ruby>聞<rt>き<\/rt><\/ruby>いたことを<ruby>彼<rt>かれ<\/rt><\/ruby>は（まるで）<ruby>見<rt>み<\/rt><\/ruby>たように<ruby>話<rt>はな<\/rt><\/ruby>す。 ・ その<ruby>人<rt>ひと<\/rt><\/ruby>は<ruby>何<rt>なに<\/rt><\/ruby>かを<ruby>思<rt>おも<\/rt><\/ruby>い<ruby>出<rt>だ<\/rt><\/ruby>した（かの）ように<ruby>笑<rt>わら<\/rt><\/ruby>い<ruby>始<rt>はじ<\/rt><\/ruby>めた。<\/p><p class=\"lp\">この<ruby>本<rt>ほん<\/rt><\/ruby>は<ruby>飛<rt>と<\/rt><\/ruby>ぶように<ruby>売<rt>う<\/rt><\/ruby>れているそうです。 ・ <ruby>居酒屋<rt>いざかや<\/rt><\/ruby>で<ruby>若者<rt>わかもの<\/rt><\/ruby>たちが<ruby>酒<rt>さけ<\/rt><\/ruby>を<ruby>浴<rt>あ<\/rt><\/ruby>びるように<ruby>飲<rt>の<\/rt><\/ruby>んでいた。<\/p>","text":"「よう」の色々いろいろな使しい方ほう（１） - Sustantivo + の + [“ような+ Sustantivo” / “ように+ Predicado”](“Sustantivo1のようなSustantivo2” se usa para modificar un Sustantivo 2 citando al Sustantivo1 como ejemplo semejante.  También, se puede usar “Sustantivo1はSustantivo2のようにPredicado” para describir que el Sustantivo1 tiene caracteristicas mencionadas en el Predicado citando al Sustantivo 2 como ejemplo semejante.)彼女かのじょのような美うつくしさが欲ほしい。 ・  ・ 野球やきゅうのようなチームスポーツが苦手にがてです。田中たなかさんのように速はやく走はしりたい。 ・  ・ 人生じんせいを数学すうがくのように理論的りろんてきに考かんがえることは難むずかしい。- Sustantivo1 / Frase +というような / といったような + Sustantivo2(Esta expresión se usa para explicar el Sustantivo2 citando el Sustantivo1 o Frase como ejemplo específico.  Es una expresión similar al uso No.1, pero es un estilo de expresión más erudito o académico.)わたし私わたくしは金閣寺きんかくじというような派手はでな寺てらが好すきです。   　電車でんしゃが遅おくれたというような言いい訳わけは信用しんようできません。ケーキやクッキーといったような甘あまいものは控ひかえてください。移民いみんをどのように受うけ入いれるかといったような問題もんだいが議論ぎろんされている。- [Verbo / Adjetivo en forma sencilla] + [ような+ Sustantivo / ように+ Predicado](En esta expresión, “ような/ように” se usa para modificar un sustantivo o predicado posterior citando las características o maneras expresadas por el verbo o adjetivo que precede.)彼かれが持もっているような鞄かばんが欲ほしい。 ・  ・ 彼かれは小学生しょうがくせいなのに、大人おとなが読よむような難むずかしい本ほんを読よむ。わたし私わたくしが説明せつめいしたように、椅子いすを並ならべてください。 ・ 彼女かのじょがかわいいように、彼女かのじょの娘むすめもかわいいだろう。- (まるで +) Sustantivo + の + [ようだ/ようです / ような+ Sustantivo / ように+ Predicado](“Sustantivo1はSustantivo2のようだ/ようです” se usa para expresar las características del Sustantivo 1 citando al Sustantivo2 como metáforo.  Hay casos en que se usa “Sustantivo1のようなSustantivo2” para modificar un Sustantivo 2 citando al Sustantivo1 como metáforo.  También, se puede usar “Sustantivo1はSustantivo2のようにPredicado” para describir que el Sustantivo1 tiene características mencionadas en el Predicado citando al Sustantivo 2 como metáforo.  Con frecuencia se agrega “まるで” antes del sustantivo metafórico.)人生じんせいは（まるで）ジェットコースターのようだ。　　　セビリアの旧市街きゅうしがいは（まるで）迷路めいろのようです。（まるで）わた綿めんのような雪ゆきが降ふっています。 ・ マラソンの後あと、彼かれは（まるで）滝たきのような汗あせをかいていた。母ははは怒おこると、（まるで）鬼おにのようにこわい。 ・ 彼かれらは（まるで）アリのように働はたらいています。- (まるで +) [Verbo / Adjetivo en forma sencilla] (+かの) + [ようだ/ようです / ような+ Sustantivo / ように+ Predicado](En esta expresión, “ようだ/ような/ように” se usa para modificar un sustantivo o predicado posterior citando los aspectos metafóricos expresados con el verbo o adjetivo que precede.  Con frecuencia se agrega “まるで” antes o “かの” después del verbo o adjetivo metafórico.)この絵えの馬うまは（まるで）生いきているようだ。 ・ 下したから見みると、ペンギンが空そらを飛とんでいる（かの）ようだ。（まるで）サウナの中なかにいるような天気てんきだ。 ・ 彼かれは何なにも知しらなかった（かの）ような表情ひょうじょうだった。聞きいたことを彼かれは（まるで）見みたように話はなす。 ・ その人ひとは何なにかを思おもい出だした（かの）ように笑わらい始はじめた。この本ほんは飛とぶように売うれているそうです。 ・ 居酒屋いざかやで若者わかものたちが酒さけを浴あびるように飲のんでいた。"},{"id":"L026","file":"20260618__YOU___2_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「よう」の色々な使い方（２）","titleRuby":"「よう」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>（２）","html":"<p class=\"lp\">- [Sustantivo + の / Adjetivo / Verbo en forma sencilla] + ようだ/ようです<\/p><p class=\"lp\">(Esta expresión se utiliza cuando el hablante hace un juicio a partir de las circunstancias de un determinado momento sin poder afirmarlo categóricamente.  Con frecuencia, se agrega “どうも” o “どうやら” antes del Sustantivo, Adjetivo or Verbo.)<\/p><p class=\"lp\"><ruby>雲<rt>くも<\/rt><\/ruby>のを<ruby>見<rt>み<\/rt><\/ruby>ると、<ruby>西<rt>にし<\/rt><\/ruby>の<ruby>方<rt>ほう<\/rt><\/ruby>は（どうも）のようだ。 ・ <ruby>山田<rt>やまだ<\/rt><\/ruby>さんは（どうやら）<ruby>忙<rt>いそが<\/rt><\/ruby>しいようです。<\/p><p class=\"lp\">Jorgeは（どうやら）コーヒーがいなようだ。 ・  ・ あのラーメンは（どうも）があるようです。<\/p><p class=\"lp\"><ruby>昨日<rt>きのう<\/rt><\/ruby>からがあり、（どうも）<ruby>風邪<rt>かぜ<\/rt><\/ruby>をいたようだ。 ・ <ruby>今日<rt>きょう<\/rt><\/ruby>、は（どうやら）に<ruby>行<rt>い<\/rt><\/ruby>かないようです。<\/p><p class=\"lp\">- Verbo1 en forma diccionario o en forma negativa + ように+ Verbo2<\/p><p class=\"lp\">(Esta expresión se usa para expresar la realización de la situación que precede a “ように” como objetivo o propósito del Verbo 2.)<\/p><p class=\"lp\">みんなにかるように、<ruby>説明<rt>せつめい<\/rt><\/ruby>してください。 ・  ・ <ruby>日本<rt>にっぽん<\/rt><\/ruby>が<ruby>読<rt>よ<\/rt><\/ruby>めるように、<ruby>漢字<rt>かんじ<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>している。<\/p><p class=\"lp\"><ruby>遅刻<rt>ちこく<\/rt><\/ruby>しないように、<ruby>少<rt>すこ<\/rt><\/ruby>し<ruby>早<rt>はや<\/rt><\/ruby>い<ruby>電車<rt>でんしゃ<\/rt><\/ruby>に<ruby>乗<rt>の<\/rt><\/ruby>りました。 ・  ・ <ruby>母<rt>はは<\/rt><\/ruby>はけしないように、<ruby>日傘<rt>ひがさ<\/rt><\/ruby>を<ruby>使<rt>つか<\/rt><\/ruby>っている。<\/p><p class=\"lnote\">Nota: Tanto “ように” como “ために” se utilizan para expresar propósito, pero cada uno tiene matices y usos distintos.  Con “ために” se utilizan verbos volitivos, y el sujeto tanto en la cláusula antecedente como en la consecuente se refiere a la misma persona.  En cambio, con “ように” se utilizan verbos no volitivos y se utiliza a menudo con los verbos en forma potencial o negativa, así como con los verbos intransitivos.<\/p><p class=\"lp\"><ruby>試験<rt>しけん<\/rt><\/ruby>にするために、<ruby>毎日<rt>まいにち<\/rt><\/ruby>３<ruby>時間<rt>じかん<\/rt><\/ruby><ruby>勉強<rt>べんきょう<\/rt><\/ruby>します。     <ruby>試験<rt>しけん<\/rt><\/ruby>にできるように、<ruby>毎日<rt>まいにち<\/rt><\/ruby>３<ruby>時間<rt>じかん<\/rt><\/ruby><ruby>勉強<rt>べんきょう<\/rt><\/ruby>します。<\/p><p class=\"lp\">- Verbo en forma diccionario o o en forma negativa + ようにする/ようにします<\/p><p class=\"lp\">(Esta expresión se usa para expresar que uno realiza esfuerzos para hacer algo una costumbre o hábito.)<\/p><p class=\"lp\"><ruby>健康<rt>けんこう<\/rt><\/ruby>のため、できるだけくようにします。 ・ <ruby>朝<rt>あさ<\/rt><\/ruby>はヨーグルトをべるようにしています。<\/p><p class=\"lp\"><ruby>廊下<rt>ろうか<\/rt><\/ruby>ではらないようにしましょう。 ・  ・ このは<ruby>暗<rt>くら<\/rt><\/ruby>いので、<ruby>夜<rt>よる<\/rt><\/ruby>は<ruby>通<rt>とお<\/rt><\/ruby>らないようにしています。<\/p><p class=\"lp\">できるだけ<ruby>日本<rt>にっぽん<\/rt><\/ruby>で<ruby>話<rt>はな<\/rt><\/ruby>すようにしてください。 ・ おはあまり<ruby>飲<rt>の<\/rt><\/ruby>まないようにしてください。<\/p><p class=\"lp\">- Verbo en forma diccionario o o en forma negativa + ようになる/ようになります<\/p><p class=\"lp\">(Esta expresión se usa para hacer referencia a una situación imposible o irrealizable que se convierte en possible o realizable, o para exprear que se ha adquirido una costumbre o hábito que antes no se tenia.)<\/p><p class=\"lp\"><ruby>練習<rt>れんしゅう<\/rt><\/ruby>したら、<ruby>泳<rt>およ<\/rt><\/ruby>げるようになります。　　　<ruby>子<rt>こ<\/rt><\/ruby>どもがまれると、<ruby>家族<rt>かぞく<\/rt><\/ruby>の<ruby>大切<rt>たいせつ<\/rt><\/ruby>さが<ruby>分<rt>わ<\/rt><\/ruby>かるようになります。<\/p><p class=\"lp\"><ruby>何度<rt>なんど<\/rt><\/ruby>もして、<ruby>将棋<rt>しょうぎ<\/rt><\/ruby>で<ruby>兄<rt>あに<\/rt><\/ruby>に<ruby>負<rt>ま<\/rt><\/ruby>けないようになった。 ・ <ruby>忙<rt>いそが<\/rt><\/ruby>しくなって、を<ruby>食<rt>た<\/rt><\/ruby>べないようになった。<\/p><p class=\"lp\">- Verbo en forma diccionario o o en forma negativa + よう(に) + い<ruby>言<rt>げん<\/rt><\/ruby>う/<ruby>頼<rt>たの<\/rt><\/ruby>む/<ruby>伝<rt>つた<\/rt><\/ruby>える/<ruby>勧<rt>すす<\/rt><\/ruby>める, etc.<\/p><p class=\"lp\">(Esta expresión se usa para aludir indirectamente a los detalles de una instrucción, solicitud, orden, recomendación, etc.)<\/p><p class=\"lp\"><ruby>先生<rt>せんせい<\/rt><\/ruby>はに<ruby>宿題<rt>しゅくだい<\/rt><\/ruby>をやるよう(に)<ruby>言<rt>い<\/rt><\/ruby>いました。 ・ <ruby>店長<rt>てんちょう<\/rt><\/ruby>からのバイトに<ruby>入<rt>はい<\/rt><\/ruby>るよう(に)<ruby>頼<rt>たの<\/rt><\/ruby>まれました。<\/p><p class=\"lp\"><ruby>今度<rt>こんど<\/rt><\/ruby>のがうまく<ruby>行<rt>い<\/rt><\/ruby>くよう(に)<ruby>願<rt>ねが<\/rt><\/ruby>っている。 ・ <ruby>隣<rt>となり<\/rt><\/ruby>のに<ruby>大声<rt>おおごえ<\/rt><\/ruby>を<ruby>出<rt>だ<\/rt><\/ruby>さないよう(に)<ruby>注意<rt>ちゅうい<\/rt><\/ruby>しました。<\/p><p class=\"lp\"><ruby>映画<rt>えいが<\/rt><\/ruby>をる<ruby>前<rt>まえ<\/rt><\/ruby>にこの<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>むよう(に)<ruby>勧<rt>すす<\/rt><\/ruby>めた。 ・ <ruby>学生<rt>がくせい<\/rt><\/ruby>にパスポートをってくるよう(に)<ruby>連絡<rt>れんらく<\/rt><\/ruby>しました。<\/p><p class=\"lp\">- Verbo en forma-ますsin ます + ようがない/ようがありません<\/p><p class=\"lp\">(Esta expresión se utiliza para enfatizar que algo es imposible por no tener manera o medios para hacerlo.  Para convertir una frase “SustantivoをVerbo” a este estilo, se usa la partícula “の” detrás del sustantivo seguido al verbo + “ようがない”.)<\/p><p class=\"lp\"><ruby>電車<rt>でんしゃ<\/rt><\/ruby>が<ruby>止<rt>と<\/rt><\/ruby>まったので、<ruby>帰<rt>かえ<\/rt><\/ruby>りようがありません。 ・ 　　<ruby>学校<rt>がっこう<\/rt><\/ruby>へはまっすぐ<ruby>行<rt>い<\/rt><\/ruby>くだけだから、<ruby>迷<rt>まよ<\/rt><\/ruby>いようがない。<\/p><p class=\"lp\"><ruby>番号<rt>ばんごう<\/rt><\/ruby>を<ruby>知<rt>し<\/rt><\/ruby>らないから、<ruby>電話<rt>でんわ<\/rt><\/ruby>のしようがない。 ・ 　　<ruby>自分<rt>じぶん<\/rt><\/ruby>が<ruby>間違<rt>まちが<\/rt><\/ruby>えたので、<ruby>文句<rt>もんく<\/rt><\/ruby>の<ruby>言<rt>い<\/rt><\/ruby>いようがありません。<\/p>","text":"「よう」の色々いろいろな使しい方ほう（２） - [Sustantivo + の / Adjetivo / Verbo en forma sencilla] + ようだ/ようです(Esta expresión se utiliza cuando el hablante hace un juicio a partir de las circunstancias de un determinado momento sin poder afirmarlo categóricamente.  Con frecuencia, se agrega “どうも” o “どうやら” antes del Sustantivo, Adjetivo or Verbo.)雲くものを見みると、西にしの方ほうは（どうも）のようだ。 ・ 山田やまださんは（どうやら）忙いそがしいようです。Jorgeは（どうやら）コーヒーがいなようだ。 ・  ・ あのラーメンは（どうも）があるようです。昨日きのうからがあり、（どうも）風邪かぜをいたようだ。 ・ 今日きょう、は（どうやら）に行いかないようです。- Verbo1 en forma diccionario o en forma negativa + ように+ Verbo2(Esta expresión se usa para expresar la realización de la situación que precede a “ように” como objetivo o propósito del Verbo 2.)みんなにかるように、説明せつめいしてください。 ・  ・ 日本にっぽんが読よめるように、漢字かんじを勉強べんきょうしている。遅刻ちこくしないように、少すこし早はやい電車でんしゃに乗のりました。 ・  ・ 母はははけしないように、日傘ひがさを使つかっている。Nota: Tanto “ように” como “ために” se utilizan para expresar propósito, pero cada uno tiene matices y usos distintos.  Con “ために” se utilizan verbos volitivos, y el sujeto tanto en la cláusula antecedente como en la consecuente se refiere a la misma persona.  En cambio, con “ように” se utilizan verbos no volitivos y se utiliza a menudo con los verbos en forma potencial o negativa, así como con los verbos intransitivos.試験しけんにするために、毎日まいにち３時間じかん勉強べんきょうします。     試験しけんにできるように、毎日まいにち３時間じかん勉強べんきょうします。- Verbo en forma diccionario o o en forma negativa + ようにする/ようにします(Esta expresión se usa para expresar que uno realiza esfuerzos para hacer algo una costumbre o hábito.)健康けんこうのため、できるだけくようにします。 ・ 朝あさはヨーグルトをべるようにしています。廊下ろうかではらないようにしましょう。 ・  ・ このは暗くらいので、夜よるは通とおらないようにしています。できるだけ日本にっぽんで話はなすようにしてください。 ・ おはあまり飲のまないようにしてください。- Verbo en forma diccionario o o en forma negativa + ようになる/ようになります(Esta expresión se usa para hacer referencia a una situación imposible o irrealizable que se convierte en possible o realizable, o para exprear que se ha adquirido una costumbre o hábito que antes no se tenia.)練習れんしゅうしたら、泳およげるようになります。　　　子こどもがまれると、家族かぞくの大切たいせつさが分わかるようになります。何度なんどもして、将棋しょうぎで兄あにに負まけないようになった。 ・ 忙いそがしくなって、を食たべないようになった。- Verbo en forma diccionario o o en forma negativa + よう(に) + い言げんう/頼たのむ/伝つたえる/勧すすめる, etc.(Esta expresión se usa para aludir indirectamente a los detalles de una instrucción, solicitud, orden, recomendación, etc.)先生せんせいはに宿題しゅくだいをやるよう(に)言いいました。 ・ 店長てんちょうからのバイトに入はいるよう(に)頼たのまれました。今度こんどのがうまく行いくよう(に)願ねがっている。 ・ 隣となりのに大声おおごえを出ださないよう(に)注意ちゅういしました。映画えいがをる前まえにこの本ほんを読よむよう(に)勧すすめた。 ・ 学生がくせいにパスポートをってくるよう(に)連絡れんらくしました。- Verbo en forma-ますsin ます + ようがない/ようがありません(Esta expresión se utiliza para enfatizar que algo es imposible por no tener manera o medios para hacerlo.  Para convertir una frase “SustantivoをVerbo” a este estilo, se usa la partícula “の” detrás del sustantivo seguido al verbo + “ようがない”.)電車でんしゃが止とまったので、帰かえりようがありません。 ・ 　　学校がっこうへはまっすぐ行いくだけだから、迷まよいようがない。番号ばんごうを知しらないから、電話でんわのしようがない。 ・ 　　自分じぶんが間違まちがえたので、文句もんくの言いいようがありません。"},{"id":"L027","file":"20260622_Regla__SOUDA____YOUDA____MITAIDA____RASHII_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「そうだ」「ようだ」「みたいだ」「らしい」のルール","titleRuby":"「そうだ」「ようだ」「みたいだ」「らしい」のルール","html":"<p class=\"lp\">Cada uno de “そうだ”, “ようだ”, “みたいだ” y “らしい” se utiliza para expresar conjetura que representa el juicio subjetivo del hablante basado en alguna evidencia.  Sin embargo, estas difieren en términos de su conexión y significado.<\/p><p class=\"lp\">- “そうだ”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">“そうだ” se utiliza para transmitir información de oídas obtenida de fuentes externas (información escuchada de otra persona o vista en noticias o artículos).  Aquí no hay sentimientos ni opiniones personales del hablante, sino simplemente se transmite a quienes le rodean la información que ha obtenido en otros lugares.<\/p><p class=\"lp\">- Regla de conexión a “そうだ”<\/p><p class=\"lp\">“そうだ” viene después de a) Verbo: en forma sencilla tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma sencilla tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaだ tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoだ en tiempo no-pretérito o だった en tiempo pasado.<\/p><p class=\"lp\"><ruby>来週<rt>らいしゅう<\/rt><\/ruby>はより<ruby>寒<rt>さむ<\/rt><\/ruby>くなるそうです。 ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>子<rt>こ<\/rt><\/ruby>どもの、フランスに<ruby>住<rt>す<\/rt><\/ruby>んでいたそうです。<\/p><p class=\"lp\"><ruby>隣<rt>となり<\/rt><\/ruby>ののパエリヤを<ruby>見<rt>み<\/rt><\/ruby>て、<ruby>彼<rt>かれ<\/rt><\/ruby>も<ruby>食<rt>た<\/rt><\/ruby>べたそうです。 ・ よしのや<ruby>吉野<rt>よしの<\/rt><\/ruby><ruby>家<rt>いえ<\/rt><\/ruby>のはおいしいそうですよ。<\/p><p class=\"lp\">リーさんによると、<ruby>先生<rt>せんせい<\/rt><\/ruby>の<ruby>恋人<rt>こいびと<\/rt><\/ruby>は<ruby>真面目<rt>まじめ<\/rt><\/ruby>だそうだ。 ・  ・ <ruby>天気<rt>てんき<\/rt><\/ruby><ruby>予報<rt>よほう<\/rt><\/ruby>によれば、は<ruby>雨<rt>あめ<\/rt><\/ruby>だそうだ。<\/p><p class=\"lp\">- “ようだ”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">“ようだ” se utiliza cuando se deduce algo a partir de lo que se ve con los propios ojos, se huele o se saborea.  La diferencia entre “そうだ” y “ようだ” radica en si la fuente de la información es externa (“そうだ”) o uno mismo (“ようだ”).<\/p><p class=\"lp\">- Regla de conexión a “ようだ”<\/p><p class=\"lp\">“ようだ” viene después de a) Verbo: en forma sencilla tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma sencilla tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaな tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoの en tiempo no-pretérito o だった en tiempo pasado.<\/p><p class=\"lp\"><ruby>雲<rt>くも<\/rt><\/ruby>のを<ruby>見<rt>み<\/rt><\/ruby>ると、<ruby>西<rt>にし<\/rt><\/ruby>の<ruby>方<rt>ほう<\/rt><\/ruby>は<ruby>雨<rt>あめ<\/rt><\/ruby>のようだ。 ・ <ruby>山田<rt>やまだ<\/rt><\/ruby>さんはにも<ruby>出<rt>で<\/rt><\/ruby>ないので、<ruby>忙<rt>いそが<\/rt><\/ruby>しいようです。<\/p><p class=\"lp\">Jorgeはコーヒーがいなようだ。 ・  ・ <ruby>行列<rt>ぎょうれつ<\/rt><\/ruby>をると、あのラーメン<ruby>屋<rt>や<\/rt><\/ruby>は<ruby>人気<rt>にんき<\/rt><\/ruby>があるようです。<\/p><p class=\"lp\"><ruby>昨日<rt>きのう<\/rt><\/ruby>からがあり、<ruby>風邪<rt>かぜ<\/rt><\/ruby>を<ruby>引<rt>ひ<\/rt><\/ruby>いたようだ。 ・ <ruby>父<rt>ちち<\/rt><\/ruby>はまだていて、<ruby>今日<rt>きょう<\/rt><\/ruby>、<ruby>仕事<rt>しごと<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>かないようです。<\/p><p class=\"lp\">- “みたいだ”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">“みたいだ” tiene el mismo significado que “ようだ” y se utiliza para expresar juicios o predicciones basados en los propios sentidos.  Se utiliza en situaciones más informales que “ようだ” y es lenguaje coloquial.<\/p><p class=\"lp\">- Regla de conexión a “みたいだ”<\/p><p class=\"lp\">“みたいだ” viene después de a) Verbo: en forma sencilla, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de sencilla tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: sin な tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: sin agregar nada en tiempo no-pretérito o だった en tiempo pasado.<\/p><p class=\"lp\"><ruby>雲<rt>くも<\/rt><\/ruby>のを<ruby>見<rt>み<\/rt><\/ruby>ると、<ruby>西<rt>にし<\/rt><\/ruby>の<ruby>方<rt>ほう<\/rt><\/ruby>は<ruby>雨<rt>あめ<\/rt><\/ruby>みたいだ。 ・ <ruby>山田<rt>やまだ<\/rt><\/ruby>さんはにも<ruby>出<rt>で<\/rt><\/ruby>ないので、<ruby>忙<rt>いそが<\/rt><\/ruby>しいみたいです。<\/p><p class=\"lp\">Jorgeはコーヒーがいみたいだ。 ・  ・ <ruby>行列<rt>ぎょうれつ<\/rt><\/ruby>をると、あのラーメン<ruby>屋<rt>や<\/rt><\/ruby>は<ruby>人気<rt>にんき<\/rt><\/ruby>があるみたいです。<\/p><p class=\"lp\"><ruby>昨日<rt>きのう<\/rt><\/ruby>からがあり、<ruby>風邪<rt>かぜ<\/rt><\/ruby>を<ruby>引<rt>ひ<\/rt><\/ruby>いたみたいだ。 ・ <ruby>父<rt>ちち<\/rt><\/ruby>はまだていて、<ruby>今日<rt>きょう<\/rt><\/ruby>、<ruby>仕事<rt>しごと<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>かないみたいです。<\/p><p class=\"lp\">- “らしい”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">“らしい” se utiliza en rumores cuando se transmite información obtenida de fuentes externas (algo que se ha oído de otra persona o información vista en noticias o artículos), igual que “そうだ”.  Sin embargo, es más distante y objetivo que “そうだ” y se transmite con matiz de no garantizar su credibilidad, y con menos énfasis en los sentimientos personales del hablante.<\/p><p class=\"lp\">- Regla de conexión a “らしい”<\/p><p class=\"lp\">“らしい” viene después de a) Verbo: en forma sencilla, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de sencilla tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: sin な tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: sin agregar nada en tiempo no-pretérito o だった en tiempo pasado.<\/p><p class=\"lp\">ニュースによると、あした<ruby>明日<rt>あす<\/rt><\/ruby>は<ruby>雪<rt>ゆき<\/rt><\/ruby>らしい。 ・  ・ ジョニー・デップの<ruby>新<rt>あたら<\/rt><\/ruby>しい<ruby>映画<rt>えいが<\/rt><\/ruby>が<ruby>面白<rt>おもしろ<\/rt><\/ruby>いらしい。<\/p><p class=\"lp\">この<ruby>辺<rt>あた<\/rt><\/ruby>りの<ruby>住宅街<rt>じゅうたくがい<\/rt><\/ruby>は、いつも<ruby>静<rt>しず<\/rt><\/ruby>からしい。 ・ <ruby>木村<rt>きむら<\/rt><\/ruby>さん、<ruby>来月<rt>らいげつ<\/rt><\/ruby>で<ruby>会社<rt>かいしゃ<\/rt><\/ruby>を<ruby>辞<rt>や<\/rt><\/ruby>めるらしいよ。<\/p><p class=\"lp\"><ruby>駅前<rt>えきまえ<\/rt><\/ruby>で<ruby>車<rt>くるま<\/rt><\/ruby>の<ruby>事故<rt>じこ<\/rt><\/ruby>があったらしいですよ。 ・ <ruby>鈴木<rt>すずき<\/rt><\/ruby>さんは<ruby>会議<rt>かいぎ<\/rt><\/ruby>に<ruby>出席<rt>しゅっせき<\/rt><\/ruby>しなかったらしいです。<\/p>","text":"「そうだ」「ようだ」「みたいだ」「らしい」のルール Cada uno de “そうだ”, “ようだ”, “みたいだ” y “らしい” se utiliza para expresar conjetura que representa el juicio subjetivo del hablante basado en alguna evidencia.  Sin embargo, estas difieren en términos de su conexión y significado.- “そうだ”- Método de uso“そうだ” se utiliza para transmitir información de oídas obtenida de fuentes externas (información escuchada de otra persona o vista en noticias o artículos).  Aquí no hay sentimientos ni opiniones personales del hablante, sino simplemente se transmite a quienes le rodean la información que ha obtenido en otros lugares.- Regla de conexión a “そうだ”“そうだ” viene después de a) Verbo: en forma sencilla tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma sencilla tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaだ tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoだ en tiempo no-pretérito o だった en tiempo pasado.来週らいしゅうはより寒さむくなるそうです。 ・  ・ 彼かれは子こどもの、フランスに住すんでいたそうです。隣となりののパエリヤを見みて、彼かれも食たべたそうです。 ・ よしのや吉野よしの家いえのはおいしいそうですよ。リーさんによると、先生せんせいの恋人こいびとは真面目まじめだそうだ。 ・  ・ 天気てんき予報よほうによれば、は雨あめだそうだ。- “ようだ”- Método de uso“ようだ” se utiliza cuando se deduce algo a partir de lo que se ve con los propios ojos, se huele o se saborea.  La diferencia entre “そうだ” y “ようだ” radica en si la fuente de la información es externa (“そうだ”) o uno mismo (“ようだ”).- Regla de conexión a “ようだ”“ようだ” viene después de a) Verbo: en forma sencilla tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma sencilla tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: en formaな tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: agregandoの en tiempo no-pretérito o だった en tiempo pasado.雲くものを見みると、西にしの方ほうは雨あめのようだ。 ・ 山田やまださんはにも出でないので、忙いそがしいようです。Jorgeはコーヒーがいなようだ。 ・  ・ 行列ぎょうれつをると、あのラーメン屋やは人気にんきがあるようです。昨日きのうからがあり、風邪かぜを引ひいたようだ。 ・ 父ちちはまだていて、今日きょう、仕事しごとに行いかないようです。- “みたいだ”- Método de uso“みたいだ” tiene el mismo significado que “ようだ” y se utiliza para expresar juicios o predicciones basados en los propios sentidos.  Se utiliza en situaciones más informales que “ようだ” y es lenguaje coloquial.- Regla de conexión a “みたいだ”“みたいだ” viene después de a) Verbo: en forma sencilla, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de sencilla tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: sin な tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: sin agregar nada en tiempo no-pretérito o だった en tiempo pasado.雲くものを見みると、西にしの方ほうは雨あめみたいだ。 ・ 山田やまださんはにも出でないので、忙いそがしいみたいです。Jorgeはコーヒーがいみたいだ。 ・  ・ 行列ぎょうれつをると、あのラーメン屋やは人気にんきがあるみたいです。昨日きのうからがあり、風邪かぜを引ひいたみたいだ。 ・ 父ちちはまだていて、今日きょう、仕事しごとに行いかないみたいです。- “らしい”- Método de uso“らしい” se utiliza en rumores cuando se transmite información obtenida de fuentes externas (algo que se ha oído de otra persona o información vista en noticias o artículos), igual que “そうだ”.  Sin embargo, es más distante y objetivo que “そうだ” y se transmite con matiz de no garantizar su credibilidad, y con menos énfasis en los sentimientos personales del hablante.- Regla de conexión a “らしい”“らしい” viene después de a) Verbo: en forma sencilla, y tanto en tiempo no-pretérito como en tiempo pasado, b) Adjetivo tipo-い: en forma de sencilla tanto en tiempo no-pretérito como en tiempo pasado, c) Adjetivo tipo-な: sin な tanto en tiempo no-pretérito como en tiempo pasado, y d) Sustantivo: sin agregar nada en tiempo no-pretérito o だった en tiempo pasado.ニュースによると、あした明日あすは雪ゆきらしい。 ・  ・ ジョニー・デップの新あたらしい映画えいがが面白おもしろいらしい。この辺あたりの住宅街じゅうたくがいは、いつも静しずからしい。 ・ 木村きむらさん、来月らいげつで会社かいしゃを辞やめるらしいよ。駅前えきまえで車くるまの事故じこがあったらしいですよ。 ・ 鈴木すずきさんは会議かいぎに出席しゅっせきしなかったらしいです。"},{"id":"L028","file":"20260622__MITAI_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「みたい」の色々な使い方","titleRuby":"「みたい」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- “Sustantivo 1 + みたいな + Sustantivo2” / “Sustantivo + みたいに + Predicado” / “Sustantivo + みたいだ”<\/p><p class=\"lp\">(“Sustantivo1みたいなSustantivo2” se usa para modificar un Sustantivo 2 citando al Sustantivo1 como ejemplo semejante o metáforo.  También, se puede usar “Sustantivo1はSustantivo2みたいにPredicado” para describir que el Sustantivo1 tiene caracteristicas mencionadas en el Predicado citando al Sustantivo 2 como ejemplo semejante o metáforo.  “Sustantivo1はSustantivo2みたいだ” se usa para expresar las características del Sustantivo 1 citando al Sustantivo2 como metáforo.  Como hemos visto, “のよう” y “みたい” significan lo mismo, pero “みたい” se emplea de una forma menos formal.)<\/p><p class=\"lp\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>みたいな<ruby>美<rt>うつく<\/rt><\/ruby>しさが<ruby>欲<rt>ほ<\/rt><\/ruby>しい。 ・  ・  ・ <ruby>野球<rt>やきゅう<\/rt><\/ruby>みたいなチームスポーツが<ruby>苦手<rt>にがて<\/rt><\/ruby>です。<\/p><p class=\"lp\">わた<ruby>綿<rt>めん<\/rt><\/ruby>みたいな<ruby>雪<rt>ゆき<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>っています。 ・  ・  ・ マラソンの<ruby>後<rt>あと<\/rt><\/ruby>、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>滝<rt>たき<\/rt><\/ruby>みたいな<ruby>汗<rt>あせ<\/rt><\/ruby>をかいていた。<\/p><p class=\"lp\"><ruby>田中<rt>たなか<\/rt><\/ruby>さんみたいに<ruby>速<rt>はや<\/rt><\/ruby>く<ruby>走<rt>はし<\/rt><\/ruby>りたい。 ・  ・ <ruby>人生<rt>じんせい<\/rt><\/ruby>を<ruby>数学<rt>すうがく<\/rt><\/ruby>みたいに<ruby>理論的<rt>りろんてき<\/rt><\/ruby>に<ruby>考<rt>かんが<\/rt><\/ruby>えることは<ruby>難<rt>むずか<\/rt><\/ruby>しい。<\/p><p class=\"lp\"><ruby>母<rt>はは<\/rt><\/ruby>は<ruby>怒<rt>おこ<\/rt><\/ruby>ると、<ruby>鬼<rt>おに<\/rt><\/ruby>みたいにこわい。 ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>らはアリみたいに<ruby>働<rt>はたら<\/rt><\/ruby>いています。<\/p><p class=\"lp\"><ruby>人生<rt>じんせい<\/rt><\/ruby>はジェットコースターみたいだ。　　　 ・ セビリアのサンタクルス<ruby>地区<rt>ちく<\/rt><\/ruby>は<ruby>迷路<rt>めいろ<\/rt><\/ruby>みたいです。<\/p><p class=\"lp\">- [Sustantivo / Adjetivo en forma sencilla / Verbo en forma sencilla] + みたいだ<\/p><p class=\"lp\">(Esta expresión indica una conjetura a partir de determinada situación, como una apariencia externa, etc.  “〜みたいだ/みたいです” significa lo mismo que “〜ようだ/ようです”, pero en el lenguaje excrito o en discursos formales, normalmente se usa “〜ようだ/ようです”.)<\/p><p class=\"lp\"><ruby>雲<rt>くも<\/rt><\/ruby>の<ruby>様子<rt>ようす<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>ると、<ruby>西<rt>にし<\/rt><\/ruby>の<ruby>方<rt>ほう<\/rt><\/ruby>は<ruby>雨<rt>あめ<\/rt><\/ruby>みたいだ。 ・ <ruby>山田<rt>やまだ<\/rt><\/ruby>さんは<ruby>忙<rt>いそが<\/rt><\/ruby>しいみたいです。<\/p><p class=\"lp\">Jorgeはコーヒーが<ruby>嫌<rt>きら<\/rt><\/ruby>いみたいだ。 ・  ・ あのラーメン<ruby>屋<rt>や<\/rt><\/ruby>は<ruby>人気<rt>にんき<\/rt><\/ruby>があるみたいです。<\/p><p class=\"lp\"><ruby>昨日<rt>きのう<\/rt><\/ruby>から<ruby>熱<rt>ねつ<\/rt><\/ruby>があり、<ruby>風邪<rt>かぜ<\/rt><\/ruby>を<ruby>引<rt>ひ<\/rt><\/ruby>いたみたいだ。 ・ <ruby>今日<rt>きょう<\/rt><\/ruby>、<ruby>父<rt>ちち<\/rt><\/ruby>は<ruby>仕事<rt>しごと<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>かないみたいです。<\/p>","text":"「みたい」の色々いろいろな使しい方ほう - “Sustantivo 1 + みたいな + Sustantivo2” / “Sustantivo + みたいに + Predicado” / “Sustantivo + みたいだ”(“Sustantivo1みたいなSustantivo2” se usa para modificar un Sustantivo 2 citando al Sustantivo1 como ejemplo semejante o metáforo.  También, se puede usar “Sustantivo1はSustantivo2みたいにPredicado” para describir que el Sustantivo1 tiene caracteristicas mencionadas en el Predicado citando al Sustantivo 2 como ejemplo semejante o metáforo.  “Sustantivo1はSustantivo2みたいだ” se usa para expresar las características del Sustantivo 1 citando al Sustantivo2 como metáforo.  Como hemos visto, “のよう” y “みたい” significan lo mismo, pero “みたい” se emplea de una forma menos formal.)彼女かのじょみたいな美うつくしさが欲ほしい。 ・  ・  ・ 野球やきゅうみたいなチームスポーツが苦手にがてです。わた綿めんみたいな雪ゆきが降ふっています。 ・  ・  ・ マラソンの後あと、彼かれは滝たきみたいな汗あせをかいていた。田中たなかさんみたいに速はやく走はしりたい。 ・  ・ 人生じんせいを数学すうがくみたいに理論的りろんてきに考かんがえることは難むずかしい。母ははは怒おこると、鬼おにみたいにこわい。 ・  ・ 彼かれらはアリみたいに働はたらいています。人生じんせいはジェットコースターみたいだ。　　　 ・ セビリアのサンタクルス地区ちくは迷路めいろみたいです。- [Sustantivo / Adjetivo en forma sencilla / Verbo en forma sencilla] + みたいだ(Esta expresión indica una conjetura a partir de determinada situación, como una apariencia externa, etc.  “〜みたいだ/みたいです” significa lo mismo que “〜ようだ/ようです”, pero en el lenguaje excrito o en discursos formales, normalmente se usa “〜ようだ/ようです”.)雲くもの様子ようすを見みると、西にしの方ほうは雨あめみたいだ。 ・ 山田やまださんは忙いそがしいみたいです。Jorgeはコーヒーが嫌きらいみたいだ。 ・  ・ あのラーメン屋やは人気にんきがあるみたいです。昨日きのうから熱ねつがあり、風邪かぜを引ひいたみたいだ。 ・ 今日きょう、父ちちは仕事しごとに行いかないみたいです。"},{"id":"L029","file":"20260622__RASHII_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「らしい」の色々な使い方","titleRuby":"「らしい」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- “Sustantivo 1 + らしい + Sustantivo2” / “Sustantivo + らしく + Predicado” / “Sustantivo + らしい”<\/p><p class=\"lp\">(La fórmula “sustantivo +らしい” o “sustantivo +らしく” se utiliza para formar adjetivos o adverbios significando que posee una cualidad o propiedad típica del sustantivo que precede.  También, “Sustantivo +らしい” puede ser el predicado de una oración.  En una expresión coloquial que refleja la impresión intuitiva del hablante, “らしい” se puede sustituir por “っぽい”.)<\/p><p class=\"lp\"><ruby>秋<rt>あき<\/rt><\/ruby>らしい ・  ・ メッシらしいゴール ・  ・ <ruby>今日<rt>きょう<\/rt><\/ruby>はロンドンらしい<ruby>天気<rt>てんき<\/rt><\/ruby>だ。<\/p><p class=\"lp\"><ruby>秋<rt>あき<\/rt><\/ruby>っぽい<ruby>洋服<rt>ようふく<\/rt><\/ruby> ・  ・ メッシっぽいゴール ・  ・ 　　　ロンドンっぽい<ruby>天気<rt>てんき<\/rt><\/ruby><\/p><p class=\"lp\">いつもらしく<ruby>生<rt>い<\/rt><\/ruby>きたい。 ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>日本<rt>にっぽん<\/rt><\/ruby>のビジネスマンらしく、いつも<ruby>残業<rt>ざんぎょう<\/rt><\/ruby>をしている。<\/p><p class=\"lp\"><ruby>人間<rt>にんげん<\/rt><\/ruby>っぽく<ruby>生<rt>い<\/rt><\/ruby>きたい ・  ・ 　　　　　ビジネスマンっぽく、・・・<\/p><p class=\"lp\">このは、の<ruby>部屋<rt>へや<\/rt><\/ruby>があって<ruby>日本<rt>にっぽん<\/rt><\/ruby>らしいですね。 ・ <ruby>会議<rt>かいぎ<\/rt><\/ruby>にするのは、<ruby>鈴木<rt>すずき<\/rt><\/ruby>さんらしくない。<\/p><p class=\"lp\"><ruby>日本<rt>にっぽん<\/rt><\/ruby>っぽいですね ・  ・ 　　　　　　　　　　<ruby>鈴木<rt>すずき<\/rt><\/ruby>さんっぽくない<\/p><p class=\"lp\">- [Sustantivo / Adjetivo en forma sencilla / Verbo en forma sencilla] + らしい<\/p><p class=\"lp\">(Esta expresión indica que es una información leída o escuchada (un rumor), o puede indicar que uno piensa que quizás algo sea verdad (una conjetura) basándose en información vista o escuchada.)<\/p><p class=\"lp\">ニュースによると、あした<ruby>明日<rt>あす<\/rt><\/ruby>は<ruby>雪<rt>ゆき<\/rt><\/ruby>らしい。 ・  ・ ジョニー・デップの<ruby>新<rt>あたら<\/rt><\/ruby>しい<ruby>映画<rt>えいが<\/rt><\/ruby>が<ruby>面白<rt>おもしろ<\/rt><\/ruby>いらしい。<\/p><p class=\"lp\">この<ruby>辺<rt>あた<\/rt><\/ruby>りの<ruby>住宅街<rt>じゅうたくがい<\/rt><\/ruby>は、いつも<ruby>静<rt>しず<\/rt><\/ruby>からしい。 ・ <ruby>木村<rt>きむら<\/rt><\/ruby>さん、<ruby>来月<rt>らいげつ<\/rt><\/ruby>で<ruby>会社<rt>かいしゃ<\/rt><\/ruby>を<ruby>辞<rt>や<\/rt><\/ruby>めるらしいよ。<\/p><p class=\"lp\"><ruby>駅前<rt>えきまえ<\/rt><\/ruby>で<ruby>車<rt>くるま<\/rt><\/ruby>の<ruby>事故<rt>じこ<\/rt><\/ruby>があったらしいですよ。 ・ <ruby>鈴木<rt>すずき<\/rt><\/ruby>さんは<ruby>会議<rt>かいぎ<\/rt><\/ruby>に<ruby>出席<rt>しゅっせき<\/rt><\/ruby>しなかったらしいです。<\/p>","text":"「らしい」の色々いろいろな使しい方ほう - “Sustantivo 1 + らしい + Sustantivo2” / “Sustantivo + らしく + Predicado” / “Sustantivo + らしい”(La fórmula “sustantivo +らしい” o “sustantivo +らしく” se utiliza para formar adjetivos o adverbios significando que posee una cualidad o propiedad típica del sustantivo que precede.  También, “Sustantivo +らしい” puede ser el predicado de una oración.  En una expresión coloquial que refleja la impresión intuitiva del hablante, “らしい” se puede sustituir por “っぽい”.)秋あきらしい ・  ・ メッシらしいゴール ・  ・ 今日きょうはロンドンらしい天気てんきだ。秋あきっぽい洋服ようふく ・  ・ メッシっぽいゴール ・  ・ 　　　ロンドンっぽい天気てんきいつもらしく生いきたい。 ・  ・ 彼かれは日本にっぽんのビジネスマンらしく、いつも残業ざんぎょうをしている。人間にんげんっぽく生いきたい ・  ・ 　　　　　ビジネスマンっぽく、・・・このは、の部屋へやがあって日本にっぽんらしいですね。 ・ 会議かいぎにするのは、鈴木すずきさんらしくない。日本にっぽんっぽいですね ・  ・ 　　　　　　　　　　鈴木すずきさんっぽくない- [Sustantivo / Adjetivo en forma sencilla / Verbo en forma sencilla] + らしい(Esta expresión indica que es una información leída o escuchada (un rumor), o puede indicar que uno piensa que quizás algo sea verdad (una conjetura) basándose en información vista o escuchada.)ニュースによると、あした明日あすは雪ゆきらしい。 ・  ・ ジョニー・デップの新あたらしい映画えいがが面白おもしろいらしい。この辺あたりの住宅街じゅうたくがいは、いつも静しずからしい。 ・ 木村きむらさん、来月らいげつで会社かいしゃを辞やめるらしいよ。駅前えきまえで車くるまの事故じこがあったらしいですよ。 ・ 鈴木すずきさんは会議かいぎに出席しゅっせきしなかったらしいです。"},{"id":"L030","file":"20260629_Tabla__SOU___YOU___MITAI___RASHII_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「そう」「よう」「みたい」「らしい」の比較","titleRuby":"「そう」「よう」「みたい」「らしい」の<ruby>比較<rt>ひかく<\/rt><\/ruby>","html":"<p class=\"lp\">Las cuatro formas de uso se pueden clasificar de la siguiente manera.<\/p><div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">**〜****そう**<\/div><div class=\"lc-r\"><span class=\"lc-l\">**E****jemplo****/****M****etáforo**<\/span><span class=\"jp\">(No se utiliza)<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Conjetura**<\/span><span class=\"jp\">*(**Previsión**/**juicio** **subjetivo** **en** base a **fundamentos** o **razones**)* Verbo en forma-ます sin ます 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**De ****oídas**<\/span><span class=\"jp\">Sustantivo+だ 〜 Adjetivo tipo-い 〜 Adjetivo tipo-な en forma-だ 〜 Verbo forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Estado****/Apariencia**<\/span><span class=\"jp\">Adjetivo tipo-い sinい 〜 Adjetivo tipo-なsinな 〜 Verbo en forma-ます sin ます 〜 (Solo con verbos estativos)<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">**〜****よう**<\/div><div class=\"lc-r\"><span class=\"lc-l\">**E****jemplo****/****M****etáforo**<\/span><span class=\"jp\">Sustantivo +の 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Conjetura**<\/span><span class=\"jp\">*(**S**uposición** **objetiva**)* Sustantivo +の 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**De ****oídas**<\/span><span class=\"jp\">(No se utiliza)<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Estado****/Apariencia**<\/span><span class=\"jp\">(No se utiliza)<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">**〜****みたい**<\/div><div class=\"lc-r\"><span class=\"lc-l\">**E****jemplo****/****M****etáforo**<\/span><span class=\"jp\">Sustantivo 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Conjetura**<\/span><span class=\"jp\">*(**S**uposición** o **juicio** **subjetivo** **en** base a** **los** **cinco** **sentidos**)* Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**De ****oídas**<\/span><span class=\"jp\">(No se utiliza)<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Estado****/Apariencia**<\/span><span class=\"jp\">(No se utiliza)<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">**〜****らしい**<\/div><div class=\"lc-r\"><span class=\"lc-l\">**E****jemplo****/****M****etáforo**<\/span><span class=\"jp\">*(**C**ualidad** o **propiedad** **típica**)* Sustantivo 〜 (A diferencia de “よう” o “みたい”, el sustantivo que precede a “らしい” indica el sujeto de la palabra siguiente.)<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Conjetura**<\/span><span class=\"jp\">*(**S**uposición** **objetiva**)* Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**De ****oídas**<\/span><span class=\"jp\">Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Estado****/Apariencia**<\/span><span class=\"jp\">(No se utiliza)<\/span><\/div><\/div><\/div>","text":"「そう」「よう」「みたい」「らしい」の比較ひかく Las cuatro formas de uso se pueden clasificar de la siguiente manera.**〜****そう****E****jemplo****/****M****etáforo**(No se utiliza)**Conjetura***(**Previsión**/**juicio** **subjetivo** **en** base a **fundamentos** o **razones**)* Verbo en forma-ます sin ます 〜**De ****oídas**Sustantivo+だ 〜 Adjetivo tipo-い 〜 Adjetivo tipo-な en forma-だ 〜 Verbo forma sencilla 〜**Estado****/Apariencia**Adjetivo tipo-い sinい 〜 Adjetivo tipo-なsinな 〜 Verbo en forma-ます sin ます 〜 (Solo con verbos estativos)**〜****よう****E****jemplo****/****M****etáforo**Sustantivo +の 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜**Conjetura***(**S**uposición** **objetiva**)* Sustantivo +の 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜**De ****oídas**(No se utiliza)**Estado****/Apariencia**(No se utiliza)**〜****みたい****E****jemplo****/****M****etáforo**Sustantivo 〜**Conjetura***(**S**uposición** o **juicio** **subjetivo** **en** base a** **los** **cinco** **sentidos**)* Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜**De ****oídas**(No se utiliza)**Estado****/Apariencia**(No se utiliza)**〜****らしい****E****jemplo****/****M****etáforo***(**C**ualidad** o **propiedad** **típica**)* Sustantivo 〜 (A diferencia de “よう” o “みたい”, el sustantivo que precede a “らしい” indica el sujeto de la palabra siguiente.)**Conjetura***(**S**uposición** **objetiva**)* Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜**De ****oídas**Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜**Estado****/Apariencia**(No se utiliza)"},{"id":"L031","file":"20260629__TOKI_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「とき」の色々な使い方","titleRuby":"「とき」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- <ruby>時<rt>じ<\/rt><\/ruby> (とき)<\/p><p class=\"lp\">(“<ruby>時<rt>じ<\/rt><\/ruby> (とき)” se utiliza como sustantivo que significa “tiempo” o “momento”.)<\/p><p class=\"lp\"><ruby>時<rt>とき<\/rt><\/ruby>は<ruby>金<rt>かね<\/rt><\/ruby>なり。 ・  ・ <ruby>運動<rt>うんどう<\/rt><\/ruby>の<ruby>後<rt>あと<\/rt><\/ruby>こそ、ビールがおいしい<ruby>時<rt>とき<\/rt><\/ruby>だ。 ・ <ruby>時<rt>とき<\/rt><\/ruby>が<ruby>経<rt>た<\/rt><\/ruby>てばこの<ruby>問題<rt>もんだい<\/rt><\/ruby>もかい<ruby>解<rt>かい<\/rt><\/ruby><ruby>決<rt>けつ<\/rt><\/ruby>するだろう。<\/p><p class=\"lp\">- [Sustantivo + の / Adjetivo / Verbo] + <ruby>時<rt>じ<\/rt><\/ruby> (とき) (+は/に) + Cláusula Principal<\/p><p class=\"lp\">(“<ruby>時<rt>じ<\/rt><\/ruby> (とき)” se utiliza para indicar el momento específico en que se establece una condición, acción o fenómeno expresado en la Cláusula Principal que viene a continuación.)<\/p><p class=\"lp\"><ruby>弟<rt>おとうと<\/rt><\/ruby>は25さい<ruby>歳<rt>とし<\/rt><\/ruby>の<ruby>時<rt>とき<\/rt><\/ruby>に<ruby>結婚<rt>けっこん<\/rt><\/ruby>しました。 ・  ・ <ruby>寒<rt>さむ<\/rt><\/ruby>い<ruby>時<rt>とき<\/rt><\/ruby>は、<ruby>温<rt>あたた<\/rt><\/ruby>かいものが<ruby>食<rt>た<\/rt><\/ruby>べたい。<\/p><p class=\"lp\"><ruby>暇<rt>ひま<\/rt><\/ruby>な<ruby>時<rt>とき<\/rt><\/ruby>は、<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>んでいることが<ruby>多<rt>おお<\/rt><\/ruby>い。 ・  ・ <ruby>家<rt>いえ<\/rt><\/ruby>を<ruby>出<rt>で<\/rt><\/ruby>る<ruby>時<rt>とき<\/rt><\/ruby>は、<ruby>必<rt>かなら<\/rt><\/ruby>ずドアの<ruby>鍵<rt>かぎ<\/rt><\/ruby>をかけてください。<\/p><p class=\"lp\">- Verbo en forma diccionario + とき (+は/に)、+ Cláusula Principal<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar que el contenido de la Cláusula Principal ocurre justo antes del momento expresado en la cláusula subordinada que termina con “とき”.  En esta expresión, indipendientemente del tiempo verbal del verbo en la cláusula principal, el verbo en la cláusula subordinada guarda la forma de diccionario.)<\/p><p class=\"lp\"><ruby>教室<rt>きょうしつ<\/rt><\/ruby>を<ruby>出<rt>で<\/rt><\/ruby>るとき、<ruby>電気<rt>でんき<\/rt><\/ruby>を<ruby>消<rt>け<\/rt><\/ruby>します。 ・  ・ ごはん<ruby>飯<rt>めし<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べるときは、「いただきます」と<ruby>言<rt>い<\/rt><\/ruby>います。<\/p><p class=\"lp\"><ruby>映画<rt>えいが<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>くとき、チケットを<ruby>予約<rt>よやく<\/rt><\/ruby>した。 ・ 　　アメリカへ<ruby>行<rt>い<\/rt><\/ruby>くときに、<ruby>時計<rt>とけい<\/rt><\/ruby>を<ruby>買<rt>か<\/rt><\/ruby>いました。<\/p><p class=\"lp\">- Verbo en forma-た (forma pretérito) +とき (+は/に)、+ Cláusula Principal<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar que el contenido de la Cláusula Principal ocurre justo después del momento expresado en la cláusula subordinada que terimna con “とき”.  En esta expresión, indipendientemente del tiempo verbal del verbo en la cláusula principal, el verbo en la cláusula subordinada guarda la forma-た, es decir, la forma pretérito.)<\/p><p class=\"lp\"><ruby>教室<rt>きょうしつ<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>ったとき、<ruby>電気<rt>でんき<\/rt><\/ruby>をつけます。 ・  ・ ごはん<ruby>飯<rt>めし<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べたときは、「ごちそうさま」と<ruby>言<rt>い<\/rt><\/ruby>います。<\/p><p class=\"lp\"><ruby>映画<rt>えいが<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>ったとき、ポップコーンを<ruby>買<rt>か<\/rt><\/ruby>った。 ・ 　　アメリカへ<ruby>行<rt>い<\/rt><\/ruby>ったときに、<ruby>時計<rt>とけい<\/rt><\/ruby>を<ruby>買<rt>か<\/rt><\/ruby>いました。<\/p>","text":"「とき」の色々いろいろな使しい方ほう - 時じ (とき)(“時じ (とき)” se utiliza como sustantivo que significa “tiempo” o “momento”.)時ときは金かねなり。 ・  ・ 運動うんどうの後あとこそ、ビールがおいしい時ときだ。 ・ 時ときが経たてばこの問題もんだいもかい解かい決けつするだろう。- [Sustantivo + の / Adjetivo / Verbo] + 時じ (とき) (+は/に) + Cláusula Principal(“時じ (とき)” se utiliza para indicar el momento específico en que se establece una condición, acción o fenómeno expresado en la Cláusula Principal que viene a continuación.)弟おとうとは25さい歳としの時ときに結婚けっこんしました。 ・  ・ 寒さむい時ときは、温あたたかいものが食たべたい。暇ひまな時ときは、本ほんを読よんでいることが多おおい。 ・  ・ 家いえを出でる時ときは、必かならずドアの鍵かぎをかけてください。- Verbo en forma diccionario + とき (+は/に)、+ Cláusula Principal(Esta expresión se utiliza para indicar que el contenido de la Cláusula Principal ocurre justo antes del momento expresado en la cláusula subordinada que termina con “とき”.  En esta expresión, indipendientemente del tiempo verbal del verbo en la cláusula principal, el verbo en la cláusula subordinada guarda la forma de diccionario.)教室きょうしつを出でるとき、電気でんきを消けします。 ・  ・ ごはん飯めしを食たべるときは、「いただきます」と言いいます。映画えいがを見みに行いくとき、チケットを予約よやくした。 ・ 　　アメリカへ行いくときに、時計とけいを買かいました。- Verbo en forma-た (forma pretérito) +とき (+は/に)、+ Cláusula Principal(Esta expresión se utiliza para indicar que el contenido de la Cláusula Principal ocurre justo después del momento expresado en la cláusula subordinada que terimna con “とき”.  En esta expresión, indipendientemente del tiempo verbal del verbo en la cláusula principal, el verbo en la cláusula subordinada guarda la forma-た, es decir, la forma pretérito.)教室きょうしつに入はいったとき、電気でんきをつけます。 ・  ・ ごはん飯めしを食たべたときは、「ごちそうさま」と言いいます。映画えいがを見みに行いったとき、ポップコーンを買かった。 ・ 　　アメリカへ行いったときに、時計とけいを買かいました。"},{"id":"L032","file":"20260702_Tabla_Conjetura__SOU___YOU___MITAI___RASHII_.docx","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","title":"「そう」「よう」「みたい」「らしい」の比較","titleRuby":"「そう」「よう」「みたい」「らしい」の<ruby>比較<rt>ひかく<\/rt><\/ruby>","html":"<p class=\"lp\">Comparación de las cuatro formas para expresar Conjeturas.<\/p><div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">**〜****そう**<\/div><div class=\"lc-r\"><span class=\"lc-l\">**Escenario****s**** de Uso**<\/span><span class=\"jp\">*S**uposición** **objetiva** **basada** **únicamente** **en** la **apariencia*<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Conecci****ó****n**<\/span><span class=\"jp\">Verbo en forma-ます sin ます 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Nota**<\/span><span class=\"jp\">Es una expresión que sirve para especular sobre lo que puede ocurrir en el presente o en un futuro próximo y no se usa para expresar una suposición sobre lo que pudo haver ocurrido en el pasado.  Por otro lado, hay que tener en cuenta que, cuando va seguida de un verbo en forma sencilla, se expresa lo que se ha oído.<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">**〜****よう**<\/div><div class=\"lc-r\"><span class=\"lc-l\">**Escenario****s**** de Uso**<\/span><span class=\"jp\">*S**uposición** **subjetiva** **basada** no solo **en** la **apariencia**, **sino** también **en** **diversos** **factores** **como** la **situación**, la **experiencia** y **los** **conocimientos*<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Conecci****ó****n**<\/span><span class=\"jp\">Sustantivo +の 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Nota**<\/span><span class=\"jp\">Esta expresión no solo se utiliza para expresar una suposición sobre lo que ocurrirá en el presente o en un futuro próximo, sino que, cuando va seguida de un adjetivo o de un verbo en pasado, también sirve para expresar una conjetura sobre lo que pudo haber ocurrido en el pasado.<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">**〜****みたい**<\/div><div class=\"lc-r\"><span class=\"lc-l\">**Escenario****s**** de Uso**<\/span><span class=\"jp\">*S**uposición** **subjetiva** **basadas** **en** **“**lo **que** ha visto y **sentido** **el **hablante**”**.*<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Conecci****ó****n**<\/span><span class=\"jp\">Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Nota**<\/span><span class=\"jp\">En principio, su significado y método de uso son prácticamente los mismos que los de “よう”, pero es una expresión muy coloquial e informal, y es la que más se utiliza en las conversaciones entre amigos.<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">**〜****らしい**<\/div><div class=\"lc-r\"><span class=\"lc-l\">**Escenario****s**** de Uso**<\/span><span class=\"jp\">*S**uposición** **objetiva** **basad**a** **en** **información** **indirecta** **procedente** del exterior, **como** lo **que** se **oye** **decir**, las **noticias** o **los** **rumores*<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Conecci****ó****n**<\/span><span class=\"jp\">Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">**Nota**<\/span><span class=\"jp\">Esta expresión no solo se utiliza para expresar una suposición sobre lo que ocurrirá en el presente o en un futuro próximo, sino que, cuando va seguida de un adjetivo o de un verbo en pasado, también sirve para expresar una conjetura sobre lo que pudo haber ocurrido en el pasado.  No se utiliza cuando se trata de conjeturas sobre uno mismo.<\/span><\/div><\/div><\/div>","text":"「そう」「よう」「みたい」「らしい」の比較ひかく Comparación de las cuatro formas para expresar Conjeturas.**〜****そう****Escenario****s**** de Uso***S**uposición** **objetiva** **basada** **únicamente** **en** la **apariencia***Conecci****ó****n**Verbo en forma-ます sin ます 〜**Nota**Es una expresión que sirve para especular sobre lo que puede ocurrir en el presente o en un futuro próximo y no se usa para expresar una suposición sobre lo que pudo haver ocurrido en el pasado.  Por otro lado, hay que tener en cuenta que, cuando va seguida de un verbo en forma sencilla, se expresa lo que se ha oído.**〜****よう****Escenario****s**** de Uso***S**uposición** **subjetiva** **basada** no solo **en** la **apariencia**, **sino** también **en** **diversos** **factores** **como** la **situación**, la **experiencia** y **los** **conocimientos***Conecci****ó****n**Sustantivo +の 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜**Nota**Esta expresión no solo se utiliza para expresar una suposición sobre lo que ocurrirá en el presente o en un futuro próximo, sino que, cuando va seguida de un adjetivo o de un verbo en pasado, también sirve para expresar una conjetura sobre lo que pudo haber ocurrido en el pasado.**〜****みたい****Escenario****s**** de Uso***S**uposición** **subjetiva** **basadas** **en** **“**lo **que** ha visto y **sentido** **el **hablante**”**.***Conecci****ó****n**Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜**Nota**En principio, su significado y método de uso son prácticamente los mismos que los de “よう”, pero es una expresión muy coloquial e informal, y es la que más se utiliza en las conversaciones entre amigos.**〜****らしい****Escenario****s**** de Uso***S**uposición** **objetiva** **basad**a** **en** **información** **indirecta** **procedente** del exterior, **como** lo **que** se **oye** **decir**, las **noticias** o **los** **rumores***Conecci****ó****n**Sustantivo 〜 Adjetivo en forma sencilla 〜 Verbo en forma sencilla 〜**Nota**Esta expresión no solo se utiliza para expresar una suposición sobre lo que ocurrirá en el presente o en un futuro próximo, sino que, cuando va seguida de un adjetivo o de un verbo en pasado, también sirve para expresar una conjetura sobre lo que pudo haber ocurrido en el pasado.  No se utiliza cuando se trata de conjeturas sobre uno mismo."},{"id":"L033","file":"20260702__BAAI_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「場合」の色々な使い方","titleRuby":"「<ruby>場合<rt>ばあい<\/rt><\/ruby>」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- [Sustantivo + の / Adjetivo en forma diccionario / Verbo en forma diccionario, en forma-た o en forma-ない] + <ruby>場合<rt>ばあい<\/rt><\/ruby> (ばあい) (+は/に/には) + Cláusula Principal<\/p><p class=\"lp\">(Esta expresión se utiliza para hablar sobre una circunstancia hipotética e indicar en la Cláusula Principal la manera de enfrentarse a dicha circunstancia o la situación resultante.  No se puede utilizar para acontecimientos pasados que realmente ocurrieron ni para suposiciones poco realistas que nunca podrían suceder.)<\/p><p class=\"lp\"><ruby>外国人<rt>がいこくじん<\/rt><\/ruby>の、<ruby>入国<rt>にゅうこく<\/rt><\/ruby>にはビザが<ruby>必要<rt>ひつよう<\/rt><\/ruby>です。 ・ <ruby>体調<rt>たいちょう<\/rt><\/ruby>がい<ruby>場合<rt>ばあい<\/rt><\/ruby>は、<ruby>休<rt>やす<\/rt><\/ruby>んでもいいです。<\/p><p class=\"lp\"><ruby>修理<rt>しゅうり<\/rt><\/ruby>がな<ruby>場合<rt>ばあい<\/rt><\/ruby>、ここに<ruby>電話<rt>でんわ<\/rt><\/ruby>してください。 ・ <ruby>熱<rt>ねつ<\/rt><\/ruby>がく<ruby>場合<rt>ばあい<\/rt><\/ruby>は、<ruby>病院<rt>びょういん<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>ったほうがいい。<\/p><p class=\"lp\"><ruby>電車<rt>でんしゃ<\/rt><\/ruby>がれた<ruby>場合<rt>ばあい<\/rt><\/ruby>には、<ruby>連絡<rt>れんらく<\/rt><\/ruby>してください。 ・ <ruby>意見<rt>いけん<\/rt><\/ruby>がまとまらないに、<ruby>多数決<rt>たすうけつ<\/rt><\/ruby>で<ruby>決<rt>き<\/rt><\/ruby>めることもある。<\/p><p class=\"lnote\">Nota: “～”, “～とき” y “～たら” son similares, pero difieren en los siguientes aspectos.<\/p><div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Significado<\/div><div class=\"lc-r\"><span class=\"lc-l\">〜<ruby>場合<rt>ばあい<\/rt><\/ruby><\/span><span class=\"jp\">Circunstancias, condiciones o supuestos específicos<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">〜とき<\/span><span class=\"jp\">Un momento específico, un intérvalo de tiempo o una situación.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">〜たら<\/span><span class=\"jp\">Condiciones hipotéticas, resultados tras la finalización de la acción<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Eventos pasados<\/div><div class=\"lc-r\"><span class=\"lc-l\">〜<ruby>場合<rt>ばあい<\/rt><\/ruby><\/span><span class=\"jp\">No se puede utilizar<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">〜とき<\/span><span class=\"jp\">Se puede utilizar<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">〜たら<\/span><span class=\"jp\">Se puede utilizar<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Supuesto imposible<\/div><div class=\"lc-r\"><span class=\"lc-l\">〜<ruby>場合<rt>ばあい<\/rt><\/ruby><\/span><span class=\"jp\">No se puede utilizar<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">〜とき<\/span><span class=\"jp\">No se puede utilizar<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">〜たら<\/span><span class=\"jp\">Se puede utilizar<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Sustitución<\/div><div class=\"lc-r\"><span class=\"lc-l\">〜<ruby>場合<rt>ばあい<\/rt><\/ruby><\/span><span class=\"jp\">En términos de posibles ocurrencias, se puede sustituir por “たら”.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">〜とき<\/span><span class=\"jp\">Sustituible si se tratan situaciones previstas.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">〜たら<\/span><span class=\"jp\">En términos de posibles ocurrencias, se puede sustituir por “<ruby>場合<rt>ばあい<\/rt><\/ruby>”.<\/span><\/div><\/div><\/div><p class=\"lp\">- Verbo en forma-て + いる + <ruby>場合<rt>ばあい<\/rt><\/ruby>ではない / <ruby>場合<rt>ばあい<\/rt><\/ruby>じゃない<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar que la acción descrita por el verbo es inadecuada para la situación.)<\/p><p class=\"lp\"><ruby>試験<rt>しけん<\/rt><\/ruby>がいので、<ruby>遊<rt>あそ<\/rt><\/ruby>んでいる<ruby>場合<rt>ばあい<\/rt><\/ruby>ではない。 ・ こんなで<ruby>冗談<rt>じょうだん<\/rt><\/ruby>を<ruby>言<rt>い<\/rt><\/ruby>っている<ruby>場合<rt>ばあい<\/rt><\/ruby>じゃない。<\/p><p class=\"lp\">- Expresiones fijas con “<ruby>場合<rt>ばあい<\/rt><\/ruby>”<\/p><p class=\"lp\">- <ruby>場合<rt>ばあい<\/rt><\/ruby>によっては、〜 ・ (Se utiliza para significar “Si se cumplen ciertas condiciones, 〜”.)<\/p><p class=\"lp\"><ruby>場合<rt>ばあい<\/rt><\/ruby>によっては、<ruby>今年<rt>ことし<\/rt><\/ruby>の<ruby>文化<rt>ぶんか<\/rt><\/ruby>さい<ruby>祭<rt>まつり<\/rt><\/ruby>は<ruby>中止<rt>ちゅうし<\/rt><\/ruby>になるかもしれない。<\/p><p class=\"lp\">- <ruby>万一<rt>まんいち<\/rt><\/ruby>の〜 ・  ・ (Se utiliza para significar “En caso de emergencia, 〜”.)<\/p><p class=\"lp\"><ruby>万一<rt>まんいち<\/rt><\/ruby>の<ruby>場合<rt>ばあい<\/rt><\/ruby>を<ruby>考<rt>かんが<\/rt><\/ruby>え、<ruby>火災<rt>かさい<\/rt><\/ruby><ruby>保険<rt>ほけん<\/rt><\/ruby>や<ruby>地震<rt>じしん<\/rt><\/ruby><ruby>保険<rt>ほけん<\/rt><\/ruby>をけい契<ruby>約<rt>やく<\/rt><\/ruby>しましょう。<\/p>","text":"「場合ばあい」の色々いろいろな使しい方ほう - [Sustantivo + の / Adjetivo en forma diccionario / Verbo en forma diccionario, en forma-た o en forma-ない] + 場合ばあい (ばあい) (+は/に/には) + Cláusula Principal(Esta expresión se utiliza para hablar sobre una circunstancia hipotética e indicar en la Cláusula Principal la manera de enfrentarse a dicha circunstancia o la situación resultante.  No se puede utilizar para acontecimientos pasados que realmente ocurrieron ni para suposiciones poco realistas que nunca podrían suceder.)外国人がいこくじんの、入国にゅうこくにはビザが必要ひつようです。 ・ 体調たいちょうがい場合ばあいは、休やすんでもいいです。修理しゅうりがな場合ばあい、ここに電話でんわしてください。 ・ 熱ねつがく場合ばあいは、病院びょういんに行いったほうがいい。電車でんしゃがれた場合ばあいには、連絡れんらくしてください。 ・ 意見いけんがまとまらないに、多数決たすうけつで決きめることもある。Nota: “～”, “～とき” y “～たら” son similares, pero difieren en los siguientes aspectos.Significado〜場合ばあいCircunstancias, condiciones o supuestos específicos〜ときUn momento específico, un intérvalo de tiempo o una situación.〜たらCondiciones hipotéticas, resultados tras la finalización de la acciónEventos pasados〜場合ばあいNo se puede utilizar〜ときSe puede utilizar〜たらSe puede utilizarSupuesto imposible〜場合ばあいNo se puede utilizar〜ときNo se puede utilizar〜たらSe puede utilizarSustitución〜場合ばあいEn términos de posibles ocurrencias, se puede sustituir por “たら”.〜ときSustituible si se tratan situaciones previstas.〜たらEn términos de posibles ocurrencias, se puede sustituir por “場合ばあい”.- Verbo en forma-て + いる + 場合ばあいではない / 場合ばあいじゃない(Esta expresión se utiliza para indicar que la acción descrita por el verbo es inadecuada para la situación.)試験しけんがいので、遊あそんでいる場合ばあいではない。 ・ こんなで冗談じょうだんを言いっている場合ばあいじゃない。- Expresiones fijas con “場合ばあい”- 場合ばあいによっては、〜 ・ (Se utiliza para significar “Si se cumplen ciertas condiciones, 〜”.)場合ばあいによっては、今年ことしの文化ぶんかさい祭まつりは中止ちゅうしになるかもしれない。- 万一まんいちの〜 ・  ・ (Se utiliza para significar “En caso de emergencia, 〜”.)万一まんいちの場合ばあいを考かんがえ、火災かさい保険ほけんや地震じしん保険ほけんをけい契約やくしましょう。"},{"id":"L034","file":"20260702__KORO_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「ころ」の色々な使い方","titleRuby":"「ころ」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- <ruby>頃<rt>ころ<\/rt><\/ruby> (ころ)<\/p><p class=\"lp\">(“<ruby>頃<rt>ころ<\/rt><\/ruby> (ころ)” se utiliza como sustantivo que significa “período” o “momento aproximado”.  Cuando va después de un sustantivo que indica un momento concreto, se lee “ごろ” en vez de “ころ”. )<\/p><p class=\"lp\"><ruby>冬<rt>ふゆ<\/rt><\/ruby>には<ruby>夕方<rt>ゆうがた<\/rt><\/ruby>５<ruby>時<rt>じ<\/rt><\/ruby><ruby>頃<rt>ごろ<\/rt><\/ruby>は<ruby>暗<rt>くら<\/rt><\/ruby>くなります。 ・ にほんし<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>史<rt>し<\/rt><\/ruby>は<ruby>時代<rt>じだい<\/rt><\/ruby>のが<ruby>最<rt>もっと<\/rt><\/ruby>もおもしろい。<\/p><p class=\"lp\"><ruby>若<rt>わか<\/rt><\/ruby>いの<ruby>写真<rt>しゃしん<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>せてください。 ・ <ruby>図書館<rt>としょかん<\/rt><\/ruby>にくと、おかね<ruby>金<rt>きん<\/rt><\/ruby>がなくて<ruby>暇<rt>ひま<\/rt><\/ruby>だった<ruby>頃<rt>ころ<\/rt><\/ruby>を<ruby>思<rt>おも<\/rt><\/ruby>い<ruby>出<rt>だ<\/rt><\/ruby>します。<\/p><p class=\"lp\">そろそろシカゴからのフライトが<ruby>着<rt>つ<\/rt><\/ruby>く<ruby>頃<rt>ころ<\/rt><\/ruby>です。 ・ <ruby>目<rt>め<\/rt><\/ruby>がめたら、<ruby>試合<rt>しあい<\/rt><\/ruby>が<ruby>終<rt>お<\/rt><\/ruby>わった<ruby>頃<rt>ころ<\/rt><\/ruby>だった。<\/p><p class=\"lp\">- [Sustantivo que indica un momento concreto + <ruby>頃<rt>ごろ<\/rt><\/ruby>] / [Sustantivo + の / Adjetivo / Verbo en forma sencilla + <ruby>頃<rt>ころ<\/rt><\/ruby> (ころ)] (+は/に) + Cláusula Principal<\/p><p class=\"lp\">(“<ruby>頃<rt>ころ<\/rt><\/ruby> (ごろ/ころ)” se utiliza para indicar el período o el momento aproximado en que se establece una condición, acción o fenómeno expresado en la Cláusula Principal que viene a continuación.)<\/p><p class=\"lp\">3<ruby>月<rt>がつ<\/rt><\/ruby><ruby>下旬<rt>げじゅん<\/rt><\/ruby><ruby>頃<rt>ごろ<\/rt><\/ruby>から4<ruby>月<rt>がつ<\/rt><\/ruby><ruby>上旬<rt>じょうじゅん<\/rt><\/ruby><ruby>頃<rt>ごろ<\/rt><\/ruby>、が<ruby>咲<rt>さ<\/rt><\/ruby>きます。 ・ <ruby>毎年<rt>まいとし<\/rt><\/ruby>、のころは、よく<ruby>雨<rt>あめ<\/rt><\/ruby>がふ<ruby>降<rt>こう<\/rt><\/ruby>ります。<\/p><p class=\"lp\"><ruby>暑<rt>あつ<\/rt><\/ruby>いころは、かきごおり<ruby>氷<rt>こおり<\/rt><\/ruby>がよく<ruby>売<rt>う<\/rt><\/ruby>れます。 ・  ・ <ruby>忙<rt>いそが<\/rt><\/ruby>しかったころ、<ruby>毎日<rt>まいにち<\/rt><\/ruby>タクシーで<ruby>家<rt>いえ<\/rt><\/ruby>に<ruby>帰<rt>かえ<\/rt><\/ruby>っていました。<\/p><p class=\"lp\"><ruby>電車<rt>でんしゃ<\/rt><\/ruby>がくころに、<ruby>駅<rt>えき<\/rt><\/ruby>に<ruby>迎<rt>むか<\/rt><\/ruby>えに<ruby>行<rt>い<\/rt><\/ruby>きます。 ・ <ruby>日本<rt>にっぽん<\/rt><\/ruby>にたころ、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>はあまり<ruby>話<rt>はな<\/rt><\/ruby>せませんでした。<\/p><p class=\"lnote\">Nota: Tanto “とき” como “ころ” se traducen al español como “cuando”, pero tienen un matiz ligeramente diferente.<\/p><p class=\"lp\">“とき”: un momento o una situación concretos<\/p><p class=\"lp\">“ころ”: un momento aproximado o un período de tiempo no definido que abarca el entorno<\/p><p class=\"lp\">- Verbo en forma-ます sin ます + <ruby>頃<rt>ころ<\/rt><\/ruby> (ごろ)<\/p><p class=\"lp\">(Esta fórmula se utiliza para expresar “el momento ideal para hacer el acto indicado por el verbo que precede” o “la época en la que ese acto alcanza su máximo apogeo”.  En este caso, <ruby>頃<rt>ころ<\/rt><\/ruby> siempre se lee “ごろ”.)<\/p><p class=\"lp\">トマトは<ruby>皮<rt>かわ<\/rt><\/ruby>が<ruby>赤<rt>あか<\/rt><\/ruby>くなると<ruby>食<rt>た<\/rt><\/ruby>べ<ruby>頃<rt>ごろ<\/rt><\/ruby>です。 ・  ・ こののバラの<ruby>見<rt>み<\/rt><\/ruby><ruby>頃<rt>ごろ<\/rt><\/ruby>は５<ruby>月<rt>がつ<\/rt><\/ruby><ruby>後半<rt>こうはん<\/rt><\/ruby>です。<\/p><p class=\"lp\">このおもちゃは５から７<ruby>才<rt>さい<\/rt><\/ruby>が<ruby>遊<rt>あそ<\/rt><\/ruby>び<ruby>頃<rt>ごろ<\/rt><\/ruby>です。 ・ 30<ruby>代<rt>だい<\/rt><\/ruby>から40<ruby>代<rt>だい<\/rt><\/ruby>がいちばんき<ruby>頃<rt>ごろ<\/rt><\/ruby>と<ruby>言<rt>い<\/rt><\/ruby>われている。<\/p><p class=\"lp\">- Expresiones fijas con “<ruby>頃<rt>ころ<\/rt><\/ruby>（ころ/ごろ）”<\/p><p class=\"lp\">- この<ruby>頃<rt>ころ<\/rt><\/ruby> o <ruby>近頃<rt>ちかごろ<\/rt><\/ruby> ・ (Son términos que se refieren al período reciente en general, como “recientemente”, “últimamente” o “en estos días”.)<\/p><p class=\"lp\">この、<ruby>山田<rt>やまだ<\/rt><\/ruby>さんを<ruby>見<rt>み<\/rt><\/ruby>かけません。 ・ <ruby>近頃<rt>ちかごろ<\/rt><\/ruby>、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>の<ruby>勉強<rt>べんきょう<\/rt><\/ruby>が<ruby>楽<rt>たの<\/rt><\/ruby>しくなってきた。<\/p><p class=\"lp\">- <ruby>今頃<rt>いまごろ<\/rt><\/ruby> ・  ・ (Es un término que se utiliza para expresar “en este momento (ya/todavía)” o con un matiz de reproche, en el sentido de “ahora que ya es demasiado tarde”.)<\/p><p class=\"lp\"><ruby>今頃<rt>いまごろ<\/rt><\/ruby>、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>飛行機<rt>ひこうき<\/rt><\/ruby>に<ruby>乗<rt>の<\/rt><\/ruby>っているだろう。 ・ <ruby>今頃<rt>いまごろ<\/rt><\/ruby>に<ruby>言<rt>い<\/rt><\/ruby>い<ruby>出<rt>だ<\/rt><\/ruby>しても、チケットは<ruby>売<rt>う<\/rt><\/ruby>り<ruby>切<rt>き<\/rt><\/ruby>れているよ。<\/p>","text":"「ころ」の色々いろいろな使しい方ほう - 頃ころ (ころ)(“頃ころ (ころ)” se utiliza como sustantivo que significa “período” o “momento aproximado”.  Cuando va después de un sustantivo que indica un momento concreto, se lee “ごろ” en vez de “ころ”. )冬ふゆには夕方ゆうがた５時じ頃ごろは暗くらくなります。 ・ にほんし日本にっぽん史しは時代じだいのが最もっともおもしろい。若わかいの写真しゃしんを見みせてください。 ・ 図書館としょかんにくと、おかね金きんがなくて暇ひまだった頃ころを思おもい出だします。そろそろシカゴからのフライトが着つく頃ころです。 ・ 目めがめたら、試合しあいが終おわった頃ころだった。- [Sustantivo que indica un momento concreto + 頃ごろ] / [Sustantivo + の / Adjetivo / Verbo en forma sencilla + 頃ころ (ころ)] (+は/に) + Cláusula Principal(“頃ころ (ごろ/ころ)” se utiliza para indicar el período o el momento aproximado en que se establece una condición, acción o fenómeno expresado en la Cláusula Principal que viene a continuación.)3月がつ下旬げじゅん頃ごろから4月がつ上旬じょうじゅん頃ごろ、が咲さきます。 ・ 毎年まいとし、のころは、よく雨あめがふ降こうります。暑あついころは、かきごおり氷こおりがよく売うれます。 ・  ・ 忙いそがしかったころ、毎日まいにちタクシーで家いえに帰かえっていました。電車でんしゃがくころに、駅えきに迎むかえに行いきます。 ・ 日本にっぽんにたころ、日本にっぽん語ごはあまり話はなせませんでした。Nota: Tanto “とき” como “ころ” se traducen al español como “cuando”, pero tienen un matiz ligeramente diferente.“とき”: un momento o una situación concretos“ころ”: un momento aproximado o un período de tiempo no definido que abarca el entorno- Verbo en forma-ます sin ます + 頃ころ (ごろ)(Esta fórmula se utiliza para expresar “el momento ideal para hacer el acto indicado por el verbo que precede” o “la época en la que ese acto alcanza su máximo apogeo”.  En este caso, 頃ころ siempre se lee “ごろ”.)トマトは皮かわが赤あかくなると食たべ頃ごろです。 ・  ・ こののバラの見み頃ごろは５月がつ後半こうはんです。このおもちゃは５から７才さいが遊あそび頃ごろです。 ・ 30代だいから40代だいがいちばんき頃ごろと言いわれている。- Expresiones fijas con “頃ころ（ころ/ごろ）”- この頃ころ o 近頃ちかごろ ・ (Son términos que se refieren al período reciente en general, como “recientemente”, “últimamente” o “en estos días”.)この、山田やまださんを見みかけません。 ・ 近頃ちかごろ、日本にっぽん語ごの勉強べんきょうが楽たのしくなってきた。- 今頃いまごろ ・  ・ (Es un término que se utiliza para expresar “en este momento (ya/todavía)” o con un matiz de reproche, en el sentido de “ahora que ya es demasiado tarde”.)今頃いまごろ、彼かれは飛行機ひこうきに乗のっているだろう。 ・ 今頃いまごろに言いい出だしても、チケットは売うり切きれているよ。"},{"id":"L035","file":"20260716_Verbos_Auxiliares__1_.docx","cat":"vaux","catLabel":"Verbos auxiliares","title":"補助動詞・Verbos Auxiliares (1)","titleRuby":"<ruby>補助<rt>ほじょ<\/rt><\/ruby><ruby>動詞<rt>どうし<\/rt><\/ruby>・Verbos Auxiliares (1)","html":"<p class=\"lp\">Mientras que los “Verbos Principales” son verbos autónomos que tienen significado por sí mismos, los “Verbos Auxiliares” tienen la función de apoyar a otros verbos.<\/p><p class=\"lp\">Por ejemplo, en la frase “コップをテーブルにならべて<ruby>置<rt>お<\/rt><\/ruby>く”, “<ruby>置<rt>お<\/rt><\/ruby>く” es un Verbo Principal con significado de “colocar (los vasos en fila sobre la mesa)”, pero en la frase “コップをテーブルにならべておく”, “おく” es un Verbo Auxiliar que añade el significado de “dejar de antemano (los vasos colocados en fila sobre la mesa)”.  Los “Verbos Auxiliares” suelen escribirse en hiragana.  De este modo, se distinguen de los “Verbos Principales”, que tienen el significado propio.<\/p><div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+いる/います<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica que la acción se está llevando a cabo en este momento.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>子供<rt>こども<\/rt><\/ruby>たちがでサッカーをしています。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 1<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo intransitivo en forma-て+いる/います<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica que el estado resultante de una acción determinada persiste.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\">あそこのがあ<ruby>開<rt>かい<\/rt><\/ruby>いている<ruby>部屋<rt>へや<\/rt><\/ruby>がわたし<ruby>私<rt>わたくし<\/rt><\/ruby>の<ruby>寝室<rt>しんしつ<\/rt><\/ruby>です。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+いる/います<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica que un estado o una acción se ha mantenido desde un momento determinado del pasado hasta el presente.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>彼<rt>かれ<\/rt><\/ruby>のことを１０から<ruby>知<rt>し<\/rt><\/ruby>っています。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+いる/います<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica acciones o hábitos que se repiten desde el pasado hasta el presente.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>彼<rt>かれ<\/rt><\/ruby>はいつも<ruby>遅<rt>おそ<\/rt><\/ruby>くまでゲームをしています。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+いる/います<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica un hecho histórico, una experiencia o un antecedente.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>彼<rt>かれ<\/rt><\/ruby>はまでに３<ruby>回<rt>かい<\/rt><\/ruby>も<ruby>結婚<rt>けっこん<\/rt><\/ruby>しています。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo transitivo en forma-て+ある/あります<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica una situación resultante de una acción realizada intencionadamente por alguien.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>今日<rt>きょう<\/rt><\/ruby>のおすすめが<ruby>黒板<rt>こくばん<\/rt><\/ruby>に<ruby>書<rt>か<\/rt><\/ruby>いてあります。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo volitivo en forma-て+おく/おきます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Se refiere a actuar con antelación con un objetivo concreto.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>友達<rt>ともだち<\/rt><\/ruby>がびに<ruby>来<rt>く<\/rt><\/ruby>る<ruby>前<rt>まえ<\/rt><\/ruby>に<ruby>部屋<rt>へや<\/rt><\/ruby>を<ruby>掃除<rt>そうじ<\/rt><\/ruby>しておいた。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 2<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo volitivo en forma-て+おく/おきます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Significa mantener una situación tal y como está, o dejarla así temporalmente.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>暑<rt>あつ<\/rt><\/ruby>いのでを<ruby>開<rt>あ<\/rt><\/ruby>けておきましょう。<\/span><\/div><\/div><\/div><p class=\"lnote\">Nota 1: ・ En el lenguaje hablado, a menudo se omite &quot;い&quot; y se dice &quot;〜てる&quot; en vez de &quot;〜ている&quot;, &quot;〜でる&quot; en vez de &quot;〜でいる&quot;, &quot;〜てます&quot; en vez de &quot;〜ています&quot;, o &quot;〜でます&quot; en vez de &quot;〜でいます&quot;.<\/p><p class=\"lnote\">Nota 2:  En el lenguaje hablado, también se usa &quot;〜とく&quot; en vez de &quot;〜ておく&quot;, &quot;〜どく&quot; en vez de &quot;〜でおく&quot;, &quot;〜ときます&quot; en vez dee &quot;〜ておきます&quot; o &quot;〜どきます&quot; en vez de &quot;〜でおきます&quot;.<\/p>","text":"補助ほじょ動詞どうし・Verbos Auxiliares (1) Mientras que los “Verbos Principales” son verbos autónomos que tienen significado por sí mismos, los “Verbos Auxiliares” tienen la función de apoyar a otros verbos.Por ejemplo, en la frase “コップをテーブルにならべて置おく”, “置おく” es un Verbo Principal con significado de “colocar (los vasos en fila sobre la mesa)”, pero en la frase “コップをテーブルにならべておく”, “おく” es un Verbo Auxiliar que añade el significado de “dejar de antemano (los vasos colocados en fila sobre la mesa)”.  Los “Verbos Auxiliares” suelen escribirse en hiragana.  De este modo, se distinguen de los “Verbos Principales”, que tienen el significado propio.Verbo en forma-て+いる/いますSignificadoIndica que la acción se está llevando a cabo en este momento.Ejemplo de frase子供こどもたちがでサッカーをしています。NotaNota 1Verbo intransitivo en forma-て+いる/いますSignificadoIndica que el estado resultante de una acción determinada persiste.Ejemplo de fraseあそこのがあ開かいいている部屋へやがわたし私わたくしの寝室しんしつです。Verbo en forma-て+いる/いますSignificadoIndica que un estado o una acción se ha mantenido desde un momento determinado del pasado hasta el presente.Ejemplo de frase彼かれのことを１０から知しっています。Verbo en forma-て+いる/いますSignificadoIndica acciones o hábitos que se repiten desde el pasado hasta el presente.Ejemplo de frase彼かれはいつも遅おそくまでゲームをしています。Verbo en forma-て+いる/いますSignificadoIndica un hecho histórico, una experiencia o un antecedente.Ejemplo de frase彼かれはまでに３回かいも結婚けっこんしています。Verbo transitivo en forma-て+ある/ありますSignificadoIndica una situación resultante de una acción realizada intencionadamente por alguien.Ejemplo de frase今日きょうのおすすめが黒板こくばんに書かいてあります。Verbo volitivo en forma-て+おく/おきますSignificadoSe refiere a actuar con antelación con un objetivo concreto.Ejemplo de frase友達ともだちがびに来くる前まえに部屋へやを掃除そうじしておいた。NotaNota 2Verbo volitivo en forma-て+おく/おきますSignificadoSignifica mantener una situación tal y como está, o dejarla así temporalmente.Ejemplo de frase暑あついのでを開あけておきましょう。Nota 1: ・ En el lenguaje hablado, a menudo se omite &quot;い&quot; y se dice &quot;〜てる&quot; en vez de &quot;〜ている&quot;, &quot;〜でる&quot; en vez de &quot;〜でいる&quot;, &quot;〜てます&quot; en vez de &quot;〜ています&quot;, o &quot;〜でます&quot; en vez de &quot;〜でいます&quot;.Nota 2:  En el lenguaje hablado, también se usa &quot;〜とく&quot; en vez de &quot;〜ておく&quot;, &quot;〜どく&quot; en vez de &quot;〜でおく&quot;, &quot;〜ときます&quot; en vez dee &quot;〜ておきます&quot; o &quot;〜どきます&quot; en vez de &quot;〜でおきます&quot;."},{"id":"L036","file":"20260716__ATO__GO__USHIRO_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「後（あと/ご/のち）/後ろ (うしろ)」の使い方","titleRuby":"「<ruby>後<rt>あと<\/rt><\/ruby>（あと/ご/のち）/<ruby>後<rt>あと<\/rt><\/ruby>ろ (うしろ)」の<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- <ruby>後<rt>あと<\/rt><\/ruby>ろ (うしろ)<\/p><p class=\"lp\">(“<ruby>後<rt>あと<\/rt><\/ruby>ろ (うしろ)” se utiliza como un sustantivo que indica una posición o un lugar, y significa “detrás” o “espaldas”.  En este contexto, lo habitual es utilizar la palabra “<ruby>後<rt>あと<\/rt><\/ruby>ろ” (que se lee “うしろ”), y no se suele emplear la Kanji “<ruby>後<rt>あと<\/rt><\/ruby>” solo, salvo cuando se indique el orden de una secuencia donde “<ruby>後<rt>あと<\/rt><\/ruby>” se lee “あと”.)<\/p><p class=\"lp\"><ruby>列<rt>れつ<\/rt><\/ruby>のろに<ruby>並<rt>なら<\/rt><\/ruby>んでください。 ・ 　<ruby>後<rt>うし<\/rt><\/ruby>ろのポケットに<ruby>財布<rt>さいふ<\/rt><\/ruby>を<ruby>入<rt>い<\/rt><\/ruby>れました。 ・ このバスは<ruby>後<rt>うし<\/rt><\/ruby>ろから<ruby>降<rt>お<\/rt><\/ruby>ります。<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>のについてきてください。 ・  ・ <ruby>警官<rt>けいかん<\/rt><\/ruby>がの<ruby>後<rt>あと<\/rt><\/ruby>を<ruby>追<rt>お<\/rt><\/ruby>いかけた。<\/p><p class=\"lp\">- <ruby>後<rt>あと<\/rt><\/ruby> (あと)<\/p><p class=\"lp\">(“<ruby>後<rt>あと<\/rt><\/ruby> (あと)” se utiliza como un sustantivo que indica un momento o un punto en el tiempo, y significa algo así como “después”, “momento posterior” o “la vez posterior.)<\/p><p class=\"lp\"><ruby>江戸<rt>えど<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>のは<ruby>明治<rt>めいじ<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>です。　<ruby>急行<rt>きゅうこう<\/rt><\/ruby>はの<ruby>電車<rt>でんしゃ<\/rt><\/ruby>の<ruby>後<rt>あと<\/rt><\/ruby>に<ruby>来<rt>く<\/rt><\/ruby>る。　アメリカのは<ruby>入学<rt>にゅうがく<\/rt><\/ruby>した<ruby>後<rt>あと<\/rt><\/ruby>が<ruby>大変<rt>たいへん<\/rt><\/ruby>だ。<\/p><p class=\"lp\">- あと<\/p><p class=\"lp\">(“あと” se utiliza para expresar “restar” o “quedar”, o para continuar el relato, al igual que “luego”, “adicionalmente” o “además”.  En este uso, se expresa generalmente en Hiragana.)<\/p><p class=\"lp\">あと5<ruby>分<rt>ふん<\/rt><\/ruby>でが<ruby>来<rt>き<\/rt><\/ruby>ます。　 あと、<ruby>質問<rt>しつもん<\/rt><\/ruby>が<ruby>三<rt>さん<\/rt><\/ruby>つあります。　 <ruby>弁当<rt>べんとう<\/rt><\/ruby>をください。あと、お<ruby>茶<rt>ちゃ<\/rt><\/ruby>もお<ruby>願<rt>ねが<\/rt><\/ruby>いします。<\/p><p class=\"lp\">- Sustantivo Cuantitficador (el período del tiempo) + <ruby>後<rt>あと<\/rt><\/ruby> (ご)<\/p><p class=\"lp\">(Esta expresión indica “cuánto tiempo ha/había/habrá pasado desde ahora o desde el momento ante-especificado”, y significa algo así como “dentro de (Sustantivo Cuantificador)”, o “(Sustantivo Cuantificador) después”.)<\/p><p class=\"lp\">30ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>ご<ruby>後<rt>あと<\/rt><\/ruby>にしましょう。　　10<ruby>年<rt>ねん<\/rt><\/ruby>ご<ruby>後<rt>あと<\/rt><\/ruby>はが<ruby>空<rt>そら<\/rt><\/ruby>を<ruby>飛<rt>と<\/rt><\/ruby>ぶ<ruby>時代<rt>じだい<\/rt><\/ruby>になる。　　<ruby>彼女<rt>かのじょ<\/rt><\/ruby>とって３<ruby>年<rt>ねん<\/rt><\/ruby>ご<ruby>後<rt>あと<\/rt><\/ruby>に<ruby>結婚<rt>けっこん<\/rt><\/ruby>した。<\/p><p class=\"lp\">- [Sustantivo + の / Verbo en forma-た] + <ruby>後<rt>あと<\/rt><\/ruby> (あと)  (+で) + Cláusula Principal<\/p><p class=\"lp\">(Se utiliza para expresar que se realiza la acción o el hecho indicado por el verbo en la Cláusula Principal tuvo/tiene/tendrá lugar después de que hubiera/haya ocurrido la acción o el hecho indicado por el Sustantivo o Verbo que precede a “<ruby>後<rt>あと<\/rt><\/ruby> (あと).  El verbo que precede a “<ruby>後<rt>あと<\/rt><\/ruby> (あと) se usa siempre en la forma-たaunque la Cláusula Principal esté en pretérito o no pretérito.  En este contexto, se puede omitir la partícula “で” después de “<ruby>後<rt>あと<\/rt><\/ruby> (あと).)<\/p><p class=\"lp\"><ruby>食事<rt>しょくじ<\/rt><\/ruby>の（で）<ruby>散歩<rt>さんぽ<\/rt><\/ruby>にきませんか。 ・  ・ <ruby>授業<rt>じゅぎょう<\/rt><\/ruby>の（で）<ruby>先生<rt>せんせい<\/rt><\/ruby>にをしに<ruby>行<rt>い<\/rt><\/ruby>きました。<\/p><p class=\"lp\"><ruby>掃除<rt>そうじ<\/rt><\/ruby>をした（で）コーヒーをんで<ruby>休<rt>やす<\/rt><\/ruby>んだ。 ・ <ruby>子<rt>こ<\/rt><\/ruby>どもがたあと<ruby>後<rt>で<\/rt><\/ruby><ruby>映画<rt>えいが<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>るのが<ruby>楽<rt>たの<\/rt><\/ruby>しみです。<\/p><p class=\"lp\">- [Sustantivo + の / Verbo en forma-た] + <ruby>後<rt>あと<\/rt><\/ruby> (あと) + Cláusula Principal<\/p><p class=\"lp\">(Se utiliza para describir las consecuencias o el estado denotado en la Cláusula Principal que se produce tras la acción o el hecho indicado por Sustantivo o Verbo anterior a “<ruby>後<rt>あと<\/rt><\/ruby> (あと)” que ya ha terminado.  Con diferencia al uso 5 anterior, no viene la
