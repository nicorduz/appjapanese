 partícula “で” después de “<ruby>後<rt>あと<\/rt><\/ruby> (あと)”.  Y en la Cláusula Principal se utiliza un verbo que expresa un estado.  El verbo que precede a “<ruby>後<rt>あと<\/rt><\/ruby> (あと) se usa siempre en la forma-たaunque la Cláusula Principal esté en pretérito o no pretérito.)<\/p><p class=\"lp\"><ruby>食事<rt>しょくじ<\/rt><\/ruby>の、<ruby>眠<rt>ねむ<\/rt><\/ruby>ってしまいました。 ・  ・ <ruby>授業<rt>じゅぎょう<\/rt><\/ruby>の、<ruby>何人<rt>なんにん<\/rt><\/ruby>かの<ruby>学生<rt>がくせい<\/rt><\/ruby>が<ruby>教室<rt>きょうしつ<\/rt><\/ruby>に<ruby>残<rt>のこ<\/rt><\/ruby>っていた。<\/p><p class=\"lp\"><ruby>掃除<rt>そうじ<\/rt><\/ruby>をした、<ruby>疲<rt>つか<\/rt><\/ruby>れて<ruby>動<rt>うご<\/rt><\/ruby>けなかった。 ・  ・ <ruby>大学<rt>だいがく<\/rt><\/ruby>をした<ruby>後<rt>あと<\/rt><\/ruby>、ずっと<ruby>日本<rt>にっぽん<\/rt><\/ruby>で<ruby>働<rt>はたら<\/rt><\/ruby>いています。<\/p><p class=\"lp\">- Expresiones fijas con “<ruby>後<rt>あと<\/rt><\/ruby> (あと)”<\/p><p class=\"lp\">- <ruby>後味<rt>あとあじ<\/rt><\/ruby>がい ・ (Significa que se queda una sensación desagradable, que se deja mal sabor de boca.)<\/p><p class=\"lp\"><ruby>友達<rt>ともだち<\/rt><\/ruby>とつまらないことでけんかをして、<ruby>後味<rt>あとあじ<\/rt><\/ruby>が<ruby>悪<rt>わる<\/rt><\/ruby>い。<\/p><p class=\"lp\">- <ruby>後<rt>あと<\/rt><\/ruby>のり ・ (Significa que ya es demasiado tarde y no hay nada que hacer.)<\/p><p class=\"lp\">テストがわってから<ruby>勉強<rt>べんきょう<\/rt><\/ruby>しても、<ruby>後<rt>あと<\/rt><\/ruby>の<ruby>祭<rt>まつ<\/rt><\/ruby>りだ。<\/p><p class=\"lp\">- <ruby>後<rt>あと<\/rt><\/ruby>を<ruby>引<rt>ひ<\/rt><\/ruby>く ・ (Significa que el impacto o la sensación perduran durante mucho tiempo.)<\/p><p class=\"lp\"><ruby>昨日<rt>きのう<\/rt><\/ruby>の<ruby>失敗<rt>しっぱい<\/rt><\/ruby>がを<ruby>引<rt>ひ<\/rt><\/ruby>いていて、<ruby>今日<rt>きょう<\/rt><\/ruby>も<ruby>仕事<rt>しごと<\/rt><\/ruby>に<ruby>集中<rt>しゅうちゅう<\/rt><\/ruby>できない。<\/p><p class=\"lp\">- <ruby>後<rt>あと<\/rt><\/ruby>にも<ruby>先<rt>さき<\/rt><\/ruby>にも　 ・ (Es una forma de expresar el sentimiento de que algo nunca ha ocurrido antes y que seguramente tampoco ocurrirá en el futuro.)<\/p><p class=\"lp\"><ruby>後<rt>あと<\/rt><\/ruby>にもにも、あんなまずい<ruby>料理<rt>りょうり<\/rt><\/ruby>は<ruby>食<rt>た<\/rt><\/ruby>べたことがない。<\/p><p class=\"lp\">- <ruby>後<rt>あと<\/rt><\/ruby>をたない　 ・ (Significa que se suceden continuamente situaciones o acontecimientos desagradables que no parecen desaparecer.)<\/p><p class=\"lp\"><ruby>高齢者<rt>こうれいしゃ<\/rt><\/ruby>による<ruby>事故<rt>じこ<\/rt><\/ruby>が<ruby>後<rt>あと<\/rt><\/ruby>を<ruby>絶<rt>た<\/rt><\/ruby>たない。<\/p>","text":"「後あと（あと/ご/のち）/後あとろ (うしろ)」の使しい方ほう - 後あとろ (うしろ)(“後あとろ (うしろ)” se utiliza como un sustantivo que indica una posición o un lugar, y significa “detrás” o “espaldas”.  En este contexto, lo habitual es utilizar la palabra “後あとろ” (que se lee “うしろ”), y no se suele emplear la Kanji “後あと” solo, salvo cuando se indique el orden de una secuencia donde “後あと” se lee “あと”.)列れつのろに並ならんでください。 ・ 　後うしろのポケットに財布さいふを入いれました。 ・ このバスは後うしろから降おります。わたし私わたくしのについてきてください。 ・  ・ 警官けいかんがの後あとを追おいかけた。- 後あと (あと)(“後あと (あと)” se utiliza como un sustantivo que indica un momento o un punto en el tiempo, y significa algo así como “después”, “momento posterior” o “la vez posterior.)江戸えど時代じだいのは明治めいじ時代じだいです。　急行きゅうこうはの電車でんしゃの後あとに来くる。　アメリカのは入学にゅうがくした後あとが大変たいへんだ。- あと(“あと” se utiliza para expresar “restar” o “quedar”, o para continuar el relato, al igual que “luego”, “adicionalmente” o “además”.  En este uso, se expresa generalmente en Hiragana.)あと5分ふんでが来きます。　 あと、質問しつもんが三さんつあります。　 弁当べんとうをください。あと、お茶ちゃもお願ねがいします。- Sustantivo Cuantitficador (el período del tiempo) + 後あと (ご)(Esta expresión indica “cuánto tiempo ha/había/habrá pasado desde ahora o desde el momento ante-especificado”, y significa algo así como “dentro de (Sustantivo Cuantificador)”, o “(Sustantivo Cuantificador) después”.)30ぷん分ぶんご後あとにしましょう。　　10年ねんご後あとはが空そらを飛とぶ時代じだいになる。　　彼女かのじょとって３年ねんご後あとに結婚けっこんした。- [Sustantivo + の / Verbo en forma-た] + 後あと (あと)  (+で) + Cláusula Principal(Se utiliza para expresar que se realiza la acción o el hecho indicado por el verbo en la Cláusula Principal tuvo/tiene/tendrá lugar después de que hubiera/haya ocurrido la acción o el hecho indicado por el Sustantivo o Verbo que precede a “後あと (あと).  El verbo que precede a “後あと (あと) se usa siempre en la forma-たaunque la Cláusula Principal esté en pretérito o no pretérito.  En este contexto, se puede omitir la partícula “で” después de “後あと (あと).)食事しょくじの（で）散歩さんぽにきませんか。 ・  ・ 授業じゅぎょうの（で）先生せんせいにをしに行いきました。掃除そうじをした（で）コーヒーをんで休やすんだ。 ・ 子こどもがたあと後で映画えいがを見みるのが楽たのしみです。- [Sustantivo + の / Verbo en forma-た] + 後あと (あと) + Cláusula Principal(Se utiliza para describir las consecuencias o el estado denotado en la Cláusula Principal que se produce tras la acción o el hecho indicado por Sustantivo o Verbo anterior a “後あと (あと)” que ya ha terminado.  Con diferencia al uso 5 anterior, no viene la partícula “で” después de “後あと (あと)”.  Y en la Cláusula Principal se utiliza un verbo que expresa un estado.  El verbo que precede a “後あと (あと) se usa siempre en la forma-たaunque la Cláusula Principal esté en pretérito o no pretérito.)食事しょくじの、眠ねむってしまいました。 ・  ・ 授業じゅぎょうの、何人なんにんかの学生がくせいが教室きょうしつに残のこっていた。掃除そうじをした、疲つかれて動うごけなかった。 ・  ・ 大学だいがくをした後あと、ずっと日本にっぽんで働はたらいています。- Expresiones fijas con “後あと (あと)”- 後味あとあじがい ・ (Significa que se queda una sensación desagradable, que se deja mal sabor de boca.)友達ともだちとつまらないことでけんかをして、後味あとあじが悪わるい。- 後あとのり ・ (Significa que ya es demasiado tarde y no hay nada que hacer.)テストがわってから勉強べんきょうしても、後あとの祭まつりだ。- 後あとを引ひく ・ (Significa que el impacto o la sensación perduran durante mucho tiempo.)昨日きのうの失敗しっぱいがを引ひいていて、今日きょうも仕事しごとに集中しゅうちゅうできない。- 後あとにも先さきにも　 ・ (Es una forma de expresar el sentimiento de que algo nunca ha ocurrido antes y que seguramente tampoco ocurrirá en el futuro.)後あとにもにも、あんなまずい料理りょうりは食たべたことがない。- 後あとをたない　 ・ (Significa que se suceden continuamente situaciones o acontecimientos desagradables que no parecen desaparecer.)高齢者こうれいしゃによる事故じこが後あとを絶たたない。"},{"id":"L037","file":"20260716__MAE_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「前（まえ）」の使い方","titleRuby":"「<ruby>前<rt>まえ<\/rt><\/ruby>」の<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- <ruby>前<rt>まえ<\/rt><\/ruby> (まえ)<\/p><p class=\"lp\">(“<ruby>前<rt>まえ<\/rt><\/ruby> (まえ)” se utiliza como un sustantivo que indica una posición o un lugar, y significa algo así como “delante” o “frente”.)<\/p><p class=\"lp\">A<ruby>銀行<rt>ぎんこう<\/rt><\/ruby>はの<ruby>前<rt>まえ<\/rt><\/ruby>にあります。　　<ruby>学校<rt>がっこう<\/rt><\/ruby>ので<ruby>友達<rt>ともだち<\/rt><\/ruby>を<ruby>待<rt>ま<\/rt><\/ruby>っていた。 ・ <ruby>駅<rt>えき<\/rt><\/ruby>のが<ruby>工事中<rt>こうじちゅう<\/rt><\/ruby>で、<ruby>通<rt>とお<\/rt><\/ruby>れません。<\/p><p class=\"lp\">- <ruby>前<rt>まえ<\/rt><\/ruby> (まえ)<\/p><p class=\"lp\">(“<ruby>前<rt>まえ<\/rt><\/ruby> (まえ)” se utiliza como un sustantivo que indica un momento o un punto en el tiempo, y significa algo así como “antes”, “momento anterior” o “la vez anterior.)<\/p><p class=\"lp\"><ruby>明治<rt>めいじ<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>のは<ruby>江戸<rt>えど<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>です。 ・ 　　<ruby>前<rt>まえ<\/rt><\/ruby>のことはれて、<ruby>今<rt>いま<\/rt><\/ruby>を<ruby>楽<rt>たの<\/rt><\/ruby>しもう。 ・ <ruby>前<rt>まえ<\/rt><\/ruby>より<ruby>日本<rt>にっぽん<\/rt><\/ruby>が<ruby>上手<rt>じょうず<\/rt><\/ruby>になった。<\/p><p class=\"lp\">- Sustantivo Cuantificador (el período del tiempo) + <ruby>前<rt>まえ<\/rt><\/ruby> (まえ)<\/p><p class=\"lp\">(Esta expresión indica cuánto tiempo hace, y significa algo así como “hace (Sustantivo Cuantificador) que 〜”.)<\/p><p class=\"lp\">３<ruby>前<rt>まえ<\/rt><\/ruby>、<ruby>日本<rt>にっぽん<\/rt><\/ruby>に<ruby>来<rt>き<\/rt><\/ruby>ました。 ・ 1<ruby>億<rt>おく<\/rt><\/ruby><ruby>年<rt>ねん<\/rt><\/ruby><ruby>前<rt>まえ<\/rt><\/ruby>はが<ruby>生<rt>い<\/rt><\/ruby>きていました。 ・ <ruby>少<rt>すこ<\/rt><\/ruby>しに<ruby>電話<rt>でんわ<\/rt><\/ruby>がありました。<\/p><p class=\"lp\">- [Sustantivo + の / Verbo en forma diccionario] + <ruby>前<rt>まえ<\/rt><\/ruby> (まえ) +に + Cláusula Principal<\/p><p class=\"lp\">(Se utiliza para expresar que se realiza la acción del verbo en la Cláusula Principal en un momento anterior al del hecho referido en el Sustantivo o Verbo anterior a “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ).  Por lo tanto, en la Cláusula Principal se utiliza un verbo que expresa una acción.  El verbo anterior a “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ) se usa siempre en la forma de diccionario aunque la Cláusula Principal esté en pretérito o no pretérito.)<\/p><p class=\"lp\">テストのに<ruby>文法<rt>ぶんぽう<\/rt><\/ruby>の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>をしました。 ・  ・ <ruby>会議<rt>かいぎ<\/rt><\/ruby>のにプレゼンテーションの<ruby>資料<rt>しりょう<\/rt><\/ruby>を<ruby>作<rt>つく<\/rt><\/ruby>ってください。<\/p><p class=\"lp\"><ruby>出<rt>で<\/rt><\/ruby>かけるにトイレに<ruby>行<rt>い<\/rt><\/ruby>っておきなさい。 ・ <ruby>傘<rt>かさ<\/rt><\/ruby>がないので、が<ruby>降<rt>ふ<\/rt><\/ruby>り<ruby>始<rt>はじ<\/rt><\/ruby>める<ruby>前<rt>まえ<\/rt><\/ruby>に<ruby>家<rt>いえ<\/rt><\/ruby>に<ruby>帰<rt>かえ<\/rt><\/ruby>りたい。<\/p><p class=\"lp\">- [Sustantivo + の / Verbo en forma diccionario] + <ruby>前<rt>まえ<\/rt><\/ruby> (まえ) (+は) + Cláusula Principal<\/p><p class=\"lp\">(Se utiliza para expresar la situación o estado denotado en la Cláusula Principal antes del hecho referido en el Sustantivo o Verbo anterior a “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ).  Con diferencia al uso 4 anterior, no viene “に” despues de “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ)” pero puede venir “は”.  Y en la Cláusula Principal se utiliza un verbo que expresa un estado.  El verbo anterior a “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ) se usa siempre en la forma de diccionario aunque la Cláusula Principal esté en pretérito o no pretérito.)<\/p><p class=\"lp\"><ruby>明治<rt>めいじ<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>の、<ruby>日本<rt>にっぽん<\/rt><\/ruby>は<ruby>鎖国<rt>さこく<\/rt><\/ruby>していた。 ・  ・ <ruby>大航海<rt>だいこうかい<\/rt><\/ruby><ruby>時代<rt>じだい<\/rt><\/ruby>のは、アメリカにインディオが<ruby>住<rt>す<\/rt><\/ruby>んでいた。<\/p><p class=\"lp\">ごはんをべる<ruby>前<rt>まえ<\/rt><\/ruby>は、おなか<ruby>腹<rt>はら<\/rt><\/ruby>が<ruby>痛<rt>いた<\/rt><\/ruby>かった。 ・  ・ ショッピングモールができる<ruby>前<rt>まえ<\/rt><\/ruby>、そこは<ruby>田<rt>た<\/rt><\/ruby>んぼでした。<\/p><p class=\"lp\">- Expresiones fijas con “<ruby>前<rt>まえ<\/rt><\/ruby> (まえ)”<\/p><p class=\"lp\">- <ruby>当<rt>あ<\/rt><\/ruby>たり ・ (Se refiere a una situación que mucha gente considera normal, o se refiere a algo que no es especial, sino que representa una situación normal y corriente.)<\/p><p class=\"lp\"><ruby>困<rt>こま<\/rt><\/ruby>っている<ruby>人<rt>ひと<\/rt><\/ruby>をけるのは<ruby>当<rt>あ<\/rt><\/ruby>たり<ruby>前<rt>まえ<\/rt><\/ruby>だ。 ・ <ruby>仕事<rt>しごと<\/rt><\/ruby>をたり<ruby>前<rt>まえ<\/rt><\/ruby>だと<ruby>思<rt>おも<\/rt><\/ruby>わずに、<ruby>感謝<rt>かんしゃ<\/rt><\/ruby>して<ruby>働<rt>はたら<\/rt><\/ruby>きたい。<\/p><p class=\"lp\">- <ruby>人前<rt>ひとまえ<\/rt><\/ruby>で ・  ・ (Se utiliza para referirse a situaciones en las que hay miradas ajenas, como “delante de otras personas”, “ante un público numeroso” o “en un lugar público”.)<\/p><p class=\"lp\"><ruby>人前<rt>ひとまえ<\/rt><\/ruby>でくのは<ruby>恥<rt>は<\/rt><\/ruby>ずかしい。 ・ <ruby>人前<rt>ひとまえ<\/rt><\/ruby>でべるときは、マナーに<ruby>気<rt>き<\/rt><\/ruby>をつけましょう。<\/p><p class=\"lp\">- <ruby>前向<rt>まえむ<\/rt><\/ruby>きな/に ・ (Se utiliza con los siguientes significados: (a) Tener una forma de pensar y un estado de ánimo optimistas y positivos, o (b) Mantener una actitud que busca avanzar en la dirección correcta, incluso ante los problemas o los fracasos.)<\/p><p class=\"lp\"><ruby>失敗<rt>しっぱい<\/rt><\/ruby>しても<ruby>前向<rt>まえむ<\/rt><\/ruby>きな<ruby>気持<rt>きも<\/rt><\/ruby>ちが<ruby>大切<rt>たいせつ<\/rt><\/ruby>だ。 ・ そのについては、<ruby>社内<rt>しゃない<\/rt><\/ruby>で<ruby>前向<rt>まえむ<\/rt><\/ruby>きに<ruby>検討<rt>けんとう<\/rt><\/ruby>いたします。<\/p><p class=\"lp\">- <ruby>一人前<rt>いちにんまえ<\/rt><\/ruby>　 ・ (Significa que es una persona con capacidad y reconocimiento social necesarios para valerse por sí mismo como adulto o como profesional.)<\/p><p class=\"lp\"><ruby>一人前<rt>いちにんまえ<\/rt><\/ruby>のになることが<ruby>夢<rt>ゆめ<\/rt><\/ruby>だ。 ・ <ruby>新人<rt>しんじん<\/rt><\/ruby>をにするまでには、<ruby>教育<rt>きょういく<\/rt><\/ruby>と<ruby>時間<rt>じかん<\/rt><\/ruby>が<ruby>必要<rt>ひつよう<\/rt><\/ruby>です。<\/p><p class=\"lp\">- <ruby>半人前<rt>はんにんまえ<\/rt><\/ruby>　 ・ (Se utiliza para referirse a alguien que aún no tiene la destreza ni la experiencia suficientes y que no puede actuar independiente.)<\/p><p class=\"lp\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>はまだの<ruby>医者<rt>いしゃ<\/rt><\/ruby>だ。 ・ エンジニアとしてはなので、<ruby>毎日<rt>まいにち<\/rt><\/ruby><ruby>勉強<rt>べんきょう<\/rt><\/ruby>を<ruby>続<rt>つづ<\/rt><\/ruby>けている。<\/p><p class=\"lp\">- <ruby>朝飯前<rt>あさめしまえ<\/rt><\/ruby> ・  ・ (Significa “algo muy sencillo que se puede hacer sin ningún esfuerzo”.)<\/p><p class=\"lp\">そんな、<ruby>彼<rt>かれ<\/rt><\/ruby>にとっては<ruby>朝飯前<rt>あさめしまえ<\/rt><\/ruby>だ。 ・ これくらいのなら、<ruby>歩<rt>ある<\/rt><\/ruby>いて<ruby>行<rt>い<\/rt><\/ruby>くのは<ruby>朝飯前<rt>あさめしまえ<\/rt><\/ruby>だよ。<\/p><p class=\"lp\">- <ruby>前触<rt>まえぶ<\/rt><\/ruby>れ ・  ・ (Señales, presagios o indicios que aparecen antes de que suceda algo.)<\/p><p class=\"lp\"><ruby>大<rt>だい<\/rt><\/ruby><ruby>地震<rt>じしん<\/rt><\/ruby>の<ruby>前触<rt>まえぶ<\/rt><\/ruby>れのような<ruby>小<rt>ちい<\/rt><\/ruby>さな<ruby>揺<rt>ゆ<\/rt><\/ruby>れを<ruby>感<rt>かん<\/rt><\/ruby>じた。 ・ <ruby>何<rt>なん<\/rt><\/ruby>の<ruby>前触<rt>まえぶ<\/rt><\/ruby>れもなく<ruby>社長<rt>しゃちょう<\/rt><\/ruby>が<ruby>交代<rt>こうたい<\/rt><\/ruby>した。<\/p>","text":"「前まえ」の使しい方ほう - 前まえ (まえ)(“前まえ (まえ)” se utiliza como un sustantivo que indica una posición o un lugar, y significa algo así como “delante” o “frente”.)A銀行ぎんこうはの前まえにあります。　　学校がっこうので友達ともだちを待まっていた。 ・ 駅えきのが工事中こうじちゅうで、通とおれません。- 前まえ (まえ)(“前まえ (まえ)” se utiliza como un sustantivo que indica un momento o un punto en el tiempo, y significa algo así como “antes”, “momento anterior” o “la vez anterior.)明治めいじ時代じだいのは江戸えど時代じだいです。 ・ 　　前まえのことはれて、今いまを楽たのしもう。 ・ 前まえより日本にっぽんが上手じょうずになった。- Sustantivo Cuantificador (el período del tiempo) + 前まえ (まえ)(Esta expresión indica cuánto tiempo hace, y significa algo así como “hace (Sustantivo Cuantificador) que 〜”.)３前まえ、日本にっぽんに来きました。 ・ 1億おく年ねん前まえはが生いきていました。 ・ 少すこしに電話でんわがありました。- [Sustantivo + の / Verbo en forma diccionario] + 前まえ (まえ) +に + Cláusula Principal(Se utiliza para expresar que se realiza la acción del verbo en la Cláusula Principal en un momento anterior al del hecho referido en el Sustantivo o Verbo anterior a “前まえ (まえ).  Por lo tanto, en la Cláusula Principal se utiliza un verbo que expresa una acción.  El verbo anterior a “前まえ (まえ) se usa siempre en la forma de diccionario aunque la Cláusula Principal esté en pretérito o no pretérito.)テストのに文法ぶんぽうの復習ふくしゅうをしました。 ・  ・ 会議かいぎのにプレゼンテーションの資料しりょうを作つくってください。出でかけるにトイレに行いっておきなさい。 ・ 傘かさがないので、が降ふり始はじめる前まえに家いえに帰かえりたい。- [Sustantivo + の / Verbo en forma diccionario] + 前まえ (まえ) (+は) + Cláusula Principal(Se utiliza para expresar la situación o estado denotado en la Cláusula Principal antes del hecho referido en el Sustantivo o Verbo anterior a “前まえ (まえ).  Con diferencia al uso 4 anterior, no viene “に” despues de “前まえ (まえ)” pero puede venir “は”.  Y en la Cláusula Principal se utiliza un verbo que expresa un estado.  El verbo anterior a “前まえ (まえ) se usa siempre en la forma de diccionario aunque la Cláusula Principal esté en pretérito o no pretérito.)明治めいじ時代じだいの、日本にっぽんは鎖国さこくしていた。 ・  ・ 大航海だいこうかい時代じだいのは、アメリカにインディオが住すんでいた。ごはんをべる前まえは、おなか腹はらが痛いたかった。 ・  ・ ショッピングモールができる前まえ、そこは田たんぼでした。- Expresiones fijas con “前まえ (まえ)”- 当あたり ・ (Se refiere a una situación que mucha gente considera normal, o se refiere a algo que no es especial, sino que representa una situación normal y corriente.)困こまっている人ひとをけるのは当あたり前まえだ。 ・ 仕事しごとをたり前まえだと思おもわずに、感謝かんしゃして働はたらきたい。- 人前ひとまえで ・  ・ (Se utiliza para referirse a situaciones en las que hay miradas ajenas, como “delante de otras personas”, “ante un público numeroso” o “en un lugar público”.)人前ひとまえでくのは恥はずかしい。 ・ 人前ひとまえでべるときは、マナーに気きをつけましょう。- 前向まえむきな/に ・ (Se utiliza con los siguientes significados: (a) Tener una forma de pensar y un estado de ánimo optimistas y positivos, o (b) Mantener una actitud que busca avanzar en la dirección correcta, incluso ante los problemas o los fracasos.)失敗しっぱいしても前向まえむきな気持きもちが大切たいせつだ。 ・ そのについては、社内しゃないで前向まえむきに検討けんとういたします。- 一人前いちにんまえ　 ・ (Significa que es una persona con capacidad y reconocimiento social necesarios para valerse por sí mismo como adulto o como profesional.)一人前いちにんまえのになることが夢ゆめだ。 ・ 新人しんじんをにするまでには、教育きょういくと時間じかんが必要ひつようです。- 半人前はんにんまえ　 ・ (Se utiliza para referirse a alguien que aún no tiene la destreza ni la experiencia suficientes y que no puede actuar independiente.)彼女かのじょはまだの医者いしゃだ。 ・ エンジニアとしてはなので、毎日まいにち勉強べんきょうを続つづけている。- 朝飯前あさめしまえ ・  ・ (Significa “algo muy sencillo que se puede hacer sin ningún esfuerzo”.)そんな、彼かれにとっては朝飯前あさめしまえだ。 ・ これくらいのなら、歩あるいて行いくのは朝飯前あさめしまえだよ。- 前触まえぶれ ・  ・ (Señales, presagios o indicios que aparecen antes de que suceda algo.)大だい地震じしんの前触まえぶれのような小ちいさな揺ゆれを感かんじた。 ・ 何なんの前触まえぶれもなく社長しゃちょうが交代こうたいした。"},{"id":"L038","file":"20260727_Verbos_Auxiliares__2_.docx","cat":"vaux","catLabel":"Verbos auxiliares","title":"補助動詞・Verbos Auxiliares (2)","titleRuby":"<ruby>補助<rt>ほじょ<\/rt><\/ruby><ruby>動詞<rt>どうし<\/rt><\/ruby>・Verbos Auxiliares (2)","html":"<div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+しまう/しまいます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica que una acción se ha completado por completo.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>今日<rt>きょう<\/rt><\/ruby>、から<ruby>借<rt>か<\/rt><\/ruby>りた<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>んでしまいます。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 3<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+しまう/しまいます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Se utiliza cuando se ha cometido un acto sin querer y se lamenta o se arrepiente.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>昨日<rt>きのう<\/rt><\/ruby><ruby>買<rt>か<\/rt><\/ruby>ったばかりのを<ruby>電車<rt>でんしゃ<\/rt><\/ruby>に<ruby>忘<rt>わす<\/rt><\/ruby>れてしまった。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo volitivo en forma-て+みる/みます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Significa &quot;probar a hacer algo&quot; o &quot;hacerlo para ver cómo sale&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\">このコートを<ruby>着<rt>き<\/rt><\/ruby>てみてもいいですか。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo volitivo en forma-て+みせる/みせます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Es una forma de expresar la voluntad o la determinación del hablante, con matiz de demostrárselo al interloctor.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>結婚<rt>けっこん<\/rt><\/ruby>したら、を<ruby>幸<rt>しあわ<\/rt><\/ruby>せにしてみせます。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+いく/いきます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica un movimiento o estado que se aleja del hablante.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>福岡<rt>ふくおか<\/rt><\/ruby>へはに<ruby>乗<rt>の<\/rt><\/ruby>っていくほうが<ruby>便利<rt>べんり<\/rt><\/ruby>だ。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 4<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+いく/いきます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica un movimiento o una evolución de un estado desde el momento actual hacia el futuro.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\">これからもの<ruby>勉強<rt>べんきょう<\/rt><\/ruby>を<ruby>続<rt>つづ<\/rt><\/ruby>けていきます。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo vollitivo en forma-て+くる/きます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Se utiliza cuando el hablante va a algún lugar, hace la acción expresada por el verbo volitivo y vuelve.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\">コンビニでを<ruby>買<rt>か<\/rt><\/ruby>ってくるから、<ruby>待<rt>ま<\/rt><\/ruby>って。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+くる/きます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica movimientos o estados de que algo aparece, se desplaza o cambia en dirección al hablante.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>焼<rt>や<\/rt><\/ruby>きを<ruby>焼<rt>や<\/rt><\/ruby>く、いいにおいがしてきた。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-て+くる/きます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica que una acción o un estado se ha prolongado desde el pasado hasta el presente.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>観光<rt>かんこう<\/rt><\/ruby>でする<ruby>外国人<rt>がいこくじん<\/rt><\/ruby>が<ruby>増<rt>ふ<\/rt><\/ruby>えてきました。<\/span><\/div><\/div><\/div><p class=\"lnote\">Nota 3:  En el lenguaje hablado, también se usa &quot;〜ちゃう&quot;en lugar de &quot;〜てしまう&quot;, &quot;〜じゃう&quot; en vez de &quot;〜でしまう&quot;, &quot;〜ちゃいます&quot; en vez de &quot;〜てしまいます&quot; o &quot;〜じゃいます&quot; en vez de &quot;〜じゃいます&quot;.<\/p><p class=\"lnote\">Nota 4:  En el lenguaje hablado, a menudo se omite &quot;い&quot; y se dice &quot;〜てく&quot; en vez de &quot;〜ていく&quot;, &quot;〜でく&quot; en vez de &quot;〜でいく&quot;, &quot;〜てきます&quot; en vez de &quot;〜ていきます&quot;, o &quot;〜できます&quot; en vez de &quot;〜でいきます&quot;.<\/p>","text":"補助ほじょ動詞どうし・Verbos Auxiliares (2) Verbo en forma-て+しまう/しまいますSignificadoIndica que una acción se ha completado por completo.Ejemplo de frase今日きょう、から借かりた本ほんを読よんでしまいます。NotaNota 3Verbo en forma-て+しまう/しまいますSignificadoSe utiliza cuando se ha cometido un acto sin querer y se lamenta o se arrepiente.Ejemplo de frase昨日きのう買かったばかりのを電車でんしゃに忘わすれてしまった。Verbo volitivo en forma-て+みる/みますSignificadoSignifica &quot;probar a hacer algo&quot; o &quot;hacerlo para ver cómo sale&quot;.Ejemplo de fraseこのコートを着きてみてもいいですか。Verbo volitivo en forma-て+みせる/みせますSignificadoEs una forma de expresar la voluntad o la determinación del hablante, con matiz de demostrárselo al interloctor.Ejemplo de frase結婚けっこんしたら、を幸しあわせにしてみせます。Verbo en forma-て+いく/いきますSignificadoIndica un movimiento o estado que se aleja del hablante.Ejemplo de frase福岡ふくおかへはに乗のっていくほうが便利べんりだ。NotaNota 4Verbo en forma-て+いく/いきますSignificadoIndica un movimiento o una evolución de un estado desde el momento actual hacia el futuro.Ejemplo de fraseこれからもの勉強べんきょうを続つづけていきます。Verbo vollitivo en forma-て+くる/きますSignificadoSe utiliza cuando el hablante va a algún lugar, hace la acción expresada por el verbo volitivo y vuelve.Ejemplo de fraseコンビニでを買かってくるから、待まって。Verbo en forma-て+くる/きますSignificadoIndica movimientos o estados de que algo aparece, se desplaza o cambia en dirección al hablante.Ejemplo de frase焼やきを焼やく、いいにおいがしてきた。Verbo en forma-て+くる/きますSignificadoIndica que una acción o un estado se ha prolongado desde el pasado hasta el presente.Ejemplo de frase観光かんこうでする外国人がいこくじんが増ふえてきました。Nota 3:  En el lenguaje hablado, también se usa &quot;〜ちゃう&quot;en lugar de &quot;〜てしまう&quot;, &quot;〜じゃう&quot; en vez de &quot;〜でしまう&quot;, &quot;〜ちゃいます&quot; en vez de &quot;〜てしまいます&quot; o &quot;〜じゃいます&quot; en vez de &quot;〜じゃいます&quot;.Nota 4:  En el lenguaje hablado, a menudo se omite &quot;い&quot; y se dice &quot;〜てく&quot; en vez de &quot;〜ていく&quot;, &quot;〜でく&quot; en vez de &quot;〜でいく&quot;, &quot;〜てきます&quot; en vez de &quot;〜ていきます&quot;, o &quot;〜できます&quot; en vez de &quot;〜でいきます&quot;."},{"id":"L039","file":"20260727__AIDA_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「あいだ/間」の色々な使い方","titleRuby":"「あいだ/<ruby>間<rt>ま<\/rt><\/ruby>」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- [Sustantivo1 +と+ Sustantivo2 +の / Sustantivos3 (plural) + の] + <ruby>間<rt>ま<\/rt><\/ruby> (あいだ) + に/を/で/の/・・・<\/p><p class=\"lp\">(“<ruby>間<rt>ま<\/rt><\/ruby> (あいだ)” es un sustantivo que denota la posición, extensión o la distancia entre el Sustantivo1 y el Sustantivo 2 o entre los Sustantivos3 (plural).)<\/p><p class=\"lp\"><ruby>本屋<rt>ほんや<\/rt><\/ruby>は<ruby>肉屋<rt>にくや<\/rt><\/ruby>とパン<ruby>屋<rt>や<\/rt><\/ruby>のあいだ<ruby>間<rt>ま<\/rt><\/ruby>にあります。 ・  ・ <ruby>仕事<rt>しごと<\/rt><\/ruby>で<ruby>東京<rt>とうきょう<\/rt><\/ruby>と<ruby>大阪<rt>おおさか<\/rt><\/ruby>の<ruby>間<rt>あいだ<\/rt><\/ruby>の<ruby>往復<rt>おうふく<\/rt><\/ruby>を<ruby>繰<rt>く<\/rt><\/ruby>り<ruby>返<rt>かえ<\/rt><\/ruby>している。<\/p><p class=\"lp\">たまごっちは<ruby>若者<rt>わかもの<\/rt><\/ruby>の<ruby>間<rt>あいだ<\/rt><\/ruby>で<ruby>流行<rt>りゅうこう<\/rt><\/ruby>している。 ・ <ruby>横浜<rt>よこはま<\/rt><\/ruby>は<ruby>外国人<rt>がいこくじん<\/rt><\/ruby>のあいだ<ruby>間<rt>ま<\/rt><\/ruby>に<ruby>人気<rt>にんき<\/rt><\/ruby>の<ruby>観光地<rt>かんこうち<\/rt><\/ruby>です。<\/p><p class=\"lp\">- [Sustantivo +の / Adjetivo / Verbo en forma diccionario o en forma-て+いる] + あいだ(は) + Cláusula Principal<\/p><p class=\"lp\">(Esta expresión se utiliza para mostrar que tanto la acción o situación que precede a “あいだ” como la acción o situación denotada en la Cláusula Principal se mantienen simultaneamente durante cierto período de tiempo.)<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>が<ruby>病気<rt>びょうき<\/rt><\/ruby>のあいだ、<ruby>母<rt>はは<\/rt><\/ruby>は<ruby>仕事<rt>しごと<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>んだ。 ・ <ruby>若<rt>わか<\/rt><\/ruby>いあいだは<ruby>何<rt>なん<\/rt><\/ruby>でもチャレンジするといいですよ。<\/p><p class=\"lp\"><ruby>桜<rt>さくら<\/rt><\/ruby>がきれいなあいだ、<ruby>毎週<rt>まいしゅう<\/rt><\/ruby><ruby>花見<rt>はなみ<\/rt><\/ruby>をします。 ・ <ruby>電車<rt>でんしゃ<\/rt><\/ruby>に<ruby>乗<rt>の<\/rt><\/ruby>っているあいだ、ずっと<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>んでいた。<\/p><p class=\"lp\">- [Sustantivo +の / Adjetivo / Verbo en forma diccionario o en forma-て+いる] + あいだに + Cláusula Principal<\/p><p class=\"lp\">(Esta expresión se utiliza para mostrar que, mientras la acción o la situación que precede a “あいだ” se mantiene por cierto período de tiempo, la acción denotada en la Cláusula Principal se toma o el suceso denotado en la Cláusula Principal surge.)<\/p><p class=\"lp\"><ruby>夏休<rt>なつやす<\/rt><\/ruby>みのあいだに、<ruby>沖縄<rt>おきなわ<\/rt><\/ruby>に<ruby>旅行<rt>りょこう<\/rt><\/ruby>した。 ・  ・ <ruby>旅行<rt>りょこう<\/rt><\/ruby>のあいだに、<ruby>家<rt>いえ<\/rt><\/ruby>に<ruby>泥棒<rt>どろぼう<\/rt><\/ruby>が<ruby>入<rt>はい<\/rt><\/ruby>ったようだ。<\/p><p class=\"lp\">ひまなあいだに、<ruby>部屋<rt>へや<\/rt><\/ruby>を<ruby>片付<rt>かたづ<\/rt><\/ruby>けよう。 ・  ・ <ruby>暑<rt>あつ<\/rt><\/ruby>いあいだに、あのカフェのかきごおり<ruby>氷<rt>こおり<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べに<ruby>行<rt>い<\/rt><\/ruby>こう！<\/p><p class=\"lp\"><ruby>日本<rt>にっぽん<\/rt><\/ruby>にいるあいだに、<ruby>富士山<rt>ふじさん<\/rt><\/ruby>に<ruby>登<rt>のぼ<\/rt><\/ruby>りたい。 ・ わたし<ruby>私<rt>わたくし<\/rt><\/ruby>がいないあいだに、だれかが<ruby>来<rt>き<\/rt><\/ruby>たようです。<\/p><p class=\"lp\">- Expresiones fijas con “<ruby>間<rt>あいだ<\/rt><\/ruby>”<\/p><p class=\"lp\">- この<ruby>間<rt>ま<\/rt><\/ruby>〜 ・ (Es un término que se refiere a un momento o período específico en el pasado reciente, no muy lejano del presente, como “el otro día” o “hace poco”.)<\/p><p class=\"lp\">このあいだ<ruby>間<rt>ま<\/rt><\/ruby>、<ruby>奈良<rt>なら<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>って<ruby>来<rt>き<\/rt><\/ruby>た。 ・  ・ <ruby>彼女<rt>かのじょ<\/rt><\/ruby>と<ruby>公園<rt>こうえん<\/rt><\/ruby>で<ruby>会<rt>あ<\/rt><\/ruby>ったのはこの<ruby>間<rt>あいだ<\/rt><\/ruby>の<ruby>日曜日<rt>にちようび<\/rt><\/ruby>だった。<\/p><p class=\"lp\">- <ruby>間<rt>ま<\/rt><\/ruby>に<ruby>入<rt>いり<\/rt><\/ruby>る ・ (Actuar como mediador entre dos partes enfrentadas, con el fin de restablecer las relaciones o facilitar el buen desarrollo de los asuntos.)<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>と<ruby>妹<rt>いもうと<\/rt><\/ruby>がけんかする<ruby>時<rt>とき<\/rt><\/ruby>は、いつも<ruby>姉<rt>あね<\/rt><\/ruby>があいだ<ruby>間<rt>ま<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>ってくれます。<\/p><p class=\"lp\">- <ruby>間<rt>ま<\/rt><\/ruby>を<ruby>取<rt>とり<\/rt><\/ruby>り<ruby>持<rt>もち<\/rt><\/ruby>つ ・ (Interponerse entre las personas para construir o mejorar su relación.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>が<ruby>営業<rt>えいぎょう<\/rt><\/ruby><ruby>部門<rt>ぶもん<\/rt><\/ruby>と<ruby>技術<rt>ぎじゅつ<\/rt><\/ruby><ruby>部門<rt>ぶもん<\/rt><\/ruby>の<ruby>間<rt>あいだ<\/rt><\/ruby>を<ruby>取<rt>と<\/rt><\/ruby>り<ruby>持<rt>も<\/rt><\/ruby>ち、<ruby>新商品<rt>しんしょうひん<\/rt><\/ruby>がヒットした。<\/p>","text":"「あいだ/間ま」の色々いろいろな使しい方ほう - [Sustantivo1 +と+ Sustantivo2 +の / Sustantivos3 (plural) + の] + 間ま (あいだ) + に/を/で/の/・・・(“間ま (あいだ)” es un sustantivo que denota la posición, extensión o la distancia entre el Sustantivo1 y el Sustantivo 2 o entre los Sustantivos3 (plural).)本屋ほんやは肉屋にくやとパン屋やのあいだ間まにあります。 ・  ・ 仕事しごとで東京とうきょうと大阪おおさかの間あいだの往復おうふくを繰くり返かえしている。たまごっちは若者わかものの間あいだで流行りゅうこうしている。 ・ 横浜よこはまは外国人がいこくじんのあいだ間まに人気にんきの観光地かんこうちです。- [Sustantivo +の / Adjetivo / Verbo en forma diccionario o en forma-て+いる] + あいだ(は) + Cláusula Principal(Esta expresión se utiliza para mostrar que tanto la acción o situación que precede a “あいだ” como la acción o situación denotada en la Cláusula Principal se mantienen simultaneamente durante cierto período de tiempo.)わたし私わたくしが病気びょうきのあいだ、母ははは仕事しごとを休やすんだ。 ・ 若わかいあいだは何なんでもチャレンジするといいですよ。桜さくらがきれいなあいだ、毎週まいしゅう花見はなみをします。 ・ 電車でんしゃに乗のっているあいだ、ずっと本ほんを読よんでいた。- [Sustantivo +の / Adjetivo / Verbo en forma diccionario o en forma-て+いる] + あいだに + Cláusula Principal(Esta expresión se utiliza para mostrar que, mientras la acción o la situación que precede a “あいだ” se mantiene por cierto período de tiempo, la acción denotada en la Cláusula Principal se toma o el suceso denotado en la Cláusula Principal surge.)夏休なつやすみのあいだに、沖縄おきなわに旅行りょこうした。 ・  ・ 旅行りょこうのあいだに、家いえに泥棒どろぼうが入はいったようだ。ひまなあいだに、部屋へやを片付かたづけよう。 ・  ・ 暑あついあいだに、あのカフェのかきごおり氷こおりを食たべに行いこう！日本にっぽんにいるあいだに、富士山ふじさんに登のぼりたい。 ・ わたし私わたくしがいないあいだに、だれかが来きたようです。- Expresiones fijas con “間あいだ”- この間ま〜 ・ (Es un término que se refiere a un momento o período específico en el pasado reciente, no muy lejano del presente, como “el otro día” o “hace poco”.)このあいだ間ま、奈良ならに行いって来きた。 ・  ・ 彼女かのじょと公園こうえんで会あったのはこの間あいだの日曜日にちようびだった。- 間まに入いりる ・ (Actuar como mediador entre dos partes enfrentadas, con el fin de restablecer las relaciones o facilitar el buen desarrollo de los asuntos.)わたし私わたくしと妹いもうとがけんかする時ときは、いつも姉あねがあいだ間まに入はいってくれます。- 間まを取とりり持もちつ ・ (Interponerse entre las personas para construir o mejorar su relación.)彼かれが営業えいぎょう部門ぶもんと技術ぎじゅつ部門ぶもんの間あいだを取とり持もち、新商品しんしょうひんがヒットした。"},{"id":"L040","file":"20260727__UCHI_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「うち」の色々な使い方","titleRuby":"「うち」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- [Sustantivo +の / Adjetivo / Verbo en forma sencilla] + うち + は/が/に/を/で/の/・・・<\/p><p class=\"lp\">(“うち” es un sustantivo que designa la casa.  Cuando se refiere a la casa de otra persona en el lenguaje coloquial, a veces se utiliza la forma abreviada “〜んち”, como en “おばあちゃんち” o “<ruby>山田<rt>やまだ<\/rt><\/ruby>んち”.  Cuando se habla de la casa de una persona del mayor rango, es más cortés usar “お<ruby>宅<rt>おたく<\/rt><\/ruby>” que “うち”.  Depende del contexto, “うち” puede designar el grupo que pertenece el hablante.)<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>のうちは<ruby>横浜市<rt>よこはまし<\/rt><\/ruby><ruby>青葉区<rt>あおばく<\/rt><\/ruby>にあります。 ・  ・ 　　スーパーのに<ruby>新<rt>あたら<\/rt><\/ruby>しいうちが<ruby>建<rt>た<\/rt><\/ruby>ちました。<\/p><p class=\"lp\">あのの<ruby>上<rt>うえ<\/rt><\/ruby>にあるうちに、<ruby>雷<rt>かみなり<\/rt><\/ruby>が<ruby>落<rt>お<\/rt><\/ruby>ちたらしい。 ・ 　　<ruby>田中<rt>たなか<\/rt><\/ruby>さんがんでいたうちを<ruby>買<rt>か<\/rt><\/ruby>いました。<\/p><p class=\"lp\">うちのメニューはラーメンだけです。 ・  ・ 　　うちの<ruby>従業員<rt>じゅうぎょういん<\/rt><\/ruby>はみんな<ruby>会計<rt>かいけい<\/rt><\/ruby>の<ruby>資格<rt>しかく<\/rt><\/ruby>を<ruby>持<rt>も<\/rt><\/ruby>っています。<\/p><p class=\"lp\">- Sustantivo (Numérico o Colectivo) +の + うち(で)<\/p><p class=\"lp\">(“〜のうち(で)” se utiliza como sustantivo para indicar un rango específico y se emplea cuando se extrae una parte del conjunto al que se refiere “〜”.  Tiene un significado similar al de “〜の<ruby>中<rt>なか<\/rt><\/ruby>で”.)<\/p><p class=\"lp\"><ruby>家族<rt>かぞく<\/rt><\/ruby>のうちで、<ruby>運転<rt>うんてん<\/rt><\/ruby>できるのはわたし<ruby>私<rt>わたくし<\/rt><\/ruby>だけです。 ・ 　　<ruby>外国人<rt>がいこくじん<\/rt><\/ruby><ruby>観光客<rt>かんこうきゃく<\/rt><\/ruby>10<ruby>人<rt>にん<\/rt><\/ruby>のうち、8<ruby>人<rt>にん<\/rt><\/ruby>はを<ruby>訪<rt>おとず<\/rt><\/ruby>れる。<\/p><p class=\"lp\"><ruby>全都道府県<rt>ぜんとどうふけん<\/rt><\/ruby>のうちで、8つのには<ruby>海<rt>うみ<\/rt><\/ruby>がない。 ・ 　　このクラスのうち、５<ruby>割<rt>わり<\/rt><\/ruby>がiPhoneを<ruby>使<rt>つか<\/rt><\/ruby>っている。<\/p><p class=\"lp\">- [Sustantivo +の / Adjetivo / Verbo en forma diccionario, en forma-て +いる o en forma-ない] + うちに + Cláusula Principal<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar que, mientras se mantiene una situación determinada, se produce algún cambio de forma gradual o sin que se de cuenta.)<\/p><p class=\"lp\"><ruby>留守<rt>るす<\/rt><\/ruby>のうちに、<ruby>郵便受<rt>ゆうびんう<\/rt><\/ruby>けがあふれていた。 ・ マッサージをけ、<ruby>気持<rt>きも<\/rt><\/ruby>ちがいいうちに、<ruby>眠<rt>ねむ<\/rt><\/ruby>ってしまった。<\/p><p class=\"lp\"><ruby>住<rt>す<\/rt><\/ruby>んでいるうちに、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>覚<rt>おぼ<\/rt><\/ruby>えるだろう。 ・ しばらくわないうちに、<ruby>彼女<rt>かのじょ<\/rt><\/ruby>はきれいになりました。<\/p><p class=\"lp\">- [Sustantivo +の / Adjetivo / Verbo en forma diccionario, en forma-て +いる o en forma-ない] + うちに + Cláusula Principal<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar la intención del hablante de que se debe hacer algo mientras persiste una determinada situación.  En el caso del Verbo en forma-ない, se expresa la intención de que se debe hacer algo antes de que se produzca la situación denotada por el verbo.  De todos modos, implica que, si se deja pasar ese plazo, es posible que ya no se pueda realizar esa acción o que se produzcan perjuicios.)<\/p><p class=\"lp\"><ruby>独身<rt>どくしん<\/rt><\/ruby>のうちに、たくさん<ruby>遊<rt>あそ<\/rt><\/ruby>んでおきたい。 ・ 　　<ruby>天気<rt>てんき<\/rt><\/ruby>がいいうちに、<ruby>洗濯<rt>せんたく<\/rt><\/ruby>を<ruby>済<rt>す<\/rt><\/ruby>ませましょう。<\/p><p class=\"lp\">スープがかいうちに、どうぞ<ruby>飲<rt>の<\/rt><\/ruby>んでください。　　スープがめないうちに、どうぞ<ruby>飲<rt>の<\/rt><\/ruby>んでください。<\/p><p class=\"lp\"><ruby>桜<rt>さくら<\/rt><\/ruby>がいているうちにお<ruby>花見<rt>はなみ<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>きたかった。 ・ 　　<ruby>雨<rt>あめ<\/rt><\/ruby>がらないうちに、<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>帰<rt>かえ<\/rt><\/ruby>りましょう。<\/p><p class=\"lp\">- Verbo en forma diccionario +か + Verbo en forma-ない +か + の + うちに + Cláusula Principal<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar el significado de “en cuanto...”, enfatizando que el evento denotado en la Cláusula Principal ocurre poco después de la acción del Verbo antes de &quot;うちに&quot; o casi al mismo tiempo.  Como esta estructura se utiliza para cosas que ya han ocurrido, la Cláusula Principal siempre va con un verbo en forma-た, es decir, en forma pretérito.)<\/p><p class=\"lp\"><ruby>駅<rt>えき<\/rt><\/ruby>に<ruby>着<rt>つ<\/rt><\/ruby>くか<ruby>着<rt>つ<\/rt><\/ruby>かないかのうちに<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>り<ruby>出<rt>で<\/rt><\/ruby>した。　　<ruby>食<rt>た<\/rt><\/ruby>べおわ<ruby>終<rt>おわり<\/rt><\/ruby>わるかおわ<ruby>終<rt>おわり<\/rt><\/ruby>わらないかのうちに、<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>料理<rt>りょうり<\/rt><\/ruby>が<ruby>来<rt>き<\/rt><\/ruby>た。<\/p><p class=\"lp\"><ruby>布団<rt>ふとん<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>るか<ruby>入<rt>はい<\/rt><\/ruby>らないかのうちに<ruby>寝<rt>ね<\/rt><\/ruby>てしまった。　お<ruby>年寄<rt>としよ<\/rt><\/ruby>りが<ruby>座<rt>すわ<\/rt><\/ruby>るか<ruby>座<rt>すわ<\/rt><\/ruby>らないかのうちに、バスが<ruby>発車<rt>はっしゃ<\/rt><\/ruby>した。<\/p>","text":"「うち」の色々いろいろな使しい方ほう - [Sustantivo +の / Adjetivo / Verbo en forma sencilla] + うち + は/が/に/を/で/の/・・・(“うち” es un sustantivo que designa la casa.  Cuando se refiere a la casa de otra persona en el lenguaje coloquial, a veces se utiliza la forma abreviada “〜んち”, como en “おばあちゃんち” o “山田やまだんち”.  Cuando se habla de la casa de una persona del mayor rango, es más cortés usar “お宅おたく” que “うち”.  Depende del contexto, “うち” puede designar el grupo que pertenece el hablante.)わたし私わたくしのうちは横浜市よこはまし青葉区あおばくにあります。 ・  ・ 　　スーパーのに新あたらしいうちが建たちました。あのの上うえにあるうちに、雷かみなりが落おちたらしい。 ・ 　　田中たなかさんがんでいたうちを買かいました。うちのメニューはラーメンだけです。 ・  ・ 　　うちの従業員じゅうぎょういんはみんな会計かいけいの資格しかくを持もっています。- Sustantivo (Numérico o Colectivo) +の + うち(で)(“〜のうち(で)” se utiliza como sustantivo para indicar un rango específico y se emplea cuando se extrae una parte del conjunto al que se refiere “〜”.  Tiene un significado similar al de “〜の中なかで”.)家族かぞくのうちで、運転うんてんできるのはわたし私わたくしだけです。 ・ 　　外国人がいこくじん観光客かんこうきゃく10人にんのうち、8人にんはを訪おとずれる。全都道府県ぜんとどうふけんのうちで、8つのには海うみがない。 ・ 　　このクラスのうち、５割わりがiPhoneを使つかっている。- [Sustantivo +の / Adjetivo / Verbo en forma diccionario, en forma-て +いる o en forma-ない] + うちに + Cláusula Principal(Esta expresión se utiliza para indicar que, mientras se mantiene una situación determinada, se produce algún cambio de forma gradual o sin que se de cuenta.)留守るすのうちに、郵便受ゆうびんうけがあふれていた。 ・ マッサージをけ、気持きもちがいいうちに、眠ねむってしまった。住すんでいるうちに、日本にっぽん語ごを覚おぼえるだろう。 ・ しばらくわないうちに、彼女かのじょはきれいになりました。- [Sustantivo +の / Adjetivo / Verbo en forma diccionario, en forma-て +いる o en forma-ない] + うちに + Cláusula Principal(Esta expresión se utiliza para indicar la intención del hablante de que se debe hacer algo mientras persiste una determinada situación.  En el caso del Verbo en forma-ない, se expresa la intención de que se debe hacer algo antes de que se produzca la situación denotada por el verbo.  De todos modos, implica que, si se deja pasar ese plazo, es posible que ya no se pueda realizar esa acción o que se produzcan perjuicios.)独身どくしんのうちに、たくさん遊あそんでおきたい。 ・ 　　天気てんきがいいうちに、洗濯せんたくを済すませましょう。スープがかいうちに、どうぞ飲のんでください。　　スープがめないうちに、どうぞ飲のんでください。桜さくらがいているうちにお花見はなみに行いきたかった。 ・ 　　雨あめがらないうちに、早はやく帰かえりましょう。- Verbo en forma diccionario +か + Verbo en forma-ない +か + の + うちに + Cláusula Principal(Esta expresión se utiliza para indicar el significado de “en cuanto...”, enfatizando que el evento denotado en la Cláusula Principal ocurre poco después de la acción del Verbo antes de &quot;うちに&quot; o casi al mismo tiempo.  Como esta estructura se utiliza para cosas que ya han ocurrido, la Cláusula Principal siempre va con un verbo en forma-た, es decir, en forma pretérito.)駅えきに着つくか着つかないかのうちに雨あめが降ふり出でした。　　食たべおわ終おわりわるかおわ終おわりわらないかのうちに、次つぎの料理りょうりが来きた。布団ふとんに入はいるか入はいらないかのうちに寝ねてしまった。　お年寄としよりが座すわるか座すわらないかのうちに、バスが発車はっしゃした。"},{"id":"L041","file":"20260730_Comparacion__AIDA__UCHI__TOCHU_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「あいだ」「うち」「途中」の違い","titleRuby":"「あいだ」「うち」「<ruby>途中<rt>とちゅう<\/rt><\/ruby>」の<ruby>違<rt>い<\/rt><\/ruby>い","html":"<p class=\"lp\">Las expresiones “〜あいだ (に)”, “〜うちに” y “〜<ruby>途中<rt>とちゅう<\/rt><\/ruby> (に/で)” se utilizan para indicar que algo ocurre o se hace durante un determinado periodo de tiempo, formando las cláusulas compuestas.  Sin embargo, cada una de ellas tiene un matiz distinto.<\/p><p class=\"lp\">- “〜あいだ (に)”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">“あいだ” se refiere al periodo total durante el cual se mantiene un estado o una acción y transmite una sensación de continuidad.  Cuando el estado o la acción expresada en la Cláusula Principal continua o se repite durante el periodo total de la la Cláusula Subordinada, la Cláusula Subordinada termina con “あいだ”.  En cambio, cuando el estado o la acción expresada en la Cláusula Principal ocurre una vez en algún momento o durante un periodo más corto que el de la la Cláusula Subordinada, la Cláusula Subordinada termina con “あいだに”.<\/p><p class=\"lp\">- Regla de conexión a “あいだ (に)”<\/p><p class=\"lp\">“あいだ (に)” viene después de a) Verbo: en forma diccionario o en forma-て +いる, b) Adjetivo tipo-い: en forma diccionario, c) Adjetivo tipo-な: en forma diccionario, y d) Sustantivo: agregandoの.<\/p><p class=\"lp\"><ruby>夏休<rt>なつやす<\/rt><\/ruby>みのあいだ、<ruby>毎日<rt>まいにち<\/rt><\/ruby>プールに<ruby>行<rt>い<\/rt><\/ruby>きました。 ・ <ruby>夏休<rt>なつやす<\/rt><\/ruby>みのあいだに、<ruby>一度<rt>いちど<\/rt><\/ruby>プールに<ruby>行<rt>い<\/rt><\/ruby>きたい。<\/p><p class=\"lp\"><ruby>暑<rt>あつ<\/rt><\/ruby>いあいだ、クーラーをつけっぱなしにする。 ・ <ruby>暑<rt>あつ<\/rt><\/ruby>いあいだにクーラーが<ruby>壊<rt>こわ<\/rt><\/ruby>れて、<ruby>買<rt>か<\/rt><\/ruby>い<ruby>換<rt>か<\/rt><\/ruby>えました。<\/p><p class=\"lp\"><ruby>夫<rt>おっと<\/rt><\/ruby>がを<ruby>見<rt>み<\/rt><\/ruby>ているあいだ、わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は<ruby>料理<rt>りょうり<\/rt><\/ruby>をしていた。　　<ruby>夫<rt>おっと<\/rt><\/ruby>がを<ruby>見<rt>み<\/rt><\/ruby>ているあいだに、わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は<ruby>料理<rt>りょうり<\/rt><\/ruby>をした。<\/p><p class=\"lp\">マラソンをっているあいだ、<ruby>足<rt>あし<\/rt><\/ruby>が<ruby>痛<rt>いた<\/rt><\/ruby>かった。 ・ 　　マラソンをっているあいだに、<ruby>足<rt>あし<\/rt><\/ruby>が<ruby>痛<rt>いた<\/rt><\/ruby>くなった。<\/p><p class=\"lp\">- “〜うちに”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">“うち” significa originalmente “interior” y tiene un matiz que denota “dentro de un determinado ámbito” o “mientras se permanece en ese estado”. La expresión “うちに” transmite la idea de que “ahora que esa situación de la Cláusula Subordinada persiste es el momento oportuno para hacer la acción descrita en la Cláusula Principal”.  En su uso general, existen dos acepciones: a) “Antes de que la situación cambie o termine” y b) “A medida que la situación continua o cambia de forma natural”, siendo la última similar a “あいだに”, y a menudo se puede usar cualquiera de las dos.  Sin embargo, “うちに” transmite más la sensación de que “lo descrito en la Cláusula Principal ya había ocurrido sin que se diera cuenta”.<\/p><p class=\"lp\">- Regla de conexión a “うちに”<\/p><p class=\"lp\">“うちに” viene después de a) Verbo: en forma diccionario, en forma-て +いる o en forma-ない, b) Adjetivo tipo-い: en forma diccionario, c) Adjetivo tipo-な: en forma diccionario, y d) Sustantivo: agregandoの.<\/p><p class=\"lp\"><ruby>夏休<rt>なつやす<\/rt><\/ruby>みのうちに<ruby>海外<rt>かいがい<\/rt><\/ruby><ruby>旅行<rt>りょこう<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>くつもりだ。 ・ 　　<ruby>若<rt>わか<\/rt><\/ruby>いうちに<ruby>外国語<rt>がいこくご<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>したほうがいい。<\/p><p class=\"lp\"><ruby>両親<rt>りょうしん<\/rt><\/ruby>がなうちに、たくさん<ruby>旅行<rt>りょこう<\/rt><\/ruby>したい。 ・ 　　<ruby>暗<rt>くら<\/rt><\/ruby>くならないうちに、<ruby>家<rt>いえ<\/rt><\/ruby>に<ruby>帰<rt>かえ<\/rt><\/ruby>りましょう。<\/p><p class=\"lp\"><ruby>夫<rt>おっと<\/rt><\/ruby>がを<ruby>見<rt>み<\/rt><\/ruby>ているうちに、わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は<ruby>料理<rt>りょうり<\/rt><\/ruby>をした。 ・ 　　マラソンをっているうちに、<ruby>足<rt>あし<\/rt><\/ruby>が<ruby>痛<rt>いた<\/rt><\/ruby>くなった。<\/p><p class=\"lp\">- “〜<ruby>途中<rt>とちゅう<\/rt><\/ruby> (に/で)”<\/p><p class=\"lp\">- Método de uso<\/p><p class=\"lp\">“<ruby>途中<rt>とちゅう<\/rt><\/ruby>” se refiere a un momento o lugar concreto dentro de un periodo de tiempo, un desplazamiento o una tarea en los que el punto de partida y el punto de llegada están claramente definidos.  Cuando se enfoca en una ubicación o un hecho referido en la Cláusula Principal en la mitad de desplazamiento o periodo de tiempo en la Cláusula Subordinada, la Cláusula Subordinada termina con “<ruby>途中<rt>とちゅう<\/rt><\/ruby>” o “<ruby>途中<rt>とちゅう<\/rt><\/ruby>に”.  En cambio, cuando se expresa que “ocurre o se hace lo indicado en la Cláusula Principal en el transcurso de que se realiza una acción o un desplazamiento indicado en la Cláusula Subordinada”, la Cláusula Subordinada termina con “<ruby>途中<rt>とちゅう<\/rt><\/ruby>” o “<ruby>途中<rt>とちゅう<\/rt><\/ruby>で”.<\/p><p class=\"lp\">- Regla de conexión a “<ruby>途中<rt>とちゅう<\/rt><\/ruby> (に/で)”<\/p><p class=\"lp\">“<ruby>途中<rt>とちゅう<\/rt><\/ruby> (に/で)” viene después de a) Verbo: en forma diccionario o en forma-て +いる, y b) Sustantivo: agregandoの.<\/p><p class=\"lp\"><ruby>夏休<rt>なつやす<\/rt><\/ruby>みの<ruby>途中<rt>とちゅう<\/rt><\/ruby>に<ruby>大<rt>おお<\/rt><\/ruby>きな<ruby>地震<rt>じしん<\/rt><\/ruby>があった。 ・  ・ 　　<ruby>夏休<rt>なつやす<\/rt><\/ruby>みの<ruby>途中<rt>とちゅう<\/rt><\/ruby>で<ruby>彼<rt>かれ<\/rt><\/ruby>はイギリスに<ruby>帰<rt>かえ<\/rt><\/ruby>ってしまった。<\/p><p class=\"lp\"><ruby>坂<rt>さか<\/rt><\/ruby>を<ruby>上<rt>のぼ<\/rt><\/ruby>る<ruby>途中<rt>とちゅう<\/rt><\/ruby>に<ruby>有名<rt>ゆうめい<\/rt><\/ruby>なレストランがあります。 ・ 　　<ruby>坂<rt>さか<\/rt><\/ruby>を<ruby>上<rt>のぼ<\/rt><\/ruby>る<ruby>途中<rt>とちゅう<\/rt><\/ruby>で<ruby>有名<rt>ゆうめい<\/rt><\/ruby>なレストランに<ruby>入<rt>はい<\/rt><\/ruby>りました。<\/p><p class=\"lp\"><ruby>夫<rt>おっと<\/rt><\/ruby>が<ruby>映画<rt>えいが<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>ている<ruby>途中<rt>とちゅう<\/rt><\/ruby>に、わたし<ruby>私<rt>わたくし<\/rt><\/ruby>は<ruby>料理<rt>りょうり<\/rt><\/ruby>をした。 ・ 　　マラソンを<ruby>走<rt>はし<\/rt><\/ruby>っている<ruby>途中<rt>とちゅう<\/rt><\/ruby>で、<ruby>足<rt>あし<\/rt><\/ruby>が<ruby>痛<rt>いた<\/rt><\/ruby>くなった。<\/p>","text":"「あいだ」「うち」「途中とちゅう」の違いい Las expresiones “〜あいだ (に)”, “〜うちに” y “〜途中とちゅう (に/で)” se utilizan para indicar que algo ocurre o se hace durante un determinado periodo de tiempo, formando las cláusulas compuestas.  Sin embargo, cada una de ellas tiene un matiz distinto.- “〜あいだ (に)”- Método de uso“あいだ” se refiere al periodo total durante el cual se mantiene un estado o una acción y transmite una sensación de continuidad.  Cuando el estado o la acción expresada en la Cláusula Principal continua o se repite durante el periodo total de la la Cláusula Subordinada, la Cláusula Subordinada termina con “あいだ”.  En cambio, cuando el estado o la acción expresada en la Cláusula Principal ocurre una vez en algún momento o durante un periodo más corto que el de la la Cláusula Subordinada, la Cláusula Subordinada termina con “あいだに”.- Regla de conexión a “あいだ (に)”“あいだ (に)” viene después de a) Verbo: en forma diccionario o en forma-て +いる, b) Adjetivo tipo-い: en forma diccionario, c) Adjetivo tipo-な: en forma diccionario, y d) Sustantivo: agregandoの.夏休なつやすみのあいだ、毎日まいにちプールに行いきました。 ・ 夏休なつやすみのあいだに、一度いちどプールに行いきたい。暑あついあいだ、クーラーをつけっぱなしにする。 ・ 暑あついあいだにクーラーが壊こわれて、買かい換かえました。夫おっとがを見みているあいだ、わたし私わたくしは料理りょうりをしていた。　　夫おっとがを見みているあいだに、わたし私わたくしは料理りょうりをした。マラソンをっているあいだ、足あしが痛いたかった。 ・ 　　マラソンをっているあいだに、足あしが痛いたくなった。- “〜うちに”- Método de uso“うち” significa originalmente “interior” y tiene un matiz que denota “dentro de un determinado ámbito” o “mientras se permanece en ese estado”. La expresión “うちに” transmite la idea de que “ahora que esa situación de la Cláusula Subordinada persiste es el momento oportuno para hacer la acción descrita en la Cláusula Principal”.  En su uso general, existen dos acepciones: a) “Antes de que la situación cambie o termine” y b) “A medida que la situación continua o cambia de forma natural”, siendo la última similar a “あいだに”, y a menudo se puede usar cualquiera de las dos.  Sin embargo, “うちに” transmite más la sensación de que “lo descrito en la Cláusula Principal ya había ocurrido sin que se diera cuenta”.- Regla de conexión a “うちに”“うちに” viene después de a) Verbo: en forma diccionario, en forma-て +いる o en forma-ない, b) Adjetivo tipo-い: en forma diccionario, c) Adjetivo tipo-な: en forma diccionario, y d) Sustantivo: agregandoの.夏休なつやすみのうちに海外かいがい旅行りょこうに行いくつもりだ。 ・ 　　若わかいうちに外国語がいこくごを勉強べんきょうしたほうがいい。両親りょうしんがなうちに、たくさん旅行りょこうしたい。 ・ 　　暗くらくならないうちに、家いえに帰かえりましょう。夫おっとがを見みているうちに、わたし私わたくしは料理りょうりをした。 ・ 　　マラソンをっているうちに、足あしが痛いたくなった。- “〜途中とちゅう (に/で)”- Método de uso“途中とちゅう” se refiere a un momento o lugar concreto dentro de un periodo de tiempo, un desplazamiento o una tarea en los que el punto de partida y el punto de llegada están claramente definidos.  Cuando se enfoca en una ubicación o un hecho referido en la Cláusula Principal en la mitad de desplazamiento o periodo de tiempo en la Cláusula Subordinada, la Cláusula Subordinada termina con “途中とちゅう” o “途中とちゅうに”.  En cambio, cuando se expresa que “ocurre o se hace lo indicado en la Cláusula Principal en el transcurso de que se realiza una acción o un desplazamiento indicado en la Cláusula Subordinada”, la Cláusula Subordinada termina con “途中とちゅう” o “途中とちゅうで”.- Regla de conexión a “途中とちゅう (に/で)”“途中とちゅう (に/で)” viene después de a) Verbo: en forma diccionario o en forma-て +いる, y b) Sustantivo: agregandoの.夏休なつやすみの途中とちゅうに大おおきな地震じしんがあった。 ・  ・ 　　夏休なつやすみの途中とちゅうで彼かれはイギリスに帰かえってしまった。坂さかを上のぼる途中とちゅうに有名ゆうめいなレストランがあります。 ・ 　　坂さかを上のぼる途中とちゅうで有名ゆうめいなレストランに入はいりました。夫おっとが映画えいがを見みている途中とちゅうに、わたし私わたくしは料理りょうりをした。 ・ 　　マラソンを走はしっている途中とちゅうで、足あしが痛いたくなった。"},{"id":"L042","file":"20260730_Verbos_Auxiliares__3_.docx","cat":"vaux","catLabel":"Verbos auxiliares","title":"補助動詞・Verbos Auxiliares (3)","titleRuby":"<ruby>補助<rt>ほじょ<\/rt><\/ruby><ruby>動詞<rt>どうし<\/rt><\/ruby>・Verbos Auxiliares (3)","html":"<div class=\"ltable\"><\/div><div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Verbo volitivo en forma-て+もらう/もらいます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significa que alguien hace algo por el hablante que conlleva un sentimiento de agradecimiento o alegría por la acción del sujeto.<\/span><span class=\"jp\">Denota el favor que se recibe el sujeto cuando alguien hace algo por él. Es la otra persona la que actúa, y el sujeto es quien se beneficia de esa acción.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\"><ruby>友達<rt>ともだち<\/rt><\/ruby>がの<ruby>引越<rt>ひっこし<\/rt><\/ruby>を<ruby>手伝<rt>てつだ<\/rt><\/ruby>ってくれました。 <ruby>大学<rt>だいがく<\/rt><\/ruby>のがにほんご<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>教<rt>おし<\/rt><\/ruby>えてくださいます。<\/span><span class=\"jp\">そのは<ruby>母<rt>はは<\/rt><\/ruby><ruby>親<rt>おや<\/rt><\/ruby>に<ruby>学校<rt>がっこう<\/rt><\/ruby>へ<ruby>車<rt>くるま<\/rt><\/ruby>で<ruby>送<rt>おく<\/rt><\/ruby>ってもらった。 <ruby>大学<rt>だいがく<\/rt><\/ruby>のににほんご<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>教<rt>おし<\/rt><\/ruby>えていただきます。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota 5<\/span><span class=\"jp\">Nota 6<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo volitivo en forma-て+やる/やります<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significa que alguien hace algo por el hablante que conlleva un sentimiento de agradecimiento o alegría por la acción del sujeto.<\/span><span class=\"jp\">Significa hacer algo por alguien de menor rango que el hablante, como niños, animales, plantas u objetos.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\"><ruby>友達<rt>ともだち<\/rt><\/ruby>がの<ruby>引越<rt>ひっこし<\/rt><\/ruby>を<ruby>手伝<rt>てつだ<\/rt><\/ruby>ってくれました。 <ruby>大学<rt>だいがく<\/rt><\/ruby>のがにほんご<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>教<rt>おし<\/rt><\/ruby>えてくださいます。<\/span><span class=\"jp\">あした<ruby>明日<rt>あす<\/rt><\/ruby>はどもと<ruby>公園<rt>こうえん<\/rt><\/ruby>で<ruby>遊<rt>あそ<\/rt><\/ruby>んでやるつもりだ。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota 5<\/span><span class=\"jp\">Nota 7<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo volitivo en forma-て+やる/やります<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significa que alguien hace algo por el hablante que conlleva un sentimiento de agradecimiento o alegría por la acción del sujeto.<\/span><span class=\"jp\">Expresa con firmeza los propios sentimientos &quot;te demostraré que lo haré&quot;, con tono de &quot;descargar las emociones&quot; y &quot;frustración, ira o un fuerte deseo&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\"><ruby>友達<rt>ともだち<\/rt><\/ruby>がの<ruby>引越<rt>ひっこし<\/rt><\/ruby>を<ruby>手伝<rt>てつだ<\/rt><\/ruby>ってくれました。 <ruby>大学<rt>だいがく<\/rt><\/ruby>のがにほんご<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>教<rt>おし<\/rt><\/ruby>えてくださいます。<\/span><span class=\"jp\"><ruby>来年<rt>らいねん<\/rt><\/ruby>こそは<ruby>大学<rt>だいがく<\/rt><\/ruby>に<ruby>必<rt>かなら<\/rt><\/ruby>ず<ruby>合格<rt>ごうかく<\/rt><\/ruby>してやる。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo volitivo en forma-て+あげる/あげます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significa que alguien hace algo por el hablante que conlleva un sentimiento de agradecimiento o alegría por la acción del sujeto.<\/span><span class=\"jp\">Significa que el sujeto o alguien de su entorno hace favor por la otra persona. Se trata de un favor desde el punto de vista del sujeto.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\"><ruby>友達<rt>ともだち<\/rt><\/ruby>がの<ruby>引越<rt>ひっこし<\/rt><\/ruby>を<ruby>手伝<rt>てつだ<\/rt><\/ruby>ってくれました。 <ruby>大学<rt>だいがく<\/rt><\/ruby>のがにほんご<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>教<rt>おし<\/rt><\/ruby>えてくださいます。<\/span><span class=\"jp\"><ruby>外国<rt>がいこく<\/rt><\/ruby>じん<ruby>人<rt>ひと<\/rt><\/ruby>にまでの<ruby>道<rt>みち<\/rt><\/ruby>を<ruby>教<rt>おし<\/rt><\/ruby>えてあげました。 おりに<ruby>席<rt>せき<\/rt><\/ruby>を<ruby>譲<rt>ゆず<\/rt><\/ruby>ってさしあげました。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota 5<\/span><span class=\"jp\">Nota 8<\/span><\/div><\/div><\/div><p class=\"lnote\">Nota 5:  En las expresiones honoríficas (expresiones respetuosas), &quot;〜てくれる&quot; y &quot;〜てくれます&quot; se convierten en &quot;〜てくださる&quot; y &quot;〜てくださいます&quot;.<\/p><p class=\"lnote\">Nota 6:  En las expresiones honoríficas (expresiones humildes), &quot;〜てもらう&quot; y &quot;〜てもらいます&quot; se convierten en &quot;〜ていただく&quot; y &quot;〜ていただきます&quot;.<\/p><p class=\"lnote\">Nota 7:  Tiene un tono más informal y un poco más brusco que &quot;〜てあげる&quot;.<\/p><p class=\"lnote\">Nota 8:  En las expresiones honoríficas (expresiones humildes), &quot;〜てあげる&quot; y &quot;〜てあげます&quot; se convierten en &quot;〜てさしあげる&quot; y &quot;〜てさしあげます&quot;.<\/p>","text":"補助ほじょ動詞どうし・Verbos Auxiliares (3) Verbo volitivo en forma-て+もらう/もらいますSignifica que alguien hace algo por el hablante que conlleva un sentimiento de agradecimiento o alegría por la acción del sujeto.Denota el favor que se recibe el sujeto cuando alguien hace algo por él. Es la otra persona la que actúa, y el sujeto es quien se beneficia de esa acción.友達ともだちがの引越ひっこしを手伝てつだってくれました。 大学だいがくのがにほんご日本にっぽん語ごを教おしえてくださいます。そのは母はは親おやに学校がっこうへ車くるまで送おくってもらった。 大学だいがくのににほんご日本にっぽん語ごを教おしえていただきます。Nota 5Nota 6Verbo volitivo en forma-て+やる/やりますSignifica que alguien hace algo por el hablante que conlleva un sentimiento de agradecimiento o alegría por la acción del sujeto.Significa hacer algo por alguien de menor rango que el hablante, como niños, animales, plantas u objetos.友達ともだちがの引越ひっこしを手伝てつだってくれました。 大学だいがくのがにほんご日本にっぽん語ごを教おしえてくださいます。あした明日あすはどもと公園こうえんで遊あそんでやるつもりだ。Nota 5Nota 7Verbo volitivo en forma-て+やる/やりますSignifica que alguien hace algo por el hablante que conlleva un sentimiento de agradecimiento o alegría por la acción del sujeto.Expresa con firmeza los propios sentimientos &quot;te demostraré que lo haré&quot;, con tono de &quot;descargar las emociones&quot; y &quot;frustración, ira o un fuerte deseo&quot;.友達ともだちがの引越ひっこしを手伝てつだってくれました。 大学だいがくのがにほんご日本にっぽん語ごを教おしえてくださいます。来年らいねんこそは大学だいがくに必かならず合格ごうかくしてやる。Verbo volitivo en forma-て+あげる/あげますSignifica que alguien hace algo por el hablante que conlleva un sentimiento de agradecimiento o alegría por la acción del sujeto.Significa que el sujeto o alguien de su entorno hace favor por la otra persona. Se trata de un favor desde el punto de vista del sujeto.友達ともだちがの引越ひっこしを手伝てつだってくれました。 大学だいがくのがにほんご日本にっぽん語ごを教おしえてくださいます。外国がいこくじん人ひとにまでの道みちを教おしえてあげました。 おりに席せきを譲ゆずってさしあげました。Nota 5Nota 8Nota 5:  En las expresiones honoríficas (expresiones respetuosas), &quot;〜てくれる&quot; y &quot;〜てくれます&quot; se convierten en &quot;〜てくださる&quot; y &quot;〜てくださいます&quot;.Nota 6:  En las expresiones honoríficas (expresiones humildes), &quot;〜てもらう&quot; y &quot;〜てもらいます&quot; se convierten en &quot;〜ていただく&quot; y &quot;〜ていただきます&quot;.Nota 7:  Tiene un tono más informal y un poco más brusco que &quot;〜てあげる&quot;.Nota 8:  En las expresiones honoríficas (expresiones humildes), &quot;〜てあげる&quot; y &quot;〜てあげます&quot; se convierten en &quot;〜てさしあげる&quot; y &quot;〜てさしあげます&quot;."},{"id":"L043","file":"20260730__TOCHU_.docx","cat":"tiempo","catLabel":"Tiempo y momento","title":"「途中（とちゅう）」の使い方","titleRuby":"「<ruby>途中<rt>とちゅう<\/rt><\/ruby>」の<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- <ruby>途中<rt>とちゅう<\/rt><\/ruby> (とちゅう)<\/p><p class=\"lp\">(“<ruby>途中<rt>とちゅう<\/rt><\/ruby> (とちゅう)” se utiliza como un sustantivo que designa “la parte comprendida entre el inicio y el final de un lugar o una acción” o “el trayecto o el camino hacia algún lugar”.  Se utiliza tanto para referirse al trayecto de un desplazamiento como a la mitad de una acción.)<\/p><p class=\"lp\"><ruby>看板<rt>かんばん<\/rt><\/ruby>のが<ruby>汚<rt>よご<\/rt><\/ruby>れていて<ruby>読<rt>よ<\/rt><\/ruby>めない。　　 ・  ・ <ruby>借<rt>か<\/rt><\/ruby>りたはまだ<ruby>読<rt>よ<\/rt><\/ruby>んでいる<ruby>途中<rt>とちゅう<\/rt><\/ruby>です。<\/p><p class=\"lp\"><ruby>途中<rt>とちゅう<\/rt><\/ruby>ので<ruby>降<rt>お<\/rt><\/ruby>りて<ruby>飲<rt>の<\/rt><\/ruby>み<ruby>物<rt>もの<\/rt><\/ruby>を<ruby>買<rt>か<\/rt><\/ruby>った。 ・  ・ レポートをまで<ruby>書<rt>か<\/rt><\/ruby>いたが、<ruby>期限<rt>きげん<\/rt><\/ruby>に<ruby>間<rt>ま<\/rt><\/ruby>に<ruby>合<rt>あ<\/rt><\/ruby>わなかった。<\/p><p class=\"lp\">- [Sustantivo +の / Verbo en forma diccionario o en forma-て +いる] + <ruby>途中<rt>とちゅう<\/rt><\/ruby> (とちゅう) (+に) + Cláusula Principal<\/p><p class=\"lp\">(Se suele utilizar para indicar una ubicación o un hecho en la mitad de periodo del tiempo o desplazamiento, enfocando en un “momento concreto” o un “periodo” de tiempo de una acción o un estado.  Aunque la Cláusula Principal esté en pretérito o no pretérito, el verbo que precede a “<ruby>途中<rt>とちゅう<\/rt><\/ruby>” se utiliza en forma diccionario o en forma-て +いる.  La partícula “に” antes de la Cláusula Principal se puede omitir.)<\/p><p class=\"lp\"><ruby>会議<rt>かいぎ<\/rt><\/ruby>の<ruby>途中<rt>とちゅう<\/rt><\/ruby> (に)、<ruby>電話<rt>でんわ<\/rt><\/ruby>が<ruby>鳴<rt>な<\/rt><\/ruby>り<ruby>始<rt>はじ<\/rt><\/ruby>めた。 ・ <ruby>東京<rt>とうきょう<\/rt><\/ruby>との<ruby>途中<rt>とちゅう<\/rt><\/ruby>にある<ruby>町<rt>まち<\/rt><\/ruby>で<ruby>一泊<rt>いっぱく<\/rt><\/ruby>しました。<\/p><p class=\"lp\"><ruby>家<rt>いえ<\/rt><\/ruby>にる<ruby>途中<rt>とちゅう<\/rt><\/ruby> (に)、いつも<ruby>吠<rt>ほ<\/rt><\/ruby>える<ruby>犬<rt>いぬ<\/rt><\/ruby>がいる。 ・ <ruby>散歩<rt>さんぽ<\/rt><\/ruby>をしている (に)、が<ruby>降<rt>ふ<\/rt><\/ruby>ってきた。<\/p><p class=\"lp\">- [Sustantivo +の / Verbo en forma diccionario o en forma-て +いる]+ <ruby>途中<rt>とちゅう<\/rt><\/ruby> (とちゅう) (+で) + Cláusula Principal<\/p><p class=\"lp\">(Se utiliza para expresar que, mientras que se realiza una acción o un desplazamiento indicado por el Sustantivo o Verbo que precede a “<ruby>途中<rt>とちゅう<\/rt><\/ruby>”, ocurre o se hace lo indicado en la Cláusula Principal.  Es una imagen en la que, en el transcurso de una acción, se pasa por un lugar o una situación determinados y, a continuación, se produce otra acción.  Aunque la Cláusula Principal esté en pretérito o no pretérito, el verbo que precede a “<ruby>途中<rt>とちゅう<\/rt><\/ruby>” se utiliza en forma diccionario en el caso de un desplazamiento,, y el verbo que precede a “<ruby>途中<rt>とちゅう<\/rt><\/ruby>” se utiliza en forma-て +いる en el caso de una acción.  En ambos casos, la partícula “で” se puede omitir.)<\/p><p class=\"lp\"><ruby>掃除<rt>そうじ<\/rt><\/ruby>の<ruby>途中<rt>とちゅう<\/rt><\/ruby> (で)、<ruby>昔<rt>むかし<\/rt><\/ruby>の<ruby>写真<rt>しゃしん<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>つけました。 ・ <ruby>話<rt>はなし<\/rt><\/ruby>の<ruby>途中<rt>とちゅう<\/rt><\/ruby> (で)、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>急<rt>きゅう<\/rt><\/ruby>に<ruby>電話<rt>でんわ<\/rt><\/ruby>を<ruby>切<rt>き<\/rt><\/ruby>ってしまいました。<\/p><p class=\"lp\"><ruby>会社<rt>かいしゃ<\/rt><\/ruby>へ<ruby>向<rt>む<\/rt><\/ruby>かう<ruby>途中<rt>とちゅう<\/rt><\/ruby> (で)、<ruby>財布<rt>さいふ<\/rt><\/ruby>を<ruby>落<rt>お<\/rt><\/ruby>とした。 ・ <ruby>映画<rt>えいが<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>ている<ruby>途中<rt>とちゅう<\/rt><\/ruby> (で)、<ruby>眠<rt>ねむ<\/rt><\/ruby>くなってしまいました。<\/p>","text":"「途中とちゅう」の使しい方ほう - 途中とちゅう (とちゅう)(“途中とちゅう (とちゅう)” se utiliza como un sustantivo que designa “la parte comprendida entre el inicio y el final de un lugar o una acción” o “el trayecto o el camino hacia algún lugar”.  Se utiliza tanto para referirse al trayecto de un desplazamiento como a la mitad de una acción.)看板かんばんのが汚よごれていて読よめない。　　 ・  ・ 借かりたはまだ読よんでいる途中とちゅうです。途中とちゅうので降おりて飲のみ物ものを買かった。 ・  ・ レポートをまで書かいたが、期限きげんに間まに合あわなかった。- [Sustantivo +の / Verbo en forma diccionario o en forma-て +いる] + 途中とちゅう (とちゅう) (+に) + Cláusula Principal(Se suele utilizar para indicar una ubicación o un hecho en la mitad de periodo del tiempo o desplazamiento, enfocando en un “momento concreto” o un “periodo” de tiempo de una acción o un estado.  Aunque la Cláusula Principal esté en pretérito o no pretérito, el verbo que precede a “途中とちゅう” se utiliza en forma diccionario o en forma-て +いる.  La partícula “に” antes de la Cláusula Principal se puede omitir.)会議かいぎの途中とちゅう (に)、電話でんわが鳴なり始はじめた。 ・ 東京とうきょうとの途中とちゅうにある町まちで一泊いっぱくしました。家いえにる途中とちゅう (に)、いつも吠ほえる犬いぬがいる。 ・ 散歩さんぽをしている (に)、が降ふってきた。- [Sustantivo +の / Verbo en forma diccionario o en forma-て +いる]+ 途中とちゅう (とちゅう) (+で) + Cláusula Principal(Se utiliza para expresar que, mientras que se realiza una acción o un desplazamiento indicado por el Sustantivo o Verbo que precede a “途中とちゅう”, ocurre o se hace lo indicado en la Cláusula Principal.  Es una imagen en la que, en el transcurso de una acción, se pasa por un lugar o una situación determinados y, a continuación, se produce otra acción.  Aunque la Cláusula Principal esté en pretérito o no pretérito, el verbo que precede a “途中とちゅう” se utiliza en forma diccionario en el caso de un desplazamiento,, y el verbo que precede a “途中とちゅう” se utiliza en forma-て +いる en el caso de una acción.  En ambos casos, la partícula “で” se puede omitir.)掃除そうじの途中とちゅう (で)、昔むかしの写真しゃしんを見みつけました。 ・ 話はなしの途中とちゅう (で)、彼かれは急きゅうに電話でんわを切きってしまいました。会社かいしゃへ向むかう途中とちゅう (で)、財布さいふを落おとした。 ・ 映画えいがを見みている途中とちゅう (で)、眠ねむくなってしまいました。"},{"id":"L044","file":"20260806_Verbos_Compuestos__1_.docx","cat":"vcomp","catLabel":"Verbos compuestos","title":"複合動詞・Verbos Compuestos (1)","titleRuby":"<ruby>複合<rt>ふくごう<\/rt><\/ruby><ruby>動詞<rt>どうし<\/rt><\/ruby>・Verbos Compuestos (1)","html":"<p class=\"lp\">Un Verbo Compuesto es un verbo formado por la unión de dos o más palabras.  Los Verbos Compuestos se forman cuando varias palabras independientes se unen para crear un verbo con un nuevo significado o función.<\/p><p class=\"lp\">En los Verbos Compuestos que vemos abajo, el verbo que aparece en segundo lugar desempeña la función gramatical, y se trata de una estructura en la que el verbo posterior toma al verbo anterior como complemento.  En otras palabras, el verbo anterior puede actuar como sujeto o como objeto del verbo posterior.  En caso de “<ruby>食<rt>た<\/rt><\/ruby>べ<ruby>始<rt>はじ<\/rt><\/ruby>める”, significa “<ruby>食<rt>た<\/rt><\/ruby>べることを<ruby>始<rt>はじ<\/rt><\/ruby>める”, y en caso de “<ruby>食<rt>た<\/rt><\/ruby>べ<ruby>終<rt>お<\/rt><\/ruby>わる”, significa “<ruby>食<rt>た<\/rt><\/ruby>べることを<ruby>終<rt>お<\/rt><\/ruby>わる”, de modo que “<ruby>食<rt>た<\/rt><\/ruby>べる” actúa como objeto de “<ruby>始<rt>はじ<\/rt><\/ruby>める” y “<ruby>終<rt>お<\/rt><\/ruby>わる”.<\/p><div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>始<rt>はじ<\/rt><\/ruby>める/<ruby>始<rt>はじ<\/rt><\/ruby>めます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica el momento en que comienza la acción expresada por el verbo anterior. Se corresponde aproximadamente con &quot;empezar a hacerla&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>洗濯物<rt>せんたくもの<\/rt><\/ruby>をしているとき、<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>り<ruby>始<rt>はじ<\/rt><\/ruby>めた。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 1<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>出<rt>だ<\/rt><\/ruby>す/<ruby>出<rt>だ<\/rt><\/ruby>します<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Expresa que la acción expresada por el verbo anterior &quot;comienza de repente o a partir de un momento determinado&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>先生<rt>せんせい<\/rt><\/ruby>のクシャミでたちが<ruby>笑<rt>わら<\/rt><\/ruby>い<ruby>出<rt>だ<\/rt><\/ruby>した。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 1<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>続<rt>つづ<\/rt><\/ruby>ける/<ruby>続<rt>つづ<\/rt><\/ruby>けます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica que la acción expresada por el verbo anterior se prolonga durante mucho tiempo o continua sin parar.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>は２０も<ruby>同<rt>おな<\/rt><\/ruby>じ<ruby>会社<rt>かいしゃ<\/rt><\/ruby>で<ruby>働<rt>はたら<\/rt><\/ruby>き<ruby>続<rt>つづ<\/rt><\/ruby>けている。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 2<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>通<rt>とお<\/rt><\/ruby>す/<ruby>通<rt>とお<\/rt><\/ruby>します<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">significa continuar la acción expresada por el verbo anterior hasta el final sin interrumpirlo.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>何<rt>なに<\/rt><\/ruby>があっても、は<ruby>家族<rt>かぞく<\/rt><\/ruby>との<ruby>約束<rt>やくそく<\/rt><\/ruby>を<ruby>守<rt>まも<\/rt><\/ruby>り<ruby>通<rt>とお<\/rt><\/ruby>した。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 2<\/span><\/div><\/div><\/div><p class=\"lnote\">Nota 1: ・ &quot;Verbo+<ruby>始<rt>はじ<\/rt><\/ruby>める&quot; se utiliza para expresar con naturalidad el hecho de que &quot;esa acción o estado comienza a partir de un momento determinado&quot;.  Por otro lado, &quot;Verbo+<ruby>出<rt>だ<\/rt><\/ruby>す&quot; tiende a transmitir una sensación de &quot;de repente&quot;, &quot;de forma inesperada&quot; o &quot;por fin ha empezado a hacerlo&quot;.<\/p><p class=\"lnote\">Nota 2:  &quot;Verbo+<ruby>続<rt>つづ<\/rt><\/ruby>ける&quot; describe objetivamente que la acción &quot;continúa&quot;, y da la impresión de que, simplemente como hecho, &quot;se lleva haciendo desde hace tiempo&quot;. Por otro lado, &quot;Verbo+<ruby>通<rt>とお<\/rt><\/ruby>す&quot; enfatiza el hecho de &quot;mantener la voluntad y llegar hasta el final&quot; a pesar de las dificultades o la oposición, y a menudo incluye en cierta medida la valoración o los sentimientos del hablante.<\/p>","text":"複合ふくごう動詞どうし・Verbos Compuestos (1) Un Verbo Compuesto es un verbo formado por la unión de dos o más palabras.  Los Verbos Compuestos se forman cuando varias palabras independientes se unen para crear un verbo con un nuevo significado o función.En los Verbos Compuestos que vemos abajo, el verbo que aparece en segundo lugar desempeña la función gramatical, y se trata de una estructura en la que el verbo posterior toma al verbo anterior como complemento.  En otras palabras, el verbo anterior puede actuar como sujeto o como objeto del verbo posterior.  En caso de “食たべ始はじめる”, significa “食たべることを始はじめる”, y en caso de “食たべ終おわる”, significa “食たべることを終おわる”, de modo que “食たべる” actúa como objeto de “始はじめる” y “終おわる”.Verbo en forma-ます+始はじめる/始はじめますSignificadoIndica el momento en que comienza la acción expresada por el verbo anterior. Se corresponde aproximadamente con &quot;empezar a hacerla&quot;.Ejemplo de frase洗濯物せんたくものをしているとき、雨あめが降ふり始はじめた。NotaNota 1Verbo en forma-ます+出だす/出だしますSignificadoExpresa que la acción expresada por el verbo anterior &quot;comienza de repente o a partir de un momento determinado&quot;.Ejemplo de frase先生せんせいのクシャミでたちが笑わらい出だした。NotaNota 1Verbo en forma-ます+続つづける/続つづけますSignificadoIndica que la acción expresada por el verbo anterior se prolonga durante mucho tiempo o continua sin parar.Ejemplo de frase彼女かのじょは２０も同おなじ会社かいしゃで働はたらき続つづけている。NotaNota 2Verbo en forma-ます+通とおす/通とおしますSignificadosignifica continuar la acción expresada por el verbo anterior hasta el final sin interrumpirlo.Ejemplo de frase何なにがあっても、は家族かぞくとの約束やくそくを守まもり通とおした。NotaNota 2Nota 1: ・ &quot;Verbo+始はじめる&quot; se utiliza para expresar con naturalidad el hecho de que &quot;esa acción o estado comienza a partir de un momento determinado&quot;.  Por otro lado, &quot;Verbo+出だす&quot; tiende a transmitir una sensación de &quot;de repente&quot;, &quot;de forma inesperada&quot; o &quot;por fin ha empezado a hacerlo&quot;.Nota 2:  &quot;Verbo+続つづける&quot; describe objetivamente que la acción &quot;continúa&quot;, y da la impresión de que, simplemente como hecho, &quot;se lleva haciendo desde hace tiempo&quot;. Por otro lado, &quot;Verbo+通とおす&quot; enfatiza el hecho de &quot;mantener la voluntad y llegar hasta el final&quot; a pesar de las dificultades o la oposición, y a menudo incluye en cierta medida la valoración o los sentimientos del hablante."},{"id":"L045","file":"20260806___NARU_.docx","cat":"cambio","catLabel":"Cambio・なる・する","title":"「〜なる」の色々な使い方","titleRuby":"「〜なる」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- [Sustantivo+に / Adjetivo tipo-い en forma-く / Adjetivo tipo-な en forma-に] +なる<\/p><p class=\"lp\">(Esta expresión se utiliza para convertir sustantivos o adjetivos en verbos intransitivos que representa la alteración del estado o cualidad de las cosas, personas, etc. y significa “convertirse en ...“, “volverse …”, “hacerse …”, etc.)<\/p><p class=\"lp\"><ruby>田中<rt>たなか<\/rt><\/ruby>さんは４<ruby>月<rt>がつ<\/rt><\/ruby>から<ruby>部長<rt>ぶちょう<\/rt><\/ruby>になります。 ・  ・ <ruby>彼女<rt>かのじょ<\/rt><\/ruby>はになるために<ruby>勉強<rt>べんきょう<\/rt><\/ruby>している。<\/p><p class=\"lp\">10<ruby>月<rt>がつ<\/rt><\/ruby>になると<ruby>朝<rt>あさ<\/rt><\/ruby>と<ruby>夜<rt>よる<\/rt><\/ruby>はすずしくなります。 ・ <ruby>映画<rt>えいが<\/rt><\/ruby>がまると<ruby>映画館<rt>えいがかん<\/rt><\/ruby>は<ruby>静<rt>しず<\/rt><\/ruby>かになりました。<\/p><p class=\"lp\">- Sustantivo +と +なる<\/p><p class=\"lp\">(Esta expresión se utiliza en la misma manera que “Sustantivo +に +なる” explicada en el 1. arriva.  Sin embargo, cuando se quiere expresar un cambio natural en las cosas o en el tiempo, la expresión “Sustantivo +に +なる” resulta más adecuada.  Por el contrario, la expresión “Sustantivo +と +なる” se utiliza más cuando se quiere destacar cambios o resultados inesperados, o cuando se quiere comunicar de manera formal cambios de carácter humano, como decisiones o directrices.)<\/p><p class=\"lp\"><ruby>田中<rt>たなか<\/rt><\/ruby>さんがとなることが<ruby>決<rt>き<\/rt><\/ruby>まりました。 ・ ここでの<ruby>電話<rt>でんわ<\/rt><\/ruby>の<ruby>使用<rt>しよう<\/rt><\/ruby>は<ruby>禁止<rt>きんし<\/rt><\/ruby>となりました。<\/p><p class=\"lp\">- Sustantivo +から +なる<\/p><p class=\"lp\">(Esta estructura es una forma de expresar que varios elementos o partes se unen para formar un todo, y se utiliza para explicar que algo está compuesto por determinados materiales o elementos.)<\/p><p class=\"lp\">このレポートは、よっ<ruby>四<rt>よん<\/rt><\/ruby>つの<ruby>章<rt>しょう<\/rt><\/ruby>からなる。 ・  ・ <ruby>四国<rt>しこく<\/rt><\/ruby><ruby>地方<rt>ちほう<\/rt><\/ruby>は<ruby>香川県<rt>かがわけん<\/rt><\/ruby>、<ruby>徳島県<rt>とくしまけん<\/rt><\/ruby>、<ruby>愛媛県<rt>えひめけん<\/rt><\/ruby>、<ruby>高知県<rt>こうちけん<\/rt><\/ruby>からなる。<\/p>","text":"「〜なる」の色々いろいろな使しい方ほう - [Sustantivo+に / Adjetivo tipo-い en forma-く / Adjetivo tipo-な en forma-に] +なる(Esta expresión se utiliza para convertir sustantivos o adjetivos en verbos intransitivos que representa la alteración del estado o cualidad de las cosas, personas, etc. y significa “convertirse en ...“, “volverse …”, “hacerse …”, etc.)田中たなかさんは４月がつから部長ぶちょうになります。 ・  ・ 彼女かのじょはになるために勉強べんきょうしている。10月がつになると朝あさと夜よるはすずしくなります。 ・ 映画えいががまると映画館えいがかんは静しずかになりました。- Sustantivo +と +なる(Esta expresión se utiliza en la misma manera que “Sustantivo +に +なる” explicada en el 1. arriva.  Sin embargo, cuando se quiere expresar un cambio natural en las cosas o en el tiempo, la expresión “Sustantivo +に +なる” resulta más adecuada.  Por el contrario, la expresión “Sustantivo +と +なる” se utiliza más cuando se quiere destacar cambios o resultados inesperados, o cuando se quiere comunicar de manera formal cambios de carácter humano, como decisiones o directrices.)田中たなかさんがとなることが決きまりました。 ・ ここでの電話でんわの使用しようは禁止きんしとなりました。- Sustantivo +から +なる(Esta estructura es una forma de expresar que varios elementos o partes se unen para formar un todo, y se utiliza para explicar que algo está compuesto por determinados materiales o elementos.)このレポートは、よっ四よんつの章しょうからなる。 ・  ・ 四国しこく地方ちほうは香川県かがわけん、徳島県とくしまけん、愛媛県えひめけん、高知県こうちけんからなる。"},{"id":"L046","file":"20260806___SURU_.docx","cat":"cambio","catLabel":"Cambio・なる・する","title":"「〜する」の色々な使い方","titleRuby":"「〜する」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivo +を +する<\/p><p class=\"lp\">(El verbo “する” adopta como objetos sustantivos de una amplia gama, y significa que la acción indicada por el objeto es ejecutada.)<\/p><p class=\"lp\">サッカーをする ・ パーティーをする ・ <ruby>会議<rt>かいぎ<\/rt><\/ruby>をする ・ <ruby>仕事<rt>しごと<\/rt><\/ruby>をする ・ <ruby>電話<rt>でんわ<\/rt><\/ruby>をする, etc.<\/p><p class=\"lp\">- Sustantivo +する<\/p><p class=\"lp\">(Es un Grupo de verbos formados con sustantivo del tipo acción y “する”.)<\/p><p class=\"lp\"><ruby>運転<rt>うんてん<\/rt><\/ruby>する ・ <ruby>説明<rt>せつめい<\/rt><\/ruby>する ・ <ruby>散歩<rt>さんぽ<\/rt><\/ruby>する ・ <ruby>結婚<rt>けっこん<\/rt><\/ruby>する ・ <ruby>予約<rt>よやく<\/rt><\/ruby>する ・ <ruby>報告<rt>ほうこく<\/rt><\/ruby>する, etc.<\/p><p class=\"lp\">- [Sustantivo+に / Adjetivo tipo-い en forma-く / Adjetivo tipo-な en forma-に] +する<\/p><p class=\"lp\">(Esta expresión se utiliza para convertir sustantivos o adjetivos en verbos transitivos para expresar que se hace que un objeto sufra algún tipo de cambio o transformación.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>をリーダーにするつもりです。 ・  ・ <ruby>将来<rt>しょうらい<\/rt><\/ruby>はを<ruby>医者<rt>いしゃ<\/rt><\/ruby>にしたいです。<\/p><p class=\"lp\"><ruby>料理<rt>りょうり<\/rt><\/ruby>をもっとおいしくする<ruby>方法<rt>ほうほう<\/rt><\/ruby>を<ruby>知<rt>し<\/rt><\/ruby>りたい。 ・ <ruby>友達<rt>ともだち<\/rt><\/ruby>がる<ruby>前<rt>まえ<\/rt><\/ruby>に、<ruby>部屋<rt>へや<\/rt><\/ruby>をきれいにしておきました。<\/p><p class=\"lp\">- Sustantivo +に +する<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar una selección y/o decision del hablante.)<\/p><p class=\"lp\"><ruby>今年<rt>ことし<\/rt><\/ruby>のの<ruby>旅行先<rt>りょこうさき<\/rt><\/ruby>は<ruby>北海道<rt>ほっかいどう<\/rt><\/ruby>にしました。 ・  ・ <ruby>今日<rt>きょう<\/rt><\/ruby>の<ruby>夕食<rt>ゆうしょく<\/rt><\/ruby>はカレーにしよう。<\/p><p class=\"lp\">- Sustantivo +が +する<\/p><p class=\"lp\">(Esta expresión se utiliza para señalar que se percibe algún ruido o voz, olor, sabor, etc., a travésde los órganos de los sentidos, e incluso, se puede utilizar para referirse al ambiente o la impresión que transmite.)<\/p><p class=\"lp\"><ruby>隣<rt>となり<\/rt><\/ruby>のからテレビの<ruby>音<rt>おと<\/rt><\/ruby>がする。 ・  ・ このお<ruby>茶<rt>ちゃ<\/rt><\/ruby>はレモンの<ruby>味<rt>あじ<\/rt><\/ruby>がします。<\/p><p class=\"lp\"><ruby>家<rt>いえ<\/rt><\/ruby>のドアのをかけるのを<ruby>忘<rt>わす<\/rt><\/ruby>れた<ruby>気<rt>き<\/rt><\/ruby>がする。 ・ このを<ruby>見<rt>み<\/rt><\/ruby>ていると、<ruby>夢<rt>ゆめ<\/rt><\/ruby>のような<ruby>感<rt>かん<\/rt><\/ruby>じがします。<\/p><p class=\"lp\">- Sustantivo +を +している<\/p><p class=\"lp\">(Esta expresión se utiliza para describir características físicas como el color la forma o el rostro y significa que tiene esa característica llamada “el Sustantivo”.  Cuando va seguido de un sustantivo, como en “〜をしているN”, también se puede sustituir por “〜をしたN”.)<\/p><p class=\"lp\">カロリナさんはきれいな<ruby>髪<rt>かみ<\/rt><\/ruby>をしています。 ・ <ruby>富士山<rt>ふじさん<\/rt><\/ruby>はきれいな<ruby>円錐<rt>えんすい<\/rt><\/ruby>の<ruby>形<rt>かたち<\/rt><\/ruby>をしている。<\/p><p class=\"lp\">あの<ruby>変<rt>へん<\/rt><\/ruby>な<ruby>色<rt>いろ<\/rt><\/ruby>をしている<ruby>建物<rt>たてもの<\/rt><\/ruby>は<ruby>何<rt>なん<\/rt><\/ruby>だろう。 ・  ・ <ruby>優<rt>やさ<\/rt><\/ruby>しそう<ruby>顔<rt>かお<\/rt><\/ruby>をした<ruby>男<rt>おとこ<\/rt><\/ruby>の<ruby>人<rt>ひと<\/rt><\/ruby>に<ruby>話<rt>はな<\/rt><\/ruby>しかけられました。<\/p>","text":"「〜する」の色々いろいろな使しい方ほう - Sustantivo +を +する(El verbo “する” adopta como objetos sustantivos de una amplia gama, y significa que la acción indicada por el objeto es ejecutada.)サッカーをする ・ パーティーをする ・ 会議かいぎをする ・ 仕事しごとをする ・ 電話でんわをする, etc.- Sustantivo +する(Es un Grupo de verbos formados con sustantivo del tipo acción y “する”.)運転うんてんする ・ 説明せつめいする ・ 散歩さんぽする ・ 結婚けっこんする ・ 予約よやくする ・ 報告ほうこくする, etc.- [Sustantivo+に / Adjetivo tipo-い en forma-く / Adjetivo tipo-な en forma-に] +する(Esta expresión se utiliza para convertir sustantivos o adjetivos en verbos transitivos para expresar que se hace que un objeto sufra algún tipo de cambio o transformación.)彼かれをリーダーにするつもりです。 ・  ・ 将来しょうらいはを医者いしゃにしたいです。料理りょうりをもっとおいしくする方法ほうほうを知しりたい。 ・ 友達ともだちがる前まえに、部屋へやをきれいにしておきました。- Sustantivo +に +する(Esta expresión se utiliza para indicar una selección y/o decision del hablante.)今年ことしのの旅行先りょこうさきは北海道ほっかいどうにしました。 ・  ・ 今日きょうの夕食ゆうしょくはカレーにしよう。- Sustantivo +が +する(Esta expresión se utiliza para señalar que se percibe algún ruido o voz, olor, sabor, etc., a travésde los órganos de los sentidos, e incluso, se puede utilizar para referirse al ambiente o la impresión que transmite.)隣となりのからテレビの音おとがする。 ・  ・ このお茶ちゃはレモンの味あじがします。家いえのドアのをかけるのを忘わすれた気きがする。 ・ このを見みていると、夢ゆめのような感かんじがします。- Sustantivo +を +している(Esta expresión se utiliza para describir características físicas como el color la forma o el rostro y significa que tiene esa característica llamada “el Sustantivo”.  Cuando va seguido de un sustantivo, como en “〜をしているN”, también se puede sustituir por “〜をしたN”.)カロリナさんはきれいな髪かみをしています。 ・ 富士山ふじさんはきれいな円錐えんすいの形かたちをしている。あの変へんな色いろをしている建物たてものは何なんだろう。 ・  ・ 優やさしそう顔かおをした男おとこの人ひとに話はなしかけられました。"},{"id":"L047","file":"20260813_Verbos_Compuestos__2_.docx","cat":"vcomp","catLabel":"Verbos compuestos","title":"複合動詞・Verbos Compuestos (2)","titleRuby":"<ruby>複合<rt>ふくごう<\/rt><\/ruby><ruby>動詞<rt>どうし<\/rt><\/ruby>・Verbos Compuestos (2)","html":"<div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+かける/かけます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Indica que se acaba de empezar la acción expresada por el verbo anterior y aún se encuentra en una fase intermedia, o que se ha avanzado hasta cierto punto sin llegar al final.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>電車<rt>でんしゃ<\/rt><\/ruby>にりかけたところで、<ruby>電話<rt>でんわ<\/rt><\/ruby>が<ruby>鳴<rt>な<\/rt><\/ruby>った。<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+まくる/まくります<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Significa &quot;hacer la acción expresada por el verbo anterior con intensidad, muchas veces o en gran cantidad&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>外国人<rt>がいこくじん<\/rt><\/ruby>の<ruby>客<rt>きゃく<\/rt><\/ruby>がお<ruby>土産<rt>みやげ<\/rt><\/ruby>を<ruby>買<rt>か<\/rt><\/ruby>いまくっていた。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 3<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>終<rt>お<\/rt><\/ruby>わる/<ruby>終<rt>お<\/rt><\/ruby>わります<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Expresa que la acción expresada por el verbo anterior ha concluido por completo. Se corresponde approximadamente con “terminar de hacerla”.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>読<rt>よ<\/rt><\/ruby>みわった<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>本棚<rt>ほんだな<\/rt><\/ruby>に<ruby>戻<rt>もど<\/rt><\/ruby>しておいてください。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 4<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>上<rt>あ<\/rt><\/ruby>げる/<ruby>上<rt>あ<\/rt><\/ruby>げます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Tiene dos significados: a) llevar a cabo la acción expresada por el verbo anterior hasta el final, o b) levantar o mover hacia arriba.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>昨日<rt>きのう<\/rt><\/ruby>、でレポートを<ruby>書<rt>か<\/rt><\/ruby>き<ruby>上<rt>あ<\/rt><\/ruby>げました。 <ruby>父親<rt>ちちおや<\/rt><\/ruby>はに<ruby>迎<rt>むか<\/rt><\/ruby>えにき<ruby>来<rt>き<\/rt><\/ruby>た<ruby>子<rt>こ<\/rt><\/ruby>どもをだ<ruby>抱<rt>かかえ<\/rt><\/ruby>き<ruby>上<rt>あ<\/rt><\/ruby>げた。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 5<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>上<rt>あ<\/rt><\/ruby>がる/<ruby>上<rt>あ<\/rt><\/ruby>がります<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Tiene dos significados: a) la acción expresada por el verbo anterior llega hasta el final y se completa, o b) moverse hacia arriba.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\">こちらはき<ruby>上<rt>あ<\/rt><\/ruby>がったばかりのパンです。 たくさんのが<ruby>夜空<rt>よぞら<\/rt><\/ruby>に<ruby>打<rt>う<\/rt><\/ruby>ち<ruby>上<rt>あ<\/rt
