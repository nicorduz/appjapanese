><\/ruby>がりました。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 5<\/span><\/div><\/div><\/div><p class=\"lnote\">Nota 3: ・ Es una expresión bastante informal que se utiliza a menudo en las conversaciones.<\/p><p class=\"lnote\">Nota 4: ・ Existe también la expresión &quot;Verbo+<ruby>終<rt>お<\/rt><\/ruby>える&quot;, que tiene el mismo significado, pero resulta un poco más formal y literaria, y transmite con mayor intensidad la sensación de haber llevado algo a buen término.<\/p><p class=\"lnote\">Nota 5: ・ &quot;Verbo+<ruby>上<rt>あ<\/rt><\/ruby>げる&quot; : verbo transitivo que significa &quot;una persona lleva a cabo una acción hasta su finalización&quot;.  Se utiliza cuando se hace especial hincapié en la persona o sujeto que ha realizado la acción y transmite la idea de &quot;lo he conseguido con esfuerzo&quot; o &quot;lo he completado a propósito&quot;.  &quot;Verbo+<ruby>上<rt>あ<\/rt><\/ruby>がる&quot;: verbo intransitivo que significa &quot;algo llega a un estado de finalización&quot;.  Se utiliza cuando se presta atención al resultado o estado final y transmite la idea de &quot;se ha completado sin que se de cuenta&quot; o &quot;por fin ha terminado&quot;.<\/p>","text":"複合ふくごう動詞どうし・Verbos Compuestos (2) Verbo en forma-ます+かける/かけますSignificadoIndica que se acaba de empezar la acción expresada por el verbo anterior y aún se encuentra en una fase intermedia, o que se ha avanzado hasta cierto punto sin llegar al final.Ejemplo de frase電車でんしゃにりかけたところで、電話でんわが鳴なった。Verbo en forma-ます+まくる/まくりますSignificadoSignifica &quot;hacer la acción expresada por el verbo anterior con intensidad, muchas veces o en gran cantidad&quot;.Ejemplo de frase外国人がいこくじんの客きゃくがお土産みやげを買かいまくっていた。NotaNota 3Verbo en forma-ます+終おわる/終おわりますSignificadoExpresa que la acción expresada por el verbo anterior ha concluido por completo. Se corresponde approximadamente con “terminar de hacerla”.Ejemplo de frase読よみわった本ほんを本棚ほんだなに戻もどしておいてください。NotaNota 4Verbo en forma-ます+上あげる/上あげますSignificadoTiene dos significados: a) llevar a cabo la acción expresada por el verbo anterior hasta el final, o b) levantar o mover hacia arriba.Ejemplo de frase昨日きのう、でレポートを書かき上あげました。 父親ちちおやはに迎むかえにき来きた子こどもをだ抱かかえき上あげた。NotaNota 5Verbo en forma-ます+上あがる/上あがりますSignificadoTiene dos significados: a) la acción expresada por el verbo anterior llega hasta el final y se completa, o b) moverse hacia arriba.Ejemplo de fraseこちらはき上あがったばかりのパンです。 たくさんのが夜空よぞらに打うち上あがりました。NotaNota 5Nota 3: ・ Es una expresión bastante informal que se utiliza a menudo en las conversaciones.Nota 4: ・ Existe también la expresión &quot;Verbo+終おえる&quot;, que tiene el mismo significado, pero resulta un poco más formal y literaria, y transmite con mayor intensidad la sensación de haber llevado algo a buen término.Nota 5: ・ &quot;Verbo+上あげる&quot; : verbo transitivo que significa &quot;una persona lleva a cabo una acción hasta su finalización&quot;.  Se utiliza cuando se hace especial hincapié en la persona o sujeto que ha realizado la acción y transmite la idea de &quot;lo he conseguido con esfuerzo&quot; o &quot;lo he completado a propósito&quot;.  &quot;Verbo+上あがる&quot;: verbo intransitivo que significa &quot;algo llega a un estado de finalización&quot;.  Se utiliza cuando se presta atención al resultado o estado final y transmite la idea de &quot;se ha completado sin que se de cuenta&quot; o &quot;por fin ha terminado&quot;."},{"id":"L048","file":"20260813__MONO__1_.docx","cat":"nom","catLabel":"Nominalización・こと・もの","title":"「もの」の色々な使い方（１）","titleRuby":"「もの」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>（１）","html":"<p class=\"lp\">- [Sustantivo +の / Adjetivo / Verbo] + <ruby>物<rt>もの<\/rt><\/ruby> (もの)<\/p><p class=\"lp\">(“<ruby>物<rt>もの<\/rt><\/ruby> (もの)” es un sustantivo que se refiere a objetos, es decir, cosas que se pueden ver, tocar u oler.)<\/p><p class=\"lp\">このの<ruby>物<rt>もの<\/rt><\/ruby>に<ruby>触<rt>ふ<\/rt><\/ruby>れないでください。 ・  ・ <ruby>他<rt>ほか<\/rt><\/ruby>のでもう<ruby>少<rt>すこ<\/rt><\/ruby>し<ruby>安<rt>やす<\/rt><\/ruby>い<ruby>物<rt>もの<\/rt><\/ruby>を<ruby>探<rt>さが<\/rt><\/ruby>しましょう。<\/p><p class=\"lp\">こので<ruby>売<rt>う<\/rt><\/ruby>っている<ruby>服<rt>ふく<\/rt><\/ruby>はきれいな<ruby>物<rt>もの<\/rt><\/ruby>が<ruby>多<rt>おお<\/rt><\/ruby>い。 ・ <ruby>冷蔵庫<rt>れいぞうこ<\/rt><\/ruby>のに<ruby>食<rt>た<\/rt><\/ruby>べる<ruby>物<rt>もの<\/rt><\/ruby>があまり<ruby>残<rt>のこ<\/rt><\/ruby>っていない。<\/p><p class=\"lnote\">Nota: Hay algunas palabras derivadas de &quot;verbo en forma-ます + <ruby>物<rt>もの<\/rt><\/ruby> (もの)&quot; que se utilizan cotidianamente como siguen, y significan &quot;cosas para hacer (verbo)&quot;.<\/p><p class=\"lp\"><ruby>食<rt>た<\/rt><\/ruby>べ (comida, cosas para comer), <ruby>飲<rt>の<\/rt><\/ruby>み (bebida, cosas para beber), <ruby>着物<rt>きもの<\/rt><\/ruby> (kimono, cosas para vestirse),<\/p><p class=\"lp\"><ruby>履<rt>は<\/rt><\/ruby>き (calzado, cosas para ponerse en los pies), <ruby>乗<rt>の<\/rt><\/ruby>り (vehículo, cosas para montar o transportar),<\/p><p class=\"lp\"><ruby>買<rt>か<\/rt><\/ruby>い (compras, cosas para comprar), <ruby>持<rt>も<\/rt><\/ruby>ち (pertenencias, cosas para llevar consigo),<\/p><p class=\"lp\"><ruby>贈<rt>おく<\/rt><\/ruby>り (regalo, cosas para regalar), <ruby>落<rt>お<\/rt><\/ruby>とし (objetos perdidos, cosas que se han perdido), etc.<\/p><p class=\"lp\">- [Sustantivo + の / Adjetivo / Verbo] + <ruby>者<rt>もの<\/rt><\/ruby> (もの)<\/p><p class=\"lp\">(“<ruby>者<rt>もの<\/rt><\/ruby> (もの)” es un sustantivo que se refiere a la persona que es el agente de una acción, o a una persona que posee características específicas.  El término “<ruby>者<rt>もの<\/rt><\/ruby>” se considera una expresión menos respetuosa en comparación con “<ruby>人<rt>ひと<\/rt><\/ruby> ” o “<ruby>方<rt>かた<\/rt><\/ruby>”.)<\/p><p class=\"lp\"><ruby>洗濯機<rt>せんたくき<\/rt><\/ruby>のに<ruby>担当<rt>たんとう<\/rt><\/ruby>の<ruby>者<rt>もの<\/rt><\/ruby>を<ruby>行<rt>い<\/rt><\/ruby>かせます。 ・  ・ <ruby>腕<rt>うで<\/rt><\/ruby><ruby>相撲<rt>すもう<\/rt><\/ruby>では、の<ruby>力<rt>ちから<\/rt><\/ruby>が<ruby>強<rt>つよ<\/rt><\/ruby>い<ruby>者<rt>もの<\/rt><\/ruby>が<ruby>勝<rt>か<\/rt><\/ruby>つ。<\/p><p class=\"lp\"><ruby>市<rt>し<\/rt><\/ruby><ruby>役所<rt>やくしょ<\/rt><\/ruby>はが<ruby>必要<rt>ひつよう<\/rt><\/ruby>な<ruby>者<rt>もの<\/rt><\/ruby>へ<ruby>説明<rt>せつめい<\/rt><\/ruby>をおこな<ruby>行<rt>こう<\/rt><\/ruby>った。 ・ <ruby>数学<rt>すうがく<\/rt><\/ruby>のを<ruby>忘<rt>わす<\/rt><\/ruby>れた<ruby>者<rt>もの<\/rt><\/ruby>は<ruby>手<rt>て<\/rt><\/ruby>を<ruby>挙<rt>あ<\/rt><\/ruby>げなさい。<\/p><p class=\"lnote\">Nota: Hay algunas palabras que se han convertido en expresiones fijas como siguien, y significan “personas que hacen (verbo) o que son de carácter (adjetivo)”.<\/p><p class=\"lp\"><ruby>働<rt>はたら<\/rt><\/ruby>き (gran trabajador, personas que trabajan mucho), <ruby>怠<rt>なま<\/rt><\/ruby>け (vago, personas que son perezosos),<\/p><p class=\"lp\"><ruby>若者<rt>わかもの<\/rt><\/ruby> (jóven, personas que son jóvenes, いたずら (travieso, personas que son traviesos), etc.<\/p><p class=\"lp\">- Sustantivo +というもの + は/が/を/に/で・・・ o だ<\/p><p class=\"lp\">(Esta expresión se utiliza, en relación con el sustantivo que precede a “というもの”, para definirlo, darle sustancia, o enfatizar su esencia.  En el lenguaje hablado, se puede expresar como “〜っていうもの” en vez de “〜というもの”.)<\/p><p class=\"lp\">うちのは<ruby>努力<rt>どりょく<\/rt><\/ruby>というものをしない。 ・  ・ おというものは、いくらあっても<ruby>困<rt>こま<\/rt><\/ruby>らない。<\/p><p class=\"lp\"><ruby>友情<rt>ゆうじょう<\/rt><\/ruby>というものは、<ruby>信頼<rt>しんらい<\/rt><\/ruby>から<ruby>生<rt>う<\/rt><\/ruby>まれる。 ・ <ruby>花見<rt>はなみ<\/rt><\/ruby>は<ruby>日本<rt>にっぽん<\/rt><\/ruby>の<ruby>文化<rt>ぶんか<\/rt><\/ruby>というものに<ruby>触<rt>ふ<\/rt><\/ruby>れる<ruby>機会<rt>きかい<\/rt><\/ruby>になった。<\/p><p class=\"lp\">- [Adjetivo en forma diccionario / Verbo en forma diccionario / Verbo en forma-ない] + ものだ/ものではない<\/p><p class=\"lp\">(Esta expresión se utiliza para expresar lo que se da por sentado o se considera de sentido común en la sociedad.  En algunos casos, también puede tener connotaciones de consejo u obligación.  En el lenguaje hablado, se puede expresar como “〜もんだ” en vez de “〜ものだ”, y “〜もんじゃない” en vez de “〜ものではない”.)<\/p><p class=\"lp\"><ruby>子<rt>こ<\/rt><\/ruby>どものは<ruby>早<rt>はや<\/rt><\/ruby>いものだ。 ・  ・  ・ <ruby>外国語<rt>がいこくご<\/rt><\/ruby>をするのは<ruby>難<rt>むずか<\/rt><\/ruby>しいものです。<\/p><p class=\"lp\"><ruby>電車<rt>でんしゃ<\/rt><\/ruby>やバスでは、おりに<ruby>席<rt>せき<\/rt><\/ruby>を<ruby>譲<rt>ゆず<\/rt><\/ruby>るものだ。 ・ <ruby>赤信号<rt>あかしんごう<\/rt><\/ruby>では、<ruby>車<rt>くるま<\/rt><\/ruby>が<ruby>来<rt>こ<\/rt><\/ruby>なくても<ruby>道路<rt>どうろ<\/rt><\/ruby>を<ruby>渡<rt>わた<\/rt><\/ruby>らないものだ。<\/p><p class=\"lp\">あんなつきのと、<ruby>約束<rt>やくそく<\/rt><\/ruby>をするものではない。<\/p><p class=\"lp\">- Verbo en forma-た o en forma-なかった (tiempo pasado) + ものだ<\/p><p class=\"lp\">(Esta expresión se usa para expresar un sentimiento de nostalgia al recordar acontecimientos pasados.  En el lenguaje hablado, se puede expresar como “〜もんだ” en vez de “〜ものだ”.)<\/p><p class=\"lp\"><ruby>昔<rt>むかし<\/rt><\/ruby>の<ruby>先生<rt>せんせい<\/rt><\/ruby>は<ruby>厳<rt>きび<\/rt><\/ruby>しかったものです。 ・  ・ <ruby>夏休<rt>なつやす<\/rt><\/ruby>みには、よく<ruby>家族<rt>かぞく<\/rt><\/ruby>で<ruby>海<rt>うみ<\/rt><\/ruby>へ<ruby>行<rt>い<\/rt><\/ruby>ったものだ。<\/p><p class=\"lp\"><ruby>若<rt>わか<\/rt><\/ruby>い<ruby>頃<rt>ころ<\/rt><\/ruby>は、<ruby>遅<rt>おそ<\/rt><\/ruby>くまでお<ruby>酒<rt>さけ<\/rt><\/ruby>を<ruby>飲<rt>の<\/rt><\/ruby>んだものだ。 ・ <ruby>子<rt>こ<\/rt><\/ruby>どもの<ruby>頃<rt>ころ<\/rt><\/ruby>はよく<ruby>母<rt>はは<\/rt><\/ruby>に<ruby>叱<rt>しか<\/rt><\/ruby>られたものです。<\/p><p class=\"lp\"><ruby>若<rt>わか<\/rt><\/ruby>い<ruby>頃<rt>ころ<\/rt><\/ruby>は、<ruby>遅<rt>おそ<\/rt><\/ruby>くまでお<ruby>酒<rt>さけ<\/rt><\/ruby>を<ruby>飲<rt>の<\/rt><\/ruby>んでも<ruby>疲<rt>つか<\/rt><\/ruby>れなかったものだ。<\/p>","text":"「もの」の色々いろいろな使しい方ほう（１） - [Sustantivo +の / Adjetivo / Verbo] + 物もの (もの)(“物もの (もの)” es un sustantivo que se refiere a objetos, es decir, cosas que se pueden ver, tocar u oler.)このの物ものに触ふれないでください。 ・  ・ 他ほかのでもう少すこし安やすい物ものを探さがしましょう。こので売うっている服ふくはきれいな物ものが多おおい。 ・ 冷蔵庫れいぞうこのに食たべる物ものがあまり残のこっていない。Nota: Hay algunas palabras derivadas de &quot;verbo en forma-ます + 物もの (もの)&quot; que se utilizan cotidianamente como siguen, y significan &quot;cosas para hacer (verbo)&quot;.食たべ (comida, cosas para comer), 飲のみ (bebida, cosas para beber), 着物きもの (kimono, cosas para vestirse),履はき (calzado, cosas para ponerse en los pies), 乗のり (vehículo, cosas para montar o transportar),買かい (compras, cosas para comprar), 持もち (pertenencias, cosas para llevar consigo),贈おくり (regalo, cosas para regalar), 落おとし (objetos perdidos, cosas que se han perdido), etc.- [Sustantivo + の / Adjetivo / Verbo] + 者もの (もの)(“者もの (もの)” es un sustantivo que se refiere a la persona que es el agente de una acción, o a una persona que posee características específicas.  El término “者もの” se considera una expresión menos respetuosa en comparación con “人ひと ” o “方かた”.)洗濯機せんたくきのに担当たんとうの者ものを行いかせます。 ・  ・ 腕うで相撲すもうでは、の力ちからが強つよい者ものが勝かつ。市し役所やくしょはが必要ひつような者ものへ説明せつめいをおこな行こうった。 ・ 数学すうがくのを忘わすれた者ものは手てを挙あげなさい。Nota: Hay algunas palabras que se han convertido en expresiones fijas como siguien, y significan “personas que hacen (verbo) o que son de carácter (adjetivo)”.働はたらき (gran trabajador, personas que trabajan mucho), 怠なまけ (vago, personas que son perezosos),若者わかもの (jóven, personas que son jóvenes, いたずら (travieso, personas que son traviesos), etc.- Sustantivo +というもの + は/が/を/に/で・・・ o だ(Esta expresión se utiliza, en relación con el sustantivo que precede a “というもの”, para definirlo, darle sustancia, o enfatizar su esencia.  En el lenguaje hablado, se puede expresar como “〜っていうもの” en vez de “〜というもの”.)うちのは努力どりょくというものをしない。 ・  ・ おというものは、いくらあっても困こまらない。友情ゆうじょうというものは、信頼しんらいから生うまれる。 ・ 花見はなみは日本にっぽんの文化ぶんかというものに触ふれる機会きかいになった。- [Adjetivo en forma diccionario / Verbo en forma diccionario / Verbo en forma-ない] + ものだ/ものではない(Esta expresión se utiliza para expresar lo que se da por sentado o se considera de sentido común en la sociedad.  En algunos casos, también puede tener connotaciones de consejo u obligación.  En el lenguaje hablado, se puede expresar como “〜もんだ” en vez de “〜ものだ”, y “〜もんじゃない” en vez de “〜ものではない”.)子こどものは早はやいものだ。 ・  ・  ・ 外国語がいこくごをするのは難むずかしいものです。電車でんしゃやバスでは、おりに席せきを譲ゆずるものだ。 ・ 赤信号あかしんごうでは、車くるまが来こなくても道路どうろを渡わたらないものだ。あんなつきのと、約束やくそくをするものではない。- Verbo en forma-た o en forma-なかった (tiempo pasado) + ものだ(Esta expresión se usa para expresar un sentimiento de nostalgia al recordar acontecimientos pasados.  En el lenguaje hablado, se puede expresar como “〜もんだ” en vez de “〜ものだ”.)昔むかしの先生せんせいは厳きびしかったものです。 ・  ・ 夏休なつやすみには、よく家族かぞくで海うみへ行いったものだ。若わかい頃ころは、遅おそくまでお酒さけを飲のんだものだ。 ・ 子こどもの頃ころはよく母ははに叱しかられたものです。若わかい頃ころは、遅おそくまでお酒さけを飲のんでも疲つかれなかったものだ。"},{"id":"L049","file":"20260824_Verbos_Compuestos__3_.docx","cat":"vcomp","catLabel":"Verbos compuestos","title":"複合動詞・Verbos Compuestos (3)","titleRuby":"<ruby>複合<rt>ふくごう<\/rt><\/ruby><ruby>動詞<rt>どうし<\/rt><\/ruby>・Verbos Compuestos (3)","html":"<div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+きる/きります<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Se utiliza con dos significados: a) terminar de hacer todo de la acción expresada por el verbo anterior, o b) llevarla hasta el límite o hacerla por completo.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\">60さい<ruby>歳<rt>とし<\/rt><\/ruby>のはマラソンを<ruby>最後<rt>さいご<\/rt><\/ruby>まで<ruby>走<rt>はし<\/rt><\/ruby>りきった。 <ruby>一日中<rt>いちにちじゅう<\/rt><\/ruby><ruby>立<rt>た<\/rt><\/ruby>ちで、もう<ruby>疲<rt>つか<\/rt><\/ruby>れきっています。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 6<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>抜<rt>ぬ<\/rt><\/ruby>く/<ruby>抜<rt>ぬ<\/rt><\/ruby>きます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Significa &quot;seguir haciendo la acción expresada por el verbo anterior hasta el final&quot; o &quot;hacerla hasta llegar al límite.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>厳<rt>きび<\/rt><\/ruby>しいで、<ruby>社長<rt>しゃちょう<\/rt><\/ruby>は<ruby>従業員<rt>じゅうぎょういん<\/rt><\/ruby>を<ruby>守<rt>まも<\/rt><\/ruby>り<ruby>抜<rt>ぬ<\/rt><\/ruby>いた。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 6<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>尽<rt>つ<\/rt><\/ruby>くす/<ruby>尽<rt>つ<\/rt><\/ruby>くします<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Significa &quot;realizar la acción expresada por el verbo anterior en la medida de lo posible&quot;, &quot;hacerla todo&quot; o &quot;hacerla por completo&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>彼<rt>かれ<\/rt><\/ruby>はそのい<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>一晩<rt>ひとばん<\/rt><\/ruby>で<ruby>読<rt>よ<\/rt><\/ruby>み<ruby>尽<rt>つ<\/rt><\/ruby>くした。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 6<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+こ<ruby>込<rt>こみ<\/rt><\/ruby>む/<ruby>込<rt>こ<\/rt><\/ruby>みます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Significa lo siguiente: a) Entrar en algo, b) Hacer la acción expresada por el verbo que precede de forma intensa o profunda, c) Hacerla con cuidado o detenidamente, o d) Hacerla hasta el final.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>乗客<rt>じょうきゃく<\/rt><\/ruby>がバスにどんどんり<ruby>込<rt>こ<\/rt><\/ruby>んでいった。 <ruby>先生<rt>せんせい<\/rt><\/ruby>にされて、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>黙<rt>だま<\/rt><\/ruby>り<ruby>込<rt>こ<\/rt><\/ruby>んでしまった。 <ruby>説明書<rt>せつめいしょ<\/rt><\/ruby>をみ<ruby>込<rt>こ<\/rt><\/ruby>んでから<ruby>作業<rt>さぎょう<\/rt><\/ruby>を<ruby>始<rt>はじ<\/rt><\/ruby>めてください。<\/span><\/div><\/div><\/div><p class=\"lnote\">Nota 6: ・ &quot;Verbo+きる&quot; tiene un significado más marcado de &quot;hacer algo hasta el final&quot; o &quot;hacer algo por completo&quot;.  &quot;Verbo+<ruby>抜<rt>ぬ<\/rt><\/ruby>く&quot; tiene un matiz más marcado de &quot;perseverar hasta el final a pesar de las dificultades&quot;.  Verbo+<ruby>尽<rt>つ<\/rt><\/ruby>くす&quot; transmite la idea de &quot;hacer todo lo posible&quot;, &quot;aprovechar hasta la última gota&quot; o &quot;hacer algo a fondo&quot;.  Si quiere decir &quot;he terminado bien&quot;, se utiliza &quot;Verbo+きる&quot;.  Si quiere destacar el esfuerzo o el trabajo duro, se utiliza &quot;Verbo+<ruby>抜<rt>ぬ<\/rt><\/ruby>く&quot;.  Si quiere expresar con firmeza que &quot;lo he hecho todo, no queda nada&quot;, se utiliza &quot;Verbo+<ruby>尽<rt>つ<\/rt><\/ruby>くす&quot;.<\/p>","text":"複合ふくごう動詞どうし・Verbos Compuestos (3) Verbo en forma-ます+きる/きりますSignificadoSe utiliza con dos significados: a) terminar de hacer todo de la acción expresada por el verbo anterior, o b) llevarla hasta el límite o hacerla por completo.Ejemplo de frase60さい歳としのはマラソンを最後さいごまで走はしりきった。 一日中いちにちじゅう立たちで、もう疲つかれきっています。NotaNota 6Verbo en forma-ます+抜ぬく/抜ぬきますSignificadoSignifica &quot;seguir haciendo la acción expresada por el verbo anterior hasta el final&quot; o &quot;hacerla hasta llegar al límite.Ejemplo de frase厳きびしいで、社長しゃちょうは従業員じゅうぎょういんを守まもり抜ぬいた。NotaNota 6Verbo en forma-ます+尽つくす/尽つくしますSignificadoSignifica &quot;realizar la acción expresada por el verbo anterior en la medida de lo posible&quot;, &quot;hacerla todo&quot; o &quot;hacerla por completo&quot;.Ejemplo de frase彼かれはそのい本ほんを一晩ひとばんで読よみ尽つくした。NotaNota 6Verbo en forma-ます+こ込こみむ/込こみますSignificadoSignifica lo siguiente: a) Entrar en algo, b) Hacer la acción expresada por el verbo que precede de forma intensa o profunda, c) Hacerla con cuidado o detenidamente, o d) Hacerla hasta el final.Ejemplo de frase乗客じょうきゃくがバスにどんどんり込こんでいった。 先生せんせいにされて、彼かれは黙だまり込こんでしまった。 説明書せつめいしょをみ込こんでから作業さぎょうを始はじめてください。Nota 6: ・ &quot;Verbo+きる&quot; tiene un significado más marcado de &quot;hacer algo hasta el final&quot; o &quot;hacer algo por completo&quot;.  &quot;Verbo+抜ぬく&quot; tiene un matiz más marcado de &quot;perseverar hasta el final a pesar de las dificultades&quot;.  Verbo+尽つくす&quot; transmite la idea de &quot;hacer todo lo posible&quot;, &quot;aprovechar hasta la última gota&quot; o &quot;hacer algo a fondo&quot;.  Si quiere decir &quot;he terminado bien&quot;, se utiliza &quot;Verbo+きる&quot;.  Si quiere destacar el esfuerzo o el trabajo duro, se utiliza &quot;Verbo+抜ぬく&quot;.  Si quiere expresar con firmeza que &quot;lo he hecho todo, no queda nada&quot;, se utiliza &quot;Verbo+尽つくす&quot;."},{"id":"L050","file":"20260824__KOTO__1_.docx","cat":"nom","catLabel":"Nominalización・こと・もの","title":"「こと」の色々な使い方（１）","titleRuby":"「こと」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>（１）","html":"<p class=\"lp\">- Sustantivo + の + こと + は/が/を/に/で・・・<\/p><p class=\"lp\">(“こと” usado en forma “sustantivo +の + こと” indica asuntos relacionados con el sustantivo que precede. En mayoría de los casos, “sustantivo +の + こと” puede sustituirse por “sustantivo+について”.)<\/p><p class=\"lp\"><ruby>最近<rt>さいきん<\/rt><\/ruby>、は<ruby>仕事<rt>しごと<\/rt><\/ruby>のことで<ruby>悩<rt>なや<\/rt><\/ruby>んでいるようだ。 ・ コロンビアにっても、<ruby>横浜<rt>よこはま<\/rt><\/ruby><ruby>国大<rt>こくだい<\/rt><\/ruby>のことは<ruby>忘<rt>わす<\/rt><\/ruby>れません。<\/p><p class=\"lp\"><ruby>来週<rt>らいしゅう<\/rt><\/ruby>ののことを<ruby>説明<rt>せつめい<\/rt><\/ruby>してください。 ・ <ruby>昨日<rt>きのう<\/rt><\/ruby>のことが<ruby>気<rt>き<\/rt><\/ruby>になって、あまり<ruby>眠<rt>ねむ<\/rt><\/ruby>れませんでした。<\/p><p class=\"lp\">- Verbo en forma diccionario + こと + は/が/を/に/で・・・<\/p><p class=\"lp\">(“こと” se utiliza para sustantivar verbo para que funcione como sujeto, objeto de una oración entera.)<\/p><p class=\"lp\">このではカードで<ruby>払<rt>はら<\/rt><\/ruby>うことができます。 ・ わたし<ruby>私<rt>わたくし<\/rt><\/ruby>はかな<ruby>音楽<rt>おんがく<\/rt><\/ruby>を<ruby>聴<rt>き<\/rt><\/ruby>くことが<ruby>好<rt>す<\/rt><\/ruby>きです。<\/p><p class=\"lp\"><ruby>朝<rt>あさ<\/rt><\/ruby><ruby>早<rt>はや<\/rt><\/ruby>くくことは<ruby>気持<rt>きも<\/rt><\/ruby>ちがいい。 ・  ・ <ruby>昨日<rt>きのう<\/rt><\/ruby><ruby>話<rt>はな<\/rt><\/ruby>したことは、<ruby>誰<rt>だれ<\/rt><\/ruby>にも<ruby>言<rt>い<\/rt><\/ruby>わないでください。<\/p><p class=\"lp\">- Oración en forma sencilla (+という) + こと + は/が/を/に/で・・・<\/p><p class=\"lp\">(“こと” se utiliza para hacer que la oración que precede funcione como sustantivo de tal que sirve como sujeto, objeto de una oración entera.  Se puede agregar “という” antes de “こと”.  Sin embargo, cuando la oración termina con un adjetivo tipo-な, se emplea la forma “Adjetivo en forma-な +こと” , “Adjetivo en forma-である +こと” o “Adjetivo en forma-だ +という +こと”.  En cambio, cuando la oración termina con predicado sustantivo (Sustantivo +だ), siempre lleva “という” antes de +こと”.)<\/p><p class=\"lp\">あのが<ruby>結婚<rt>けっこん<\/rt><\/ruby>する（という）ことが<ruby>発表<rt>はっぴょう<\/rt><\/ruby>された。<\/p><p class=\"lp\">このは、<ruby>司会者<rt>しかいしゃ<\/rt><\/ruby>の<ruby>話<rt>はなし<\/rt><\/ruby>がおもしろい（という）ことで<ruby>人気<rt>にんき<\/rt><\/ruby>があります。<\/p><p class=\"lp\">このマンガがで <ruby>有名<rt>ゆうめい<\/rt><\/ruby>なこと/<ruby>有名<rt>ゆうめい<\/rt><\/ruby>であること/<ruby>有名<rt>ゆうめい<\/rt><\/ruby>だということ をっていますか？<\/p><p class=\"lp\"><ruby>観光客<rt>かんこうきゃく<\/rt><\/ruby>は、この<ruby>山<rt>やま<\/rt><\/ruby>の<ruby>向<rt>む<\/rt><\/ruby>こうが<ruby>海<rt>うみ<\/rt><\/ruby>だということには<ruby>気<rt>き<\/rt><\/ruby>が<ruby>付<rt>つ<\/rt><\/ruby>かない。<\/p><p class=\"lp\">- Oración en forma sencilla + とのことだ/ということだ<\/p><p class=\"lp\">(Esta expresión se utiliza para transmitir información denotada en la Oración, que alguien ha dicho o que la gente en general dice.  La forma “とのことだ” tiende a ser más en el lenguaje escrito.)<\/p><p class=\"lp\">ニュースによると、は<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>るとのことだ。　　<ruby>山田<rt>やまだ<\/rt><\/ruby>さんからで、<ruby>少<rt>すこ<\/rt><\/ruby>し<ruby>遅<rt>おく<\/rt><\/ruby>れるということです。<\/p><p class=\"lp\"><ruby>部長<rt>ぶちょう<\/rt><\/ruby>から、するなということです。 ・ <ruby>新聞<rt>しんぶん<\/rt><\/ruby>によると、<ruby>日本<rt>にっぽん<\/rt><\/ruby>のが<ruby>減<rt>へ<\/rt><\/ruby>っているとのことです。<\/p><p class=\"lp\">- Sustantivo1 +とは/というのは + [Sustantivo2 +の” / “Verbo en forma sencilla +という] + ことだ<\/p><p class=\"lp\">(Esta expresión se utiliza para explicar el significado del Sustantivo1 o definirlo con otras palabras.)<\/p><p class=\"lp\">スタバとはスターバックスのことだ。 ・  ・ <ruby>立入禁止<rt>たちいりきんし<\/rt><\/ruby>というのは、<ruby>入<rt>はい<\/rt><\/ruby>ってはいけないということだ。<\/p><p class=\"lp\"><ruby>良<rt>よ<\/rt><\/ruby>いとは、<ruby>生徒<rt>せいと<\/rt><\/ruby>のことを<ruby>理解<rt>りかい<\/rt><\/ruby>してあげられる<ruby>先生<rt>せんせい<\/rt><\/ruby>のことだ。<\/p><p class=\"lp\">- Verbo en forma-た (tiempo pasado) + ことがある<\/p><p class=\"lp\">(Esta expresión se usa para mencionar alguna experiencia ya vivida en el momento en que está hablando.  En este caso, hay que tener en cuenta que no debe utilizarse junto con palabras que indiquen un pasado reciente o palabras que indiquen frecuencia.)<\/p><p class=\"lp\">カエルをべたことがありますか？ ・  ・ ３、<ruby>学校<rt>がっこう<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>んだことが<ruby>一度<rt>いちど<\/rt><\/ruby>もありません。<\/p><p class=\"lp\"><ruby>子<rt>こ<\/rt><\/ruby>どものに、<ruby>日本<rt>にっぽん<\/rt><\/ruby>に<ruby>来<rt>き<\/rt><\/ruby>たことがあります。 ・ １０ほど<ruby>前<rt>まえ<\/rt><\/ruby>に、<ruby>東京<rt>とうきょう<\/rt><\/ruby>タワーに<ruby>行<rt>い<\/rt><\/ruby>ったことがある。<\/p><p class=\"lp\">- [Verbo en forma diccionario (tiempo no pretérito) o Verbo en forma-ない / Adjetivo en forma diccionario / Sustantivo +の] + ことがある<\/p><p class=\"lp\">(Esta expresión se usa para mencionar una acción o situación que sucede a veces u ocasionalmente pero que no sea habitual.  Cuando se utilizan en este sentido, a menudo adverbios como “ときどき”, “たまに” o “まれに” se emplean juntas.)<\/p><p class=\"lp\"><ruby>朝<rt>あさ<\/rt><\/ruby>やは、バスが<ruby>遅<rt>おく<\/rt><\/ruby>れることがあります。 ・ <ruby>雨<rt>あめ<\/rt><\/ruby>がった<ruby>後<rt>あと<\/rt><\/ruby>に、ときどき<ruby>虹<rt>にじ<\/rt><\/ruby>がでることがある。<\/p><p class=\"lp\"><ruby>心配事<rt>しんぱいごと<\/rt><\/ruby>があると、たまにれないことがある。 ・ <ruby>晴<rt>は<\/rt><\/ruby>れの<ruby>日<rt>ひ<\/rt><\/ruby>のは、<ruby>富士山<rt>ふじさん<\/rt><\/ruby>が<ruby>赤<rt>あか<\/rt><\/ruby>いことがあります。<\/p><p class=\"lp\"><ruby>日本<rt>にっぽん<\/rt><\/ruby>にいると、<ruby>国<rt>くに<\/rt><\/ruby>が<ruby>恋<rt>こい<\/rt><\/ruby>しいことがあります。 ・ <ruby>忙<rt>いそが<\/rt><\/ruby>しいには、<ruby>週末<rt>しゅうまつ<\/rt><\/ruby>も<ruby>仕事<rt>しごと<\/rt><\/ruby>のことがある。<\/p><p class=\"lp\">- [Verbo en forma diccionario (tiempo no pretérito) o Verbo en forma-ない / Adjetivo en forma diccionario / Sustantivo +の] + こともある<\/p><p class=\"lp\">(Esta expresión se emplea de mismo modo que el uso 7 arriba.  Sin embargo, es más natural utilizar “こともある”, cuando se enumeran varias opciones en paralelo, o cuando el oyente reconoce que lo habitual es  contrario.)<\/p><p class=\"lp\"><ruby>毎朝<rt>まいあさ<\/rt><\/ruby>6じ<ruby>時<rt>じ<\/rt><\/ruby>に<ruby>起<rt>お<\/rt><\/ruby>きるが、<ruby>起<rt>お<\/rt><\/ruby>きられないこともある。 ・ 　<ruby>昼食<rt>ちゅうしょく<\/rt><\/ruby>はお<ruby>弁当<rt>べんとう<\/rt><\/ruby>のこともあれば、<ruby>外食<rt>がいしょく<\/rt><\/ruby>することもある。<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>の<ruby>話<rt>はなし<\/rt><\/ruby>はいつも<ruby>長<rt>なが<\/rt><\/ruby>いが、<ruby>短<rt>みじか<\/rt><\/ruby>いこともあります。 ・ 　<ruby>一人暮<rt>ひとりぐ<\/rt><\/ruby>らしは<ruby>気楽<rt>きらく<\/rt><\/ruby>ですが、さびしいこともあります。<\/p><p class=\"lp\"><ruby>風呂<rt>ふろ<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>らず、シャワーだけのこともあります。 ・ 　<ruby>朝食<rt>ちょうしょく<\/rt><\/ruby>はいつもトーストですが、ごはん<ruby>飯<rt>めし<\/rt><\/ruby>のこともあります。<\/p>","text":"「こと」の色々いろいろな使しい方ほう（１） - Sustantivo + の + こと + は/が/を/に/で・・・(“こと” usado en forma “sustantivo +の + こと” indica asuntos relacionados con el sustantivo que precede. En mayoría de los casos, “sustantivo +の + こと” puede sustituirse por “sustantivo+について”.)最近さいきん、は仕事しごとのことで悩なやんでいるようだ。 ・ コロンビアにっても、横浜よこはま国大こくだいのことは忘わすれません。来週らいしゅうののことを説明せつめいしてください。 ・ 昨日きのうのことが気きになって、あまり眠ねむれませんでした。- Verbo en forma diccionario + こと + は/が/を/に/で・・・(“こと” se utiliza para sustantivar verbo para que funcione como sujeto, objeto de una oración entera.)このではカードで払はらうことができます。 ・ わたし私わたくしはかな音楽おんがくを聴きくことが好すきです。朝あさ早はやくくことは気持きもちがいい。 ・  ・ 昨日きのう話はなしたことは、誰だれにも言いわないでください。- Oración en forma sencilla (+という) + こと + は/が/を/に/で・・・(“こと” se utiliza para hacer que la oración que precede funcione como sustantivo de tal que sirve como sujeto, objeto de una oración entera.  Se puede agregar “という” antes de “こと”.  Sin embargo, cuando la oración termina con un adjetivo tipo-な, se emplea la forma “Adjetivo en forma-な +こと” , “Adjetivo en forma-である +こと” o “Adjetivo en forma-だ +という +こと”.  En cambio, cuando la oración termina con predicado sustantivo (Sustantivo +だ), siempre lleva “という” antes de +こと”.)あのが結婚けっこんする（という）ことが発表はっぴょうされた。このは、司会者しかいしゃの話はなしがおもしろい（という）ことで人気にんきがあります。このマンガがで 有名ゆうめいなこと/有名ゆうめいであること/有名ゆうめいだということ をっていますか？観光客かんこうきゃくは、この山やまの向むこうが海うみだということには気きが付つかない。- Oración en forma sencilla + とのことだ/ということだ(Esta expresión se utiliza para transmitir información denotada en la Oración, que alguien ha dicho o que la gente en general dice.  La forma “とのことだ” tiende a ser más en el lenguaje escrito.)ニュースによると、は雨あめが降ふるとのことだ。　　山田やまださんからで、少すこし遅おくれるということです。部長ぶちょうから、するなということです。 ・ 新聞しんぶんによると、日本にっぽんのが減へっているとのことです。- Sustantivo1 +とは/というのは + [Sustantivo2 +の” / “Verbo en forma sencilla +という] + ことだ(Esta expresión se utiliza para explicar el significado del Sustantivo1 o definirlo con otras palabras.)スタバとはスターバックスのことだ。 ・  ・ 立入禁止たちいりきんしというのは、入はいってはいけないということだ。良よいとは、生徒せいとのことを理解りかいしてあげられる先生せんせいのことだ。- Verbo en forma-た (tiempo pasado) + ことがある(Esta expresión se usa para mencionar alguna experiencia ya vivida en el momento en que está hablando.  En este caso, hay que tener en cuenta que no debe utilizarse junto con palabras que indiquen un pasado reciente o palabras que indiquen frecuencia.)カエルをべたことがありますか？ ・  ・ ３、学校がっこうを休やすんだことが一度いちどもありません。子こどものに、日本にっぽんに来きたことがあります。 ・ １０ほど前まえに、東京とうきょうタワーに行いったことがある。- [Verbo en forma diccionario (tiempo no pretérito) o Verbo en forma-ない / Adjetivo en forma diccionario / Sustantivo +の] + ことがある(Esta expresión se usa para mencionar una acción o situación que sucede a veces u ocasionalmente pero que no sea habitual.  Cuando se utilizan en este sentido, a menudo adverbios como “ときどき”, “たまに” o “まれに” se emplean juntas.)朝あさやは、バスが遅おくれることがあります。 ・ 雨あめがった後あとに、ときどき虹にじがでることがある。心配事しんぱいごとがあると、たまにれないことがある。 ・ 晴はれの日ひのは、富士山ふじさんが赤あかいことがあります。日本にっぽんにいると、国くにが恋こいしいことがあります。 ・ 忙いそがしいには、週末しゅうまつも仕事しごとのことがある。- [Verbo en forma diccionario (tiempo no pretérito) o Verbo en forma-ない / Adjetivo en forma diccionario / Sustantivo +の] + こともある(Esta expresión se emplea de mismo modo que el uso 7 arriba.  Sin embargo, es más natural utilizar “こともある”, cuando se enumeran varias opciones en paralelo, o cuando el oyente reconoce que lo habitual es  contrario.)毎朝まいあさ6じ時じに起おきるが、起おきられないこともある。 ・ 　昼食ちゅうしょくはお弁当べんとうのこともあれば、外食がいしょくすることもある。彼かれの話はなしはいつも長ながいが、短みじかいこともあります。 ・ 　一人暮ひとりぐらしは気楽きらくですが、さびしいこともあります。風呂ふろに入はいらず、シャワーだけのこともあります。 ・ 　朝食ちょうしょくはいつもトーストですが、ごはん飯めしのこともあります。"},{"id":"L051","file":"20260824__MONO__2_.docx","cat":"nom","catLabel":"Nominalización・こと・もの","title":"「もの」の色々な使い方（２）","titleRuby":"「もの」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>（２）","html":"<p class=\"lp\">- [Adjetivo en forma diccionario / Verbo en forma diccionario / Verbo en forma-ない] + ものがある<\/p><p class=\"lp\">(Esta expresión se usa para transmitir el matiz de “tener un cierto sentimiento hacia algo”, acompañado de la emoción o la valoración del hablante.  En el lenguaje hablado, se puede esxpresar como “もんがある” en vez de “ものがある”.)<\/p><p class=\"lp\">あの<ruby>食堂<rt>しょくどう<\/rt><\/ruby>が<ruby>閉店<rt>へいてん<\/rt><\/ruby>するのは<ruby>寂<rt>さび<\/rt><\/ruby>しいものがある。 ・ <ruby>大臣<rt>だいじん<\/rt><\/ruby>のその<ruby>発言<rt>はつげん<\/rt><\/ruby>には、<ruby>不適切<rt>ふてきせつ<\/rt><\/ruby>なものがあります。<\/p><p class=\"lp\"><ruby>彼女<rt>かのじょ<\/rt><\/ruby>の<ruby>歌<rt>うた<\/rt><\/ruby>は、<ruby>聞<rt>き<\/rt><\/ruby>く<ruby>人<rt>ひと<\/rt><\/ruby>を<ruby>感動<rt>かんどう<\/rt><\/ruby>させるものがある。 ・ その<ruby>話<rt>はなし<\/rt><\/ruby>には、<ruby>納得<rt>なっとく<\/rt><\/ruby>できないものがあります。<\/p><p class=\"lp\">- [Sustantivo +な / Adjetivo en forma sencilla / Verbo en forma sencilla] +ものだから/もので、+ Predicado<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar la causa o la razón de lo que se expresa en el predicado. A menudo, se utiliza para expresar disculpas o excusas de un matiz que “Realmente no quería ~, pero ~”. En el lenguaje hablado, se puede expresar como “もんだから” en vez de “ものだから”, o “もんで” en vez de “もので”.)<\/p><p class=\"lp\"><ruby>出張<rt>しゅっちょう<\/rt><\/ruby>なものですから、<ruby>会議<rt>かいぎ<\/rt><\/ruby>は<ruby>欠席<rt>けっせき<\/rt><\/ruby>します。 ・ パンが<ruby>安<rt>やす<\/rt><\/ruby>かったもので、つい<ruby>買<rt>か<\/rt><\/ruby>いすぎました。<\/p><p class=\"lp\">ビールは<ruby>苦手<rt>にがて<\/rt><\/ruby>なものだから、ワインにする。 ・ <ruby>電車<rt>でんしゃ<\/rt><\/ruby>が<ruby>遅<rt>おく<\/rt><\/ruby>れたもので、<ruby>約束<rt>やくそく<\/rt><\/ruby>に<ruby>間<rt>ま<\/rt><\/ruby>に<ruby>合<rt>あ<\/rt><\/ruby>いませんでした。<\/p><p class=\"lp\">- [Sustantivo +である/ Adjetivo en forma sencilla / Verbo en forma sencilla] + ものの、+ Predicado<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar una situación que va contra una prevision o expectativa, o una situación antagónica desde el punto de vista semántico.)<\/p><p class=\"lp\"><ruby>休日<rt>きゅうじつ<\/rt><\/ruby>であるものの、<ruby>電車<rt>でんしゃ<\/rt><\/ruby>は<ruby>混<rt>こ<\/rt><\/ruby>んでいます。 ・  ・ <ruby>今<rt>いま<\/rt><\/ruby>の<ruby>会社<rt>かいしゃ<\/rt><\/ruby>は、<ruby>給料<rt>きゅうりょう<\/rt><\/ruby>は<ruby>安<rt>やす<\/rt><\/ruby>いものの、<ruby>仕事<rt>しごと<\/rt><\/ruby>は<ruby>楽<rt>たの<\/rt><\/ruby>しい。<\/p><p class=\"lp\">この<ruby>家<rt>いえ<\/rt><\/ruby>は、<ruby>駅<rt>えき<\/rt><\/ruby>から<ruby>近<rt>ちか<\/rt><\/ruby>くて<ruby>便利<rt>べんり<\/rt><\/ruby>なものの、<ruby>家賃<rt>やちん<\/rt><\/ruby>が<ruby>高<rt>たか<\/rt><\/ruby>い。 ・ <ruby>欲<rt>ほ<\/rt><\/ruby>しかった<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>買<rt>か<\/rt><\/ruby>ったものの、<ruby>読<rt>よ<\/rt><\/ruby>んでいない。<\/p><p class=\"lp\">- [Sustantivo (+だ) / Adjetivo en forma sencilla / Verbo en forma sencilla] + とはいうものの、+ Predicado<\/p><p class=\"lp\">(Esta expresión se utiliza para reconocer un hecho determinado, al tiempo que se indica que la situación real difiere de él.)<\/p><p class=\"lp\">４<ruby>月<rt>がつ<\/rt><\/ruby>とはいうものの、まだ<ruby>暖<rt>あたた<\/rt><\/ruby>かくない。　　　<ruby>今日<rt>きょう<\/rt><\/ruby>は<ruby>寒<rt>さむ<\/rt><\/ruby>いとはいうものの、コートを<ruby>着<rt>き<\/rt><\/ruby>なくても<ruby>大丈夫<rt>だいじょうぶ<\/rt><\/ruby>だ。<\/p><p class=\"lp\">この<ruby>辺<rt>へん<\/rt><\/ruby>は<ruby>静<rt>しず<\/rt><\/ruby>かだとはいうものの、<ruby>道<rt>みち<\/rt><\/ruby>が<ruby>暗<rt>くら<\/rt><\/ruby>い。 ・ <ruby>梅雨<rt>つゆ<\/rt><\/ruby>が<ruby>明<rt>あ<\/rt><\/ruby>けたとはいうものの、<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>続<rt>つづ<\/rt><\/ruby>いている。<\/p><p class=\"lp\">- Expresiones fijas con “もの”<\/p><p class=\"lp\">- ものにする　 ・ (Se utiliza para significar “obtenerlo” o “hacerlo propio”, o “adquirir una habilidad o conocimiento”.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>弁護士<rt>べんごし<\/rt><\/ruby>の<ruby>資格<rt>しかく<\/rt><\/ruby>をものにした。 ・  ・ <ruby>外国語<rt>がいこくご<\/rt><\/ruby>をものにするには<ruby>努力<rt>どりょく<\/rt><\/ruby>が<ruby>必要<rt>ひつよう<\/rt><\/ruby>です。<\/p><p class=\"lp\">- ものになる ・ (Se utiliza para significar “convertirse en una persona hecha y derecha”, “aprovechar las habilidades adquiridas” o “hacer realidad las propias aspiraciones”.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>は、<ruby>将来的<rt>しょうらいてき<\/rt><\/ruby>にはものになりそうだ。　　<ruby>子供<rt>こども<\/rt><\/ruby>に<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>習<rt>なら<\/rt><\/ruby>いごと<ruby>事<rt>こと<\/rt><\/ruby>をさせたが、どれもものにならなかった。<\/p><p class=\"lp\">- ものを<ruby>言<rt>げん<\/rt><\/ruby>う　 ・ (Se utiliza cuando algo resulta útil o eficaz para hacer algo.)<\/p><p class=\"lp\">こういった<ruby>場合<rt>ばあい<\/rt><\/ruby>には<ruby>経験<rt>けいけん<\/rt><\/ruby>がものをい<ruby>言<rt>げん<\/rt><\/ruby>う。 ・ <ruby>彼<rt>かれ<\/rt><\/ruby>は、<ruby>金<rt>かね<\/rt><\/ruby>にものを<ruby>言<rt>い<\/rt><\/ruby>わせて、<ruby>土地<rt>とち<\/rt><\/ruby>を<ruby>買<rt>か<\/rt><\/ruby>い<ruby>占<rt>し<\/rt><\/ruby>めた。<\/p><p class=\"lp\">- ものともせず ・ (Es una expresión que denota el acto de superar dificultades u obstáculos importantes sin dejarse vencer por ellos.)<\/p><p class=\"lp\"><ruby>周囲<rt>しゅうい<\/rt><\/ruby>の<ruby>反対<rt>はんたい<\/rt><\/ruby>をものともせず、<ruby>二人<rt>ふたり<\/rt><\/ruby>は<ruby>結婚<rt>けっこん<\/rt><\/ruby>した。 ・ <ruby>大雪<rt>おおゆき<\/rt><\/ruby>をものともせず、<ruby>鉄道<rt>てつどう<\/rt><\/ruby>は<ruby>定時<rt>ていじ<\/rt><\/ruby><ruby>運行<rt>うんこう<\/rt><\/ruby>している。<\/p><p class=\"lp\">- ものわかり（<ruby>物<rt>もの<\/rt><\/ruby><ruby>分<rt>ぶん<\/rt><\/ruby>かり） ・ (Se refiere a la capacidad o grado de entender las cosas.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>物<rt>もの<\/rt><\/ruby><ruby>分<rt>わ<\/rt><\/ruby>かりが<ruby>良<rt>よ<\/rt><\/ruby>いから、<ruby>質問<rt>しつもん<\/rt><\/ruby>しなかった。 ・ 　　<ruby>新入<rt>しんにゅう<\/rt><\/ruby><ruby>社員<rt>しゃいん<\/rt><\/ruby>は<ruby>物<rt>もの<\/rt><\/ruby><ruby>分<rt>わ<\/rt><\/ruby>かりが<ruby>早<rt>はや<\/rt><\/ruby>く、<ruby>研修<rt>けんしゅう<\/rt><\/ruby>が<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>終<rt>お<\/rt><\/ruby>わった。<\/p>","text":"「もの」の色々いろいろな使しい方ほう（２） - [Adjetivo en forma diccionario / Verbo en forma diccionario / Verbo en forma-ない] + ものがある(Esta expresión se usa para transmitir el matiz de “tener un cierto sentimiento hacia algo”, acompañado de la emoción o la valoración del hablante.  En el lenguaje hablado, se puede esxpresar como “もんがある” en vez de “ものがある”.)あの食堂しょくどうが閉店へいてんするのは寂さびしいものがある。 ・ 大臣だいじんのその発言はつげんには、不適切ふてきせつなものがあります。彼女かのじょの歌うたは、聞きく人ひとを感動かんどうさせるものがある。 ・ その話はなしには、納得なっとくできないものがあります。- [Sustantivo +な / Adjetivo en forma sencilla / Verbo en forma sencilla] +ものだから/もので、+ Predicado(Esta expresión se utiliza para indicar la causa o la razón de lo que se expresa en el predicado. A menudo, se utiliza para expresar disculpas o excusas de un matiz que “Realmente no quería ~, pero ~”. En el lenguaje hablado, se puede expresar como “もんだから” en vez de “ものだから”, o “もんで” en vez de “もので”.)出張しゅっちょうなものですから、会議かいぎは欠席けっせきします。 ・ パンが安やすかったもので、つい買かいすぎました。ビールは苦手にがてなものだから、ワインにする。 ・ 電車でんしゃが遅おくれたもので、約束やくそくに間まに合あいませんでした。- [Sustantivo +である/ Adjetivo en forma sencilla / Verbo en forma sencilla] + ものの、+ Predicado(Esta expresión se utiliza para indicar una situación que va contra una prevision o expectativa, o una situación antagónica desde el punto de vista semántico.)休日きゅうじつであるものの、電車でんしゃは混こんでいます。 ・  ・ 今いまの会社かいしゃは、給料きゅうりょうは安やすいものの、仕事しごとは楽たのしい。この家いえは、駅えきから近ちかくて便利べんりなものの、家賃やちんが高たかい。 ・ 欲ほしかった本ほんを買かったものの、読よんでいない。- [Sustantivo (+だ) / Adjetivo en forma sencilla / Verbo en forma sencilla] + とはいうものの、+ Predicado(Esta expresión se utiliza para reconocer un hecho determinado, al tiempo que se indica que la situación real difiere de él.)４月がつとはいうものの、まだ暖あたたかくない。　　　今日きょうは寒さむいとはいうものの、コートを着きなくても大丈夫だいじょうぶだ。この辺へんは静しずかだとはいうものの、道みちが暗くらい。 ・ 梅雨つゆが明あけたとはいうものの、雨あめが続つづいている。- Expresiones fijas con “もの”- ものにする　 ・ (Se utiliza para significar “obtenerlo” o “hacerlo propio”, o “adquirir una habilidad o conocimiento”.)彼かれは弁護士べんごしの資格しかくをものにした。 ・  ・ 外国語がいこくごをものにするには努力どりょくが必要ひつようです。- ものになる ・ (Se utiliza para significar “convertirse en una persona hecha y derecha”, “aprovechar las habilidades adquiridas” o “hacer realidad las propias aspiraciones”.)彼かれは、将来的しょうらいてきにはものになりそうだ。　　子供こどもに色々いろいろな習ならいごと事ことをさせたが、どれもものにならなかった。- ものを言げんう　 ・ (Se utiliza cuando algo resulta útil o eficaz para hacer algo.)こういった場合ばあいには経験けいけんがものをい言げんう。 ・ 彼かれは、金かねにものを言いわせて、土地とちを買かい占しめた。- ものともせず ・ (Es una expresión que denota el acto de superar dificultades u obstáculos importantes sin dejarse vencer por ellos.)周囲しゅういの反対はんたいをものともせず、二人ふたりは結婚けっこんした。 ・ 大雪おおゆきをものともせず、鉄道てつどうは定時ていじ運行うんこうしている。- ものわかり（物もの分ぶんかり） ・ (Se refiere a la capacidad o grado de entender las cosas.)彼かれは物もの分わかりが良よいから、質問しつもんしなかった。 ・ 　　新入しんにゅう社員しゃいんは物もの分わかりが早はやく、研修けんしゅうが早はやく終おわった。"},{"id":"L052","file":"20260831_Verbos_Compuestos__4_.docx","cat":"vcomp","catLabel":"Verbos compuestos","title":"複合動詞・Verbos Compuestos (4)","titleRuby":"<ruby>複合<rt>ふくごう<\/rt><\/ruby><ruby>動詞<rt>どうし<\/rt><\/ruby>・Verbos Compuestos (4)","html":"<div class=\"ltable\"><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>直<rt>なお<\/rt><\/ruby>す/<ruby>直<rt>なお<\/rt><\/ruby>します<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Expresa los significados de &quot;volver a hacer&quot;, &quot;repetir&quot; o &quot;mejorar&quot;. No se trata simplemente de &quot;intentarlo otra vez&quot;, sino de &quot;intentarlo otra vez con la intención de hacerlo mejor que la vez anterior&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>忘<rt>わす<\/rt><\/ruby>れないようえた<ruby>字<rt>じ<\/rt><\/ruby>を<ruby>書<rt>か<\/rt><\/ruby>き<ruby>直<rt>なお<\/rt><\/ruby>しておいた。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 7<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>返<rt>かえ<\/rt><\/ruby>す/<ruby>返<rt>かえ<\/rt><\/ruby>します<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">significa a) volver a realizar la acción del verbo o repetirla varias veces, b) responder de la misma manera a lo que ha hecho la otra persona, o c) devolver algo a la otra persona o a su lugar original.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\">このはおもしろくて、<ruby>何度<rt>なんど<\/rt><\/ruby>も<ruby>読<rt>よ<\/rt><\/ruby>み<ruby>返<rt>かえ<\/rt><\/ruby>しました。 <ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>注意<rt>ちゅうい<\/rt><\/ruby>されても、<ruby>言<rt>い<\/rt><\/ruby>い<ruby>返<rt>かえ<\/rt><\/ruby>します。 グラウンドからんできたボールを<ruby>投<rt>な<\/rt><\/ruby>げ<ruby>返<rt>かえ<\/rt><\/ruby>した。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 7<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>合<rt>あ<\/rt><\/ruby>う/<ruby>合<rt>あ<\/rt><\/ruby>います<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Se utiliza para añadir al verbo anterior el significado de &quot;mutuamente&quot;, &quot;juntos&quot; o &quot;con la otra persona&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\"><ruby>学園祭<rt>がくえんさい<\/rt><\/ruby>のめかた<ruby>方<rt>ほう<\/rt><\/ruby>について<ruby>委員会<rt>いいんかい<\/rt><\/ruby>で<ruby>話<rt>はな<\/rt><\/ruby>し<ruby>合<rt>あ<\/rt><\/ruby>った。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 8<\/span><\/div><\/div><div class=\"lrow\"><div class=\"lc-h jp\">Verbo en forma-ます+<ruby>合<rt>あ<\/rt><\/ruby>わせる/<ruby>合<rt>あ<\/rt><\/ruby>わせます<\/div><div class=\"lc-r\"><span class=\"lc-l\">Significado<\/span><span class=\"jp\">Significa &quot;hacer algo juntos&quot; o &quot;ajustarse a la otra persona o a la situación&quot;. Se transmite la sensación de que se lleva a cabo en relación con &quot;otra persona, otra cosa o una situación&quot;.<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Ejemplo de frase<\/span><span class=\"jp\">３に<ruby>駅前<rt>えきまえ<\/rt><\/ruby>のスタバで<ruby>待<rt>ま<\/rt><\/ruby>ち<ruby>合<rt>あ<\/rt><\/ruby>わせましょう。<\/span><\/div><div class=\"lc-r\"><span class=\"lc-l\">Nota<\/span><span class=\"jp\">Nota 8<\/span><\/div><\/div><\/div><p class=\"lnote\">Nota 7: ・ Uno de los significados de &quot;Verbo+<ruby>返<rt>かえ<\/rt><\/ruby>す&quot; es &quot;repetir misma acción&quot;, lo cual es similar a &quot;Verbo+<ruby>直<rt>なお<\/rt><\/ruby>す&quot;. La diferencia radica en que, meintras que &quot;Verbo+<ruby>直<rt>じか<\/rt><\/ruby>す（なお）&quot; tiene matiz de &quot;volver a hacer algo con la intensión de mejorarlo, &quot;Verbo+<ruby>返<rt>かえ<\/rt><\/ruby>す&quot; se refiere a repetir la misma acción, ya sea propia o de otra persona.<\/p><p class=\"lnote\">Nota 8: ・ &quot;Verbo+<ruby>合<rt>あ<\/rt><\/ruby>う&quot; transmite la idea de que &quot;eso ocurre de forma natural dentro de una relación&quot; o de que &quot;ambas partes actúan en pie de igualdad&quot;.  Por el contrario, &quot;Verbo+<ruby>合<rt>あ<\/rt><\/ruby>わせる&quot; implica la intención o el elemento de control de &quot;que alguien adapte o ajuste algo a otra cosa&quot;.<\/p>","text":"複合ふくごう動詞どうし・Verbos Compuestos (4) Verbo en forma-ます+直なおす/直なおしますSignificadoExpresa los significados de &quot;volver a hacer&quot;, &quot;repetir&quot; o &quot;mejorar&quot;. No se trata simplemente de &quot;intentarlo otra vez&quot;, sino de &quot;intentarlo otra vez con la intención de hacerlo mejor que la vez anterior&quot;.Ejemplo de frase忘わすれないようえた字じを書かき直なおしておいた。NotaNota 7Verbo en forma-ます+返かえす/返かえしますSignificadosignifica a) volver a realizar la acción del verbo o repetirla varias veces, b) responder de la misma manera a lo que ha hecho la otra persona, o c) devolver algo a la otra persona o a su lugar original.Ejemplo de fraseこのはおもしろくて、何度なんども読よみ返かえしました。 彼かれは注意ちゅういされても、言いい返かえします。 グラウンドからんできたボールを投なげ返かえした。NotaNota 7Verbo en forma-ます+合あう/合あいますSignificadoSe utiliza para añadir al verbo anterior el significado de &quot;mutuamente&quot;, &quot;juntos&quot; o &quot;con la otra persona&quot;.Ejemplo de frase学園祭がくえんさいのめかた方ほうについて委員会いいんかいで話はなし合あった。NotaNota 8Verbo en forma-ます+合あわせる/合あわせますSignificadoSignifica &quot;hacer algo juntos&quot; o &quot;ajustarse a la otra persona o a la situación&quot;. Se transmite la sensación de que se lleva a cabo en relación con &quot;otra persona, otra cosa o una situación&quot;.Ejemplo de frase３に駅前えきまえのスタバで待まち合あわせましょう。NotaNota 8Nota 7: ・ Uno de los significados de &quot;Verbo+返かえす&quot; es &quot;repetir misma acción&quot;, lo cual es similar a &quot;Verbo+直なおす&quot;. La diferencia radica en que, meintras que &quot;Verbo+直じかす（なお）&quot; tiene matiz de &quot;volver a hacer algo con la intensión de mejorarlo, &quot;Verbo+返かえす&quot; se refiere a repetir la misma acción, ya sea propia o de otra persona.Nota 8: ・ &quot;Verbo+合あう&quot; transmite la idea de que &quot;eso ocurre de forma natural dentro de una relación&quot; o de que &quot;ambas partes actúan en pie de igualdad&quot;.  Por el contrario, &quot;Verbo+合あわせる&quot; implica la intención o el elemento de control de &quot;que alguien adapte o ajuste algo a otra cosa&quot;."},{"id":"L053","file":"20260831__KOTO___2_.docx","cat":"nom","catLabel":"Nominalización・こと・もの","title":"「こと」の色々な使い方（２）","titleRuby":"「こと」の<ruby>色々<rt>いろいろ<\/rt><\/ruby>な<ruby>使<rt>し<\/rt><\/ruby>い<ruby>方<rt>ほう<\/rt><\/ruby>（２）","html":"<p class=\"lp\">- [Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことにする<\/p><p class=\"lp\">(Esta expresión se usa para indicar la decisión por voluntad propia de hacer o no hacer algo denotado por el verbo.  “ことにする” puede sustituirse por “こととする” que se considera una expresión ligeramente rebuscada.)<\/p><p class=\"lp\"><ruby>次<rt>つぎ<\/rt><\/ruby>のみは<ruby>国<rt>くに<\/rt><\/ruby>へ<ruby>帰<rt>かえ<\/rt><\/ruby>ることにします。 ・  ・ あした<ruby>明日<rt>あす<\/rt><\/ruby>から、30ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>ジョギングをすることにしました。<\/p><p class=\"lp\"><ruby>健康<rt>けんこう<\/rt><\/ruby>のため、い<ruby>物<rt>もの<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べないことにした。 ・ <ruby>来年度<rt>らいねんど<\/rt><\/ruby>も、こので<ruby>事業<rt>じぎょう<\/rt><\/ruby>を<ruby>進<rt>すす<\/rt><\/ruby>めることとする。<\/p><p class=\"lp\">- [Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことにしている<\/p><p class=\"lp\">(Esta expresión se usa para indicar un hábito decidido previamente por voluntad propia para hacer o dejar de hacer algo y que sigue practicando.  “ことにしている” puede sustituirse por “こととしている” que se considera una expresión ligeramente rebuscada.)<\/p><p class=\"lp\"><ruby>毎日<rt>まいにち<\/rt><\/ruby>、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>することにしています。 ・ <ruby>寝<rt>ね<\/rt><\/ruby>るは<ruby>必<rt>かなら<\/rt><\/ruby>ずお<ruby>風呂<rt>ふろ<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>ることにしている。<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>のうことは<ruby>信<rt>しん<\/rt><\/ruby>じないことにしている。 ・ わがは、<ruby>残業<rt>ざんぎょう<\/rt><\/ruby><ruby>時間<rt>じかん<\/rt><\/ruby>を<ruby>厳<rt>きび<\/rt><\/ruby>しく<ruby>管理<rt>かんり<\/rt><\/ruby>することとしています。<\/p><p class=\"lp\">- Verbo en forma-た (tiempo pasado) + ことにする<\/p><p class=\"lp\">(Esta expresión se utiliza para expresar que se decide que algo es así, o que se considera así, aunque en realidad no sea así.  A menudo, se utiliza cuando se alteran los hechos para adaptarlos a la conveniencia propia aunque no sea realmente el caso.)<\/p><p class=\"lp\"><ruby>風邪<rt>かぜ<\/rt><\/ruby>をひいたことにして、<ruby>学校<rt>がっこう<\/rt><\/ruby>を<ruby>休<rt>きゅう<\/rt><\/ruby>んだ。 ・ このは<ruby>聞<rt>き<\/rt><\/ruby>かなかったことにしてください。<\/p><p class=\"lp\">AIでったを<ruby>自分<rt>じぶん<\/rt><\/ruby>で<ruby>考<rt>かんが<\/rt><\/ruby>えたことにした。 ・ あのとの<ruby>契約<rt>けいやく<\/rt><\/ruby>の<ruby>話<rt>はなし<\/rt><\/ruby>はなかったことにしましょう。<\/p><p class=\"lp\">- [Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことになる<\/p><p class=\"lp\">(Esta expresión se usa para expresar que algo denotado por el verbo sucede por una decisión ajena a uno mismo.  También se utiliza cuando se desea expresar algo decidido por voluntad propia de forma indirecta y modesta.  “ことになる” puede sustituirse por “こととなる” que se considera una expresión ligeramente rebuscada.)<\/p><p class=\"lp\"><ruby>父親<rt>ちちおや<\/rt><\/ruby>ので、<ruby>東京<rt>とうきょう<\/rt><\/ruby>にひ<ruby>引<rt>いん<\/rt><\/ruby>っ<ruby>越<rt>こ<\/rt><\/ruby>すことになった。 ・ 　　<ruby>来月<rt>らいげつ<\/rt><\/ruby>からで<ruby>中国<rt>ちゅうごく<\/rt><\/ruby>へ<ruby>出張<rt>しゅっちょう<\/rt><\/ruby>することになった。<\/p><p class=\"lp\"><ruby>僕<rt>ぼく<\/rt><\/ruby>たち、の<ruby>春<rt>はる<\/rt><\/ruby>に<ruby>結婚<rt>けっこん<\/rt><\/ruby>することになりました。 ・ 　　<ruby>津波<rt>つなみ<\/rt><\/ruby><ruby>警報<rt>けいほう<\/rt><\/ruby>がされ、<ruby>避難<rt>ひなん<\/rt><\/ruby>することとなった。<\/p><p class=\"lp\">- [Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことになっている<\/p><p class=\"lp\">(Esta expresión se usa para indicar que algo se ha programado o ha sido decidido como regla.  “ことになっている” puede sustituirse por “こととなっている” que se considera una expresión ligeramente rebuscada.)<\/p><p class=\"lp\">あした<ruby>明日<rt>あす<\/rt><\/ruby>はに<ruby>会<rt>あ<\/rt><\/ruby>うことになっています。　 ・ 　<ruby>燃<rt>も<\/rt><\/ruby>えるゴミは・すい<ruby>水<rt>みず<\/rt><\/ruby>・<ruby>金<rt>きん<\/rt><\/ruby>に<ruby>出<rt>だ<\/rt><\/ruby>すことになっている。<\/p><p class=\"lp\"><ruby>電車<rt>でんしゃ<\/rt><\/ruby>ではをしてはいけないことになっている。 ・ <ruby>日本<rt>にっぽん<\/rt><\/ruby>では、<ruby>車<rt>くるま<\/rt><\/ruby>は<ruby>左<rt>ひだり<\/rt><\/ruby><ruby>車線<rt>しゃせん<\/rt><\/ruby>を<ruby>走<rt>はし<\/rt><\/ruby>ることとなっている。<\/p><p class=\"lp\">- [Verbo en forma-た (tiempo pasado) +（+という）/ Sustantivo +という] + ことになる<\/p><p class=\"lp\">(Esta expresión se utiliza para transmitir el significado de que, basándose en una situación determinada, “en última instancia, dará lugar a un estado de 〜” o “se considerará como 〜”.  Su característica principal es que expresa una conclusión derivada de hechos o circunstancias objetivos, independientemente de la voluntad propia.)<\/p><p class=\"lp\">このにサインすれば、<ruby>契約<rt>けいやく<\/rt><\/ruby>した（という）ことになります。<\/p><p class=\"lp\">２<ruby>残業<rt>ざんぎょう<\/rt><\/ruby>すれば、<ruby>合計<rt>ごうけい<\/rt><\/ruby>で10<ruby>時間<rt>じかん<\/rt><\/ruby><ruby>働<rt>はたら<\/rt><\/ruby>いた（という）ことになる。<\/p><p class=\"lp\">60<ruby>点<rt>てん<\/rt><\/ruby><ruby>以上<rt>いじょう<\/rt><\/ruby>ので<ruby>合格<rt>ごうかく<\/rt><\/ruby>ということになります。 ・  ・ にらめっこでえば<ruby>負<rt>ま<\/rt><\/ruby>けということになる。<\/p><p class=\"lp\">- [Adjetivo tipo-い / Adjetivo tipo-な / Verbo en forma-た (tiempo pasado)] + ことに、+ Oración<\/p><p class=\"lp\">(Esta expresión se utiliza para indicar sentimiento o valoración del hablante en relación con la oración que sigue.  Cuando se usa con verbos, se puede utilizar solamente con algunos verbos que expresan emociones como “<ruby>困<rt>こん<\/rt><\/ruby>った”, “<ruby>驚<rt>おどろき<\/rt><\/ruby>いた”, etc.)<\/p><p class=\"lp\"><ruby>恐<rt>おそ<\/rt><\/ruby>ろしいことに、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>山<rt>やま<\/rt><\/ruby>で<ruby>熊<rt>くま<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>たらしい。 ・  ・ <ruby>嬉<rt>うれ<\/rt><\/ruby>しいことに、<ruby>夢<rt>ゆめ<\/rt><\/ruby>だった<ruby>留学<rt>りゅうがく<\/rt><\/ruby>が<ruby>決<rt>き<\/rt><\/ruby>まった。<\/p><p class=\"lp\"><ruby>困<rt>こま<\/rt><\/ruby>ったことに、<ruby>車<rt>くるま<\/rt><\/ruby>が<ruby>故障<rt>こしょう<\/rt><\/ruby>して<ruby>動<rt>うご<\/rt><\/ruby>かなくなった。 ・  ・ <ruby>驚<rt>おどろ<\/rt><\/ruby>いたことに、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>一晩<rt>ひとばん<\/rt><\/ruby>で<ruby>小説<rt>しょうせつ<\/rt><\/ruby>を<ruby>書<rt>か<\/rt><\/ruby>き<ruby>上<rt>あ<\/rt><\/ruby>げた。<\/p><p class=\"lp\">- Verbo en forma diccionario + ことなく+ Oración<\/p><p class=\"lp\">(Esta expresión se utiliza para expresar que sucede una acción o situación denotada en la oración que sigue sin hacer la acción del verbo que precede a “ことなく”.  Se trata de una expresión bastante formal, por lo que utilizarla en contextos cotidianos puede dar lugar a frases que suenen extrañas.  “Verbo +ことなく” se puede sustituir por “Verbo en forma-ない +で”.)<\/p><p class=\"lp\">3<ruby>時間<rt>じかん<\/rt><\/ruby>、の<ruby>中<rt>なか<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>むことなく<ruby>歩<rt>ある<\/rt><\/ruby>き<ruby>続<rt>つづ<\/rt><\/ruby>けた。 ・     ロウソクのは<ruby>消<rt>き<\/rt><\/ruby>えることなく、<ruby>朝<rt>あさ<\/rt><\/ruby>までついていた。<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>はまであきらめることなく、<ruby>努力<rt>どりょく<\/rt><\/ruby>した。 ・ 　　<ruby>夫<rt>おっと<\/rt><\/ruby>はに<ruby>相談<rt>そうだん<\/rt><\/ruby>することなく、ベンツを<ruby>購入<rt>こうにゅう<\/rt><\/ruby>した。<\/p><p class=\"lp\">- Verbo en forma no pretérito + ことはない<\/p><p class=\"lp\">(Esta expresión se utiliza para transimitir el significado de que “no hace falta (Verbo)” o “no es necesario (Verbo).  En lenguaje hablado, se suele omitr “は” dejando solo “ことない”).<\/p><p class=\"lp\">たくさんあるので、<ruby>遠慮<rt>えんりょ<\/rt><\/ruby>することはありません。 ・ 　　パーティーにはスーツを<ruby>着<rt>き<\/rt><\/ruby>ていくことはないですよ。<\/p><p class=\"lp\"><ruby>雨<rt>あめ<\/rt><\/ruby>はすぐに<ruby>止<rt>や<\/rt><\/ruby>むから、<ruby>傘<rt>かさ<\/rt><\/ruby>を<ruby>買<rt>か<\/rt><\/ruby>うことないよ。 ・ 　　まだ<ruby>時間<rt>じかん<\/rt><\/ruby>あるから、そんなに<ruby>急<rt>いそ<\/rt><\/ruby>ぐことないですよ。<\/p>","text":"「こと」の色々いろいろな使しい方ほう（２） - [Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことにする(Esta expresión se usa para indicar la decisión por voluntad propia de hacer o no hacer algo denotado por el verbo.  “ことにする” puede sustituirse por “こととする” que se considera una expresión ligeramente rebuscada.)次つぎのみは国くにへ帰かえることにします。 ・  ・ あした明日あすから、30ぷん分ぶんジョギングをすることにしました。健康けんこうのため、い物ものを食たべないことにした。 ・ 来年度らいねんども、こので事業じぎょうを進すすめることとする。- [Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことにしている(Esta expresión se usa para indicar un hábito decidido previamente por voluntad propia para hacer o dejar de hacer algo y que sigue practicando.  “ことにしている” puede sustituirse por “こととしている” que se considera una expresión ligeramente rebuscada.)毎日まいにち、日本にっぽん語ごを勉強べんきょうすることにしています。 ・ 寝ねるは必かならずお風呂ふろに入はいることにしている。彼かれのうことは信しんじないことにしている。 ・ わがは、残業ざんぎょう時間じかんを厳きびしく管理かんりすることとしています。- Verbo en forma-た (tiempo pasado) + ことにする(Esta expresión se utiliza para expresar que se decide que algo es así, o que se considera así, aunque en realidad no sea así.  A menudo, se utiliza cuando se alteran los hechos para adaptarlos a la conveniencia propia aunque no sea realmente el caso.)風邪かぜをひいたことにして、学校がっこうを休きゅうんだ。 ・ このは聞きかなかったことにしてください。AIでったを自分じぶんで考かんがえたことにした。 ・ あのとの契約けいやくの話はなしはなかったことにしましょう。- [Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことになる(Esta expresión se usa para expresar que algo denotado por el verbo sucede por una decisión ajena a uno mismo.  También se utiliza cuando se desea expresar algo decidido por voluntad propia de forma indirecta y modesta.  “ことになる” puede sustituirse por “こととなる” que se considera una expresión ligeramente rebuscada.)父親ちちおやので、東京とうきょうにひ引いんっ越こすことになった。 ・ 　　来月らいげつからで中国ちゅうごくへ出張しゅっちょうすることになった。僕ぼくたち、の春はるに結婚けっこんすることになりました。 ・ 　　津波つなみ警報けいほうがされ、避難ひなんすることとなった。- [Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことになっている(Esta expresión se usa para indicar que algo se ha programado o ha sido decidido como regla.  “ことになっている” puede sustituirse por “こととなっている” que se considera una expresión ligeramente rebuscada.)あした明日あすはに会あうことになっています。　 ・ 　燃もえるゴミは・すい水みず・金きんに出だすことになっている。電車でんしゃではをしてはいけないことになっている。 ・ 日本にっぽんでは、車くるまは左ひだり車線しゃせんを走はしることとなっている。- [Verbo en forma-た (tiempo pasado) +（+という）/ Sustantivo +という] + ことになる(Esta expresión se utiliza para transmitir el significado de que, basándose en una situación determinada, “en última instancia, dará lugar a un estado de 〜” o “se considerará como 〜”.  Su característica principal es que expresa una conclusión derivada de hechos o circunstancias objetivos, independientemente de la voluntad propia.)このにサインすれば、契約けいやくした（という）ことになります。２残業ざんぎょうすれば、合計ごうけいで10時間じかん働はたらいた（という）ことになる。60点てん以上いじょうので合格ごうかくということになります。 ・  ・ にらめっこでえば負まけということになる。- [Adjetivo tipo-い / Adjetivo tipo-な / Verbo en forma-た (tiempo pasado)] + ことに、+ Oración(Esta expresión se utiliza para indicar sentimiento o valoración del hablante en relación con la oración que sigue.  Cuando se usa con verbos, se puede utilizar solamente con algunos verbos que expresan emociones como “困こんった”, “驚おどろきいた”, etc.)恐おそろしいことに、彼かれは山やまで熊くまを見みたらしい。 ・  ・ 嬉うれしいことに、夢ゆめだった留学りゅうがくが決きまった。困こまったことに、車くるまが故障こしょうして動うごかなくなった。 ・  ・ 驚おどろいたことに、彼かれは一晩ひとばんで小説しょうせつを書かき上あげた。- Verbo en forma diccionario + ことなく+ Oración(Esta expresión se utiliza para expresar que sucede una acción o situación denotada en la oración que sigue sin hacer la acción del verbo que precede a “ことなく”.  Se trata de una expresión bastante formal, por lo que utilizarla en contextos cotidianos puede dar lugar a frases que suenen extrañas.  “Verbo +ことなく” se puede sustituir por “Verbo en forma-ない +で”.)3時間じかん、の中なかを休やすむことなく歩あるき続つづけた。 ・     ロウソクのは消きえることなく、朝あさまでついていた。彼かれはまであきらめることなく、努力どりょくした。 ・ 　　夫おっとはに相談そうだんすることなく、ベンツを購入こうにゅうした。- Verbo en forma no pretérito + ことはない(Esta expresión se utiliza para transimitir el significado de que “no hace falta (Verbo)” o “no es necesario (Verbo).  En lenguaje hablado, se suele omitr “は” dejando solo “ことない”).たくさんあるので、遠慮えんりょすることはありません。 ・ 　　パーティーにはスーツを着きていくことはないですよ。雨あめはすぐに止やむから、傘かさを買かうことないよ。 ・ 　　まだ時間じかんあるから、そんなに急いそぐことないですよ。"},{"id":"L054","file":"今まて_に勉強したことの復習.docx","cat":"rep","catLabel":"Repaso general","title":"今までに勉強したことの復習","titleRuby":"<ruby>今<rt>いま<\/rt><\/ruby>までに<ruby>勉強<rt>べんきょう<\/rt><\/ruby>したことの<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- ように ・  ・  ・  ・  ・  ・ (P. 17 ③)<\/p><p class=\"lp\">- Noun+のよう（に／な）<\/p><p class=\"lp\">- Verb+よう（に／な）<\/p><p class=\"lp\">- Verb+ようになる ・ （たべるようになる） ・  ・ (P. 46 ⑪)<\/p><p class=\"lp\">- Verb+ように（<ruby>頼<rt>らい<\/rt><\/ruby>む／<ruby>言<rt>げん<\/rt><\/ruby>う）（たべるように<ruby>言<rt>げん<\/rt><\/ruby>う） ・ (P. 72 ⑪)<\/p><p class=\"lp\">- Verb+ようにする（たべるようにする） ・  ・  ・ (P. 72 ⑬)<\/p><p class=\"lp\">- Verb+ようとした（が／けれど／ら）（たべようとした） ・ (P. 73 ⑯)<\/p><p class=\"lp\">- <ruby>毎<rt>まい<\/rt><\/ruby>～のように ・ +Verb ・  ・  ・  ・  ・ (P. 90 ①)<\/p><p class=\"lp\">～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～<\/p><p class=\"lp\">- Verb+こと（が／も）ある ・  ・  ・  ・ (P. 18 ⑦)<\/p><p class=\"lp\">- Verb+ことになっている ・  ・  ・  ・ (P. 70 ⑦)<\/p><p class=\"lp\">- Verb+ことになった ・ （Sin identificar quien） ・  ・ (P. 71 ⑩)<\/p><p class=\"lp\">- Verb+ことにした （わたしが、～ことにしました）<\/p><p class=\"lp\">～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～<\/p><p class=\"lp\">- ため（に／の） ・  (Purpose) ・  ・  ・ (P. 44 ⑥)<\/p><p class=\"lp\">- Noun+のため（に／の）<\/p><p class=\"lp\">- Verb+ため（に／の）<\/p><p class=\"lp\">- Verb or Adjective+ため（に） ・ (Reason, Cause) ・  ・ (P. 45 ⑦)<\/p><p class=\"lp\">「～から」、「～ので」と<ruby>言<rt>げん<\/rt><\/ruby>うこともできます<\/p><p class=\"lp\">～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～<\/p><p class=\"lp\"><ruby>英語<rt>えいご<\/rt><\/ruby>を<ruby>教<rt>きょう<\/rt><\/ruby>える<\/p><p class=\"lp\">Verb+（して）あげる (JoséはPedroに・・・)<\/p><p class=\"lp\">- Verb+（して）くれる ・  ・ (JoséはPedroに・・・)<\/p><p class=\"lp\">Pedro<\/p><p class=\"lp\">José<\/p><p class=\"lp\">- Verb+（して）もらう ・  ・ (PedroはJoséに・・・)<\/p>","text":"今いままでに勉強べんきょうしたことの復習ふくしゅう - ように ・  ・  ・  ・  ・  ・ (P. 17 ③)- Noun+のよう（に／な）- Verb+よう（に／な）- Verb+ようになる ・ （たべるようになる） ・  ・ (P. 46 ⑪)- Verb+ように（頼らいむ／言げんう）（たべるように言げんう） ・ (P. 72 ⑪)- Verb+ようにする（たべるようにする） ・  ・  ・ (P. 72 ⑬)- Verb+ようとした（が／けれど／ら）（たべようとした） ・ (P. 73 ⑯)- 毎まい～のように ・ +Verb ・  ・  ・  ・  ・ (P. 90 ①)～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～- Verb+こと（が／も）ある ・  ・  ・  ・ (P. 18 ⑦)- Verb+ことになっている ・  ・  ・  ・ (P. 70 ⑦)- Verb+ことになった ・ （Sin identificar quien） ・  ・ (P. 71 ⑩)- Verb+ことにした （わたしが、～ことにしました）～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～- ため（に／の） ・  (Purpose) ・  ・  ・ (P. 44 ⑥)- Noun+のため（に／の）- Verb+ため（に／の）- Verb or Adjective+ため（に） ・ (Reason, Cause) ・  ・ (P. 45 ⑦)「～から」、「～ので」と言げんうこともできます～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～ ～ ☆ ～ ～英語えいごを教きょうえるVerb+（して）あげる (JoséはPedroに・・・)- Verb+（して）くれる ・  ・ (JoséはPedroに・・・)PedroJosé- Verb+（して）もらう ・  ・ (PedroはJoséに・・・)"}]</script>

/rt><\/ruby>いだろう"},{"id":"gp047","cat":"part","catLabel":"Partículas","lesson":"助詞「ので」の復習","pattern":"Sustantivoな / Cláusula Subordinada + ので + Cláusula Principal","patternRuby":"Sustantivoな / Cláusula Subordinada + ので + Cláusula Principal","rule":"El Sustantivo más “な” o la cláusula subordinada que precede a la partícula “ので” expresa una circunstancia que contribuye a la ejecución del contenido expresado en la cláusula principal.","ruleRuby":"El Sustantivo más “な” o la cláusula subordinada que precede a la partícula “ので” expresa una circunstancia que contribuye a la ejecución del contenido expresado en la cláusula principal.","exJp":"これがのでんわばんごう電話番号なので、こま困ったられんらく連絡してください","exJpRuby":"これがの<ruby>電話番号<rt>でんわばんごう<\/rt><\/ruby>なので、<ruby>困<rt>こま<\/rt><\/ruby>ったら<ruby>連絡<rt>れんらく<\/rt><\/ruby>してください"},{"id":"gp048","cat":"part","catLabel":"Partículas","lesson":"助詞「より」の復習","pattern":"Sustantivo + より + Predicado","patternRuby":"Sustantivo + より + Predicado","rule":"La partícula “より” aquí indica la base para la comparación o selección. La forma “AよりBのほうが” o “BのほうがAより” se utiliza para expresar la evaluación más concreta.","ruleRuby":"La partícula “より” aquí indica la base para la comparación o selección. La forma “AよりBのほうが” o “BのほうがAより” se utiliza para expresar la evaluación más concreta.","exJp":"わたし私はがブドウよりす好きだ","exJpRuby":"わたし<ruby>私<rt>わたくし<\/rt><\/ruby>はがブドウより<ruby>好<rt>す<\/rt><\/ruby>きだ"},{"id":"gp049","cat":"part","catLabel":"Partículas","lesson":"助詞「より」の復習","pattern":"Sustantivo + より + Predicado","patternRuby":"Sustantivo + より + Predicado","rule":"La partícula “より” aquí indica el tiempo o lugar del comienzo o del punto de partida de algo. Esto suena como una expresión ligeramente más formal y rígida. Para una expresión informal o coloquial, se utiliza más “から” en su lugar.","ruleRuby":"La partícula “より” aquí indica el tiempo o lugar del comienzo o del punto de partida de algo. Esto suena como una expresión ligeramente más formal y rígida. Para una expresión informal o coloquial, se utiliza más “から” en su lugar.","exJp":"けっこんしき結婚式が２じ時よりおこな行われる","exJpRuby":"<ruby>結婚式<rt>けっこんしき<\/rt><\/ruby>が２じ<ruby>時<rt>じ<\/rt><\/ruby>より<ruby>行<rt>おこな<\/rt><\/ruby>われる"},{"id":"gp050","cat":"part","catLabel":"Partículas","lesson":"助詞「より」の復習","pattern":"Sustantivo / Verbo (en forma diccionario) + より + Predicado","patternRuby":"Sustantivo / Verbo (en forma diccionario) + より + Predicado","rule":"La partícula “より” aquí se utiliza en el sentido de seleccionar una cosa entre varias opciones disponibles o rechazar otras.","ruleRuby":"La partícula “より” aquí se utiliza en el sentido de seleccionar una cosa entre varias opciones disponibles o rechazar otras.","exJp":"マンガよりしょうせつ小説をよ読むべきだ","exJpRuby":"マンガより<ruby>小説<rt>しょうせつ<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>むべきだ"},{"id":"gp051","cat":"part","catLabel":"Partículas","lesson":"助詞「より」の復習","pattern":"Sustantivo + より + Predicado","patternRuby":"Sustantivo + より + Predicado","rule":"La partícula “より” aquí indica el agente que realiza la acción. Esto también suena como una expresión ligeramente más formal y rígida. Para una expresión informal o coloquial, se utiliza más “から” en su lugar.","ruleRuby":"La partícula “より” aquí indica el agente que realiza la acción. Esto también suena como una expresión ligeramente más formal y rígida. Para una expresión informal o coloquial, se utiliza más “から” en su lugar.","exJp":"やまだ山田さま様よりがありました","exJpRuby":"<ruby>山田<rt>やまだ<\/rt><\/ruby><ruby>様<rt>さま<\/rt><\/ruby>よりがありました"},{"id":"gp052","cat":"part","catLabel":"Partículas","lesson":"助詞「より」の復習","pattern":"より + Verbo / Adjetivo","patternRuby":"より + Verbo / Adjetivo","rule":"La partícula “より” aquí se utiliza en un sentido como “一段と(aún más)”, “いっそう(más allá)” o “さらに(todavía más)”. Aquí, a diferencia de los casos anteriores, el acento recae en la “り” de “より”.","ruleRuby":"La partícula “より” aquí se utiliza en un sentido como “<ruby>一<rt>いち<\/rt><\/ruby><ruby>段<rt>だん<\/rt><\/ruby>と(aún más)”, “いっそう(más allá)” o “さらに(todavía más)”. Aquí, a diferencia de los casos anteriores, el acento recae en la “り” de “より”.","exJp":"よりよ良いしゃかい社会になる","exJpRuby":"より<ruby>良<rt>よ<\/rt><\/ruby>い<ruby>社会<rt>しゃかい<\/rt><\/ruby>になる"},{"id":"gp053","cat":"part","catLabel":"Partículas","lesson":"助詞「ばかり」の復習","pattern":"Sustantivo / Verbo en forma diccionario o en forma-て + ばかり + Predicado","patternRuby":"Sustantivo / Verbo en forma diccionario o en forma-て + ばかり + Predicado","rule":"La partícula “ばかり” tiene una función restrictiva, indicando que el elemento enfatizado es el único, o que un contenido específico se repite varias veces, excluyendo así otras posibilidades. A menudo esta expresión indica la actitud crítica del hablante. En el lenguaje hablado, “ばっかり” también se utiliza.","ruleRuby":"La partícula “ばかり” tiene una función restrictiva, indicando que el elemento enfatizado es el único, o que un contenido específico se repite varias veces, excluyendo así otras posibilidades. A menudo esta expresión indica la actitud crítica del hablante. En el lenguaje hablado, “ばっかり” también se utiliza.","exJp":"きょうだい兄弟げんかになると、ばかりおこ怒られる","exJpRuby":"<ruby>兄弟<rt>きょうだい<\/rt><\/ruby>げんかになると、ばかり<ruby>怒<rt>おこ<\/rt><\/ruby>られる"},{"id":"gp054","cat":"part","catLabel":"Partículas","lesson":"助詞「ばかり」の復習","pattern":"Sustantivo (palabra numérica) + ばかり + Predicado","patternRuby":"Sustantivo (palabra numérica) + ばかり + Predicado","rule":"La partícula “ばかり” se utiliza después de palabras relacionadas con la cantidad para indicar un grado o extensión aproximados. “ばかり” de este uso puede reformularse como “ほど” o “くらい”. Sin embargo, “ばかり” transimite una sensación de cortesía más que “ほど” o “くらい”, añadiendo mayor grado de vaguedad.","ruleRuby":"La partícula “ばかり” se utiliza después de palabras relacionadas con la cantidad para indicar un grado o extensión aproximados. “ばかり” de este uso puede reformularse como “ほど” o “くらい”. Sin embargo, “ばかり” transimite una sensación de cortesía más que “ほど” o “くらい”, añadiendo mayor grado de vaguedad.","exJp":"20ぷん分ばかりれてしまいました","exJpRuby":"20ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>ばかりれてしまいました"},{"id":"gp055","cat":"part","catLabel":"Partículas","lesson":"助詞「ばかり」の復習","pattern":"Verbo en forma informal pretérito + ばかり + Predicado","patternRuby":"Verbo en forma informal pretérito + ばかり + Predicado","rule":"La partícula “ばかり” se utiliza para indicar que la acción acaba de completarse. En el lenguaje hablado, “ばっかり” también se utiliza. Cuando el verbo que sigue es “だ/だった/です/でした”, “ばかり” de este uso puede reformularse como “ところ”.","ruleRuby":"La partícula “ばかり” se utiliza para indicar que la acción acaba de completarse. En el lenguaje hablado, “ばっかり” también se utiliza. Cuando el verbo que sigue es “だ/だった/です/でした”, “ばかり” de este uso puede reformularse como “ところ”.","exJp":"やまだ山田さんはたったいま今、かえ帰ったばかりです","exJpRuby":"<ruby>山田<rt>やまだ<\/rt><\/ruby>さんはたった<ruby>今<rt>いま<\/rt><\/ruby>、<ruby>帰<rt>かえ<\/rt><\/ruby>ったばかりです"},{"id":"gp056","cat":"part","catLabel":"Partículas","lesson":"助詞「ばかり」の復習","pattern":"Verbo en forma informal pretérito + ばかり + に + Predicado","patternRuby":"Verbo en forma informal pretérito + ばかり + に + Predicado","rule":"La partícula “ばかり”, utilizándose en la forma “～たばかりに”, indica causa del predicado. Se puede reformular como “～たせいで”. Normalmente transmite la idea de que ha ocurrido algo malo. “ばっかり” también se utiliza.","ruleRuby":"La partícula “ばかり”, utilizándose en la forma “～たばかりに”, indica causa del predicado. Se puede reformular como “～たせいで”. Normalmente transmite la idea de que ha ocurrido algo malo. “ばっかり” también se utiliza.","exJp":"かれ彼がうそをい言ったばかりに、みな皆がこんわく困惑した","exJpRuby":"<ruby>彼<rt>かれ<\/rt><\/ruby>がうそを<ruby>言<rt>い<\/rt><\/ruby>ったばかりに、<ruby>皆<rt>みな<\/rt><\/ruby>が<ruby>困惑<rt>こんわく<\/rt><\/ruby>した"},{"id":"gp057","cat":"part","catLabel":"Partículas","lesson":"助詞「さえ」の復習","pattern":"Sustantivo + (で) さえ + Predicado","patternRuby":"Sustantivo + (で) さえ + Predicado","rule":"La partícula “さえ” se utiliza para enfatizar que todos los demás asuntos están incluidos citando un ejemplo extremo. La partícula “さえ” de este uso, cuando va seguida de palabras que denotan seres vivos o números, se utiliza a veces junto con la partícula “で” en formula de “でさえ”.","ruleRuby":"La partícula “さえ” se utiliza para enfatizar que todos los demás asuntos están incluidos citando un ejemplo extremo. La partícula “さえ” de este uso, cuando va seguida de palabras que denotan seres vivos o números, se utiliza a veces junto con la partícula “で” en formula de “でさえ”.","exJp":"は歯がくて、やわ柔らかいパンさえた食べられない","exJpRuby":"<ruby>歯<rt>は<\/rt><\/ruby>がくて、<ruby>柔<rt>やわ<\/rt><\/ruby>らかいパンさえ<ruby>食<rt>た<\/rt><\/ruby>べられない"},{"id":"gp058","cat":"part","catLabel":"Partículas","lesson":"助詞「さえ」の復習","pattern":"[Sustantivo / Adjetivo en forma de adverbio / Verbo en forma-ます] + さえ + Verbo en forma hipotética + ば、 + Cláusula Principal","patternRuby":"[Sustantivo / Adjetivo en forma de adverbio / Verbo en forma-ます] + さえ + Verbo en forma hipotética + ば、 + Cláusula Principal","rule":"La partícula “さえ” en la forma “〜さえ～ば” expresa que, si se cumple la condición mínima mencionada en la cláusula subordinada, ocurrirá lo mencionado en la cláusula principal.","ruleRuby":"La partícula “さえ” en la forma “〜さえ～ば” expresa que, si se cumple la condición mínima mencionada en la cláusula subordinada, ocurrirá lo mencionado en la cláusula principal.","exJp":"じかん時間さえあれば、もっとかんじ漢字のべんきょう勉強ができるのに","exJpRuby":"<ruby>時間<rt>じかん<\/rt><\/ruby>さえあれば、もっと<ruby>漢字<rt>かんじ<\/rt><\/ruby>の<ruby>勉強<rt>べんきょう<\/rt><\/ruby>ができるのに"},{"id":"gp059","cat":"part","catLabel":"Partículas","lesson":"助詞「すら」の復習","pattern":"Sustantivo + (で) すら + Predicado","patternRuby":"Sustantivo + (で) すら + Predicado","rule":"La partícula “すら” se utiliza para expresar un estado extremo que el oyente considera inesperado. La partícula “すら”, cuando va seguida de palabras que denotan seres vivos o números, se utiliza a veces junto con la partícula “で” en formula de “ですら”. La partícula “すら” tiene mismo significado que la partícula “さえ”. Sin embargo, en comparación con “さえ”, “すら” da la impresión de ser una forma más antigua y se utiliza a menudo en la escritura formal. Además, “すら” tiene un énfasis más fuerte, y transmite un sentimiento mucho más negativo o suena bastante sarcástico.","ruleRuby":"La partícula “すら” se utiliza para expresar un estado extremo que el oyente considera inesperado. La partícula “すら”, cuando va seguida de palabras que denotan seres vivos o números, se utiliza a veces junto con la partícula “で” en formula de “ですら”. La partícula “すら” tiene mismo significado que la partícula “さえ”. Sin embargo, en comparación con “さえ”, “すら” da la impresión de ser una forma más antigua y se utiliza a menudo en la escritura formal. Además, “すら” tiene un énfasis más fuerte, y transmite un sentimiento mucho más negativo o suena bastante sarcástico.","exJp":"たいちょう体調がく、しょくじ食事すらできない","exJpRuby":"<ruby>体調<rt>たいちょう<\/rt><\/ruby>がく、<ruby>食事<rt>しょくじ<\/rt><\/ruby>すらできない"},{"id":"gp060","cat":"part","catLabel":"Partículas","lesson":"助詞「たり」の復習","pattern":"Sustantivo1 / Adjetivo1 / Verbo1 + たり+ Sustantivo2 / Adjetivo2 / Verbo2 + たり + Verbo “する” / Partícula “で”, “と”, “の”, “を”, etc. + Verbo","patternRuby":"Sustantivo1 / Adjetivo1 / Verbo1 + たり+ Sustantivo2 / Adjetivo2 / Verbo2 + たり + Verbo “する” / Partícula “で”, “と”, “の”, “を”, etc. + Verbo","rule":"La partícula “たり” se utiliza para indicar múltiples acciones o estados en paralelo. Se suele utilizar en conjuntos de dos o más, como en “〜たり、〜たりする”. Después de los sustantivos sigue “だったり” en vez de “たり”. Los adjetivos o verbos que preceden a “たり” siempre son en forma pasado sin “た”, pero es más fácil recordarlos como expresiones en las que “り” acompaña a los adjetivos o verbos en forma completa del pasado.","ruleRuby":"La partícula “たり” se utiliza para indicar múltiples acciones o estados en paralelo. Se suele utilizar en conjuntos de dos o más, como en “〜たり、〜たりする”. Después de los sustantivos sigue “だったり” en vez de “たり”. Los adjetivos o verbos que preceden a “たり” siempre son en forma pasado sin “た”, pero es más fácil recordarlos como expresiones en las que “り” acompaña a los adjetivos o verbos en forma completa del pasado.","exJp":"ちょうしょく朝食はパンだったりごはん飯だったりします","exJpRuby":"<ruby>朝食<rt>ちょうしょく<\/rt><\/ruby>はパンだったりごはん<ruby>飯<rt>めし<\/rt><\/ruby>だったりします"},{"id":"gp061","cat":"part","catLabel":"Partículas","lesson":"助詞「たり」の復習","pattern":"Sustantivo / Adjetivo / Verbo + たり + Verbo “する”","patternRuby":"Sustantivo / Adjetivo / Verbo + たり + Verbo “する”","rule":"También existe un uso en el que la partícula “たり” se emplea solo una vez para citar una acción o un estado como ejemplo, lo que implica que existen otros asuntos similares. Después de los sustantivos sigue “だったり” en vez de “たり”. Los adjetivos o verbos que preceden a “たり” siempre son en forma pasado sin “た”, pero es más fácil recordarlos como expresiones en las que “り” acompaña a los adjetivos o verbos en forma completa del pasado.","ruleRuby":"También existe un uso en el que la partícula “たり” se emplea solo una vez para citar una acción o un estado como ejemplo, lo que implica que existen otros asuntos similares. Después de los sustantivos sigue “だったり” en vez de “たり”. Los adjetivos o verbos que preceden a “たり” siempre son en forma pasado sin “た”, pero es más fácil recordarlos como expresiones en las que “り” acompaña a los adjetivos o verbos en forma completa del pasado.","exJp":"こんど今度のにちようび日曜日はひま暇だったりします？","exJpRuby":"<ruby>今度<rt>こんど<\/rt><\/ruby>の<ruby>日曜日<rt>にちようび<\/rt><\/ruby>は<ruby>暇<rt>ひま<\/rt><\/ruby>だったりします？"},{"id":"gp062","cat":"part","catLabel":"Partículas","lesson":"助詞「ば」の復習","pattern":"Cláusula Subordinada (con verbo en forma hipotética) + ば + Cláusula Principal","patternRuby":"Cláusula Subordinada (con verbo en forma hipotética) + ば + Cláusula Principal","rule":"La partícula “ば” aquí se utiliza cuando se establece una condición hipotética para un evento que aún no ha ocurrido. Es una relación en la que una consecuencia lógica expresada en la cláusula principal se deriva de una premisa hipotética expresada en la cl a partícula “なら” se utiliza junto con “もし” de una forma como “もし～なら”. Cuando un adjetivo de tipo-い o un verbo de forma diccionario precede a la partícula “なら”, se puede añadir “の” entre el adjetivo / verbo y “なら”.","exJp":"あした明日、ならしあい試合はちゅうし中止になります","exJpRuby":"あした<ruby>明日<rt>あす<\/rt><\/ruby>、なら<ruby>試合<rt>しあい<\/rt><\/ruby>は<ruby>中止<rt>ちゅうし<\/rt><\/ruby>になります"},{"id":"gp067","cat":"part","catLabel":"Partículas","lesson":"助詞「なら」の復習","pattern":"[Sustantivo / Verbo (no pasado)] + なら + Verbo","patternRuby":"[Sustantivo / Verbo (no pasado)] + なら + Verbo","rule":"La partícula “なら” introduce un tema específico o recoge un tema al que la otra parte se refiere, y añade información relacionada con ese tema. A menudo conlleva una connotación de contraste.","ruleRuby":"La partícula “なら” introduce un tema específico o recoge un tema al que la otra parte se refiere, y añade información relacionada con ese tema. A menudo conlleva una connotación de contraste.","exJp":"(やまだ山田さんはどこですか？)","exJpRuby":"(<ruby>山田<rt>やまだ<\/rt><\/ruby>さんはどこですか？)"},{"id":"gp068","cat":"part","catLabel":"Partículas","lesson":"助詞「なら」の復習","pattern":"Sustantivo + ならでは + だ/です\tSustantivo + ならでは + の + Sustantivo","patternRuby":"Sustantivo + ならでは + だ/です\tSustantivo + ならでは + の + Sustantivo","rule":"La expresión “ならでは” se utiliza para resaltar características o cualidades únicas específicas de una persona, un lugar o una situación y enfatiza algo especial que solo posee ese sustantivo.","ruleRuby":"La expresión “ならでは” se utiliza para resaltar características o cualidades únicas específicas de una persona, un lugar o una situación y enfatiza algo especial que solo posee ese sustantivo.","exJp":"このうみ海のうつく美しさはおきなわ沖縄ならではです","exJpRuby":"この<ruby>海<rt>うみ<\/rt><\/ruby>の<ruby>美<rt>うつく<\/rt><\/ruby>しさは<ruby>沖縄<rt>おきなわ<\/rt><\/ruby>ならではです"},{"id":"gp069","cat":"conc","catLabel":"Contraste y concesión","lesson":"助詞「けど、けれど、けれども」の復習","pattern":"Cláusula Subordinada + けど/けれど/けれども + Cláusula Principal","patternRuby":"Cláusula Subo けれど” o “けれども”.","exJp":"きのう昨日よ読んだだけど、とてもおもしろ面白かった","exJpRuby":"<ruby>昨日<rt>きのう<\/rt><\/ruby><ruby>読<rt>よ<\/rt><\/ruby>んだだけど、とても<ruby>面白<rt>おもしろ<\/rt><\/ruby>かった"},{"id":"gp072","cat":"conc","catLabel":"Contraste y concesión","lesson":"助詞「けど、けれど、けれども」の復習","pattern":"Cláusula + けど・・・","patternRuby":"Cláusula + けど・・・","rule":"En japonés, colocar “けど” al final de una oración puede crear una expresión que da a entender que hay algo que no se ha dicho. Se utiliza para animar al oyente a seguir hablando o para transmitir la propia opinión de forma reservada.","ruleRuby":"En japonés, colocar “けど” al final de una oración puede crear una expresión que da a entender que hay algo que no se ha dicho. Se utiliza para animar al oyente a seguir hablando o para transmitir la propia opinión de forma reservada.","exJp":"き聞きたいことがあるんだけど・・・","exJpRuby":"<ruby>聞<rt>き<\/rt><\/ruby>きたいことがあるんだけど・・・"},{"id":"gp073","cat":"conc","catLabel":"Contraste y concesión","lesson":"助詞「のに」の復習","pattern":"[Sustantivo + な / Adjetivo / Verbo / Cláusula Subordinada] + のに + Cláusula Principal","patternRuby":"[Sustantivo + な / Adjetivo / Verbo / Cláusula Subordinada] + のに + Cláusula Principal","rule":"La partícula “のに” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrasta al hecho mencionado en la cláusula subordinada. La diferencia con otras partículas de conjunción adversativa es que la partícula “のに” conecta dos asuntos transmitiendo una sensación de sorpresa o insatisfacción. Sin embargo, la cláusula principal después de la partícula “のに” no puede expresar órdenes, peticiones, intenciones, preguntas ni el juicio del hablante.","ruleRuby":"La partícula “のに” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrasta al hecho mencionado en la cláusula subordinada. La diferencia con otras partículas de conjunción adversativa es que la partícula “のに” conecta dos asuntos transmitiendo una sensación de sorpresa o insatisfacción. Sin embargo, la cláusula principal después de la partícula “のに” no puede expresar órdenes, peticiones, intenciones, preguntas ni el juicio del hablante.","exJp":"とうきょう東京はれなのにおおさか大阪はあめ雨だ","exJpRuby":"<ruby>東京<rt>とうきょう<\/rt><\/ruby>はれなのに<ruby>大阪<rt>おおさか<\/rt><\/ruby>は<ruby>雨<rt>あめ<\/rt><\/ruby>だ"},{"id":"gp074","cat":"conc","catLabel":"Contraste y concesión","lesson":"助詞「のに」の復習","pattern":"Cláusula + のに・・・","patternRuby":"Cláusula + のに・・・","rule":"En japonés, colocar “のに” al final de una oración puede crear una expresión que da a entender que hay algo que no se ha dicho. Se utiliza para expresar sentimientos como descontento, insatisfacción, resentimiento o crítica.","ruleRuby":"En japonés, colocar “のに” al final de una oración puede crear una expresión que da a entender que hay algo que no se ha dicho. Se utiliza para expresar sentimientos como descontento, insatisfacción, resentimiento o crítica.","exJp":"やまだ山田さんはまだしごと仕事している。もうよる夜なのに・・・","exJpRuby":"<ruby>山田<rt>やまだ<\/rt><\/ruby>さんはまだ<ruby>仕事<rt>しごと<\/rt><\/ruby>している。もう<ruby>夜<rt>よる<\/rt><\/ruby>なのに・・・"},{"id":"gp075","cat":"conc","catLabel":"Contraste y concesión","lesson":"助詞「ても/でも」の復習","pattern":"Cláusula Subordinada + ても/でも + Cláusula Principal","patternRuby":"Cláusula Subordinada + ても/でも + Cláusula Principal","rule":"La partícula “ても/でも” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reverso o contrastante al hecho mencionado en la cláusula subordinada.","ruleRuby":"La partícula “ても/でも” se utiliza como conjunción adversativa que conecta un hecho de la cláusula subordinada y otro hecho de la cláusula principal de tal que el hecho mencionado en la cláusula principal es reve 々な使い方（１）","pattern":"Q: Oración Interrogativa ⇒ A: （はい、）そうです","patternRuby":"Q: Oración Interrogativa ⇒ A: （はい、）そうです","rule":"“（はい、）そうです” se utiliza como respuesta afirmativa a una pregunta con un predicado sustantivo. En caso de respuesta negativa, generalmente no se responde con “そう”, sino en la mayoría de los casos, se usa “ちがいます” o se expresa la respuesta correcta.","ruleRuby":"“（はい、）そうです” se utiliza como respuesta afirmativa a una pregunta con un predicado sustantivo. En caso de respuesta negativa, generalmente no se responde con “そう”, sino en la mayoría de los casos, se usa “ちがいます” o se expresa la respuesta correcta.","exJp":"Q: あなたはこくだい国大のりゅう留がくせい学生ですか？","exJpRuby":"Q: あなたは<ruby>国大<rt>こくだい<\/rt><\/ruby>のりゅう<ruby>留<rt>とめ<\/rt><\/ruby><ruby>学生<rt>がくせい<\/rt><\/ruby>ですか？"},{"id":"gp087","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」の色々な使い方（１）","pattern":"Q: Oración Interrogativa ⇒ A: そうですね、+ Oración de Respuesta","patternRuby":"Q: Oración Interrogativa ⇒ A: そうですね、+ Oración de Respuesta","rule":"La expresión “そうですね” indica que el hablante está pensando en una respuesta a la pregunta hecha por la otra parte. Es algo equivalente a “Bueno”, “Pues”, etc.","ruleRuby":"La expresión “そうですね” indica que el hablante está pensando en una respuesta a la pregunta hecha por la otra parte. Es algo equivalente a “Bueno”, “Pues”, etc.","exJp":"Q: 日本のべんきょう勉強はどうですか？","exJpRuby":"Q: <ruby>日本<rt>にっぽん<\/rt><\/ruby>の<ruby>勉強<rt>べんきょう<\/rt><\/ruby>はどうですか？"},{"id":"gp088","cat":"conj","catLabel":"Conjetura・そう・よう・みたい・らしい","lesson":"「そう」の色々な使い方（１）","pattern":"A: Oración ⇒ B: そうですね","patternRuby":"A: Oración ⇒ B: そうですね","rule":"La expresión “そうですね” se usa para indicar consentimiento o aquiescencia con lo que la otra parte ha dicho y el hablante también pensaba o ya tenía conocimiento.","ruleRuby":"La expresión “そうですね” se usa para indicar consentimiento o aquiescencia con lo que la otra parte ha dicho y el hablante también pensaba o ya tenía conocimiento.","exJp":"A: 日本のフルーツ
