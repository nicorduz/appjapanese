<style>
:root{
  --paper:#f7f5ef; --ink:#17221f; --muted:#68746f; --line:#dcdfd8; --card:#fffefb;
  --indigo:#4f46e5; --teal:#0f766e; --good:#18794e; --bad:#b42318; --warn:#b45309;
  --soft:#eef0ea; --shadow:0 14px 40px rgba(30,40,36,.10); color-scheme:light;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--paper);
  padding:0 0 calc(78px + env(safe-area-inset-bottom));
}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",ui-sans-serif,sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
ruby{ruby-position:over}rt{font-size:.5em;font-weight:600;color:#7a857f;letter-spacing:.02em}
a{color:var(--indigo)}
.wrap{width:min(640px,100%);margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper),var(--paper) 72%,transparent);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:15px}
.brand .mk{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--paper);font-size:19px;line-height:1}
.brand .mk::after{content:"語"}
.pill{font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.6);
  padding:6px 11px;border-radius:999px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.pill b{color:var(--ink)}
.view{padding-top:6px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.sec{font-size:13px;letter-spacing:.02em;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:18px}
/* HOME hero */
.hero{padding:22px 20px 20px;border-radius:24px}
.hero .lead{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.today{display:flex;align-items:baseline;gap:12px}
.today .num{font-size:60px;line-height:.9;font-weight:850;letter-spacing:-.04em}
.today .unit{font-size:14px;color:var(--muted);font-weight:600}
.hero .desc{font-size:14px;color:var(--muted);margin:12px 0 18px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;
  padding:14px 18px;font-weight:750;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  transition:transform .12s ease, box-shadow .12s ease;width:100%}
.btn:active{transform:translateY(1px)}
.btn.big{padding:16px;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.line{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:10px 13px;border-radius:11px;font-size:13.5px;width:auto}
.btn:disabled{opacity:.4;transform:none}
.row{display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px;text-align:left;
  display:flex;flex-direction:column;gap:5px;transition:transform .12s ease}
.tile:active{transform:translateY(1px)}
.tile .t{font-weight:750;font-size:14.5px}
.tile .s{font-size:12px;color:var(--muted);line-height:1.35}
.tile .jpc{font-size:20px;font-weight:700;color:var(--ink)}
.statline{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:rgba(255,255,255,.55)}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),#8b5cf6);border-radius:99px;transition:width .4s ease}
.goalrow{display:flex;justify-content:space-between;align-items:end;font-size:12.5px;color:var(--muted);margin-top:16px}
/* controls */
.label{font-size:12px;font-weight:750;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:650;
  transition:.14s ease;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"] .dot{outline:2px solid rgba(255,255,255,.5)}
.topicgrid{display:grid;gap:8px}
.topicbtn{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 13px}
.topicbtn[aria-pressed="false"]{opacity:.55}
.topicbtn .nm{font-weight:700;font-size:13.5px;line-height:1.4}
.topicbtn .nm .jp{font-size:15px}
.topicbtn .ct{font-size:12px;color:var(--muted)}
/* session */
.sess{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom))}
.sesshead{display:flex;align-items:center;gap:12px}
.sesshead .x{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;flex:none}
.sprog{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.sprog>i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.smeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sbody{flex:1;overflow:auto;display:flex;flex-direction:column;padding-top:16px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:24px 20px;display:flex;flex-direction:column}
.qtag{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;padding:6px 11px;border-radius:999px;
  background:var(--soft);font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:16px}
.qtag .dot{width:7px;height:7px;border-radius:50%}
.prompt{font-size:clamp(21px,5.3vw,28px);line-height:1.7;margin:2px 0}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:180px}
.front .big{font-size:clamp(30px,9vw,50px);font-weight:800;letter-spacing:.01em;line-height:1.25}
.front .big rt{font-size:.42em}
.front .sub{font-size:15px;color:var(--muted)}
.reveal{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;animation:fade .18s ease}
.reveal .mean{font-size:20px;font-weight:750}
.reveal .ex{margin-top:12px;font-size:15px;line-height:1.75;color:#3a4642}
.reveal .ex .tr{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.expl{margin-top:14px;font-size:14px;line-height:1.6;background:var(--soft);border-radius:12px;padding:12px 13px;animation:fade .18s ease}
.opts{display:grid;gap:9px;margin-top:20px}
.opt{display:grid;grid-template-columns:26px 1fr 22px;gap:11px;align-items:center;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 13px;font-size:16px;transition:.12s}
.opt:active{transform:translateY(1px)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.opt.correct{border-color:var(--good);background:#eaf6ef}
.opt.correct .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fbeceb}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .mk{justify-self:end;font-weight:800}
.opt.correct .mk{color:var(--good)}.opt.wrong .mk{color:var(--bad)}
.typein{margin-top:20px;width:100%;border:1px solid var(--line);border-radius:13px;padding:15px;font-size:20px;text-align:center;background:#fff}
.typein:focus{outline:2px solid var(--indigo);border-color:var(--indigo)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grade{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 6px;font-weight:750;font-size:13px;
  display:flex;flex-direction:column;gap:3px;align-items:center}
.grade small{font-size:10.5px;color:var(--muted);font-weight:600}
.grade.again{border-color:#e5b4af;color:var(--bad)}
.grade.hard{border-color:#e3c79b;color:var(--warn)}
.grade.good{border-color:#a9d3bd;color:var(--good)}
.grade.easy{border-color:#b6c2f0;color:var(--indigo)}
.grades.learn2{grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.grades.learn2 .grade{padding:15px 8px;font-size:15px}
.grades.learn2 .grade small{font-size:11px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stp{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;line-height:1;color:var(--ink);font-weight:700}
.stp:active{background:var(--paper)}
.dategrp{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 15px;margin-top:10px}
.dategrp .dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.dategrp .dh b{font-size:14px}.dategrp .dh span{color:var(--muted);font-size:12.5px}
.wchips{display:flex;flex-wrap:wrap;gap:7px}
.wchip{border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:14px;background:#fff}
.wchip small{color:var(--muted);font-size:12px;margin-left:5px}
.blank{border-bottom:2px solid var(--indigo);padding:0 26px}
.browse{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.brow{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px}
.brow .top{display:flex;align-items:baseline;gap:10px}
.brow .jw{font-size:20px;font-weight:750}
.brow .rd{color:var(--muted);font-size:13px}
.brow .mn{margin-top:3px}
.brow .ex{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.6}
.brow .badge{margin-left:auto;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px;border:1px solid var(--line)}
.brow .badge.ok{color:var(--good);border-color:#a9d3bd}
.brow .badge.rv{color:var(--warn);border-color:#e3c79b}
.gitem{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;margin-top:9px}
.gitem .s{font-size:17px;line-height:1.75}
.gitem .fillw{color:var(--indigo);font-weight:750;border-bottom:2px solid var(--indigo);padding:0 3px}
.gitem .ex{margin-top:8px;color:var(--muted);font-size:13.5px;line-height:1.6}
.srch{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;background:#fff;margin-top:10px}
.srch:focus{outline:2px solid var(--indigo);border-color:var(--indigo)}
.phase{font-weight:700}
.sfoot{padding-top:12px}
.summary{text-align:center;padding:34px 20px}
.summary .big{font-size:54px;font-weight:850;letter-spacing:-.03em;line-height:1}
.summary .lab{color:var(--muted);font-size:13.5px;margin-top:6px}
/* lists / forms */
.field{margin-top:14px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:15px}
textarea.inp{min-height:120px;resize:vertical;line-height:1.6}
.inp:focus{outline:2px solid var(--indigo);border-color:var(--indigo)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.optedit{display:flex;gap:8px;align-items:center;margin-top:8px}
.optedit input[type=text]{flex:1}
.optedit .rm{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;flex:none;font-size:16px}
.mark{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.listitem{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);
  background:#fff;border-radius:14px;padding:13px 13px;margin-top:9px}
.listitem .txt{min-width:0}
.listitem .jpw{font-weight:700;font-size:16px}
.listitem .es{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.listitem .acts{display:flex;gap:6px;flex:none}

la subordinada que modifica al sustantivo siguiente. Este caso, la partícula “が” puede sustituirse por “の”.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>がいた<ruby>小説<rt>しょうせつ<\/rt><\/ruby> ＝ <ruby>彼<rt>かれ<\/rt><\/ruby>の<ruby>書<rt>か<\/rt><\/ruby>いた<ruby>小説<rt>しょうせつ<\/rt><\/ruby> ・ 　<ruby>庭<rt>にわ<\/rt><\/ruby>がい<ruby>家<rt>いえ<\/rt><\/ruby> ＝ <ruby>庭<rt>にわ<\/rt><\/ruby>の<ruby>広<rt>ひろ<\/rt><\/ruby>い<ruby>家<rt>いえ<\/rt><\/ruby>　　<ruby>窓<rt>まど<\/rt><\/ruby>がない<ruby>部屋<rt>へや<\/rt><\/ruby> ＝ <ruby>窓<rt>まど<\/rt><\/ruby>のない<ruby>部屋<rt>へや<\/rt><\/ruby><\/p><p class=\"lp\">- Cláusula Subordinada + が + Cláusula Principal<\/p><p class=\"lp\">(La partícula “が” aquí expresa conjunción adversativa o simple. Cuando el verbo de la cláusula subordinada tiene conjugación informal, normalmente es una expresión escrita.)<\/p><p class=\"lp\">Adversativa ・ 　　この<ruby>映画<rt>えいが<\/rt><\/ruby>は<ruby>短<rt>みじか<\/rt><\/ruby>いがおもしろい ・ 　　　ドアをノックしましたが<ruby>返事<rt>へんじ<\/rt><\/ruby>がありませんでした<\/p><p class=\"lp\">（<ruby>短<rt>たん<\/rt><\/ruby>いけどXXX）（<ruby>短<rt>たん<\/rt><\/ruby>いのにXXX） ・  （ノックしましたけどXXX）（ノックしましたのにXXX）<\/p><p class=\"lp\">Simple ・    <ruby>彼<rt>かれ<\/rt><\/ruby>に<ruby>会<rt>あ<\/rt><\/ruby>ったが<ruby>元気<rt>げんき<\/rt><\/ruby>そうだった ・      <ruby>頂<rt>いただ<\/rt><\/ruby>いたクッキーを<ruby>食<rt>た<\/rt><\/ruby>べましたがおいしかったです<\/p><p class=\"lp\">（<ruby>会<rt>かい<\/rt><\/ruby>ったけどXXX）（<ruby>会<rt>かい<\/rt><\/ruby>ったところXXX）   （<ruby>食<rt>しょく<\/rt><\/ruby>べましたけどXXX））<ruby>食<rt>しょく<\/rt><\/ruby>べましたところXXX）<\/p>","text":"助詞じょし「が」の復習ふくしゅう - Sustantivo + が + Verbo(Cando el predicado expresa una acción, efecto, cambio, etc., la partícula “が” expresa el sujeto.)雪ゆきがる ・  ・ 猫ねこがに上のぼった ・ 弟おとうとがえにいきます ・ 　　妹いもうとがで料理りょうりする- Sustantivo + が + Verbo/Adjetivo(Cuando el predicado es una palabra estativa, La partícula “が” representa al sujeto de ese estado.)庭にわにバラが咲さいている ・  ・ 海うみのが美うつくしい ・ このレストランはパエリアがおいしい- Sustantivo + が + Sustantivo Idéntico(La partícula “が” también se utiliza para indicar el sujeto cuando el predicado es otro sustantivo idéntico. Tiene el matiz de identificar a uno entre varios candidatos.)彼かれが君くんです ・ あの人ひとが責任者せきにんしゃです ・ 東京とうきょうが日本にっぽんの首都しゅとです ・ 　　こちらがわたし私わたくしの父ちちです- [Sujetoは +] Sustantivo + が + Verbo(Con los predicados que expresan emociones, percepciones, capacidades o deseos, el objeto al que se dirigen esas emociones, percepciones, capacidades o deseos se expresa con la partícula “が”.)彼かれはクラシックが好すきだ ・  ・ わたし私わたくしはコロナウィルスが心配しんぱいだ ・  ・ 新あたらしいが欲ほしい今晩こんばんはが食たべたいですか ・  ・ 田中たなかさんはができる ・  ・ わたし私わたくしのはテニスが上手じょうずです- Sustantivo + は/に/には + Sustantivo + が + Adjetivo “ある, いる, 多さわい, 少すくなない, ない, いない”(Cuando el predicado es un verbo o adjetivo como “ある(hay)”, “いる(estar)”, &quot;多さわい(muchos)&quot;, &quot;少すくなない(pocos)&quot;, &quot;ない(no hay)” o “いない(no estar)” que expresa existencia o cantidad cuantitativa, el sujeto que posee el objeto está representado por la partícula “は/に/には” y el objeto que es poseído por la partícula “が”.)本棚ほんだなにがある　　　このは公園こうえんが多おおい　　　高速こうそく道路どうろにトイレが少すくない　　このには窓まどがない- Sustantivo + が + Verbo/Adjetivo + Sustantivo(La partícula “が” se usa cuando la parte entera de “Sustantivo + が + Verbo/Adjetivo” compone una cláusula subordinada que modifica al sustantivo siguiente. Este caso, la partícula “が” puede sustituirse por “の”.)彼かれがいた小説しょうせつ ＝ 彼かれの書かいた小説しょうせつ ・ 　庭にわがい家いえ ＝ 庭にわの広ひろい家いえ　　窓まどがない部屋へや ＝ 窓まどのない部屋へや- Cláusula Subordinada + が + Cláusula Principal(La partícula “が” aquí expresa conjunción adversativa o simple. Cuando el verbo de la cláusula subordinada tiene conjugación informal, normalmente es una expresión escrita.)Adversativa ・ 　　この映画えいがは短みじかいがおもしろい ・ 　　　ドアをノックしましたが返事へんじがありませんでした（短たんいけどXXX）（短たんいのにXXX） ・  （ノックしましたけどXXX）（ノックしましたのにXXX）Simple ・    彼かれに会あったが元気げんきそうだった ・      頂いただいたクッキーを食たべましたがおいしかったです（会かいったけどXXX）（会かいったところXXX）   （食しょくべましたけどXXX））食しょくべましたところXXX）"},{"id":"L003","file":"20251110_Particula__NI___1_.docx","cat":"part","catLabel":"Partículas","title":"助詞「に」の復習（1）","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「に」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>（1）","html":"<p class=\"lp\">- Sustantivo (lugar) + に + Verbo<\/p><p class=\"lp\">(La partícula “に” aguí indica el lugar hacia donde se dirige la acción del verbo que sigue a continuación o el lugar donde el sujeto se encuentra sin movimientos.)<\/p><p class=\"lp\"><ruby>学校<rt>がっこう<\/rt><\/ruby>にく ・ 　タクシーに<ruby>乗<rt>の<\/rt><\/ruby>る ・ <ruby>壁<rt>かべ<\/rt><\/ruby>にを<ruby>飾<rt>かざ<\/rt><\/ruby>る ・ 　あした<ruby>明日<rt>あす<\/rt><\/ruby>はにいます ・ <ruby>庭<rt>にわ<\/rt><\/ruby>にが<ruby>咲<rt>さ<\/rt><\/ruby>いている<\/p><p class=\"lp\">- Sustantivo (tiempo) + に + Verbo<\/p><p class=\"lp\">(La partícula “に” aguí indica el tiempo cuando se realiza la acción que sigue a continuación o occure la situación que sigue a continuación.)<\/p><p class=\"lp\"><ruby>毎朝<rt>まいあさ<\/rt><\/ruby>７に<ruby>起<rt>お<\/rt><\/ruby>きる ・ 　<ruby>土曜日<rt>どようび<\/rt><\/ruby>にサッカーの<ruby>試合<rt>しあい<\/rt><\/ruby>がある ・ 　　　<ruby>去年<rt>きょねん<\/rt><\/ruby>の10<ruby>月<rt>がつ<\/rt><\/ruby>に<ruby>日本<rt>にっぽん<\/rt><\/ruby>に<ruby>来<rt>き<\/rt><\/ruby>ました<\/p><p class=\"lp\">- Sustantivo (objeto o propósito) / Verbo en forma-ます sin ます / Verbo Sustantivado + に + Verbo<\/p><p class=\"lp\">(La partícula “に” aguí indica el objeto o propósito para el cual se realizan las acciónes o movimientos del verbo que sigue a continuación.)<\/p><p class=\"lp\"><ruby>友達<rt>ともだち<\/rt><\/ruby>にする ・ ニコラスににほんご<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>教<rt>おし<\/rt><\/ruby>える ・ <ruby>漢字<rt>かんじ<\/rt><\/ruby>のに<ruby>集中<rt>しゅうちゅう<\/rt><\/ruby>する<\/p><p class=\"lp\"><ruby>野菜<rt>やさい<\/rt><\/ruby>をいに<ruby>出<rt>で<\/rt><\/ruby>かける ・  ・ おいしいものをべに<ruby>行<rt>い<\/rt><\/ruby>こう ・ ハサミはを<ruby>切<rt>き<\/rt><\/ruby>るのに<ruby>使<rt>つか<\/rt><\/ruby>う<\/p><p class=\"lp\">- Sustantivo (resultado de un cambio) + に + Verbo<\/p><p class=\"lp\">(La partícula “に” aguí indica el resultado de un cambio expresado con el verbo.)<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>はになった ・ 　　<ruby>夜<rt>よる<\/rt><\/ruby>になると<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>雪<rt>ゆき<\/rt><\/ruby>に<ruby>変<rt>か<\/rt><\/ruby>わります ・ ゲームのことでとけんかになった<\/p><p class=\"lp\">- Sustantivo (causa o razón) + に + Verbo<\/p><p class=\"lp\">(La partícula “に” aguí indica la causa o razón de una reacción expreada con el verbo que sigue a continuación.)<\/p><p class=\"lp\"><ruby>大<rt>おお<\/rt><\/ruby>きなに<ruby>驚<rt>おどろ<\/rt><\/ruby>いた ・ 　おに<ruby>困<rt>こま<\/rt><\/ruby>っている ・ <ruby>彼<rt>かれ<\/rt><\/ruby>のに<ruby>感動<rt>かんどう<\/rt><\/ruby>した ・ <ruby>夜<rt>よる<\/rt><\/ruby><ruby>遅<rt>おそ<\/rt><\/ruby>くまでくことに<ruby>疲<rt>つか<\/rt><\/ruby>れた<\/p><p class=\"lp\">- Sustantivo (sujeto del verbo) + に + Verbo en forma pasiva<\/p><p class=\"lp\">(La partícula “に” aguí indica el agente del verbo en voz pasiva que sigue a continuación.)<\/p><p class=\"lp\"><ruby>教授<rt>きょうじゅ<\/rt><\/ruby>にられました ・ 　<ruby>友達<rt>ともだち<\/rt><\/ruby>にを<ruby>借<rt>か<\/rt><\/ruby>りる ・ <ruby>犯人<rt>はんにん<\/rt><\/ruby>がに<ruby>捕<rt>つか<\/rt><\/ruby>まった ・ <ruby>母<rt>はは<\/rt><\/ruby>にまれて<ruby>牛乳<rt>ぎゅうにゅう<\/rt><\/ruby>を<ruby>買<rt>か<\/rt><\/ruby>った<\/p><p class=\"lp\">- (1) Verbo, Adjetivo o Cláusula subordinada + のに + Verbo, Adjetivo o Cláusula principal<\/p><p class=\"lp\">(2) Sustantivo + なのに + Verbo o Adjetivo<\/p><p class=\"lp\">(La partícula “のに” aguí conecta el primer verbo / adjetivo o Cláusula subordinada con el segundo verbo / adjetivo, o la cláusula principal, de tal que, la acción / situación del primer verbo / adjetivo o la cláusula subordinada continúa de manera adversative a la acción / situación del segundo verbo / adjetivo o la cláusula principal. Es una expresión similar a la conjunción “pero”.  A continuación de un sustantivo, la partícula “なのに” se utiliza. Es una expresión similar a “a pesar de”.)<\/p><p class=\"lp\"><ruby>眠<rt>ねむ<\/rt><\/ruby>いのに<ruby>眠<rt>ねむ<\/rt><\/ruby>れない ・ 　<ruby>彼<rt>かれ<\/rt><\/ruby>はたくさん<ruby>食<rt>た<\/rt><\/ruby>べるのにふとらない ・ あれだけ<ruby>練習<rt>れんしゅう<\/rt><\/ruby>したのに<ruby>試合<rt>しあい<\/rt><\/ruby>で<ruby>負<rt>ま<\/rt><\/ruby>けた<\/p><p class=\"lp\">まだ10<ruby>月<rt>がつ<\/rt><\/ruby>なのに<ruby>寒<rt>さむ<\/rt><\/ruby>い ・  ・ <ruby>雨<rt>あめ<\/rt><\/ruby>なのに<ruby>傘<rt>かさ<\/rt><\/ruby>を<ruby>持<rt>も<\/rt><\/ruby>っていない ・ <ruby>彼<rt>かれ<\/rt><\/ruby>はスペイン<ruby>人<rt>ひと<\/rt><\/ruby>なのに<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>が<ruby>上手<rt>じょうず<\/rt><\/ruby>だ<\/p>","text":"助詞じょし「に」の復習ふくしゅう（1） - Sustantivo (lugar) + に + Verbo(La partícula “に” aguí indica el lugar hacia donde se dirige la acción del verbo que sigue a continuación o el lugar donde el sujeto se encuentra sin movimientos.)学校がっこうにく ・ 　タクシーに乗のる ・ 壁かべにを飾かざる ・ 　あした明日あすはにいます ・ 庭にわにが咲さいている- Sustantivo (tiempo) + に + Verbo(La partícula “に” aguí indica el tiempo cuando se realiza la acción que sigue a continuación o occure la situación que sigue a continuación.)毎朝まいあさ７に起おきる ・ 　土曜日どようびにサッカーの試合しあいがある ・ 　　　去年きょねんの10月がつに日本にっぽんに来きました- Sustantivo (objeto o propósito) / Verbo en forma-ます sin ます / Verbo Sustantivado + に + Verbo(La partícula “に” aguí indica el objeto o propósito para el cual se realizan las acciónes o movimientos del verbo que sigue a continuación.)友達ともだちにする ・ ニコラスににほんご日本にっぽん語ごを教おしえる ・ 漢字かんじのに集中しゅうちゅうする野菜やさいをいに出でかける ・  ・ おいしいものをべに行いこう ・ ハサミはを切きるのに使つかう- Sustantivo (resultado de un cambio) + に + Verbo(La partícula “に” aguí indica el resultado de un cambio expresado con el verbo.)彼かれはになった ・ 　　夜よるになると雨あめが雪ゆきに変かわります ・ ゲームのことでとけんかになった- Sustantivo (causa o razón) + に + Verbo(La partícula “に” aguí indica la causa o razón de una reacción expreada con el verbo que sigue a continuación.)大おおきなに驚おどろいた ・ 　おに困こまっている ・ 彼かれのに感動かんどうした ・ 夜よる遅おそくまでくことに疲つかれた- Sustantivo (sujeto del verbo) + に + Verbo en forma pasiva(La partícula “に” aguí indica el agente del verbo en voz pasiva que sigue a continuación.)教授きょうじゅにられました ・ 　友達ともだちにを借かりる ・ 犯人はんにんがに捕つかまった ・ 母ははにまれて牛乳ぎゅうにゅうを買かった- (1) Verbo, Adjetivo o Cláusula subordinada + のに + Verbo, Adjetivo o Cláusula principal(2) Sustantivo + なのに + Verbo o Adjetivo(La partícula “のに” aguí conecta el primer verbo / adjetivo o Cláusula subordinada con el segundo verbo / adjetivo, o la cláusula principal, de tal que, la acción / situación del primer verbo / adjetivo o la cláusula subordinada continúa de manera adversative a la acción / situación del segundo verbo / adjetivo o la cláusula principal. Es una expresión similar a la conjunción “pero”.  A continuación de un sustantivo, la partícula “なのに” se utiliza. Es una expresión similar a “a pesar de”.)眠ねむいのに眠ねむれない ・ 　彼かれはたくさん食たべるのにふとらない ・ あれだけ練習れんしゅうしたのに試合しあいで負まけたまだ10月がつなのに寒さむい ・  ・ 雨あめなのに傘かさを持もっていない ・ 彼かれはスペイン人ひとなのに日本にっぽん語ごが上手じょうずだ"},{"id":"L004","file":"20251127_Particula__DE___1_.docx","cat":"part","catLabel":"Partículas","title":"助詞「で」の復習（1）","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「で」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>（1）","html":"<p class=\"lp\">- Sustantivo (lugar) + で + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el lugar donde se realizan las acciónes o movimientos posteriores.)<\/p><p class=\"lp\"><ruby>公園<rt>こうえん<\/rt><\/ruby>でサッカーをした ・  ・ あした<ruby>明日<rt>あす<\/rt><\/ruby>、<ruby>駅<rt>えき<\/rt><\/ruby>で<ruby>会<rt>あ<\/rt><\/ruby>いましょう ・  ・ あのホテルで<ruby>友達<rt>ともだち<\/rt><\/ruby>の<ruby>結婚式<rt>けっこんしき<\/rt><\/ruby>がある<\/p><p class=\"lp\">- Sustantivo (material) + で + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el material del otro sustantivo que aparece en la misma sentencia.)<\/p><p class=\"lp\">この<ruby>家<rt>いえ<\/rt><\/ruby>は<ruby>石<rt>いし<\/rt><\/ruby>で<ruby>作<rt>つく<\/rt><\/ruby>られている ・ <ruby>紙<rt>かみ<\/rt><\/ruby>で<ruby>飛行機<rt>ひこうき<\/rt><\/ruby>を<ruby>作<rt>つく<\/rt><\/ruby>りました ・  ・ <ruby>木<rt>き<\/rt><\/ruby>でできた<ruby>橋<rt>はし<\/rt><\/ruby>は<ruby>壊<rt>こわ<\/rt><\/ruby>れやすい<\/p><p class=\"lp\">- Sustantivo (método o herramienta) + で + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el método por el que, o herramienta con el que, se realizan las acciónes o movimientos del verbo que sigue a continuación.)<\/p><p class=\"lp\">この<ruby>紙<rt>かみ<\/rt><\/ruby>に<ruby>鉛筆<rt>えんぴつ<\/rt><\/ruby>で<ruby>書<rt>か<\/rt><\/ruby>いて<ruby>下<rt>くだ<\/rt><\/ruby>さい ・ <ruby>弁当<rt>べんとう<\/rt><\/ruby>を<ruby>電子<rt>でんし<\/rt><\/ruby>レンジで<ruby>温<rt>あたた<\/rt><\/ruby>めます ・ <ruby>昨日<rt>きのう<\/rt><\/ruby>の<ruby>飛行機<rt>ひこうき<\/rt><\/ruby>でにほん<ruby>日本<rt>にっぽん<\/rt><\/ruby>に<ruby>来<rt>き<\/rt><\/ruby>ました<\/p><p class=\"lp\">- Sustantivo (causa) + で + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica la causa por la que ocurre la situación mencionada a continuación.)<\/p><p class=\"lp\"><ruby>風邪<rt>かぜ<\/rt><\/ruby>で<ruby>学校<rt>がっこう<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>んだ ・  ・ <ruby>緊張<rt>きんちょう<\/rt><\/ruby>で<ruby>脚<rt>あし<\/rt><\/ruby>が<ruby>震<rt>ふる<\/rt><\/ruby>えています ・  ・ <ruby>友人<rt>ゆうじん<\/rt><\/ruby>のことで<ruby>悩<rt>なや<\/rt><\/ruby>んでいる<\/p><p class=\"lp\">- Sustantivo (limite o rango) + で + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el limite o el rango en el que se realizan las acciónes o situaciones mencionada a continuación.)<\/p><p class=\"lp\"><ruby>駅<rt>えき<\/rt><\/ruby>まで10ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>で<ruby>歩<rt>ある<\/rt><\/ruby>けます ・ この<ruby>桃<rt>もも<\/rt><\/ruby>は4<ruby>個<rt>こ<\/rt><\/ruby>で300<ruby>円<rt>えん<\/rt><\/ruby>です ・  ・ <ruby>日本<rt>にっぽん<\/rt><\/ruby>で<ruby>一番<rt>いちばん<\/rt><\/ruby><ruby>高<rt>たか<\/rt><\/ruby>い<ruby>山<rt>やま<\/rt><\/ruby>は<ruby>富士山<rt>ふじさん<\/rt><\/ruby>です<\/p><p class=\"lp\">- Sustantivo (motivo) + で + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el motive del que se realizan las acciónes mencionada a continuación.)<\/p><p class=\"lp\"><ruby>先月<rt>せんげつ<\/rt><\/ruby>、<ruby>仕事<rt>しごと<\/rt><\/ruby>で<ruby>京都<rt>きょうと<\/rt><\/ruby>を<ruby>訪<rt>おとず<\/rt><\/ruby>れた ・ <ruby>観光<rt>かんこう<\/rt><\/ruby>で<ruby>行<rt>い<\/rt><\/ruby>ってみたい<ruby>所<rt>ところ<\/rt><\/ruby>はありますか？ ・ <ruby>趣味<rt>しゅみ<\/rt><\/ruby>で<ruby>散歩<rt>さんぽ<\/rt><\/ruby>を<ruby>楽<rt>たの<\/rt><\/ruby>しんでいる<\/p><p class=\"lp\">- Sujeto1 + は + Sustantivo1 + で、(Sujeto2 + は +) Sustantivo2 + です/だ<\/p><p class=\"lp\">(La partícula “で” aguí conecta dos o más sustantivos u oraciones. Es algo similar a la conjunción “y”.)<\/p><p class=\"lp\">ニコラス<ruby>君<rt>くん<\/rt><\/ruby>はスペイン<ruby>人<rt>ひと<\/rt><\/ruby>で、YNUの<ruby>留学生<rt>りゅうがくせい<\/rt><\/ruby>です ・  ・ <ruby>父<rt>ちち<\/rt><\/ruby>は<ruby>弁護士<rt>べんごし<\/rt><\/ruby>で、<ruby>母<rt>はは<\/rt><\/ruby>は<ruby>医者<rt>いしゃ<\/rt><\/ruby>です<\/p><p class=\"lp\">- Verbo en forma-て(で) / Adjetivo en forma-て(で) + Verbo/ Adjetivo/ Cláusula principal<\/p><p class=\"lp\">(La partícula “で” aguí conecta el primer verbo / adjetivo con el segundo verbo / adjetivo, o la cláusula subordinada con la cláusula principal, de tal que, la acción / situación del primer verbo / adjetivo o la cláusula subordinada continua a la acción / situación del segundo verbo / adjetivo o la cláusula principal. Es algo similar a la conjunción “y”. La partícula, “て” se usa en lugar de “で” dependiendo del verbo / adjetivo que precede.)<\/p><p class=\"lp\">この<ruby>海峡<rt>かいきょう<\/rt><\/ruby>を<ruby>泳<rt>およ<\/rt><\/ruby>いで<ruby>渡<rt>わた<\/rt><\/ruby>る<ruby>大会<rt>たいかい<\/rt><\/ruby>がある ・ <ruby>静<rt>しず<\/rt><\/ruby>かで<ruby>涼<rt>すず<\/rt><\/ruby>しい<ruby>森<rt>もり<\/rt><\/ruby>にいる ・ <ruby>下<rt>した<\/rt><\/ruby>の<ruby>文章<rt>ぶんしょう<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>んで、<ruby>問題<rt>もんだい<\/rt><\/ruby>に<ruby>答<rt>こた<\/rt><\/ruby>えなさい<\/p><p class=\"lp\"><ruby>漢字<rt>かんじ<\/rt><\/ruby>は<ruby>書<rt>か<\/rt><\/ruby>いて<ruby>覚<rt>おぼ<\/rt><\/ruby>えよう　　ここの<ruby>牛丼<rt>ぎゅうどん<\/rt><\/ruby>は<ruby>安<rt>やす<\/rt><\/ruby>くておいしい ・ 　<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>角<rt>かど<\/rt><\/ruby>を<ruby>右<rt>みぎ<\/rt><\/ruby>に<ruby>曲<rt>ま<\/rt><\/ruby>がって、まっすぐ<ruby>進<rt>すす<\/rt><\/ruby>んで<ruby>下<rt>くだ<\/rt><\/ruby>さい<\/p>","text":"助詞じょし「で」の復習ふくしゅう（1） - Sustantivo (lugar) + で + Verbo(La partícula “で” aguí indica el lugar donde se realizan las acciónes o movimientos posteriores.)公園こうえんでサッカーをした ・  ・ あした明日あす、駅えきで会あいましょう ・  ・ あのホテルで友達ともだちの結婚式けっこんしきがある- Sustantivo (material) + で + Verbo(La partícula “で” aguí indica el material del otro sustantivo que aparece en la misma sentencia.)この家いえは石いしで作つくられている ・ 紙かみで飛行機ひこうきを作つくりました ・  ・ 木きでできた橋はしは壊こわれやすい- Sustantivo (método o herramienta) + で + Verbo(La partícula “で” aguí indica el método por el que, o herramienta con el que, se realizan las acciónes o movimientos del verbo que sigue a continuación.)この紙かみに鉛筆えんぴつで書かいて下ください ・ 弁当べんとうを電子でんしレンジで温あたためます ・ 昨日きのうの飛行機ひこうきでにほん日本にっぽんに来きました- Sustantivo (causa) + で + Verbo(La partícula “で” aguí indica la causa por la que ocurre la situación mencionada a continuación.)風邪かぜで学校がっこうを休やすんだ ・  ・ 緊張きんちょうで脚あしが震ふるえています ・  ・ 友人ゆうじんのことで悩なやんでいる- Sustantivo (limite o rango) + で + Verbo(La partícula “で” aguí indica el limite o el rango en el que se realizan las acciónes o situaciones mencionada a continuación.)駅えきまで10ぷん分ぶんで歩あるけます ・ この桃ももは4個こで300円えんです ・  ・ 日本にっぽんで一番いちばん高たかい山やまは富士山ふじさんです- Sustantivo (motivo) + で + Verbo(La partícula “で” aguí indica el motive del que se realizan las acciónes mencionada a continuación.)先月せんげつ、仕事しごとで京都きょうとを訪おとずれた ・ 観光かんこうで行いってみたい所ところはありますか？ ・ 趣味しゅみで散歩さんぽを楽たのしんでいる- Sujeto1 + は + Sustantivo1 + で、(Sujeto2 + は +) Sustantivo2 + です/だ(La partícula “で” aguí conecta dos o más sustantivos u oraciones. Es algo similar a la conjunción “y”.)ニコラス君くんはスペイン人ひとで、YNUの留学生りゅうがくせいです ・  ・ 父ちちは弁護士べんごしで、母ははは医者いしゃです- Verbo en forma-て(で) / Adjetivo en forma-て(で) + Verbo/ Adjetivo/ Cláusula principal(La partícula “で” aguí conecta el primer verbo / adjetivo con el segundo verbo / adjetivo, o la cláusula subordinada con la cláusula principal, de tal que, la acción / situación del primer verbo / adjetivo o la cláusula subordinada continua a la acción / situación del segundo verbo / adjetivo o la cláusula principal. Es algo similar a la conjunción “y”. La partícula, “て” se usa en lugar de “で” dependiendo del verbo / adjetivo que precede.)この海峡かいきょうを泳およいで渡わたる大会たいかいがある ・ 静しずかで涼すずしい森もりにいる ・ 下したの文章ぶんしょうを読よんで、問題もんだいに答こたえなさい漢字かんじは書かいて覚おぼえよう　　ここの牛丼ぎゅうどんは安やすくておいしい ・ 　次つぎの角かどを右みぎに曲まがって、まっすぐ進すすんで下ください"},{"id":"L005","file":"20251127_Particula__DE___2_.docx","cat":"part","catLabel":"Partículas","title":"助詞「で」の復習（2）／「で」と「では」","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「で」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>（2）／「で」と「では」","html":"<p class=\"lp\">- Sustantivo (lugar) + で + Verbo ・  ・ Sustantivo (lugar) + では + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el lugar donde se realizan las acciónes o movimientos que sigue a continuación. Sin embargo, cuando se enfatiza el lugar de la acción añadiendo un matíz de algo contrario (sobre todo, cuando se niega el lugar con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** en otro lugar.)<\/p><p class=\"lp\"><ruby>公園<rt>こうえん<\/rt><\/ruby>でサッカーをした ・  ・  ・  ・ <ruby>公園<rt>こうえん<\/rt><\/ruby>ではサッカーをした（<ruby>家<rt>いえ<\/rt><\/ruby>ではゲームをした）<\/p><p class=\"lp\">この<ruby>公園<rt>こうえん<\/rt><\/ruby>でサーカーをしてはいけない ・  ・ このではサーカーをしてはいけない（<ruby>他<rt>ほか<\/rt><\/ruby>のはOK）<\/p><p class=\"lp\">- Sustantivo (material) + で + Verbo ・  ・ Sustantivo (material) + では + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el material del otro sustantivo que aparece en la misma sentencia. Sin embargo, cuando se enfatiza el material añadiendo un matíz de algo contrario (sobre todo, cuando se niega el material con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** de otro material.)<\/p><p class=\"lp\">このは<ruby>石<rt>いし<\/rt><\/ruby>で<ruby>作<rt>つく<\/rt><\/ruby>られている ・  ・ このは<ruby>石<rt>いし<\/rt><\/ruby>では<ruby>作<rt>つく<\/rt><\/ruby>られている（でもあまり<ruby>頑丈<rt>がんじょう<\/rt><\/ruby>ではない）<\/p><p class=\"lp\">このは<ruby>石<rt>いし<\/rt><\/ruby>で<ruby>作<rt>つく<\/rt><\/ruby>られていない ・  ・ このは<ruby>石<rt>いし<\/rt><\/ruby>では<ruby>作<rt>つく<\/rt><\/ruby>られていない（レンガでられている）<\/p><p class=\"lp\">- Sustantivo (método o herramienta) + で + Verbo ・ 　Sustantivo (método o herramienta) + では + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el método por el que, o herramienta con el que, se realizan las acciónes o movimientos del verbo que sigue a continuación. Sin embargo, cuando se enfatiza el método o herramienta añadiendo un matíz de algo contrario (sobre todo, cuando se niega el método o herramienta con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** de otro método o con otro herramienta.)<\/p><p class=\"lp\">このに<ruby>鉛筆<rt>えんぴつ<\/rt><\/ruby>で<ruby>書<rt>か<\/rt><\/ruby>いて<ruby>下<rt>くだ<\/rt><\/ruby>さい ・ 　　　このに<ruby>鉛筆<rt>えんぴつ<\/rt><\/ruby>では<ruby>書<rt>か<\/rt><\/ruby>いて<ruby>下<rt>くだ<\/rt><\/ruby>さい（ボールペンをっていない<ruby>場合<rt>ばあい<\/rt><\/ruby>には）<\/p><p class=\"lp\">このに<ruby>鉛筆<rt>えんぴつ<\/rt><\/ruby>で<ruby>書<rt>か<\/rt><\/ruby>かないで<ruby>下<rt>くだ<\/rt><\/ruby>さい　　このに<ruby>鉛筆<rt>えんぴつ<\/rt><\/ruby>では<ruby>書<rt>か<\/rt><\/ruby>かないで<ruby>下<rt>くだ<\/rt><\/ruby>さい（ボールペンでいて<ruby>欲<rt>ほ<\/rt><\/ruby>しい）<\/p><p class=\"lp\">- Sustantivo (causa) + で + Verbo ・ Sustantivo (causa) + では + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica la causa por la que ocurre la situación mencionada a continuación. Sin embargo, cuando se enfatiza la causa añadiendo un matíz de algo contrario (sobre todo, cuando se niega la causa con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** por otra causa.)<\/p><p class=\"lp\"><ruby>風邪<rt>かぜ<\/rt><\/ruby>でを<ruby>休<rt>やす<\/rt><\/ruby>んだ ・  ・  ・ <ruby>風邪<rt>かぜ<\/rt><\/ruby>では<ruby>学校<rt>がっこう<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>んだ（<ruby>他<rt>ほか<\/rt><\/ruby>のでは<ruby>休<rt>やす<\/rt><\/ruby>まなかった）<\/p><p class=\"lp\"><ruby>風邪<rt>かぜ<\/rt><\/ruby>でを<ruby>休<rt>やす<\/rt><\/ruby>まなかった ・  ・ <ruby>風邪<rt>かぜ<\/rt><\/ruby>では<ruby>学校<rt>がっこう<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>まなかった（<ruby>他<rt>ほか<\/rt><\/ruby>のでは<ruby>休<rt>やす<\/rt><\/ruby>んだだろう）<\/p><p class=\"lp\">- Sustantivo (limite o rango) + で + Verbo ・  ・ Sustantivo (limite o rango) + では + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el limite o el rango en el que se realiza las acciónes o situaciónes mencionada a continuación. Sin embargo, cuando se enfatiza el limite o el rango añadiendo un matíz de algo contrario (sobre todo, cuando se niega el limite o el rango con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** de otro limite o rango.)<\/p><p class=\"lp\"><ruby>駅<rt>えき<\/rt><\/ruby>まで10ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>でけます ・  ・ <ruby>駅<rt>えき<\/rt><\/ruby>まで10ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>では<ruby>歩<rt>ある<\/rt><\/ruby>けます（<ruby>多分<rt>たぶん<\/rt><\/ruby>、8ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>でくのは<ruby>難<rt>むずか<\/rt><\/ruby>しい）<\/p><p class=\"lp\"><ruby>駅<rt>えき<\/rt><\/ruby>まで10ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>でけません ・  ・ <ruby>駅<rt>えき<\/rt><\/ruby>まで10ぷん<ruby>分<rt>ぶん<\/rt><\/ruby>では<ruby>歩<rt>ある<\/rt><\/ruby>けません（<ruby>歩<rt>ある<\/rt><\/ruby>くと15<ruby>分<rt>ふん<\/rt><\/ruby>くらいです）<\/p><p class=\"lp\">- Sustantivo (motivo) + で + Verbo ・ Sustantivo (motivo) + では + Verbo<\/p><p class=\"lp\">(La partícula “で” aguí indica el motive del que se realizan las acciónes mencionada a continuación. Sin embargo, cuando se enfatiza el motivo añadiendo un matíz de algo contrario (sobre todo, cuando se niega el motivo con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** por otro motivo.)<\/p><p class=\"lp\"><ruby>先月<rt>せんげつ<\/rt><\/ruby>、<ruby>仕事<rt>しごと<\/rt><\/ruby>で<ruby>京都<rt>きょうと<\/rt><\/ruby>を<ruby>訪<rt>おとず<\/rt><\/ruby>れた ・  ・ <ruby>先月<rt>せんげつ<\/rt><\/ruby>、<ruby>仕事<rt>しごと<\/rt><\/ruby>では<ruby>京都<rt>きょうと<\/rt><\/ruby>を<ruby>訪<rt>おとず<\/rt><\/ruby>れた（<ruby>観光<rt>かんこう<\/rt><\/ruby>の<ruby>目的<rt>もくてき<\/rt><\/ruby>ではなかった）<\/p><p class=\"lp\"><ruby>先月<rt>せんげつ<\/rt><\/ruby>、<ruby>仕事<rt>しごと<\/rt><\/ruby>で<ruby>京都<rt>きょうと<\/rt><\/ruby>を<ruby>訪<rt>おとず<\/rt><\/ruby>れなかった ・ <ruby>先月<rt>せんげつ<\/rt><\/ruby>、<ruby>仕事<rt>しごと<\/rt><\/ruby>では<ruby>京都<rt>きょうと<\/rt><\/ruby>を<ruby>訪<rt>おとず<\/rt><\/ruby>れなかった（<ruby>観光<rt>かんこう<\/rt><\/ruby>の<ruby>目的<rt>もくてき<\/rt><\/ruby>で<ruby>訪<rt>おとず<\/rt><\/ruby>れた）<\/p>","text":"助詞じょし「で」の復習ふくしゅう（2）／「で」と「では」 - Sustantivo (lugar) + で + Verbo ・  ・ Sustantivo (lugar) + では + Verbo(La partícula “で” aguí indica el lugar donde se realizan las acciónes o movimientos que sigue a continuación. Sin embargo, cuando se enfatiza el lugar de la acción añadiendo un matíz de algo contrario (sobre todo, cuando se niega el lugar con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** en otro lugar.)公園こうえんでサッカーをした ・  ・  ・  ・ 公園こうえんではサッカーをした（家いえではゲームをした）この公園こうえんでサーカーをしてはいけない ・  ・ このではサーカーをしてはいけない（他ほかのはOK）- Sustantivo (material) + で + Verbo ・  ・ Sustantivo (material) + では + Verbo(La partícula “で” aguí indica el material del otro sustantivo que aparece en la misma sentencia. Sin embargo, cuando se enfatiza el material añadiendo un matíz de algo contrario (sobre todo, cuando se niega el material con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** de otro material.)このは石いしで作つくられている ・  ・ このは石いしでは作つくられている（でもあまり頑丈がんじょうではない）このは石いしで作つくられていない ・  ・ このは石いしでは作つくられていない（レンガでられている）- Sustantivo (método o herramienta) + で + Verbo ・ 　Sustantivo (método o herramienta) + では + Verbo(La partícula “で” aguí indica el método por el que, o herramienta con el que, se realizan las acciónes o movimientos del verbo que sigue a continuación. Sin embargo, cuando se enfatiza el método o herramienta añadiendo un matíz de algo contrario (sobre todo, cuando se niega el método o herramienta con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** de otro método o con otro herramienta.)このに鉛筆えんぴつで書かいて下ください ・ 　　　このに鉛筆えんぴつでは書かいて下ください（ボールペンをっていない場合ばあいには）このに鉛筆えんぴつで書かかないで下ください　　このに鉛筆えんぴつでは書かかないで下ください（ボールペンでいて欲ほしい）- Sustantivo (causa) + で + Verbo ・ Sustantivo (causa) + では + Verbo(La partícula “で” aguí indica la causa por la que ocurre la situación mencionada a continuación. Sin embargo, cuando se enfatiza la causa añadiendo un matíz de algo contrario (sobre todo, cuando se niega la causa con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** por otra causa.)風邪かぜでを休やすんだ ・  ・  ・ 風邪かぜでは学校がっこうを休やすんだ（他ほかのでは休やすまなかった）風邪かぜでを休やすまなかった ・  ・ 風邪かぜでは学校がっこうを休やすまなかった（他ほかのでは休やすんだだろう）- Sustantivo (limite o rango) + で + Verbo ・  ・ Sustantivo (limite o rango) + では + Verbo(La partícula “で” aguí indica el limite o el rango en el que se realiza las acciónes o situaciónes mencionada a continuación. Sin embargo, cuando se enfatiza el limite o el rango añadiendo un matíz de algo contrario (sobre todo, cuando se niega el limite o el rango con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** de otro limite o rango.)駅えきまで10ぷん分ぶんでけます ・  ・ 駅えきまで10ぷん分ぶんでは歩あるけます（多分たぶん、8ぷん分ぶんでくのは難むずかしい）駅えきまで10ぷん分ぶんでけません ・  ・ 駅えきまで10ぷん分ぶんでは歩あるけません（歩あるくと15分ふんくらいです）- Sustantivo (motivo) + で + Verbo ・ Sustantivo (motivo) + では + Verbo(La partícula “で” aguí indica el motive del que se realizan las acciónes mencionada a continuación. Sin embargo, cuando se enfatiza el motivo añadiendo un matíz de algo contrario (sobre todo, cuando se niega el motivo con un verbo en forma negativa), se usa “では” que puede añadir un matíz de que tal vez ***sí*** por otro motivo.)先月せんげつ、仕事しごとで京都きょうとを訪おとずれた ・  ・ 先月せんげつ、仕事しごとでは京都きょうとを訪おとずれた（観光かんこうの目的もくてきではなかった）先月せんげつ、仕事しごとで京都きょうとを訪おとずれなかった ・ 先月せんげつ、仕事しごとでは京都きょうとを訪おとずれなかった（観光かんこうの目的もくてきで訪おとずれた）"},{"id":"L006","file":"20251201_Comparacion_de_Particulas__NI____DE____WO__y__E_.docx","cat":"part","catLabel":"Partículas","title":"助詞「で」「を」「に」「へ」のルール","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「で」「を」「に」「へ」のルール","html":"<p class=\"lp\">Cada una de Las partículas “で” , “を” , “に” y “へ” se utiliza para indicar “lugar”, pero tiene función distinta que transmite significado diferente.<\/p><p class=\"lp\">- La partícula “で” indica el lugar donde una acción, movimiento o un evento se lleva acabo”. Este lugar es un espacio limitado.<\/p><p class=\"lp\"><ruby>図書館<rt>としょかん<\/rt><\/ruby>でを<ruby>読<rt>よ<\/rt><\/ruby>んでいる ・ スーパーので<ruby>事故<rt>じこ<\/rt><\/ruby>があった ・ <ruby>兄<rt>あに<\/rt><\/ruby>はニューヨークで<ruby>働<rt>はたら<\/rt><\/ruby>いている<\/p><p class=\"lp\">こので<ruby>泳<rt>およ<\/rt><\/ruby>ぐな ・  ・ こちらのでお<ruby>待<rt>ま<\/rt><\/ruby>ちください ・ そのは<ruby>東京駅<rt>とうきょうえき<\/rt><\/ruby>で<ruby>故障<rt>こしょう<\/rt><\/ruby>した<\/p><p class=\"lp\">- La partícula “を” indica el lugar donde una acción o movimiento se pasa por o el lugar donde una acción o movimiento se inicia hacia otro lugar.”<\/p><p class=\"lp\"><ruby>図書館<rt>としょかん<\/rt><\/ruby>をり<ruby>過<rt>す<\/rt><\/ruby>ぎる ・  ・ スーパーのを<ruby>右<rt>みぎ<\/rt><\/ruby>に<ruby>曲<rt>ま<\/rt><\/ruby>がる ・ <ruby>兄<rt>あに<\/rt><\/ruby>はニューヨークを<ruby>旅行<rt>りょこう<\/rt><\/ruby>している<\/p><p class=\"lp\">このを<ruby>泳<rt>およ<\/rt><\/ruby>いで<ruby>渡<rt>わた<\/rt><\/ruby>る ・  ・ <ruby>席<rt>せき<\/rt><\/ruby>をって<ruby>窓口<rt>まどぐち<\/rt><\/ruby>にお<ruby>越<rt>こ<\/rt><\/ruby>しください ・ 　　そのは<ruby>東京駅<rt>とうきょうえき<\/rt><\/ruby>を<ruby>出発<rt>しゅっぱつ<\/rt><\/ruby>した<\/p><p class=\"lp\">- La partícula “に” indica la ubicación donde algo/alguien se encuentra o el lugar a donde un movimiento se dirige y luego se para.<\/p><p class=\"lp\"><ruby>今<rt>いま<\/rt><\/ruby>、にいます ・  ・ スーパーのに<ruby>銀行<rt>ぎんこう<\/rt><\/ruby>がある ・ <ruby>兄<rt>あに<\/rt><\/ruby>はニューヨークに<ruby>住<rt>す<\/rt><\/ruby>んでいる<\/p><p class=\"lp\"><ruby>川<rt>かわ<\/rt><\/ruby>にゴミを<ruby>捨<rt>す<\/rt><\/ruby>てるな ・  ・ こちらのにおが<ruby>掛<rt>かかり<\/rt><\/ruby>けください ・ そのは<ruby>東京駅<rt>とうきょうえき<\/rt><\/ruby>にとう<ruby>到<rt>いたる<\/rt><\/ruby>ちゃく<ruby>着<rt>き<\/rt><\/ruby>した<\/p><p class=\"lp\">- La partícula “へ” indica la dirección hacia donde una acción o movimiento se dirige. Muchas veces, la partícula “へ” puede sustituirse con la partícula “に”, pero la partícula “へ” suele utilizarse para el destino menos específico o para no repetir la partícula “に” en una misma cláusula.<\/p><p class=\"lp\"><ruby>図書館<rt>としょかん<\/rt><\/ruby>へ<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>返<rt>かえ<\/rt><\/ruby>す ・  ・ スーパーへ<ruby>買<rt>か<\/rt><\/ruby>いぶつ<ruby>物<rt>もの<\/rt><\/ruby>に<ruby>行<rt>こう<\/rt><\/ruby>く ・  ・ <ruby>兄<rt>あに<\/rt><\/ruby>はニューヨークへひ<ruby>引<rt>いん<\/rt><\/ruby>っ<ruby>越<rt>こ<\/rt><\/ruby>した<\/p><p class=\"lp\">**をお**<\/p><p class=\"lp\"><ruby>公園<rt>こうえん<\/rt><\/ruby><\/p><p class=\"lp\"><ruby>多<rt>おお<\/rt><\/ruby>くの<ruby>小川<rt>おがわ<\/rt><\/ruby>がこの<ruby>川<rt>かわ<\/rt><\/ruby>へ<ruby>流<rt>なが<\/rt><\/ruby>れる　お<ruby>席<rt>せき<\/rt><\/ruby>の<ruby>方<rt>ほう<\/rt><\/ruby>へご<ruby>案内<rt>あんない<\/rt><\/ruby>します　　　その<ruby>新幹線<rt>しんかんせん<\/rt><\/ruby>は２<ruby>時<rt>じ<\/rt><\/ruby><ruby>頃<rt>ころ<\/rt><\/ruby>に<ruby>東北<rt>とうほく<\/rt><\/ruby><ruby>地方<rt>ちほう<\/rt><\/ruby>へ<ruby>向<rt>む<\/rt><\/ruby>かう**へ**<\/p><p class=\"lp\">**に**<\/p><p class=\"lp\">**で**<\/p>","text":"助詞じょし「で」「を」「に」「へ」のルール Cada una de Las partículas “で” , “を” , “に” y “へ” se utiliza para indicar “lugar”, pero tiene función distinta que transmite significado diferente.- La partícula “で” indica el lugar donde una acción, movimiento o un evento se lleva acabo”. Este lugar es un espacio limitado.図書館としょかんでを読よんでいる ・ スーパーので事故じこがあった ・ 兄あにはニューヨークで働はたらいているこので泳およぐな ・  ・ こちらのでお待まちください ・ そのは東京駅とうきょうえきで故障こしょうした- La partícula “を” indica el lugar donde una acción o movimiento se pasa por o el lugar donde una acción o movimiento se inicia hacia otro lugar.”図書館としょかんをり過すぎる ・  ・ スーパーのを右みぎに曲まがる ・ 兄あにはニューヨークを旅行りょこうしているこのを泳およいで渡わたる ・  ・ 席せきをって窓口まどぐちにお越こしください ・ 　　そのは東京駅とうきょうえきを出発しゅっぱつした- La partícula “に” indica la ubicación donde algo/alguien se encuentra o el lugar a donde un movimiento se dirige y luego se para.今いま、にいます ・  ・ スーパーのに銀行ぎんこうがある ・ 兄あにはニューヨークに住すんでいる川かわにゴミを捨すてるな ・  ・ こちらのにおが掛かかりけください ・ そのは東京駅とうきょうえきにとう到いたるちゃく着きした- La partícula “へ” indica la dirección hacia donde una acción o movimiento se dirige. Muchas veces, la partícula “へ” puede sustituirse con la partícula “に”, pero la partícula “へ” suele utilizarse para el destino menos específico o para no repetir la partícula “に” en una misma cláusula.図書館としょかんへ本ほんを返かえす ・  ・ スーパーへ買かいぶつ物ものに行こうく ・  ・ 兄あにはニューヨークへひ引いんっ越こした**をお**公園こうえん多おおくの小川おがわがこの川かわへ流ながれる　お席せきの方ほうへご案内あんないします　　　その新幹線しんかんせんは２時じ頃ころに東北とうほく地方ちほうへ向むかう**へ****に****で**"},{"id":"L007","file":"20251201_Particulas_en_Frases_Causativas.docx","cat":"part","catLabel":"Partículas","title":"使役表現の助詞について (Acerca de las Partículas en Expresiones Causativas)","titleRuby":"<ruby>使役<rt>しえき<\/rt><\/ruby><ruby>表現<rt>ひょうげん<\/rt><\/ruby>の<ruby>助詞<rt>じょし<\/rt><\/ruby>について (Acerca de las Partículas en Expresiones Causativas)","html":"<p class=\"lp\">- Cuando el predicado se compone de un verbo transitivo causativo, la partícula “に” viene después de la persona que realiza la acción del verbo y la partícula “を” después del objeto de la acción.<\/p><p class=\"lp\">- Sujeto は/が + Persona/Animal, etc.) +に+ Objeto +を+ Verbo transitivo en forma causativa<\/p><p class=\"lp\">[La persona que instruye o permite] は/が [La persona que actúa o realiza una acción] に [Objeto de la acción] を [actuar] させる.<\/p><p class=\"lp\"><ruby>先生<rt>せんせい<\/rt><\/ruby>はに<ruby>黒板<rt>こくばん<\/rt><\/ruby>を<ruby>消<rt>け<\/rt><\/ruby>させた　<ruby>看護師<rt>かんごし<\/rt><\/ruby>はに<ruby>薬<rt>くすり<\/rt><\/ruby>を<ruby>飲<rt>の<\/rt><\/ruby>ませた　 <ruby>先輩<rt>せんぱい<\/rt><\/ruby>がにパエリアを<ruby>作<rt>つく<\/rt><\/ruby>らせてくれた<\/p><p class=\"lp\">Sin embargo, en caso de un verbo transitivo que lleva un objeto acompañado de la partícula “に”, es suele utilizar la partícula “を” después del agente de la acción.<\/p><p class=\"lp\">- Sujeto は/が + Persona/Animal, etc.) +を+ Objeto +に+ Verbo transitivo en forma causativa<\/p><p class=\"lp\">[La persona que instruye o permite] は/が [La persona que actúa o realiza una acción] を [Objeto de la acción] に [actuar] させる.<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>はを<ruby>家族<rt>かぞく<\/rt><\/ruby>に<ruby>会<rt>あ<\/rt><\/ruby>わせる ・ 　<ruby>親<rt>おや<\/rt><\/ruby>がどもを<ruby>先生<rt>せんせい<\/rt><\/ruby>に<ruby>相談<rt>そうだん<\/rt><\/ruby>させた　　<ruby>部長<rt>ぶちょう<\/rt><\/ruby>はをその<ruby>意見<rt>いけん<\/rt><\/ruby>に<ruby>賛成<rt>さんせい<\/rt><\/ruby>させた<\/p><p class=\"lp\">- En cambio, cuando el predicado se compone de un verbo intransitivo causativo, dependiendo del verbo y contexto que vemos abajo, la partícula “を” o “に” viene después del agente de acción que realiza la acción del verbo.<\/p><p class=\"lp\">&lt;Regla 1&gt;<\/p><p class=\"lp\">Cuando el verbo causativo utilizado en el predicado expresa una emoción temporal, se utiliza la partícula “を” después de la persona que actúa o realiza la acción.<\/p><p class=\"lp\">- Sujeto は/が + Objeto (persona/animal, etc.) + を + Verbo Intransitivo en forma causativa<\/p><p class=\"lp\">[Sujeto que causa la acción] は [La persona que actúa o realiza la acción] を [actuar] させる.)<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>のが<ruby>彼女<rt>かのじょ<\/rt><\/ruby>を<ruby>怒<rt>おこ<\/rt><\/ruby>らせた　　そのゴールはを<ruby>驚<rt>おどろ<\/rt><\/ruby>かせた　　<ruby>佐藤<rt>さとう<\/rt><\/ruby>さんはを<ruby>笑<rt>わら<\/rt><\/ruby>わせるのが<ruby>得意<rt>とくい<\/rt><\/ruby>だ<\/p><p class=\"lp\"><ruby>彼<rt>かれ<\/rt><\/ruby>のが<ruby>恋人<rt>こいびと<\/rt><\/ruby>を<ruby>泣<rt>な<\/rt><\/ruby>かせた　 　ピエロは<ruby>子<rt>こ<\/rt><\/ruby>どもたちを<ruby>喜<rt>よろこ<\/rt><\/ruby>ばせる　 そのニュースは<ruby>母<rt>はは<\/rt><\/ruby>を<ruby>悲<rt>かな<\/rt><\/ruby>しませた<\/p><p class=\"lp\">&lt;Regla 2&gt;<\/p><p class=\"lp\">Cuando el agente de la acción del verbo causativo es un objeto inanimado que carece de voluntad, viene la partícula “を” después de ese objeto.<\/p><p class=\"lp\">- Sujeto は/が + Objeto (agente de acción) + を + Verbo Intransitivo en forma causativa<\/p><p class=\"lp\">[Sujeto que causa la acción] は [Objeto inanimado] を [actuar] させる.<\/p><p class=\"lp\"><ruby>昨夜<rt>さくや<\/rt><\/ruby>、までをらせた　　<ruby>温<rt>あたた<\/rt><\/ruby>かい<ruby>気候<rt>きこう<\/rt><\/ruby>が<ruby>桜<rt>さくら<\/rt><\/ruby>をくかせた　　<ruby>冷<rt>つめ<\/rt><\/ruby>たいは<ruby>雪<rt>ゆき<\/rt><\/ruby>を<ruby>降<rt>ふ<\/rt><\/ruby>らせる<\/p><p class=\"lp\">&lt;Regla 3&gt;<\/p><p class=\"lp\">En otros casos de verbos intransitivos causativos, tanto la partícula “に” como la partícula “を” pueden seguir al agente de la acción. El uso de “を” insinua el significado de “compulsion”, mientras que el uso de “に” insinua el significado de “permiso o aquiescencia”.<\/p><p class=\"lp\">- Sujeto は/が + Objeto (agente de acción) + を/に + Verbo Intransitivo en forma causativa<\/p><p class=\"lp\">[Sujeto que causa la acción] は [Objeto inanimado] を/に [actuar] させる.<\/p><p class=\"lp\"><ruby>母親<rt>ははおや<\/rt><\/ruby>はどもを<ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>歩<rt>ある<\/rt><\/ruby>かせた  ・  ・ La madre hizo a su hijo caminar solo.<\/p><p class=\"lp\"><ruby>母親<rt>ははおや<\/rt><\/ruby>はどもに<ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>歩<rt>ある<\/rt><\/ruby>かせた ・  ・ La madre dejó a su hijo caminar solo.<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>のわりに<ruby>弟<rt>おとうと<\/rt><\/ruby>を<ruby>参加<rt>さんか<\/rt><\/ruby>させた ・  ・ Le hice participar a mi hermano menor en mi lugar.<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>のわりに<ruby>弟<rt>おとうと<\/rt><\/ruby>に<ruby>参加<rt>さんか<\/rt><\/ruby>させた  ・ Le dejé participar a mi hermano menor en mi lugar.<\/p><p class=\"lp\">Sin embargo, cuando la partícula “を” aparece en la misma oración para indicar el lugar donde se produce la acción o el movimiento del verbo, se utiliza la partícula “に” después del agente de la acción. Del mismo modo, cuando la partícula “に” aparece en la misma oración para indicar el lugar hacia el que se dirige la acción del verbo, se utiliza la partícula “を” después del agente de la acción.<\/p><p class=\"lp\"><ruby>母親<rt>ははおや<\/rt><\/ruby>はどもに<ruby>歩道<rt>ほどう<\/rt><\/ruby>を<ruby>歩<rt>ある<\/rt><\/ruby>かせた ・  ・ La madre hizo que su hijo caminara por la acera.<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>のをパーティーに<ruby>参加<rt>さんか<\/rt><\/ruby>させた ・ Hice que mi hermano menor asistiera a la fiesta.<\/p><p class=\"lp\">- Hay algunos verbos que se utilizan unos casos como verbos intransitivos y otros casos como verbos transitivos. Para determinar si es un verbo intransitivo o transitivo, comprueba si precede una palabra que funcione como su objeto (es decir, una que lleve la partícula “を”).<\/p><p class=\"lp\"><ruby>先生<rt>せんせい<\/rt><\/ruby>はの<ruby>生徒<rt>せいと<\/rt><\/ruby>を<ruby>医務室<rt>いむしつ<\/rt><\/ruby>で<ruby>休<rt>やす<\/rt><\/ruby>ませた ・ El profesor hizo que el alumno enfermo descansara en la enfermería.<\/p><p class=\"lp\"><ruby>先生<rt>せんせい<\/rt><\/ruby>はの<ruby>生徒<rt>せいと<\/rt><\/ruby>に<ruby>授業<rt>じゅぎょう<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>ませた ・ El profesor dejó al alumno enfermo que ausenciara a clase.<\/p><p class=\"lp\"><ruby>司会者<rt>しかいしゃ<\/rt><\/ruby>はをロナウドと<ruby>話<rt>はな<\/rt><\/ruby>させてくれた ・ 　  　El presentador me dejó hablar con Ronaldo.<\/p><p class=\"lp\"><ruby>司会者<rt>しかいしゃ<\/rt><\/ruby>はに<ruby>自分<rt>じぶん<\/rt><\/ruby>の<ruby>経験<rt>けいけん<\/rt><\/ruby>を<ruby>話<rt>はな<\/rt><\/ruby>させてくれた  　El presentador me permitió contar mis propias experiencias.<\/p><p class=\"lp\">-  Los verbos en forma de “XXする” se pueden expresar también en forma de “XXをする”. Este último se considera verbo transitivo, la parte “XXを” serviendo como objeto. Los verbos “XXする” en sí pueden ser intransitive o transitivo, dependiendo de palabras verbales.<\/p><p class=\"lp\"><ruby>毎朝<rt>まいあさ<\/rt><\/ruby>、は<ruby>犬<rt>いぬ<\/rt><\/ruby>を<ruby>散歩<rt>さんぽ<\/rt><\/ruby>させる ・  ・  ・ Cada mañana, mi hermana pasea al perro.<\/p><p class=\"lp\"><ruby>毎朝<rt>まいあさ<\/rt><\/ruby>、はに<ruby>散歩<rt>さんぽ<\/rt><\/ruby>をさせる ・  ・  ・ Cada mañana, mi hermana saca al perro a pasear.<\/p><p class=\"lp\"><ruby>両親<rt>りょうしん<\/rt><\/ruby>はをカナダに<ruby>留学<rt>りゅうがく<\/rt><\/ruby>させてくれた ・  ・ Mis padres me permitieron estudiar en Canadá.<\/p><p class=\"lp\"><ruby>両親<rt>りょうしん<\/rt><\/ruby>はにカナダへの<ruby>留学<rt>りゅうがく<\/rt><\/ruby>をさせてくれた ・ Mis padres me permitieron estudiar en Canadá.<\/p><p class=\"lp\"><ruby>母<rt>はは<\/rt><\/ruby>はに<ruby>毎日<rt>まいにち<\/rt><\/ruby>ピアノを<ruby>練習<rt>れんしゅう<\/rt><\/ruby>させる ・  ・ Mi madre me obliga a practicar piano todos los días.<\/p><p class=\"lp\"><ruby>母<rt>はは<\/rt><\/ruby>はに<ruby>毎日<rt>まいにち<\/rt><\/ruby>ピアノの<ruby>練習<rt>れんしゅう<\/rt><\/ruby>をさせる ・  ・ Mi madre me obliga a practicar piano todos los días.<\/p>","text":"使役しえき表現ひょうげんの助詞じょしについて (Acerca de las Partículas en Expresiones Causativas) - Cuando el predicado se compone de un verbo transitivo causativo, la partícula “に” viene después de la persona que realiza la acción del verbo y la partícula “を” después del objeto de la acción.- Sujeto は/が + Persona/Animal, etc.) +に+ Objeto +を+ Verbo transitivo en forma causativa[La persona que instruye o permite] は/が [La persona que actúa o realiza una acción] に [Objeto de la acción] を [actuar] させる.先生せんせいはに黒板こくばんを消けさせた　看護師かんごしはに薬くすりを飲のませた　 先輩せんぱいがにパエリアを作つくらせてくれたSin embargo, en caso de un verbo transitivo que lleva un objeto acompañado de la partícula “に”, es suele utilizar la partícula “を” después del agente de la acción.- Sujeto は/が + Persona/Animal, etc.) +を+ Objeto +に+ Verbo transitivo en forma causativa[La persona que instruye o permite] は/が [La persona que actúa o realiza una acción] を [Objeto de la acción] に [actuar] させる.わたし私わたくしはを家族かぞくに会あわせる ・ 　親おやがどもを先生せんせいに相談そうだんさせた　　部長ぶちょうはをその意見いけんに賛成さんせいさせた- En cambio, cuando el predicado se compone de un verbo intransitivo causativo, dependiendo del verbo y contexto que vemos abajo, la partícula “を” o “に” viene después del agente de acción que realiza la acción del verbo.&lt;Regla 1&gt;Cuando el verbo causativo utilizado en el predicado expresa una emoción temporal, se utiliza la partícula “を” después de la persona que actúa o realiza la acción.- Sujeto は/が + Objeto (persona/animal, etc.) + を + Verbo Intransitivo en forma causativa[Sujeto que causa la acción] は [La persona que actúa o realiza la acción] を [actuar] させる.)わたし私わたくしのが彼女かのじょを怒おこらせた　　そのゴールはを驚おどろかせた　　佐藤さとうさんはを笑わらわせるのが得意とくいだ彼かれのが恋人こいびとを泣なかせた　 　ピエロは子こどもたちを喜よろこばせる　 そのニュースは母ははを悲かなしませた&lt;Regla 2&gt;Cuando el agente de la acción del verbo causativo es un objeto inanimado que carece de voluntad, viene la partícula “を” después de ese objeto.- Sujeto は/が + Objeto (agente de acción) + を + Verbo Intransitivo en forma causativa[Sujeto que causa la acción] は [Objeto inanimado] を [actuar] させる.昨夜さくや、までをらせた　　温あたたかい気候きこうが桜さくらをくかせた　　冷つめたいは雪ゆきを降ふらせる&lt;Regla 3&gt;En otros casos de verbos intransitivos causativos, tanto la partícula “に” como la partícula “を” pueden seguir al agente de la acción. El uso de “を” insinua el significado de “compulsion”, mientras que el uso de “に” insinua el significado de “permiso o aquiescencia”.- Sujeto は/が + Objeto (agente de acción) + を/に + Verbo Intransitivo en forma causativa[Sujeto que causa la acción] は [Objeto inanimado] を/に [actuar] させる.母親ははおやはどもを一人ひとりで歩あるかせた  ・  ・ La madre hizo a su hijo caminar solo.母親ははおやはどもに一人ひとりで歩あるかせた ・  ・ La madre dejó a su hijo caminar solo.わたし私わたくしのわりに弟おとうとを参加さんかさせた ・  ・ Le hice participar a mi hermano menor en mi lugar.わたし私わたくしのわりに弟おとうとに参加さんかさせた  ・ Le dejé participar a mi hermano menor en mi lugar.Sin embargo, cuando la partícula “を” aparece en la misma oración para indicar el lugar donde se produce la acción o el movimiento del verbo, se utiliza la partícula “に” después del agente de la acción. Del mismo modo, cuando la partícula “に” aparece en la misma oración para indicar el lugar hacia el que se dirige la acción del verbo, se utiliza la partícula “を” después del agente de la acción.母親ははおやはどもに歩道ほどうを歩あるかせた ・  ・ La madre hizo que su hijo caminara por la acera.わたし私わたくしのをパーティーに参加さんかさせた ・ Hice que mi hermano menor asistiera a la fiesta.- Hay algunos verbos que se utilizan unos casos como verbos intransitivos y otros casos como verbos transitivos. Para determinar si es un verbo intransitivo o transitivo, comprueba si precede una palabra que funcione como su objeto (es decir, una que lleve la partícula “を”).先生せんせいはの生徒せいとを医務室いむしつで休やすませた ・ El profesor hizo que el alumno enfermo descansara en la enfermería.先生せんせいはの生徒せいとに授業じゅぎょうを休やすませた ・ El profesor dejó al alumno enfermo que ausenciara a clase.司会者しかいしゃはをロナウドと話はなさせてくれた ・ 　  　El presentador me dejó hablar con Ronaldo.司会者しかいしゃはに自分じぶんの経験けいけんを話はなさせてくれた  　El presentador me permitió contar mis propias experiencias.-  Los verbos en forma de “XXする” se pueden expresar también en forma de “XXをする”. Este último se considera verbo transitivo, la parte “XXを” serviendo como objeto. Los verbos “XXする” en sí pueden ser intransitive o transitivo, dependiendo de palabras verbales.毎朝まいあさ、は犬いぬを散歩さんぽさせる ・  ・  ・ Cada mañana, mi hermana pasea al perro.毎朝まいあさ、はに散歩さんぽをさせる ・  ・  ・ Cada mañana, mi hermana saca al perro a pasear.両親りょうしんはをカナダに留学りゅうがくさせてくれた ・  ・ Mis padres me permitieron estudiar en Canadá.両親りょうしんはにカナダへの留学りゅうがくをさせてくれた ・ Mis padres me permitieron estudiar en Canadá.母はははに毎日まいにちピアノを練習れんしゅうさせる ・  ・ Mi madre me obliga a practicar piano todos los días.母はははに毎日まいにちピアノの練習れんしゅうをさせる ・  ・ Mi madre me obliga a practicar piano todos los días."},{"id":"L008","file":"20251211_Particula_Final__NA_.docx","cat":"part","catLabel":"Partículas","title":"終助詞「な」の復習","titleRuby":"<ruby>終<rt>しゅう<\/rt><\/ruby><ruby>助詞<rt>じょし<\/rt><\/ruby>「な」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivo +だ / Adjetivo / Verbo + な(あ)<\/p><p class=\"lp\">(La partícula final “な” expresa pensamientos o sentimientos que surgen en la mente y se expresan como si se dijeran de forma espontánea. Puede tener forma de “なあ” también. Se emplea a menudo en contextos como soliloquios, exclamaciones, deseos o especulaciones personales en los que no se busca la aprobación directa del oyente. Es una expresión de lenguaje hablado. La expresión de este modo de uso puede llevar la partícula “と” y luego verbos como “<ruby>思<rt>おもう<\/rt><\/ruby>う”, “<ruby>感<rt>かん<\/rt><\/ruby>じる”, etc.)<\/p><p class=\"lp\"><ruby>今日<rt>きょう<\/rt><\/ruby>はいい<ruby>天気<rt>てんき<\/rt><\/ruby>だな。<ruby>散歩<rt>さんぽ<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>こう。 ・  ・ このイチゴ、<ruby>甘<rt>あま<\/rt><\/ruby>くておいしいなあ。<\/p><p class=\"lp\"><ruby>夕食<rt>ゆうしょく<\/rt><\/ruby>は<ruby>焼<rt>や<\/rt><\/ruby>き<ruby>肉<rt>にく<\/rt><\/ruby>が<ruby>食<rt>た<\/rt><\/ruby>べたいなあ。 ・  ・ <ruby>驚<rt>おどろ<\/rt><\/ruby>いたな！<ruby>日本<rt>にっぽん<\/rt><\/ruby>がブラジルに<ruby>勝<rt>か<\/rt><\/ruby>った。<\/p><p class=\"lp\">あした<ruby>明日<rt>あす<\/rt><\/ruby>は<ruby>晴<rt>は<\/rt><\/ruby>れたらいいなと<ruby>思<rt>おも<\/rt><\/ruby>う。 ・  ・  ・ <ruby>朝<rt>あさ<\/rt><\/ruby>は<ruby>風<rt>かぜ<\/rt><\/ruby>が<ruby>冷<rt>つめ<\/rt><\/ruby>たいなあと<ruby>感<rt>かん<\/rt><\/ruby>じた。<\/p><p class=\"lp\">- Verbo en forma diccionario + な<\/p><p class=\"lp\">(La partícula final “な” indica una orden de prohibición contra una determinada acción o comportamiento. Es una expresión de lenguaje hablado. Pero esta expresión suena muy fuerte, y se usa más para dar una alerta que una orden. Con frecuencia se usa también en letreros y señales. Para suavisarla, suele utilizarse “〜ないで”, o más cortés “〜ないでください”.)<\/p><p class=\"lp\">「<ruby>芝生<rt>しばふ<\/rt><\/ruby>に<ruby>入<rt>はい<\/rt><\/ruby>るな！」 ・  　　「ここにゴミを<ruby>捨<rt>す<\/rt><\/ruby>てるな！」 ・ 　　　　<ruby>津波<rt>つなみ<\/rt><\/ruby>が<ruby>来<rt>く<\/rt><\/ruby>るぞ。<ruby>海<rt>うみ<\/rt><\/ruby>に<ruby>近<rt>ちか<\/rt><\/ruby>づくな！<\/p><p class=\"lp\"><ruby>危<rt>あぶ<\/rt><\/ruby>ないからこっちには<ruby>来<rt>く<\/rt><\/ruby>るな。（<ruby>危<rt>あぶ<\/rt><\/ruby>ないからこっちには<ruby>来<rt>こ<\/rt><\/ruby>ないで。）<\/p><p class=\"lp\">クマが<ruby>出<rt>で<\/rt><\/ruby>るので、あの<ruby>森<rt>もり<\/rt><\/ruby>には<ruby>行<rt>い<\/rt><\/ruby>くな。（クマが<ruby>出<rt>で<\/rt><\/ruby>るので、あの<ruby>森<rt>もり<\/rt><\/ruby>には<ruby>行<rt>い<\/rt><\/ruby>かないでください。）<\/p>","text":"終しゅう助詞じょし「な」の復習ふくしゅう - Sustantivo +だ / Adjetivo / Verbo + な(あ)(La partícula final “な” expresa pensamientos o sentimientos que surgen en la mente y se expresan como si se dijeran de forma espontánea. Puede tener forma de “なあ” también. Se emplea a menudo en contextos como soliloquios, exclamaciones, deseos o especulaciones personales en los que no se busca la aprobación directa del oyente. Es una expresión de lenguaje hablado. La expresión de este modo de uso puede llevar la partícula “と” y luego verbos como “思おもうう”, “感かんじる”, etc.)今日きょうはいい天気てんきだな。散歩さんぽに行いこう。 ・  ・ このイチゴ、甘あまくておいしいなあ。夕食ゆうしょくは焼やき肉にくが食たべたいなあ。 ・  ・ 驚おどろいたな！日本にっぽんがブラジルに勝かった。あした明日あすは晴はれたらいいなと思おもう。 ・  ・  ・ 朝あさは風かぜが冷つめたいなあと感かんじた。- Verbo en forma diccionario + な(La partícula final “な” indica una orden de prohibición contra una determinada acción o comportamiento. Es una expresión de lenguaje hablado. Pero esta expresión suena muy fuerte, y se usa más para dar una alerta que una orden. Con frecuencia se usa también en letreros y señales. Para suavisarla, suele utilizarse “〜ないで”, o más cortés “〜ないでください”.)「芝生しばふに入はいるな！」 ・  　　「ここにゴミを捨すてるな！」 ・ 　　　　津波つなみが来くるぞ。海うみに近ちかづくな！危あぶないからこっちには来くるな。（危あぶないからこっちには来こないで。）クマが出でるので、あの森もりには行いくな。（クマが出でるので、あの森もりには行いかないでください。）"},{"id":"L009","file":"20260115_Particula__KARA_.docx","cat":"part","catLabel":"Partículas","title":"助詞「から」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「から」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivo (momento) / Adjetivo en forma-く / Verbo en forma-て(で) + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica el momento en que comienza un asunto concreto. La expresión con verbo en forma-て(で) + から es equivalente a la cláusula subordinada “Después de ---“.)<\/p><p class=\"lp\"><ruby>来週<rt>らいしゅう<\/rt><\/ruby>からに<ruby>出張<rt>しゅっちょう<\/rt><\/ruby>します ・ 　<ruby>今年<rt>ことし<\/rt><\/ruby>のからテニスを<ruby>始<rt>はじ<\/rt><\/ruby>めた ・ レストランは<ruby>早<rt>はや<\/rt><\/ruby>くからあ<ruby>開<rt>かい<\/rt><\/ruby>いている<\/p><p class=\"lp\">まず<ruby>飲<rt>の<\/rt><\/ruby>んでから<ruby>映画館<rt>えいがかん<\/rt><\/ruby>に<ruby>行<rt>い<\/rt><\/ruby>こう ・  ・ シャワーをびてから<ruby>家<rt>いえ<\/rt><\/ruby>を<ruby>出<rt>で<\/rt><\/ruby>ました<\/p><p class=\"lp\">- Sustantivo (lugar) / Adjetivo en forma-く + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica el lugar o punto de partida desde el que comienza una acción, comportamiento o estado. Cuando el punto de partida está claramente definido, las partículas “から” y “を” pueden intercambiarse; sin embargo, cuando no está claramente definido, solo se puede utilizar la partícula “から”.)<\/p><p class=\"lp\"><ruby>家<rt>いえ<\/rt><\/ruby>からで<ruby>来<rt>き<\/rt><\/ruby>ました ・ <ruby>太陽<rt>たいよう<\/rt><\/ruby>はから<ruby>昇<rt>のぼ<\/rt><\/ruby>る ・ バスにいると、<ruby>遠<rt>とお<\/rt><\/ruby>くから<ruby>大<rt>おお<\/rt><\/ruby>きな<ruby>声<rt>こえ<\/rt><\/ruby>が<ruby>聞<rt>き<\/rt><\/ruby>こえた<\/p><p class=\"lp\"><ruby>海<rt>うみ<\/rt><\/ruby>からしい<ruby>風<rt>かぜ<\/rt><\/ruby>が<ruby>吹<rt>ふ<\/rt><\/ruby>いた ・ わたし<ruby>私<rt>わたくし<\/rt><\/ruby>のから<ruby>富士山<rt>ふじさん<\/rt><\/ruby>が<ruby>見<rt>み<\/rt><\/ruby>える ・ <ruby>突然<rt>とつぜん<\/rt><\/ruby>、から<ruby>木<rt>き<\/rt><\/ruby>の<ruby>枝<rt>えだ<\/rt><\/ruby>が<ruby>落<rt>お<\/rt><\/ruby>ちてきた<\/p><p class=\"lp\">- Sustantivo (lugar) + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica la ruta seguida cuando una persona u objeto se desplaza a un lugar concreto.)<\/p><p class=\"lp\">こちらのから<ruby>入<rt>はい<\/rt><\/ruby>ってください ・  ・ このバスは、<ruby>前<rt>まえ<\/rt><\/ruby>のドアから<ruby>乗<rt>の<\/rt><\/ruby>って、<ruby>後<rt>うし<\/rt><\/ruby>ろのドアから<ruby>降<rt>お<\/rt><\/ruby>りる<\/p><p class=\"lp\"><ruby>窓<rt>まど<\/rt><\/ruby>からが<ruby>入<rt>はい<\/rt><\/ruby>ってきた ・  ・  ・ <ruby>天井<rt>てんじょう<\/rt><\/ruby>からが<ruby>漏<rt>も<\/rt><\/ruby>ってきている<\/p><p class=\"lp\">- Sustantivo + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica el punto de partida de un cambio en un estado determinado.)<\/p><p class=\"lp\"><ruby>信号<rt>しんごう<\/rt><\/ruby>がから<ruby>青<rt>あお<\/rt><\/ruby>に<ruby>変<rt>か<\/rt><\/ruby>わった ・ <ruby>季節<rt>きせつ<\/rt><\/ruby>がから<ruby>冬<rt>ふゆ<\/rt><\/ruby>へと<ruby>移<rt>うつ<\/rt><\/ruby>ってきた ・ <ruby>旅行先<rt>りょこうさき<\/rt><\/ruby>をから<ruby>奈良<rt>なら<\/rt><\/ruby>に<ruby>変更<rt>へんこう<\/rt><\/ruby>した<\/p><p class=\"lp\">- Sustantivo + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica el comienzo de un ámbito o secuencia temporal o espacial.)<\/p><p class=\"lp\"><ruby>今日<rt>きょう<\/rt><\/ruby>のアルバイトは５から９じ<ruby>時<rt>じ<\/rt><\/ruby>までです ・ <ruby>右<rt>みぎ<\/rt><\/ruby>のから<ruby>順番<rt>じゅんばん<\/rt><\/ruby>にお<ruby>名前<rt>なまえ<\/rt><\/ruby>を<ruby>言<rt>い<\/rt><\/ruby>ってください<\/p><p class=\"lp\">ナイフとフォークはから<ruby>使<rt>つか<\/rt><\/ruby>います ・  ・ わたし<ruby>私<rt>わたくし<\/rt><\/ruby>の<ruby>入<rt>はい<\/rt><\/ruby>り<ruby>口<rt>くち<\/rt><\/ruby>から５<ruby>番目<rt>ばんめ<\/rt><\/ruby>の<ruby>部屋<rt>へや<\/rt><\/ruby>です<\/p><p class=\"lp\">- Sustantivo (persona) + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica el actor de una acción o comportamiento dirigido hacia el hablante.)<\/p><p class=\"lp\"><ruby>学校<rt>がっこう<\/rt><\/ruby>からを<ruby>受<rt>う<\/rt><\/ruby>け<ruby>取<rt>と<\/rt><\/ruby>った ・ お<ruby>様<rt>さま<\/rt><\/ruby>から<ruby>注文<rt>ちゅうもん<\/rt><\/ruby>を<ruby>聞<rt>き<\/rt><\/ruby>いてきて ・ <ruby>先輩<rt>せんぱい<\/rt><\/ruby>からパエリヤの<ruby>作<rt>つく<\/rt><\/ruby>りかた<ruby>方<rt>ほう<\/rt><\/ruby>を<ruby>習<rt>なら<\/rt><\/ruby>った<\/p><p class=\"lp\">- Sustantivo (material) + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica la materia prima, ingredientes o components de un objeto. Cuando se utiliza la partícula “から”, la materia prima en sí no es visible en el producto acabado. De ser contrario, se utiliza la partícula “で”.)<\/p><p class=\"lp\">プラスチックはから<ruby>作<rt>つく<\/rt><\/ruby>られている ・  ・ ディズニーランドは６つのエリアからできている<\/p><p class=\"lp\">ワインはブドウから<ruby>作<rt>つく<\/rt><\/ruby>るお<ruby>酒<rt>さけ<\/rt><\/ruby>です ・  ・ <ruby>日本<rt>にっぽん<\/rt><\/ruby>は４つのきな<ruby>島<rt>しま<\/rt><\/ruby>と<ruby>多数<rt>たすう<\/rt><\/ruby>の<ruby>小<rt>ちい<\/rt><\/ruby>さな<ruby>島<rt>しま<\/rt><\/ruby>から<ruby>構成<rt>こうせい<\/rt><\/ruby>される<\/p><p class=\"lp\">- Sustantivo + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica la base sobre la que se formula un juicio.)<\/p><p class=\"lp\">このデータから<ruby>地震<rt>じしん<\/rt><\/ruby>の<ruby>大<rt>おお<\/rt><\/ruby>きさが<ruby>分<rt>わ<\/rt><\/ruby>かる ・  ・ <ruby>防犯<rt>ぼうはん<\/rt><\/ruby>カメラのから<ruby>犯人<rt>はんにん<\/rt><\/ruby>を<ruby>特定<rt>とくてい<\/rt><\/ruby>することができた<\/p><p class=\"lp\">- Sustantivo + から + Verbo<\/p><p class=\"lp\">(La partícula “から” aquí indica la causa de la consequencia.)<\/p><p class=\"lp\">そのは<ruby>運転手<rt>うんてんしゅ<\/rt><\/ruby>の<ruby>不注意<rt>ふちゅうい<\/rt><\/ruby>から<ruby>起<rt>お<\/rt><\/ruby>きた ・  ・ <ruby>運動<rt>うんどう<\/rt><\/ruby>ぶそく<ruby>不足<rt>ふそく<\/rt><\/ruby>からが<ruby>増<rt>ふ<\/rt><\/ruby>えてしまいました<\/p><p class=\"lp\">- Sustantivo + だ / Cláusula Subordinada + から + Cláusula Principal<\/p><p class=\"lp\">(La cláusula subordinada que termina con la partícula “から” indica que expone la razón o base del juicio del asunto expresado en la cláusula principal. La cláusula con la partícula “から” puede venir al final de la oración para enfatizar la razón o base del juicio.)<\/p><p class=\"lp\"><ruby>暇<rt>ひま<\/rt><\/ruby>だから<ruby>買<rt>か<\/rt><\/ruby>いぶつ<ruby>物<rt>もの<\/rt><\/ruby>にでも<ruby>行<rt>い<\/rt><\/ruby>こう ・  ・  ・ <ruby>余<rt>あま<\/rt><\/ruby>り<ruby>勉強<rt>べんきょう<\/rt><\/ruby>しないから、テストで<ruby>良<rt>よ<\/rt><\/ruby>い<ruby>点<rt>てん<\/rt><\/ruby>が<ruby>取<rt>と<\/rt><\/ruby>れない<\/p><p class=\"lp\"><ruby>今日<rt>きょう<\/rt><\/ruby>はもう<ruby>遅<rt>おそ<\/rt><\/ruby>いから、あした<ruby>明日<rt>あす<\/rt><\/ruby><ruby>映画<rt>えいが<\/rt><\/ruby>の<ruby>続<rt>つづ<\/rt><\/ruby>きを<ruby>見<rt>み<\/rt><\/ruby>よう ・  ・ <ruby>彼<rt>かれ<\/rt><\/ruby>が<ruby>機嫌<rt>きげん<\/rt><\/ruby><ruby>悪<rt>わる<\/rt><\/ruby>いのは、<ruby>試合<rt>しあい<\/rt><\/ruby>に<ruby>負<rt>ま<\/rt><\/ruby>けたからだ<\/p>","text":"助詞じょし「から」の復習ふくしゅう - Sustantivo (momento) / Adjetivo en forma-く / Verbo en forma-て(で) + から + Verbo(La partícula “から” aquí indica el momento en que comienza un asunto concreto. La expresión con verbo en forma-て(で) + から es equivalente a la cláusula subordinada “Después de ---“.)来週らいしゅうからに出張しゅっちょうします ・ 　今年ことしのからテニスを始はじめた ・ レストランは早はやくからあ開かいいているまず飲のんでから映画館えいがかんに行いこう ・  ・ シャワーをびてから家いえを出でました- Sustantivo (lugar) / Adjetivo en forma-く + から + Verbo(La partícula “から” aquí indica el lugar o punto de partida desde el que comienza una acción, comportamiento o estado. Cuando el punto de partida está claramente definido, las partículas “から” y “を” pueden intercambiarse; sin embargo, cuando no está claramente definido, solo se puede utilizar la partícula “から”.)家いえからで来きました ・ 太陽たいようはから昇のぼる ・ バスにいると、遠とおくから大おおきな声こえが聞きこえた海うみからしい風かぜが吹ふいた ・ わたし私わたくしのから富士山ふじさんが見みえる ・ 突然とつぜん、から木きの枝えだが落おちてきた- Sustantivo (lugar) + から + Verbo(La partícula “から” aquí indica la ruta seguida cuando una persona u objeto se desplaza a un lugar concreto.)こちらのから入はいってください ・  ・ このバスは、前まえのドアから乗のって、後うしろのドアから降おりる窓まどからが入はいってきた ・  ・  ・ 天井てんじょうからが漏もってきている- Sustantivo + から + Verbo(La partícula “から” aquí indica el punto de partida de un cambio en un estado determinado.)信号しんごうがから青あおに変かわった ・ 季節きせつがから冬ふゆへと移うつってきた ・ 旅行先りょこうさきをから奈良ならに変更へんこうした- Sustantivo + から + Verbo(La partícula “から” aquí indica el comienzo de un ámbito o secuencia temporal o espacial.)今日きょうのアルバイトは５から９じ時じまでです ・ 右みぎのから順番じゅんばんにお名前なまえを言いってくださいナイフとフォークはから使つかいます ・  ・ わたし私わたくしの入はいり口くちから５番目ばんめの部屋へやです- Sustantivo (persona) + から + Verbo(La partícula “から” aquí indica el actor de una acción o comportamiento dirigido hacia el hablante.)学校がっこうからを受うけ取とった ・ お様さまから注文ちゅうもんを聞きいてきて ・ 先輩せんぱいからパエリヤの作つくりかた方ほうを習ならった- Sustantivo (material) + から + Verbo(La partícula “から” aquí indica la materia prima, ingredientes o components de un objeto. Cuando se utiliza la partícula “から”, la materia prima en sí no es visible en el producto acabado. De ser contrario, se utiliza la partícula “で”.)プラスチックはから作つくられている ・  ・ ディズニーランドは６つのエリアからできているワインはブドウから作つくるお酒さけです ・  ・ 日本にっぽんは４つのきな島しまと多数たすうの小ちいさな島しまから構成こうせいされる- Sustantivo + から + Verbo(La partícula “から” aquí indica la base sobre la que se formula un juicio.)このデータから地震じしんの大おおきさが分わかる ・  ・ 防犯ぼうはんカメラのから犯人はんにんを特定とくていすることができた- Sustantivo + から + Verbo(La partícula “から” aquí indica la causa de la consequencia.)そのは運転手うんてんしゅの不注意ふちゅういから起おきた ・  ・ 運動うんどうぶそく不足ふそくからが増ふえてしまいました- Sustantivo + だ / Cláusula Subordinada + から + Cláusula Principal(La cláusula subordinada que termina con la partícula “から” indica que expone la razón o base del juicio del asunto expresado en la cláusula principal. La cláusula con la partícula “から” puede venir al final de la oración para enfatizar la razón o base del juicio.)暇ひまだから買かいぶつ物ものにでも行いこう ・  ・  ・ 余あまり勉強べんきょうしないから、テストで良よい点てんが取とれない今日きょうはもう遅おそいから、あした明日あす映画えいがの続つづきを見みよう ・  ・ 彼かれが機嫌きげん悪わるいのは、試合しあいに負まけたからだ"},{"id":"L010","file":"20260119_Particula__NODE_.docx","cat":"part","catLabel":"Partículas","title":"助詞「ので」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「ので」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivoな / Cláusula Subordinada + ので + Cláusula Principal<\/p><p class=\"lp\">(El sustantivo más “な” o la cláusula subordinada que precede a la partícula “ので” indica la causa o razón de la situación o acción en la cláusula principal.)<\/p><p class=\"lp\"><ruby>危険<rt>きけん<\/rt><\/ruby>なので、<ruby>猿<rt>さる<\/rt><\/ruby>にエサを<ruby>与<rt>あた<\/rt><\/ruby>えないでください ・     <ruby>母<rt>はは<\/rt><\/ruby>のび<ruby>日<rt>ひ<\/rt><\/ruby>を<ruby>祝<rt>いわ<\/rt><\/ruby>うので、ケーキを<ruby>買<rt>か<\/rt><\/ruby>いに<ruby>行<rt>い<\/rt><\/ruby>きます<\/p><p class=\"lp\"><ruby>景色<rt>けしき<\/rt><\/ruby>がきれいなので、<ruby>写真<rt>しゃしん<\/rt><\/ruby>を<ruby>撮<rt>と<\/rt><\/ruby>りましょう ・     <ruby>頭<rt>あたま<\/rt><\/ruby>がかったので、<ruby>昨日<rt>きのう<\/rt><\/ruby>、<ruby>学校<rt>がっこう<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>んだ<\/p><p class=\"lp\">- Sustantivoな / Cláusula Subordinada + ので + Cláusula Principal<\/p><p class=\"lp\">(El Sustantivo más “な” o la cláusula subordinada que precede a la partícula “ので” expresa la base del juicio expresado en la cláusula principal.<\/p><p class=\"lp\"><ruby>雪<rt>ゆき<\/rt><\/ruby>なので、<ruby>外<rt>そと<\/rt><\/ruby>は<ruby>寒<rt>さむ<\/rt><\/ruby>いだろう ・  ・ <ruby>人気<rt>にんき<\/rt><\/ruby>のチームのなので、チケットを<ruby>取<rt>と<\/rt><\/ruby>るのは<ruby>難<rt>むずか<\/rt><\/ruby>しいと<ruby>思<rt>おも<\/rt><\/ruby>う<\/p><p class=\"lp\"><ruby>駅<rt>えき<\/rt><\/ruby>までいので、<ruby>急<rt>いそ<\/rt><\/ruby>いだ<ruby>方<rt>ほう<\/rt><\/ruby>がいいですよ ・  ・ <ruby>事故<rt>じこ<\/rt><\/ruby>があったので、<ruby>道路<rt>どうろ<\/rt><\/ruby>は<ruby>渋滞<rt>じゅうたい<\/rt><\/ruby>しているかもしれない<\/p><p class=\"lp\">- Sustantivoな / Cláusula Subordinada + ので + Cláusula Principal<\/p><p class=\"lp\">(El Sustantivo más “な” o la cláusula subordinada que precede a la partícula “ので” expresa una circunstancia que contribuye a la ejecución del contenido expresado en la cláusula principal.)<\/p><p class=\"lp\">これがの<ruby>電話番号<rt>でんわばんごう<\/rt><\/ruby>なので、<ruby>困<rt>こま<\/rt><\/ruby>ったら<ruby>連絡<rt>れんらく<\/rt><\/ruby>してください<\/p><p class=\"lp\"><ruby>冷蔵庫<rt>れいぞうこ<\/rt><\/ruby>にジュースがあるので、のどが<ruby>乾<rt>かわ<\/rt><\/ruby>いたらいつでも<ruby>飲<rt>の<\/rt><\/ruby>んでいいですよ<\/p><p class=\"lnote\">Nota : Las partículas “ので” y “から” transmiten casi el mismo significado, pero hay varias diferencias en su uso.<\/p><p class=\"lp\">- La partícula “ので” da impresión más cortés y se usa más para enfatizar la situación, mientras la la partícula “から” da impresión menos cortés y se usa más para indicar claramente la razón. Sería una diferencia parecida a las conjunciones “como” y “porque”.  Además, la conexión con el sustantivo o adjetivo tipo-な difiere entre la partícula “ので” y la partícula “から”. Mientras la partícula “ので” sigue a “な”, la partícula “から” sigue a “だ”.<\/p><p class=\"lp\"><ruby>危険<rt>きけん<\/rt><\/ruby>なので、<ruby>猿<rt>さる<\/rt><\/ruby>にエサを<ruby>与<rt>あた<\/rt><\/ruby>えないでください ・ 　　　<ruby>危険<rt>きけん<\/rt><\/ruby>だから、<ruby>猿<rt>さる<\/rt><\/ruby>にエサを<ruby>与<rt>あた<\/rt><\/ruby>えないでください<\/p><p class=\"lp\"><ruby>景色<rt>けしき<\/rt><\/ruby>がきれいなので、<ruby>写真<rt>しゃしん<\/rt><\/ruby>を<ruby>撮<rt>と<\/rt><\/ruby>りましょう ・ 　　　<ruby>景色<rt>けしき<\/rt><\/ruby>がきれいだから、<ruby>写真<rt>しゃしん<\/rt><\/ruby>を<ruby>撮<rt>と<\/rt><\/ruby>りましょう<\/p><p class=\"lp\">- “だろう (でしょう)” y “のだ” solo pueden conectarse con la partícula “から” y nunca con la partícula “ので”.<\/p><p class=\"lp\">あなたはしいでしょうから、わたし<ruby>私<rt>わたくし<\/rt><\/ruby><ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>行<rt>い<\/rt><\/ruby>きます ・ あなたはしいのだから、わたし<ruby>私<rt>わたくし<\/rt><\/ruby><ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>行<rt>い<\/rt><\/ruby>きます<\/p><p class=\"lp\">- La partícula “から” solo puede utilizarse como predicado cuando va acompañado de “だ” o “です”. La partícula “ので” no se utiliza como predicado aun acompañado con “だ” o “です”.<\/p><p class=\"lp\">これだけ<ruby>練習<rt>れんしゅう<\/rt><\/ruby>するのは、<ruby>優勝<rt>ゆうしょう<\/rt><\/ruby>したいからだ ・ <ruby>電話<rt>でんわ<\/rt><\/ruby>できなかったのは、<ruby>会議中<rt>かいぎちゅう<\/rt><\/ruby>だったからです<\/p>","text":"助詞じょし「ので」の復習ふくしゅう - Sustantivoな / Cláusula Subordinada + ので + Cláusula Principal(El sustantivo más “な” o la cláusula subordinada que precede a la partícula “ので” indica la causa o razón de la situación o acción en la cláusula principal.)危険きけんなので、猿さるにエサを与あたえないでください ・     母ははのび日ひを祝いわうので、ケーキを買かいに行いきます景色けしきがきれいなので、写真しゃしんを撮とりましょう ・     頭あたまがかったので、昨日きのう、学校がっこうを休やすんだ- Sustantivoな / Cláusula Subordinada + ので + Cláusula Principal(El Sustantivo más “な” o la cláusula subordinada que precede a la partícula “ので” expresa la base del juicio expresado en la cláusula principal.雪ゆきなので、外そとは寒さむいだろう ・  ・ 人気にんきのチームのなので、チケットを取とるのは難むずかしいと思おもう駅えきまでいので、急いそいだ方ほうがいいですよ ・  ・ 事故じこがあったので、道路どうろは渋滞じゅうたいしているかもしれない- Sustantivoな / Cláusula Subordinada + ので + Cláusula Principal(El Sustantivo más “な” o la cláusula subordinada que precede a la partícula “ので” expresa una circunstancia que contribuye a la ejecución del contenido expresado en la cláusula principal.)これがの電話番号でんわばんごうなので、困こまったら連絡れんらくしてください冷蔵庫れいぞうこにジュースがあるので、のどが乾かわいたらいつでも飲のんでいいですよNota : Las partículas “ので” y “から” transmiten casi el mismo significado, pero hay varias diferencias en su uso.- La partícula “ので” da impresión más cortés y se usa más para enfatizar la situación, mientras la la partícula “から” da impresión menos cortés y se usa más para indicar claramente la razón. Sería una diferencia parecida a las conjunciones “como” y “porque”.  Además, la conexión con el sustantivo o adjetivo tipo-な difiere entre la partícula “ので” y la partícula “から”. Mientras la partícula “ので” sigue a “な”, la partícula “から” sigue a “だ”.危険きけんなので、猿さるにエサを与あたえないでください ・ 　　　危険きけんだから、猿さるにエサを与あたえないでください景色けしきがきれいなので、写真しゃしんを撮とりましょう ・ 　　　景色けしきがきれいだから、写真しゃしんを撮とりましょう- “だろう (でしょう)” y “のだ” solo pueden conectarse con la partícula “から” y nunca con la partícula “ので”.あなたはしいでしょうから、わたし私わたくし一人ひとりで行いきます ・ あなたはしいのだから、わたし私わたくし一人ひとりで行いきます- La partícula “から” solo puede utilizarse como predicado cuando va acompañado de “だ” o “です”. La partícula “ので” no se utiliza como predicado aun acompañado con “だ” o “です”.これだけ練習れんしゅうするのは、優勝ゆうしょうしたいからだ ・ 電話でんわできなかったのは、会議中かいぎちゅうだったからです"},{"id":"L011","file":"20260209_Particula__YORI_.docx","cat":"part","catLabel":"Partículas","title":"助詞「より」の復習","titleRuby":"<ruby>助詞<rt>じょし<\/rt><\/ruby>「より」の<ruby>復習<rt>ふくしゅう<\/rt><\/ruby>","html":"<p class=\"lp\">- Sustantivo + より + Predicado<\/p><p class=\"lp\">(La partícula “より” aquí indica la base para la comparación o selección. La forma “AよりBのほうが” o “BのほうがAより” se utiliza para expresar la evaluación más concreta.)<\/p><p class=\"lp\">わたし<ruby>私<rt>わたくし<\/rt><\/ruby>はがブドウより<ruby>好<rt>す<\/rt><\/ruby>きだ ・ わたし<ruby>私<rt>わたくし<\/rt><\/ruby>はブドウより<ruby>桃<rt>もも<\/rt><\/ruby>のほうが<ruby>好<rt>す<\/rt><\/ruby>きだ ・ 　わたし<ruby>私<rt>わたくし<\/rt><\/ruby>はのほうがブドウより<ruby>好<rt>す<\/rt><\/ruby>きだ<\/p><p class=\"lp\"><ruby>東京<rt>とうきょう<\/rt><\/ruby>はロンドンより<ruby>暑<rt>あつ<\/rt><\/ruby>い ・ ロンドンより<ruby>東京<rt>とうきょう<\/rt><\/ruby>のほうが<ruby>暑<rt>あつ<\/rt><\/ruby>い ・ 　<ruby>東京<rt>とうきょう<\/rt><\/ruby>のほうがロンドンより<ruby>暑<rt>あつ<\/rt><\/ruby>い<\/p><p class=\"lp\"><ruby>日本<rt>にっぽん<\/rt><\/ruby>にた<ruby>時<rt>とき<\/rt><\/ruby>より<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>話<rt>はな<\/rt><\/ruby>せる ・ <ruby>日本<rt>にっぽん<\/rt><\/ruby>にた<ruby>時<rt>とき<\/rt><\/ruby>より<ruby>今<rt>いま<\/rt><\/ruby>のほうが<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>話<rt>はな<\/rt><\/ruby>せる<\/p><p class=\"lp\">- Sustantivo + より + Predicado<\/p><p class=\"lp\">(La partícula “より” aquí indica el tiempo o lugar del comienzo o del punto de partida de algo. Esto suena como una expresión ligeramente más formal y rígida. Para una expresión informal o coloquial, se utiliza más “から” en su lugar.)<\/p><p class=\"lp\"><ruby>結婚式<rt>けっこんしき<\/rt><\/ruby>が２じ<ruby>時<rt>じ<\/rt><\/ruby>より<ruby>行<rt>おこな<\/rt><\/ruby>われる ・ そのは<ruby>横浜港<rt>よこはまこう<\/rt><\/ruby>より<ruby>出港<rt>しゅっこう<\/rt><\/ruby>した ・ <ruby>多摩<rt>たま<\/rt><\/ruby>がわ<ruby>川<rt>かわ<\/rt><\/ruby>よりこうは<ruby>東京<rt>とうきょう<\/rt><\/ruby>です<\/p><p class=\"lp\">・・・<ruby>午後<rt>ごご<\/rt><\/ruby>２<ruby>時<rt>じ<\/rt><\/ruby>から・・・ ・  ・ 　・・・<ruby>横浜<rt>よこはま<\/rt><\/ruby><ruby>港<rt>こう<\/rt><\/ruby>から・・・ ・ <ruby>多摩<rt>たま<\/rt><\/ruby><ruby>川<rt>かわ<\/rt><\/ruby>から・・・<\/p><p class=\"lp\">- Sustantivo / Verbo (en forma diccionario) + より + Predicado<\/p><p class=\"lp\">(La partícula “より” aquí se utiliza en el sentido de seleccionar una cosa entre varias opciones disponibles o rechazar otras.)<\/p><p class=\"lp\">マンガより<ruby>小説<rt>しょうせつ<\/rt><\/ruby>を<ruby>読<rt>よ<\/rt><\/ruby>むべきだ ・  ・ <ruby>薬<rt>くすり<\/rt><\/ruby>をむより<ruby>運動<rt>うんどう<\/rt><\/ruby>しなさい ・ <ruby>泣<rt>な<\/rt><\/ruby>いているより<ruby>笑<
