resión se utiliza para expresar lo que se da por sentado o se considera de sentido común en la sociedad.  En algunos casos, también puede tener connotaciones de consejo u obligación.  En el lenguaje hablado, se puede expresar como “〜もんだ” en vez de “〜ものだ”, y “〜もんじゃない” en vez de “〜ものではない”.","exJp":"こ子どものははや早いものだ。","exJpRuby":"<ruby>子<rt>こ<\/rt><\/ruby>どものは<ruby>早<rt>はや<\/rt><\/ruby>いものだ。"},{"id":"gp198","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「もの」の色々な使い方（１）","pattern":"Verbo en forma-た o en forma-なかった (tiempo pasado) + ものだ","patternRuby":"Verbo en forma-た o en forma-なかった (tiempo pasado) + ものだ","rule":"Esta expresión se usa para expresar un sentimiento de nostalgia al recordar acontecimientos pasados.  En el lenguaje hablado, se puede expresar como “〜もんだ” en vez de “〜ものだ”.","ruleRuby":"Esta expresión se usa para expresar un sentimiento de nostalgia al recordar acontecimientos pasados.  En el lenguaje hablado, se puede expresar como “〜もんだ” en vez de “〜ものだ”.","exJp":"むかし昔のせんせい先生はきび厳しかったものです。","exJpRuby":"<ruby>昔<rt>むかし<\/rt><\/ruby>の<ruby>先生<rt>せんせい<\/rt><\/ruby>は<ruby>厳<rt>きび<\/rt><\/ruby>しかったものです。"},{"id":"gp199","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (3)","pattern":"Verbo en forma-ます+きる/きります","patternRuby":"Verbo en forma-ます+きる/きります","rule":"Se utiliza con dos significados: a) terminar de hacer todo de la acción expresada por el verbo anterior, o b) llevarla hasta el límite o hacerla por completo.","ruleRuby":"Se utiliza con dos significados: a) terminar de hacer todo de la acción expresada por el verbo anterior, o b) llevarla hasta el límite o hacerla por completo.","exJp":"60さい歳のはマラソンをさいご最後まではし走りきった。 いちにちじゅう一日中た立ちで、もうつか疲れきっています。","exJpRuby":"60さい<ruby>歳<rt>とし<\/rt><\/ruby>のはマラソンを<ruby>最後<rt>さいご<\/rt><\/ruby>まで<ruby>走<rt>はし<\/rt><\/ruby>りきった。 <ruby>一日中<rt>いちにちじゅう<\/rt><\/ruby><ruby>立<rt>た<\/rt><\/ruby>ちで、もう<ruby>疲<rt>つか<\/rt><\/ruby>れきっています。"},{"id":"gp200","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (3)","pattern":"Verbo en forma-ます+ぬ抜く/ぬ抜きます","patternRuby":"Verbo en forma-ます+<ruby>抜<rt>ぬ<\/rt><\/ruby>く/<ruby>抜<rt>ぬ<\/rt><\/ruby>きます","rule":"Significa \"seguir haciendo la acción expresada por el verbo anterior hasta el final\" o \"hacerla hasta llegar al límite.","ruleRuby":"Significa &quot;seguir haciendo la acción expresada por el verbo anterior hasta el final&quot; o &quot;hacerla hasta llegar al límite.","exJp":"きび厳しいで、しゃちょう社長はじゅうぎょういん従業員をまも守りぬ抜いた。","exJpRuby":"<ruby>厳<rt>きび<\/rt><\/ruby>しいで、<ruby>社長<rt>しゃちょう<\/rt><\/ruby>は<ruby>従業員<rt>じゅうぎょういん<\/rt><\/ruby>を<ruby>守<rt>まも<\/rt><\/ruby>り<ruby>抜<rt>ぬ<\/rt><\/ruby>いた。"},{"id":"gp201","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (3)","pattern":"Verbo en forma-ます+つ尽くす/つ尽くします","patternRuby":"Verbo en forma-ます+<ruby>尽<rt>つ<\/rt><\/ruby>くす/<ruby>尽<rt>つ<\/rt><\/ruby>くします","rule":"Significa \"realizar la acción expresada por el verbo anterior en la medida de lo posible\", \"hacerla todo\" o \"hacerla por completo\".","ruleRuby":"Significa &quot;realizar la acción expresada por el verbo anterior en la medida de lo posible&quot;, &quot;hacerla todo&quot; o &quot;hacerla por completo&quot;.","exJp":"かれ彼はそのいほん本をひとばん一晩でよ読みつ尽くした。","exJpRuby":"<ruby>彼<rt>かれ<\/rt><\/ruby>はそのい<ruby>本<rt>ほん<\/rt><\/ruby>を<ruby>一晩<rt>ひとばん<\/rt><\/ruby>で<ruby>読<rt>よ<\/rt><\/ruby>み<ruby>尽<rt>つ<\/rt><\/ruby>くした。"},{"id":"gp202","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (3)","pattern":"Verbo en forma-ます+こ込む/こ込みます","patternRuby":"Verbo en forma-ます+こ<ruby>込<rt>こみ<\/rt><\/ruby>む/<ruby>込<rt>こ<\/rt><\/ruby>みます","rule":"Significa lo siguiente: a) Entrar en algo, b) Hacer la acción expresada por el verbo que precede de forma intensa o profunda, c) Hacerla con cuidado o detenidamente, o d) Hacerla hasta el final.","ruleRuby":"Significa lo siguiente: a) Entrar en algo, b) Hacer la acción expresada por el verbo que precede de forma intensa o profunda, c) Hacerla con cuidado o detenidamente, o d) Hacerla hasta el final.","exJp":"じょうきゃく乗客がバスにどんどんりこ込んでいった。 せんせい先生にされて、かれ彼はだま黙りこ込んでしまった。 せつめいしょ説明書をみこ込んでからさぎょう作業をはじ始めてください。","exJpRuby":"<ruby>乗客<rt>じょうきゃく<\/rt><\/ruby>がバスにどんどんり<ruby>込<rt>こ<\/rt><\/ruby>んでいった。 <ruby>先生<rt>せんせい<\/rt><\/ruby>にされて、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>黙<rt>だま<\/rt><\/ruby>り<ruby>込<rt>こ<\/rt><\/ruby>んでしまった。 <ruby>説明書<rt>せつめいしょ<\/rt><\/ruby>をみ<ruby>込<rt>こ<\/rt><\/ruby>んでから<ruby>作業<rt>さぎょう<\/rt><\/ruby>を<ruby>始<rt>はじ<\/rt><\/ruby>めてください。"},{"id":"gp203","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（１）","pattern":"Sustantivo + の + こと + は/が/を/に/で・・・","patternRuby":"Sustantivo + の + こと + は/が/を/に/で・・・","rule":"“こと” usado en forma “sustantivo +の + こと” indica asuntos relacionados con el sustantivo que precede. En mayoría de los casos, “sustantivo +の + こと” puede sustituirse por “sustantivo+について”.","ruleRuby":"“こと” usado en forma “sustantivo +の + こと” indica asuntos relacionados con el sustantivo que precede. En mayoría de los casos, “sustantivo +の + こと” puede sustituirse por “sustantivo+について”.","exJp":"さいきん最近、はしごと仕事のことでなや悩んでいるようだ。","exJpRuby":"<ruby>最近<rt>さいきん<\/rt><\/ruby>、は<ruby>仕事<rt>しごと<\/rt><\/ruby>のことで<ruby>悩<rt>なや<\/rt><\/ruby>んでいるようだ。"},{"id":"gp204","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（１）","pattern":"Verbo en forma diccionario + こと + は/が/を/に/で・・・","patternRuby":"Verbo en forma diccionario + こと + は/が/を/に/で・・・","rule":"“こと” se utiliza para sustantivar verbo para que funcione como sujeto, objeto de una oración entera.","ruleRuby":"“こと” se utiliza para sustantivar verbo para que funcione como sujeto, objeto de una oración entera.","exJp":"このではカードではら払うことができます。","exJpRuby":"このではカードで<ruby>払<rt>はら<\/rt><\/ruby>うことができます。"},{"id":"gp205","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（１）","pattern":"Oración en forma sencilla (+という) + こと + は/が/を/に/で・・・","patternRuby":"Oración en forma sencilla (+という) + こと + は/が/を/に/で・・・","rule":"“こと” se utiliza para hacer que la oración que precede funcione como sustantivo de tal que sirve como sujeto, objeto de una oración entera.  Se puede agregar “という” antes de “こと”.  Sin embargo, cuando la oración termina con un adjetivo tipo-な, se emplea la forma “Adjetivo en forma-な +こと” , “Adjetivo en forma-である +こと” o “Adjetivo en forma-だ +という +こと”.  En cambio, cuando la oración termina con predicado sustantivo (Sustantivo +だ), siempre lleva “という” antes de +こと”.","ruleRuby":"“こと” se utiliza para hacer que la oración que precede funcione como sustantivo de tal que sirve como sujeto, objeto de una oración entera.  Se puede agregar “という” antes de “こと”.  Sin embargo, cuando la oración termina con un adjetivo tipo-な, se emplea la forma “Adjetivo en forma-な +こと” , “Adjetivo en forma-である +こと” o “Adjetivo en forma-だ +という +こと”.  En cambio, cuando la oración termina con predicado sustantivo (Sustantivo +だ), siempre lleva “という” antes de +こと”.","exJp":"あのがけっこん結婚する（という）ことがはっぴょう発表された。","exJpRuby":"あのが<ruby>結婚<rt>けっこん<\/rt><\/ruby>する（という）ことが<ruby>発表<rt>はっぴょう<\/rt><\/ruby>された。"},{"id":"gp206","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（１）","pattern":"Oración en forma sencilla + とのことだ/ということだ","patternRuby":"Oración en forma sencilla + とのことだ/ということだ","rule":"Esta expresión se utiliza para transmitir información denotada en la Oración, que alguien ha dicho o que la gente en general dice.  La forma “とのことだ” tiende a ser más en el lenguaje escrito.","ruleRuby":"Esta expresión se utiliza para transmitir información denotada en la Oración, que alguien ha dicho o que la gente en general dice.  La forma “とのことだ” tiende a ser más en el lenguaje escrito.","exJp":"ニュースによると、はあめ雨がふ降るとのことだ。　　やまだ山田さんからで、すこ少しおく遅れるということです。","exJpRuby":"ニュースによると、は<ruby>雨<rt>あめ<\/rt><\/ruby>が<ruby>降<rt>ふ<\/rt><\/ruby>るとのことだ。　　<ruby>山田<rt>やまだ<\/rt><\/ruby>さんからで、<ruby>少<rt>すこ<\/rt><\/ruby>し<ruby>遅<rt>おく<\/rt><\/ruby>れるということです。"},{"id":"gp207","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（１）","pattern":"Sustantivo1 +とは/というのは + [Sustantivo2 +の” / “Verbo en forma sencilla +という] + ことだ","patternRuby":"Sustantivo1 +とは/というのは + [Sustantivo2 +の” / “Verbo en forma sencilla +という] + ことだ","rule":"Esta expresión se utiliza para explicar el significado del Sustantivo1 o definirlo con otras palabras.","ruleRuby":"Esta expresión se utiliza para explicar el significado del Sustantivo1 o definirlo con otras palabras.","exJp":"スタバとはスターバックスのことだ。","exJpRuby":"スタバとはスターバックスのことだ。"},{"id":"gp208","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（１）","pattern":"Verbo en forma-た (tiempo pasado) + ことがある","patternRuby":"Verbo en forma-た (tiempo pasado) + ことがある","rule":"Esta expresión se usa para mencionar alguna experiencia ya vivida en el momento en que está hablando.  En este caso, hay que tener en cuenta que no debe utilizarse junto con palabras que indiquen un pasado reciente o palabras que indiquen frecuencia.","ruleRuby":"Esta expresión se usa para mencionar alguna experiencia ya vivida en el momento en que está hablando.  En este caso, hay que tener en cuenta que no debe utilizarse junto con palabras que indiquen un pasado reciente o palabras que indiquen frecuencia.","exJp":"カエルをべたことがありますか？","exJpRuby":"カエルをべたことがありますか？"},{"id":"gp209","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（１）","pattern":"[Verbo en forma diccionario (tiempo no pretérito) o Verbo en forma-ない / Adjetivo en forma diccionario / Sustantivo +の] + ことがある","patternRuby":"[Verbo en forma diccionario (tiempo no pretérito) o Verbo en forma-ない / Adjetivo en forma diccionario / Sustantivo +の] + ことがある","rule":"Esta expresión se usa para mencionar una acción o situación que sucede a veces u ocasionalmente pero que no sea habitual.  Cuando se utilizan en este sentido, a menudo adverbios como “ときどき”, “たまに” o “まれに” se emplean juntas.","ruleRuby":"Esta expresión se usa para mencionar una acción o situación que sucede a veces u ocasionalmente pero que no sea habitual.  Cuando se utilizan en este sentido, a menudo adverbios como “ときどき”, “たまに” o “まれに” se emplean juntas.","exJp":"あさ朝やは、バスがおく遅れることがあります。","exJpRuby":"<ruby>朝<rt>あさ<\/rt><\/ruby>やは、バスが<ruby>遅<rt>おく<\/rt><\/ruby>れることがあります。"},{"id":"gp210","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（１）","pattern":"[Verbo en forma diccionario (tiempo no pretérito) o Verbo en forma-ない / Adjetivo en forma diccionario / Sustantivo +の] + こともある","patternRuby":"[Verbo en forma diccionario (tiempo no pretérito) o Verbo en forma-ない / Adjetivo en forma diccionario / Sustantivo +の] + こともある","rule":"Esta expresión se emplea de mismo modo que el uso 7 arriba.  Sin embargo, es más natural utilizar “こともある”, cuando se enumeran varias opciones en paralelo, o cuando el oyente reconoce que lo habitual es  contrario.","ruleRuby":"Esta expresión se emplea de mismo modo que el uso 7 arriba.  Sin embargo, es más natural utilizar “こともある”, cuando se enumeran varias opciones en paralelo, o cuando el oyente reconoce que lo habitual es  contrario.","exJp":"まいあさ毎朝6じ時にお起きるが、お起きられないこともある。","exJpRuby":"<ruby>毎朝<rt>まいあさ<\/rt><\/ruby>6じ<ruby>時<rt>じ<\/rt><\/ruby>に<ruby>起<rt>お<\/rt><\/ruby>きるが、<ruby>起<rt>お<\/rt><\/ruby>きられないこともある。"},{"id":"gp211","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「もの」の色々な使い方（２）","pattern":"[Adjetivo en forma diccionario / Verbo en forma diccionario / Verbo en forma-ない] + ものがある","patternRuby":"[Adjetivo en forma diccionario / Verbo en forma diccionario / Verbo en forma-ない] + ものがある","rule":"Esta expresión se usa para transmitir el matiz de “tener un cierto sentimiento hacia algo”, acompañado de la emoción o la valoración del hablante.  En el lenguaje hablado, se puede esxpresar como “もんがある” en vez de “ものがある”.","ruleRuby":"Esta expresión se usa para transmitir el matiz de “tener un cierto sentimiento hacia algo”, acompañado de la emoción o la valoración del hablante.  En el lenguaje hablado, se puede esxpresar como “もんがある” en vez de “ものがある”.","exJp":"あのしょくどう食堂がへいてん閉店するのはさび寂しいものがある。","exJpRuby":"あの<ruby>食堂<rt>しょくどう<\/rt><\/ruby>が<ruby>閉店<rt>へいてん<\/rt><\/ruby>するのは<ruby>寂<rt>さび<\/rt><\/ruby>しいものがある。"},{"id":"gp212","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「もの」の色々な使い方（２）","pattern":"[Sustantivo +な / Adjetivo en forma sencilla / Verbo en forma sencilla] +ものだから/もので、+ Predicado","patternRuby":"[Sustantivo +な / Adjetivo en forma sencilla / Verbo en forma sencilla] +ものだから/もので、+ Predicado","rule":"Esta expresión se utiliza para indicar la causa o la razón de lo que se expresa en el predicado. A menudo, se utiliza para expresar disculpas o excusas de un matiz que “Realmente no quería ~, pero ~”. En el lenguaje hablado, se puede expresar como “もんだから” en vez de “ものだから”, o “もんで” en vez de “もので”.","ruleRuby":"Esta expresión se utiliza para indicar la causa o la razón de lo que se expresa en el predicado. A menudo, se utiliza para expresar disculpas o excusas de un matiz que “Realmente no quería ~, pero ~”. En el lenguaje hablado, se puede expresar como “もんだから” en vez de “ものだから”, o “もんで” en vez de “もので”.","exJp":"しゅっちょう出張なものですから、かいぎ会議はけっせき欠席します。","exJpRuby":"<ruby>出張<rt>しゅっちょう<\/rt><\/ruby>なものですから、<ruby>会議<rt>かいぎ<\/rt><\/ruby>は<ruby>欠席<rt>けっせき<\/rt><\/ruby>します。"},{"id":"gp213","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「もの」の色々な使い方（２）","pattern":"[Sustantivo +である/ Adjetivo en forma sencilla / Verbo en forma sencilla] + ものの、+ Predicado","patternRuby":"[Sustantivo +である/ Adjetivo en forma sencilla / Verbo en forma sencilla] + ものの、+ Predicado","rule":"Esta expresión se utiliza para indicar una situación que va contra una prevision o expectativa, o una situación antagónica desde el punto de vista semántico.","ruleRuby":"Esta expresión se utiliza para indicar una situación que va contra una prevision o expectativa, o una situación antagónica desde el punto de vista semántico.","exJp":"きゅうじつ休日であるものの、でんしゃ電車はこ混んでいます。","exJpRuby":"<ruby>休日<rt>きゅうじつ<\/rt><\/ruby>であるものの、<ruby>電車<rt>でんしゃ<\/rt><\/ruby>は<ruby>混<rt>こ<\/rt><\/ruby>んでいます。"},{"id":"gp214","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「もの」の色々な使い方（２）","pattern":"[Sustantivo (+だ) / Adjetivo en forma sencilla / Verbo en forma sencilla] + とはいうものの、+ Predicado","patternRuby":"[Sustantivo (+だ) / Adjetivo en forma sencilla / Verbo en forma sencilla] + とはいうものの、+ Predicado","rule":"Esta expresión se utiliza para reconocer un hecho determinado, al tiempo que se indica que la situación real difiere de él.","ruleRuby":"Esta expresión se utiliza para reconocer un hecho determinado, al tiempo que se indica que la situación real difiere de él.","exJp":"４がつ月とはいうものの、まだあたた暖かくない。　　　きょう今日はさむ寒いとはいうものの、コートをき着なくてもだいじょうぶ大丈夫だ。","exJpRuby":"４<ruby>月<rt>がつ<\/rt><\/ruby>とはいうものの、まだ<ruby>暖<rt>あたた<\/rt><\/ruby>かくない。　　　<ruby>今日<rt>きょう<\/rt><\/ruby>は<ruby>寒<rt>さむ<\/rt><\/ruby>いとはいうものの、コートを<ruby>着<rt>き<\/rt><\/ruby>なくても<ruby>大丈夫<rt>だいじょうぶ<\/rt><\/ruby>だ。"},{"id":"gp215","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (4)","pattern":"Verbo en forma-ます+なお直す/なお直します","patternRuby":"Verbo en forma-ます+<ruby>直<rt>なお<\/rt><\/ruby>す/<ruby>直<rt>なお<\/rt><\/ruby>します","rule":"Expresa los significados de \"volver a hacer\", \"repetir\" o \"mejorar\". No se trata simplemente de \"intentarlo otra vez\", sino de \"intentarlo otra vez con la intención de hacerlo mejor que la vez anterior\".","ruleRuby":"Expresa los significados de &quot;volver a hacer&quot;, &quot;repetir&quot; o &quot;mejorar&quot;. No se trata simplemente de &quot;intentarlo otra vez&quot;, sino de &quot;intentarlo otra vez con la intención de hacerlo mejor que la vez anterior&quot;.","exJp":"わす忘れないようえたじ字をか書きなお直しておいた。","exJpRuby":"<ruby>忘<rt>わす<\/rt><\/ruby>れないようえた<ruby>字<rt>じ<\/rt><\/ruby>を<ruby>書<rt>か<\/rt><\/ruby>き<ruby>直<rt>なお<\/rt><\/ruby>しておいた。"},{"id":"gp216","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (4)","pattern":"Verbo en forma-ます+かえ返す/かえ返します","patternRuby":"Verbo en forma-ます+<ruby>返<rt>かえ<\/rt><\/ruby>す/<ruby>返<rt>かえ<\/rt><\/ruby>します","rule":"significa a) volver a realizar la acción del verbo o repetirla varias veces, b) responder de la misma manera a lo que ha hecho la otra persona, o c) devolver algo a la otra persona o a su lugar original.","ruleRuby":"significa a) volver a realizar la acción del verbo o repetirla varias veces, b) responder de la misma manera a lo que ha hecho la otra persona, o c) devolver algo a la otra persona o a su lugar original.","exJp":"このはおもしろくて、なんど何度もよ読みかえ返しました。 かれ彼はちゅうい注意されても、い言いかえ返します。 グラウンドからんできたボールをな投げかえ返した。","exJpRuby":"このはおもしろくて、<ruby>何度<rt>なんど<\/rt><\/ruby>も<ruby>読<rt>よ<\/rt><\/ruby>み<ruby>返<rt>かえ<\/rt><\/ruby>しました。 <ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>注意<rt>ちゅうい<\/rt><\/ruby>されても、<ruby>言<rt>い<\/rt><\/ruby>い<ruby>返<rt>かえ<\/rt><\/ruby>します。 グラウンドからんできたボールを<ruby>投<rt>な<\/rt><\/ruby>げ<ruby>返<rt>かえ<\/rt><\/ruby>した。"},{"id":"gp217","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (4)","pattern":"Verbo en forma-ます+あ合う/あ合います","patternRuby":"Verbo en forma-ます+<ruby>合<rt>あ<\/rt><\/ruby>う/<ruby>合<rt>あ<\/rt><\/ruby>います","rule":"Se utiliza para añadir al verbo anterior el significado de \"mutuamente\", \"juntos\" o \"con la otra persona\".","ruleRuby":"Se utiliza para añadir al verbo anterior el significado de &quot;mutuamente&quot;, &quot;juntos&quot; o &quot;con la otra persona&quot;.","exJp":"がくえんさい学園祭のめかた方についていいんかい委員会ではな話しあ合った。","exJpRuby":"<ruby>学園祭<rt>がくえんさい<\/rt><\/ruby>のめかた<ruby>方<rt>ほう<\/rt><\/ruby>について<ruby>委員会<rt>いいんかい<\/rt><\/ruby>で<ruby>話<rt>はな<\/rt><\/ruby>し<ruby>合<rt>あ<\/rt><\/ruby>った。"},{"id":"gp218","cat":"vcomp","catLabel":"Verbos compuestos","lesson":"複合動詞・Verbos Compuestos (4)","pattern":"Verbo en forma-ます+あ合わせる/あ合わせます","patternRuby":"Verbo en forma-ます+<ruby>合<rt>あ<\/rt><\/ruby>わせる/<ruby>合<rt>あ<\/rt><\/ruby>わせます","rule":"Significa \"hacer algo juntos\" o \"ajustarse a la otra persona o a la situación\". Se transmite la sensación de que se lleva a cabo en relación con \"otra persona, otra cosa o una situación\".","ruleRuby":"Significa &quot;hacer algo juntos&quot; o &quot;ajustarse a la otra persona o a la situación&quot;. Se transmite la sensación de que se lleva a cabo en relación con &quot;otra persona, otra cosa o una situación&quot;.","exJp":"３にえきまえ駅前のスタバでま待ちあ合わせましょう。","exJpRuby":"３に<ruby>駅前<rt>えきまえ<\/rt><\/ruby>のスタバで<ruby>待<rt>ま<\/rt><\/ruby>ち<ruby>合<rt>あ<\/rt><\/ruby>わせましょう。"},{"id":"gp219","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"[Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことにする","patternRuby":"[Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことにする","rule":"Esta expresión se usa para indicar la decisión por voluntad propia de hacer o no hacer algo denotado por el verbo.  “ことにする” puede sustituirse por “こととする” que se considera una expresión ligeramente rebuscada.","ruleRuby":"Esta expresión se usa para indicar la decisión por voluntad propia de hacer o no hacer algo denotado por el verbo.  “ことにする” puede sustituirse por “こととする” que se considera una expresión ligeramente rebuscada.","exJp":"つぎ次のみはくに国へかえ帰ることにします。","exJpRuby":"<ruby>次<rt>つぎ<\/rt><\/ruby>のみは<ruby>国<rt>くに<\/rt><\/ruby>へ<ruby>帰<rt>かえ<\/rt><\/ruby>ることにします。"},{"id":"gp220","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"[Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことにしている","patternRuby":"[Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことにしている","rule":"Esta expresión se usa para indicar un hábito decidido previamente por voluntad propia para hacer o dejar de hacer algo y que sigue practicando.  “ことにしている” puede sustituirse por “こととしている” que se considera una expresión ligeramente rebuscada.","ruleRuby":"Esta expresión se usa para indicar un hábito decidido previamente por voluntad propia para hacer o dejar de hacer algo y que sigue practicando.  “ことにしている” puede sustituirse por “こととしている” que se considera una expresión ligeramente rebuscada.","exJp":"まいにち毎日、日本ご語をべんきょう勉強することにしています。","exJpRuby":"<ruby>毎日<rt>まいにち<\/rt><\/ruby>、<ruby>日本<rt>にっぽん<\/rt><\/ruby><ruby>語<rt>ご<\/rt><\/ruby>を<ruby>勉強<rt>べんきょう<\/rt><\/ruby>することにしています。"},{"id":"gp221","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"Verbo en forma-た (tiempo pasado) + ことにする","patternRuby":"Verbo en forma-た (tiempo pasado) + ことにする","rule":"Esta expresión se utiliza para expresar que se decide que algo es así, o que se considera así, aunque en realidad no sea así.  A menudo, se utiliza cuando se alteran los hechos para adaptarlos a la conveniencia propia aunque no sea realmente el caso.","ruleRuby":"Esta expresión se utiliza para expresar que se decide que algo es así, o que se considera así, aunque en realidad no sea así.  A menudo, se utiliza cuando se alteran los hechos para adaptarlos a la conveniencia propia aunque no sea realmente el caso.","exJp":"かぜ風邪をひいたことにして、がっこう学校を休んだ。","exJpRuby":"<ruby>風邪<rt>かぜ<\/rt><\/ruby>をひいたことにして、<ruby>学校<rt>がっこう<\/rt><\/ruby>を<ruby>休<rt>きゅう<\/rt><\/ruby>んだ。"},{"id":"gp222","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"[Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことになる","patternRuby":"[Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことになる","rule":"Esta expresión se usa para expresar que algo denotado por el verbo sucede por una decisión ajena a uno mismo.  También se utiliza cuando se desea expresar algo decidido por voluntad propia de forma indirecta y modesta.  “ことになる” puede sustituirse por “こととなる” que se considera una expresión ligeramente rebuscada.","ruleRuby":"Esta expresión se usa para expresar que algo denotado por el verbo sucede por una decisión ajena a uno mismo.  También se utiliza cuando se desea expresar algo decidido por voluntad propia de forma indirecta y modesta.  “ことになる” puede sustituirse por “こととなる” que se considera una expresión ligeramente rebuscada.","exJp":"ちちおや父親ので、とうきょう東京にひ引っこ越すことになった。","exJpRuby":"<ruby>父親<rt>ちちおや<\/rt><\/ruby>ので、<ruby>東京<rt>とうきょう<\/rt><\/ruby>にひ<ruby>引<rt>いん<\/rt><\/ruby>っ<ruby>越<rt>こ<\/rt><\/ruby>すことになった。"},{"id":"gp223","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"[Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことになっている","patternRuby":"[Verbo en forma diccionario (tiempo no pretérito) / Verbo en forma-ない] + ことになっている","rule":"Esta expresión se usa para indicar que algo se ha programado o ha sido decidido como regla.  “ことになっている” puede sustituirse por “こととなっている” que se considera una expresión ligeramente rebuscada.","ruleRuby":"Esta expresión se usa para indicar que algo se ha programado o ha sido decidido como regla.  “ことになっている” puede sustituirse por “こととなっている” que se considera una expresión ligeramente rebuscada.","exJp":"あした明日はにあ会うことになっています。","exJpRuby":"あした<ruby>明日<rt>あす<\/rt><\/ruby>はに<ruby>会<rt>あ<\/rt><\/ruby>うことになっています。"},{"id":"gp224","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"[Verbo en forma-た (tiempo pasado) +（+という）/ Sustantivo +という] + ことになる","patternRuby":"[Verbo en forma-た (tiempo pasado) +（+という）/ Sustantivo +という] + ことになる","rule":"Esta expresión se utiliza para transmitir el significado de que, basándose en una situación determinada, “en última instancia, dará lugar a un estado de 〜” o “se considerará como 〜”.  Su característica principal es que expresa una conclusión derivada de hechos o circunstancias objetivos, independientemente de la voluntad propia.","ruleRuby":"Esta expresión se utiliza para transmitir el significado de que, basándose en una situación determinada, “en última instancia, dará lugar a un estado de 〜” o “se considerará como 〜”.  Su característica principal es que expresa una conclusión derivada de hechos o circunstancias objetivos, independientemente de la voluntad propia.","exJp":"このにサインすれば、けいやく契約した（という）ことになります。","exJpRuby":"このにサインすれば、<ruby>契約<rt>けいやく<\/rt><\/ruby>した（という）ことになります。"},{"id":"gp225","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"[Adjetivo tipo-い / Adjetivo tipo-な / Verbo en forma-た (tiempo pasado)] + ことに、+ Oración","patternRuby":"[Adjetivo tipo-い / Adjetivo tipo-な / Verbo en forma-た (tiempo pasado)] + ことに、+ Oración","rule":"Esta expresión se utiliza para indicar sentimiento o valoración del hablante en relación con la oración que sigue.  Cuando se usa con verbos, se puede utilizar solamente con algunos verbos que expresan emociones como “困った”, “驚いた”, etc.","ruleRuby":"Esta expresión se utiliza para indicar sentimiento o valoración del hablante en relación con la oración que sigue.  Cuando se usa con verbos, se puede utilizar solamente con algunos verbos que expresan emociones como “<ruby>困<rt>こん<\/rt><\/ruby>った”, “<ruby>驚<rt>おどろき<\/rt><\/ruby>いた”, etc.","exJp":"おそ恐ろしいことに、かれ彼はやま山でくま熊をみ見たらしい。","exJpRuby":"<ruby>恐<rt>おそ<\/rt><\/ruby>ろしいことに、<ruby>彼<rt>かれ<\/rt><\/ruby>は<ruby>山<rt>やま<\/rt><\/ruby>で<ruby>熊<rt>くま<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>たらしい。"},{"id":"gp226","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"Verbo en forma diccionario + ことなく+ Oración","patternRuby":"Verbo en forma diccionario + ことなく+ Oración","rule":"Esta expresión se utiliza para expresar que sucede una acción o situación denotada en la oración que sigue sin hacer la acción del verbo que precede a “ことなく”.  Se trata de una expresión bastante formal, por lo que utilizarla en contextos cotidianos puede dar lugar a frases que suenen extrañas.  “Verbo +ことなく” se puede sustituir por “Verbo en forma-ない +で”.","ruleRuby":"Esta expresión se utiliza para expresar que sucede una acción o situación denotada en la oración que sigue sin hacer la acción del verbo que precede a “ことなく”.  Se trata de una expresión bastante formal, por lo que utilizarla en contextos cotidianos puede dar lugar a frases que suenen extrañas.  “Verbo +ことなく” se puede sustituir por “Verbo en forma-ない +で”.","exJp":"3じかん時間、のなか中をやす休むことなくある歩きつづ続けた。","exJpRuby":"3<ruby>時間<rt>じかん<\/rt><\/ruby>、の<ruby>中<rt>なか<\/rt><\/ruby>を<ruby>休<rt>やす<\/rt><\/ruby>むことなく<ruby>歩<rt>ある<\/rt><\/ruby>き<ruby>続<rt>つづ<\/rt><\/ruby>けた。"},{"id":"gp227","cat":"nom","catLabel":"Nominalización・こと・もの","lesson":"「こと」の色々な使い方（２）","pattern":"Verbo en forma no pretérito + ことはない","patternRuby":"Verbo en forma no pretérito + ことはない","rule":"Esta expresión se utiliza para transimitir el significado de que “no hace falta (Verbo)” o “no es necesario (Verbo).  En lenguaje hablado, se suele omitr “は” dejando solo “ことない”).","ruleRuby":"Esta expresión se utiliza para transimitir el significado de que “no hace falta (Verbo)” o “no es necesario (Verbo).  En lenguaje hablado, se suele omitr “は” dejando solo “ことない”).","exJp":"たくさんあるので、えんりょ遠慮することはありません。","exJpRuby":"たくさんあるので、<ruby>遠慮<rt>えんりょ<\/rt><\/ruby>することはありません。"}]</script>

<script>
"use strict";
/* ---------- data & storage ---------- */
const $=(s,r=document)=>r.querySelector(s);
const SEED={
  vocab: JSON.parse($("#seedVocab").textContent),
  grammar: JSON.parse($("#seedGrammar").textContent),
  topics: JSON.parse($("#seedTopics").textContent),
  lessons: JSON.parse($("#seedLessons").textContent),
  gpoints: JSON.parse($("#seedGpoints").textContent),
};
const KEY="jp.study.v1";
const DEFAULT={userVocab:[],userGrammar:[],userTopics:{},theory:{},hidden:{},star:{},srs:{},learn:{},
  stats:{streak:0,best:0,last:null,reviews:0,history:{},intake:{},learnSeq:0},
  settings:{dailyGoal:20,newPerDay:15,dir:"jp2es",learnGoal:8,dailyNew:5}};
let S;
try{S=Object.assign(structuredClone(DEFAULT),JSON.parse(localStorage.getItem(KEY)||"{}"));}
catch(e){S=structuredClone(DEFAULT);}
for(const k in DEFAULT){ if(S[k]==null) S[k]=structuredClone(DEFAULT[k]); }
S.stats=Object.assign(structuredClone(DEFAULT.stats),S.stats);
S.settings=Object.assign(structuredClone(DEFAULT.settings),S.settings);
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("No se pudo guardar (almacenamiento lleno)");}},120);}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(arr,n)=>shuffle(arr).slice(0,n);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const addDays=(str,n)=>{const p=str.split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(s){if(!s)return"Sin fecha";const t=today();if(s===t)return"Hoy";if(s===addDays(t,-1))return"Ayer";const p=s.split("-");return (+p[2])+" "+MES[+p[1]-1]+" "+p[0];}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1900);}
function allTopics(){return Object.assign({},SEED.topics,S.userTopics);}

/* merge seed + user, minus hidden */
function vocabAll(){return SEED.vocab.concat(S.userVocab).filter(v=>!S.hidden["v:"+v.id]);}
function grammarAll(){return SEED.grammar.concat(S.userGrammar).filter(q=>!S.hidden["g:"+q.id]);}
function itemsAll(){
  return vocabAll().map(v=>({key:"v:"+v.id,type:"vocab",data:v}))
    .concat(grammarAll().map(q=>({key:"g:"+q.id,type:"grammar",data:q})));
}
/* SRS partitions */
function dueReviews(){const t=today();return itemsAll().filter(it=>{const s=S.srs[it.key];return s&&s.due&&s.due<=t;});}
function newItems(){return itemsAll().filter(it=>!S.srs[it.key]);}
function dueCount(){const r=dueReviews().length;const n=Math.min(newItems().length,S.settings.newPerDay);return{rev:r,neu:n,total:r+n};}

/* ---------- learned / by-review status (vocab) ---------- */
function learnStatus(key){const s=S.learn[key];return s?s.status:"new";}
function isLearned(key){return learnStatus(key)==="learned";}
function markLearned(key){const t=today();const c=S.learn[key];
  if(!(c&&c.status==="learned")){S.stats.learnSeq=(S.stats.learnSeq||0)+1;S.learn[key]={status:"learned",on:t,at:Date.now(),seq:S.stats.learnSeq};}
  save();}
function markReview(key){const prev=learnStatus(key);const c=S.learn[key];
  S.learn[key]={status:"review",since:(c&&c.since)||today(),at:Date.now()};
  if(prev==="new"){const t=today();S.stats.intake[t]=(S.stats.intake[t]||0)+1;}
  save();}
function vocabItems(){return vocabAll().map(v=>({key:"v:"+v.id,type:"vocab",data:v}));}
function notLearnedVocab(){return vocabAll().filter(v=>learnStatus("v:"+v.id)!=="learned");}
function reviewSetVocab(){return vocabAll().filter(v=>learnStatus("v:"+v.id)==="review");}    /* explicitly not-learned, accumulated */
function newPoolVocab(){return vocabAll().filter(v=>learnStatus("v:"+v.id)==="new");}          /* never marked */
function notLearnedVocabItems(){return reviewSetVocab().map(v=>({key:"v:"+v.id,type:"vocab",data:v}));}
function learnedVocabList(){const out=[];vocabAll().forEach(v=>{const s=S.learn["v:"+v.id];if(s&&s.status==="learned")out.push({v,on:s.on||"",seq:s.seq||0,at:s.at||0});});
  out.sort((a,b)=>(a.seq-b.seq)||(a.at-b.at));return out;}
function learnedCount(){return learnedVocabList().length;}
function notLearnedCount(){return reviewSetVocab().length;}
function learnedTodayCount(){const t=today();return learnedVocabList().filter(x=>x.on===t).length;}
function intakeToday(){return S.stats.intake[today()]||0;}
function remainingIntake(){return Math.max(0,(S.settings.dailyNew||5)-intakeToday());}
/* next card for the daily flow: intake new until the day's quota of not-learned, then drill the accumulated set */
function nextDailyItem(lastKey){
  if(remainingIntake()>0){const np=newPoolVocab();if(np.length){const v=np[Math.floor(Math.random()*np.length)];return {key:"v:"+v.id,type:"vocab",data:v,phase:"new"};}}
  let pool=reviewSetVocab();
  if(pool.length>1&&lastKey){const f=pool.filter(v=>("v:"+v.id)!==lastKey);if(f.length)pool=f;}
  if(pool.length){const v=pool[Math.floor(Math.random()*pool.length)];return {key:"v:"+v.id,type:"vocab",data:v,phase:"review"};}
  return null;
}

/* ---------- SRS ---------- */
function schedule(key,g){ // g:0 again,1 hard,2 good,3 easy
  const t=today();
  let s=S.srs[key]||{ease:2.5,int:0,reps:0,ok:0,ng:0,seen:0};
  if(g===0){ s.reps=0;s.int=0;s.ease=clamp(s.ease-0.2,1.3,2.8);s.due=t;s.ng=(s.ng||0)+1; }
  else{
    if(s.reps===0) s.int=(g===3?2:1);
    else if(s.reps===1) s.int=(g===1?2:g===2?4:6);
    else{const m=g===1?1.2:(g===2?s.ease:s.ease*1.3);s.int=Math.max(1,Math.round(s.int*m));}
    s.ease=clamp(s.ease+(g===1?-0.15:g===3?0.15:0),1.3,2.8);
    s.reps++;s.due=addDays(t,s.int);s.ok=(s.ok||0)+1;
  }
  s.seen=(s.seen||0)+1;s.last=t;S.srs[key]=s;
  // stats + streak
  if(S.stats.last!==t){
    if(S.stats.last && addDays(S.stats.last,1)===t) S.stats.streak=(S.stats.streak||0)+1;
    else S.stats.streak=1;
    S.stats.last=t;S.stats.best=Math.max(S.stats.best||0,S.stats.streak);
  }
  S.stats.history[t]=(S.stats.history[t]||0)+1;
  S.stats.reviews=(S.stats.reviews||0)+1;
  save();refreshChrome();
}

/* ---------- routing ---------- */
let currentNav="home";
const views={};
function go(nav){currentNav=nav;document.querySelectorAll(".navb").forEach(b=>b.setAttribute("aria-current",b.dataset.nav===nav?"true":"false"));render();window.scrollTo(0,0);}
function render(){$("#app").innerHTML=`<div class="view">${views[currentNav]()}</div>`;if(afterRender[currentNav])afterRender[currentNav]();}
const afterRender={};
function refreshChrome(){$("#streakPill").innerHTML=`Racha <b>${S.stats.streak||0}</b>`;}

/* ---------- HOME ---------- */
views.home=function(){
  const t=today();
  const learned=learnedCount();
  const learnedToday=learnedTodayCount();const lgoal=S.settings.learnGoal||8;
  const lpct=Math.min(100,Math.round(learnedToday/lgoal*100));
  const notL=notLearnedCount();
  const remNew=remainingIntake();
  const pending=remNew+notL;
  const heroBtn = pending>0
    ? `<button class="btn big" data-act="studyDaily">Estudiar ahora</button>`
    : `<button class="btn big line" data-act="studyExtra">Adelantar palabras nuevas</button>`;
  const heroDesc = pending>0
    ? `Hoy: incorporar <b>${remNew}</b> ${remNew===1?"palabra nueva":"nuevas"} y repasar <b>${notL}</b> por aprender.`
    : `Cumpliste las nuevas de hoy. Puedes adelantar o repasar cuando quieras.`;
  return `
  <div class="card hero">
    <p class="lead">Para hoy</p>
    <div class="today"><span class="num">${pending}</span><span class="unit">${pending===1?"palabra":"palabras"}</span></div>
    <p class="desc">${heroDesc}</p>
    ${heroBtn}
    <div class="goalrow"><span>Aprendidas hoy · meta</span><span class="stepper"><button class="stp" data-act="goalDec" aria-label="Bajar meta">−</button><b style="color:var(--ink)">${learnedToday}</b> / <b>${lgoal}</b><button class="stp" data-act="goalInc" aria-label="Subir meta">+</button></span></div>
    <div class="bar"><i style="width:${lpct}%"></i></div>
    <button class="btn line" data-act="studyReview" style="margin-top:14px">Repasar no aprendidas${notL?` · ${notL}`:""}</button>
    <div class="statline">
      <div class="stat"><b>${S.stats.streak||0}</b><span>días de racha</span></div>
      <div class="stat"><b>${learned}</b><span>aprendidas</span></div>
      <div class="stat"><b>${vocabAll().length}</b><span>palabras</span></div>
    </div>
  </div>

  <h2 class="sec">Práctica rápida</h2>
  <div class="grid2">
    <button class="tile" data-act="quick-vocab"><span class="jpc jp">単語</span><span class="t">Vocabulario al azar</span><span class="s">Tarjetas mezcladas de todo tu vocabulario</span></button>

const CAT_SLUG_ORDER=["part","vcomp","vaux","nom","cambio","conj","conc","tiempo","rep","otros"];
const TOPIC2CAT={contrast:"conc",evidence1:"conj",evidence2:"conj",time:"tiempo",duration:"tiempo",change:"cambio"};
function qCat(q){return TOPIC2CAT[q.topic]||q.topic;}
const GPOINTS=SEED.gpoints||[];
const GPOINT_Q=(function(){
  return GPOINTS.map(g=>{
    const others=GPOINTS.filter(x=>x.rule!==g.rule);
    const dsel=sample(others,3);
    const opts=shuffle([{r:g.rule,ry:g.ruleRuby,c:true},...dsel.map(d=>({r:d.rule,ry:d.ruleRuby,c:false}))]);
    return {id:"gpq:"+g.id,gp:g,_cat:g.cat,_kind:"meaning",prompt:g.pattern,
      promptRuby:`<div class="gp-stem">Elige el significado correcto</div><div class="gp-pat jp">${g.patternRuby||esc(g.pattern)}</div>${g.exJpRuby?`<div class="gp-ex jp">${g.exJpRuby}</div>`:""}`,
      options:opts.map(o=>o.r),optRuby:opts.map(o=>o.ry),
      answers:opts.map((o,i)=>o.c?i:-1).filter(i=>i>=0),explanation:"",explRuby:""};
  });
})();
function grammarCats(mode){
  const map={};
  if(mode==="cards"){GPOINTS.forEach(g=>{map[g.cat]=(map[g.cat]||0)+1;});}
  else{grammarAll().forEach(q=>{const c=qCat(q);map[c]=(map[c]||0)+1;});GPOINT_Q.forEach(q=>{map[q._cat]=(map[q._cat]||0)+1;});}
  const slugs=Object.keys(map).sort((a,b)=>{const ia=CAT_SLUG_ORDER.indexOf(a),ib=CAT_SLUG_ORDER.indexOf(b);return (ia<0?90:ia)-(ib<0?90:ib);});
  const AT=allTopics();
  return slugs.map(s=>({slug:s,label:(GCATS[s]&&GCATS[s].label)||(AT[s]&&AT[s].label)||s,color:(GCATS[s]&&GCATS[s].color)||(AT[s]&&AT[s].color)||"var(--muted)",count:map[s]}));
}

/* ---------- SESSION ENGINE ---------- */
let sess=null;
function rubyOf(v){ // furigana word
  if(v.jpRuby) return v.jpRuby;
  if(v.reading && v.reading!==v.jp) return `<ruby>${esc(v.jp)}<rt>${esc(v.reading)}</rt></ruby>`;
  return esc(v.jp);
}
function exRuby(v){ return v.exJpRuby || esc(v.exJp||""); }
function startSession(items,mode,dir,daily){
  if(!items||!items.length){toast("No hay tarjetas para esa selección");return;}
  sess={queue:items.map((it,i)=>({...it,_i:i})),pos:0,mode,dir:dir||"jp2es",total:items.length,
        done:0,correct:0,revealed:false,answered:false,daily:!!daily};
  document.body.style.overflow="hidden";
  paintSession();
}
function endSession(){
  const acc=sess.done?Math.round(sess.correct/sess.done*100):0;
  const total=sess.done;const wrap=document.createElement("div");
  wrap.className="sess";wrap.id="sessOverlay";
  wrap.innerHTML=`<div class="wrap" style="display:flex;flex-direction:column;height:100%">
    <div class="sesshead"><button class="x" data-act="closeSess">✕</button><div class="sprog"><i style="width:100%"></i></div><span class="smeta">Fin</span></div>
    <div class="sbody"><div class="card summary">
      <div class="big">${total}</div><div class="lab">tarjetas repasadas</div>
      <div class="statline" style="margin-top:22px">
        <div class="stat"><b>${learnedTodayCount()}</b><span>aprendidas hoy</span></div>
        <div class="stat"><b>${S.stats.streak||0}</b><span>racha</span></div>
        <div class="stat"><b>${notLearnedCount()}</b><span>por aprender</span></div>
      </div>
      <div style="margin-top:24px" class="row">
        <button class="btn ghost" data-act="closeSess">Terminar</button>
        <button class="btn" data-act="againSess">Seguir estudiando</button>
      </div>
    </div></div></div>`;
  mountOverlay(wrap);
}
function mountOverlay(el){const old=$("#sessOverlay");if(old)old.remove();document.body.appendChild(el);}
function closeSession(){const o=$("#sessOverlay");if(o)o.remove();document.body.style.overflow="";sess=null;render();refreshChrome();}
function paintSession(){
  if(sess.pos>=sess.queue.length){endSession();return;}
  const it=sess.queue[sess.pos];sess.revealed=false;sess.answered=false;
  let progW,meta;
  if(sess.daily){
    const dn=S.settings.dailyNew||5;const intk=Math.min(dn,intakeToday());
    if(it.phase==="new"){progW=Math.round(intk/dn*100);meta=`<span class="phase">Nuevas</span> · ${intk}/${dn}`;}
    else{const nl=notLearnedCount();progW=100;meta=`<span class="phase">Repaso</span> · ${nl} por aprender`;}
  }else{progW=Math.round(sess.pos/sess.total*100);meta=`${sess.pos+1} / ${sess.total}`;}
  const el=document.createElement("div");el.className="sess";el.id="sessOverlay";
  el.innerHTML=`<div class="wrap" style="display:flex;flex-direction:column;height:100%">
    <div class="sesshead">
      <button class="x" data-act="closeSess" aria-label="Cerrar">✕</button>
      <div class="sprog"><i style="width:${progW}%"></i></div>
      <span class="smeta">${meta}</span>
    </div>
    <div class="sbody"><div id="qhost"></div></div>
  </div>`;
  mountOverlay(el);
  renderCard(it);
}
function starBtn(key){return `<button class="iconbtn" data-act="star" data-key="${key}" title="Favorita" style="margin-left:auto">${S.star[key]?"★":"☆"}</button>`;}
function renderCard(it){
  const host=$("#qhost");if(!host)return;
  if(it.type==="vocab") renderVocabCard(host,it);
  else if(it.type==="gflash") renderGrammarFlash(host,it);
  else renderGrammarCard(host,it);
}
/* vocab card by mode */
function renderVocabCard(host,it){
  const v=it.data;const dir=sess.mode==="type"?"jp2es":sess.dir;
  if(sess.mode==="mcq"){
    const pool=vocabAll();
    const correct = dir==="jp2es"? v.es : v.jp;
    const distr = sample(pool.filter(x=>x.id!==v.id && (dir==="jp2es"?x.es:x.jp)),3).map(x=>dir==="jp2es"?x.es:x.jp);
    const opts=shuffle([correct,...distr]);
    const promptHtml = dir==="jp2es"? `<div class="big jp">${rubyOf(v)}</div>` : `<div class="big">${esc(v.es)}</div>`;
    host.innerHTML=`<div class="qcard">
      <span class="qtag">Vocabulario · opción múltiple</span>
      <div class="front" style="min-height:120px">${promptHtml}</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt ${dir==='jp2es'?'':'jp'}" data-opt="${esc(o)}" data-correct="${o===correct}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span><span class="mk"></span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>`;
    host.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(sess.answered)return;sess.answered=true;
      const ok=b.dataset.correct==="true";
      host.querySelectorAll(".opt").forEach(x=>{x.style.pointerEvents="none";
        if(x.dataset.correct==="true"){x.classList.add("correct");x.querySelector(".mk").textContent="✓";}
        else if(x===b){x.classList.add("wrong");x.querySelector(".mk").textContent="✗";}});
      const extra = dir==="jp2es"? `<div class="reveal"><div class="ex jp">${exRuby(v)}<span class="tr">${esc(v.exEs)}</span></div></div>` : `<div class="reveal"><div class="mean jp">${rubyOf(v)}</div></div>`;
      $("#fb").innerHTML=extra+learnBar(it);
      bindLearn(it,ok);
    }));
    return;
  }
  if(sess.mode==="type"){
    const answer=(v.reading&&v.reading!==v.jp)?v.reading:v.jp;
    host.innerHTML=`<div class="qcard">
      <span class="qtag">Vocabulario · escribir lectura</span>
      <div class="front" style="min-height:120px"><div class="big jp">${esc(v.jp)}</div><div class="sub">Escribe la lectura en hiragana</div></div>
      <input class="typein jp" id="typein" inputmode="kana" autocomplete="off" autocapitalize="off" placeholder="ひらがな">
      <div style="margin-top:14px"><button class="btn" data-act="checkType">Comprobar</button></div>
      <div id="fb"></div>
    </div>`;
    const inp=$("#typein");setTimeout(()=>inp&&inp.focus(),60);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doCheckType(it,answer);}});
    host._answer=answer;host._it=it;
    return;
  }
  // flip
  const front = sess.dir==="jp2es"? `<div class="big jp">${rubyOf(v)}</div>` : `<div class="big">${esc(v.es)}</div>`;
  host.innerHTML=`<div class="qcard">
    <span class="qtag">Vocabulario · tarjeta ${starBtn(it.key)}</span>
    <div class="front">${front}<div class="sub">Toca para ver la respuesta</div></div>
    <div id="back"></div>
    <div class="sfoot" id="foot"><button class="btn" data-act="flip">Mostrar respuesta</button></div>
  </div>`;
  const flip=()=>{
    if(sess.revealed)return;sess.revealed=true;
    const back = sess.dir==="jp2es"
      ? `<div class="reveal"><div class="mean">${esc(v.es)}</div>${v.exJp?`<div class="ex jp">${exRuby(v)}<span class="tr">${esc(v.exEs)}</span></div>`:""}</div>`
      : `<div class="reveal"><div class="mean jp">${rubyOf(v)}</div>${v.exJp?`<div class="ex jp">${exRuby(v)}<span class="tr">${esc(v.exEs)}</span></div>`:""}</div>`;
    $("#back").innerHTML=back;$("#foot").innerHTML=learnBar(it);bindLearn(it,null);
  };
  host.querySelector(".front").addEventListener("click",flip);
  host.querySelector('[data-act="flip"]').addEventListener("click",flip);
}
function doCheckType(it,answer){
  if(sess.answered)return;const inp=$("#typein");if(!inp)return;
  const norm=s=>String(s).trim().replace(/\s/g,"").replace(/。|、/g,"");
  const ok=norm(inp.value)===norm(answer) || norm(inp.value)===norm(it.data.jp);
  sess.answered=true;inp.disabled=true;
  inp.style.borderColor=ok?"var(--good)":"var(--bad)";
  const v=it.data;
  $("#fb").innerHTML=`<div class="reveal"><div class="mean jp">${rubyOf(v)} <span style="color:${ok?'var(--good)':'var(--bad)'};font-size:15px">${ok?"correcto":"lectura: "+esc(answer)}</span></div><div class="ex" style="font-family:inherit">${esc(v.es)}</div>${v.exJp?`<div class="ex jp">${exRuby(v)}<span class="tr">${esc(v.exEs)}</span></div>`:""}</div>`+learnBar(it);
  bindLearn(it,ok);
}
/* grammar card */
function optText(q,i){return (q.optRuby&&q.optRuby[i]!=null)?q.optRuby[i]:esc(q.options[i]);}
function renderGrammarCard(host,it){
  const q=it.data;const cat=q._cat||qCat(q);const gc=GCATS[cat]||{};const AT=allTopics()[cat]||{};const clabel=gc.label||AT.label||"Gramática";const ccolor=gc.color||AT.color||"var(--muted)";
  const opts=q._shuf||(q._shuf=shuffle(q.options.map((o,i)=>({o,i}))));
  const promptHtml=q.promptRuby||esc(q.prompt).replace(/【[\s　]*】|【[　\s]+】|___+/g,'<span class="blank"></span>');
  host.innerHTML=`<div class="qcard">
    <span class="qtag"><span class="dot" style="background:${ccolor}"></span><span class="jp">${esc(clabel)}</span></span>
    <div class="prompt jp">${promptHtml}</div>
    <div class="opts">${opts.map((it2,idx)=>`<button class="opt jp" data-idx="${it2.i}"><span class="k">${"ABCD"[idx]}</span><span>${optText(q,it2.i)}</span><span class="mk"></span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  host.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(sess.answered)return;sess.answered=true;
    const idx=parseInt(b.dataset.idx);const ok=q.answers.includes(idx);
    host.querySelectorAll(".opt").forEach(x=>{x.style.pointerEvents="none";const xi=parseInt(x.dataset.idx);
      if(q.answers.includes(xi)){x.classList.add("correct");x.querySelector(".mk").textContent="✓";}
      else if(x===b){x.classList.add("wrong");x.querySelector(".mk").textContent="✗";}});
    let fb="";
    if(gramCfg.feedback!==false){
      const expl=q.explRuby||esc(q.explanation||"");
      const alt=q.answers.length>1?`<div style="color:var(--muted);margin-top:6px;font-size:13px">Respuestas válidas: ${q.answers.map(i=>optText(q,i)).join(" / ")}</div>`:"";
      if(expl||alt) fb=`<div class="expl">${expl}${alt}</div>`;
    }
    $("#fb").innerHTML=fb+learnBar(it);bindLearn(it,ok);
  }));
}
function renderGrammarFlash(host,it){
  const g=it.data;const cat=g.cat;const gc=GCATS[cat]||{};
  host.innerHTML=`<div class="qcard">
    <span class="qtag"><span class="dot" style="background:${gc.color||'var(--muted)'}"></span><span class="jp">${esc(gc.label||"Gramática")}</span></span>
    <div class="front"><div class="gpat jp">${g.patternRuby||esc(g.pattern)}</div><div class="sub">Toca para ver la regla</div></div>
    <div id="back"></div>
    <div class="sfoot" id="foot"><button class="btn" data-act="flip">Mostrar regla</button></div>
  </div>`;
  const flip=()=>{
    if(sess.revealed)return;sess.revealed=true;
    const ex=g.exJpRuby?`<div class="ex jp">${g.exJpRuby}</div>`:"";
    $("#back").innerHTML=`<div class="reveal"><div class="mean">${esc(g.rule)}</div>${ex}</div>`;
    $("#foot").innerHTML=learnBar(it);bindLearn(it,null);
  };
  host.querySelector(".front").addEventListener("click",flip);
  host.querySelector('[data-act="flip"]').addEventListener("click",flip);
}
/* grading */
function gradeBar(it,known){
  if(known===false) return `<div class="grades"><button class="grade again" data-g="0" style="grid-column:1/-1">Otra vez<small>volver a verla hoy</small></button></div>`;
  if(known===true) return `<div class="grades">
     <button class="grade hard" data-g="1">Difícil<small>pronto</small></button>
     <button class="grade good" data-g="2">Bien<small>normal</small></button>
     <button class="grade easy" data-g="3">Fácil<small>más tarde</small></button></div>`;
  return `<div class="grades">
     <button class="grade again" data-g="0">Otra vez<small>&lt;1d</small></button>
     <button class="grade hard" data-g="1">Difícil<small>corto</small></button>
     <button class="grade good" data-g="2">Bien<small>ok</small></button>
     <button class="grade easy" data-g="3">Fácil<small>largo</small></button></div>`;
}
function bindGrades(it){
  const host=$("#qhost");if(!host)return;
  host.querySelectorAll(".grade").forEach(b=>b.addEventListener("click",()=>{
    const g=parseInt(b.dataset.g);
    schedule(it.key,g);
    sess.done++;if(g>0)sess.correct++;
    if(g===0){const clone={...it};delete clone._shuf;sess.queue.push(clone);} // repeat today
    sess.pos++;paintSession();
  }));
}
/* vocab: binary learned / needs-review decision */
function learnBar(it){
  const done=isLearned(it.key);
  return `<div class="grades learn2">
     <button class="grade again" data-learn="review">Por repasar<small>la sigo estudiando</small></button>
     <button class="grade good" data-learn="learned">Ya la sé<small>${done?"sigue aprendida ✓":"aprendida ✓"}</small></button></div>`;
}
function bindLearn(it,ok){
  const host=$("#qhost");if(!host)return;
  host.querySelectorAll("[data-learn]").forEach(b=>b.addEventListener("click",()=>{
    const dec=b.dataset.learn;
    if(dec==="learned"){markLearned(it.key);schedule(it.key,ok===false?1:2);}
    else{markReview(it.key);schedule(it.key,0);}
    sess.done++;if(dec==="learned")sess.correct++;
    if(sess.daily){const nx=nextDailyItem(it.key);if(nx){sess.queue.push({...nx,_i:sess.queue.length});sess.total=sess.queue.length;}}
    else if(dec==="review"){const clone={...it};delete clone._shuf;sess.queue.push(clone);} // keep studying it now
    sess.pos++;paintSession();
  }));
}

};

/* ---------- global actions ---------- */
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest(".navb");if(b)go(b.dataset.nav);});
document.body.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  switch(act){
    case "studyToday":{const r=dueReviews();const n=newItems().slice(0,S.settings.newPerDay);
      const items=shuffle(r.concat(n));if(!items.length){toast("Nada pendiente. ¡Bien!");break;}
      // vocab -> flip, grammar -> its mcq; mixed handled per-card by type
      startSession(items,"flip",S.settings.dir);break;}
    case "studyAhead":{const items=shuffle(itemsAll()).slice(0,20);startSession(items,"flip",S.settings.dir);break;}
    case "goalInc":{S.settings.learnGoal=clamp((S.settings.learnGoal||8)+1,1,100);save();render();break;}
    case "goalDec":{S.settings.learnGoal=clamp((S.settings.learnGoal||8)-1,1,100);save();render();break;}
    case "studyReview":{vocabCfg.filter="review";const list=pickVocab().map(v=>({key:"v:"+v.id,type:"vocab",data:v}));if(!list.length){toast("No te queda ninguna palabra por repasar 🎉");break;}startSession(list,"flip",S.settings.dir);break;}
    case "studyDaily":{const first=nextDailyItem(null);if(!first){toast("Nada para hoy 🎉");break;}startSession([first],"flip",S.settings.dir,true);break;}
    case "studyExtra":{const items=shuffle(newPoolVocab()).slice(0,10).map(v=>({key:"v:"+v.id,type:"vocab",data:v}));if(!items.length){toast("No quedan palabras nuevas por ver 🎉");break;}startSession(items,"flip",S.settings.dir);break;}
    case "quick-vocab":{const items=shuffle(vocabAll()).slice(0,20).map(v=>({key:"v:"+v.id,type:"vocab",data:v}));startSession(items,"flip",S.settings.dir);break;}
    case "quick-grammar":{go("grammar");break;}
    case "quick-new":{const items=shuffle(newPoolVocab()).slice(0,10).map(v=>({key:"v:"+v.id,type:"vocab",data:v}));if(!items.length){toast("No quedan palabras sin ver");break;}startSession(items,"flip",S.settings.dir);break;}
    case "quick-type":{const items=shuffle(vocabAll().filter(v=>v.reading&&v.reading!==v.jp)).slice(0,15).map(v=>({key:"v:"+v.id,type:"vocab",data:v}));startSession(items,"type","jp2es");break;}
    case "startVocab":{const list=pickVocab().map(v=>({key:"v:"+v.id,type:"vocab",data:v}));startSession(list,vocabCfg.mode,vocabCfg.dir);break;}
    case "startGrammar":{const list=pickGrammarQuiz().map(q=>({key:q.gp?"gp:"+q.gp.id:"g:"+q.id,type:"grammar",data:q}));if(!list.length){toast("Elige alguna categoría");break;}startSession(list,"mcq");break;}
    case "startGrammarCards":{const list=pickGrammarCards().map(g=>({key:"gp:"+g.id,type:"gflash",data:g}));if(!list.length){toast("No hay tarjetas para esa selección");break;}startSession(list,"flip");break;}
    case "gCatAll":{const cs=grammarCats(gramCfg.mode);const all=cs.every(c=>gramCfg.cats.has(c.slug));cs.forEach(c=>{if(all)gramCfg.cats.delete(c.slug);else gramCfg.cats.add(c.slug);});render();break;}
    case "toggleFb":{gramCfg.feedback=!gramCfg.feedback;render();break;}
    case "lessonOpen":{lessonOpen=a.dataset.id;render();window.scrollTo(0,0);break;}
    case "lessonBack":{lessonOpen=null;render();window.scrollTo(0,0);break;}
    case "closeSess":closeSession();break;
    case "againSess":{closeSessionSilent();
      if(currentNav==="grammar"){
        if(gramCfg.mode==="cards"){const list=pickGrammarCards().map(g=>({key:"gp:"+g.id,type:"gflash",data:g}));startSession(list,"flip");}
        else{const list=pickGrammarQuiz().map(q=>({key:q.gp?"gp:"+q.gp.id:"g:"+q.id,type:"grammar",data:q}));startSession(list,"mcq");}
      }
      else{const list=pickVocab().map(v=>({key:"v:"+v.id,type:"vocab",data:v}));startSession(list,vocabCfg.mode,vocabCfg.dir);}break;}
    case "flip":break;
    case "checkType":{const host=$("#qhost");doCheckType(host._it,host._answer);break;}
    case "star":{const k=a.dataset.key;if(S.star[k])delete S.star[k];else S.star[k]=1;save();a.textContent=S.star[k]?"★":"☆";break;}
    case "saveVocab":saveVocab();break;
    case "addOpt":{gForm.options.push("");render();break;}
    case "rmOpt":{const i=+a.dataset.i;gForm.options.splice(i,1);const ns=new Set();gForm.correct.forEach(c=>{if(c<i)ns.add(c);else if(c>i)ns.add(c-1);});gForm.correct=ns;render();break;}
    case "saveGrammar":saveGrammar();break;
    case "editTheory":openTheory(a.dataset.topic);break;
    case "delVocab":{if(confirm("¿Borrar esta palabra?")){S.userVocab=S.userVocab.filter(v=>v.id!==a.dataset.id);delete S.srs["v:"+a.dataset.id];delete S.learn["v:"+a.dataset.id];save();render();toast("Palabra borrada");}break;}
    case "delGrammar":{if(confirm("¿Borrar esta pregunta?")){S.userGrammar=S.userGrammar.filter(q=>q.id!==a.dataset.id);delete S.srs["g:"+a.dataset.id];save();render();toast("Pregunta borrada");}break;}
    case "unhide":{delete S.hidden[a.dataset.key];save();render();break;}
    case "saveSettings":{const dn=parseInt($("#s_new").value);const lg=parseInt($("#s_learn").value);S.settings.dailyNew=clamp(isNaN(dn)?5:dn,1,50);S.settings.learnGoal=clamp(isNaN(lg)?8:lg,1,100);save();toast("Ajustes guardados");go("home");break;}
    case "export":doExport();break;
    case "importBtn":$("#importFile").click();break;
    case "resetSrs":{if(confirm("¿Reiniciar el progreso? Se borran el repaso espaciado y el estado de aprendidas; tu vocabulario y gramática se conservan.")){S.srs={};S.learn={};S.stats={streak:0,best:0,last:null,reviews:0,history:{}};save();toast("Progreso reiniciado");go("home");}break;}
    case "wipe":{if(confirm("Esto borra TODO (progreso, palabras y gramática que añadiste). ¿Seguro?")){localStorage.removeItem(KEY);S=structuredClone(DEFAULT);save();toast("Todo borrado");go("home");}break;}
  }
});
function closeSessionSilent(){const o=$("#sessOverlay");if(o)o.remove();sess=null;}

function saveVocab(){
  const jp=$("#f_jp").value.trim();const es=$("#f_es").value.trim();
  if(!jp||!es){toast("Escribe al menos la palabra y su significado");return;}
  const v={id:"u"+Date.now(),jp,reading:$("#f_read").value.trim(),es,exJp:$("#f_exjp").value.trim(),exEs:$("#f_exes").value.trim()};
  S.userVocab.push(v);save();toast("Palabra añadida");
  ["f_jp","f_read","f_es","f_exjp","f_exes"].forEach(id=>{const el=$("#"+id);if(el)el.value="";});
  $("#f_jp").focus();
}
function saveGrammar(){
  let topic=$("#f_topic").value;
  const prompt=$("#f_prompt").value.trim();
  const opts=gForm.options.map(o=>o.trim()).filter(Boolean);
  if(topic==="__new"){
    const lab=$("#f_tlabel").value.trim();const sh=$("#f_tshort").value.trim();
    if(!lab){toast("Ponle nombre al tema nuevo");return;}
    topic="u"+Date.now().toString(36);
    const palette=["#4f46e5","#0f766e","#c2410c","#be123c","#7c3aed","#0891b2","#b45309","#15803d"];
    S.userTopics[topic]={label:lab,short:sh||lab,color:palette[Object.keys(S.userTopics).length%palette.length]};
  }
  if(!prompt){toast("Escribe la frase");return;}
  if(opts.length<2){toast("Añade al menos dos opciones");return;}
  // recompute correct index against filtered opts
  const correctVals=[...gForm.correct].map(i=>gForm.options[i]).filter(v=>v&&v.trim());
  const answers=opts.map((o,i)=>correctVals.includes(o)?i:-1).filter(i=>i>=0);
  if(!answers.length){toast("Marca la opción correcta");return;}
  const q={id:"u"+Date.now(),topic,prompt:prompt.replace(/___+/g,"【　　　】"),options:opts,answers,explanation:$("#f_expl").value.trim(),source:"añadido por mí"};
  S.userGrammar.push(q);save();toast("Pregunta añadida");
  gForm={options:["",""],correct:new Set(),topic:topic,_init:1};
  render();
}
function openTheory(k){
  const T=allTopics();const c=T[k]||{};
  const el=document.createElement("div");el.className="sess";el.id="sessOverlay";
  el.innerHTML=`<div class="wrap" style="display:flex;flex-direction:column;height:100%">
    <div class="sesshead"><button class="x" data-act="closeSess">✕</button>
      <div style="flex:1;font-weight:800" class="jp">${esc(c.label||k)}</div></div>
    <div class="sbody">
      <p class="hint" style="margin:0 2px 8px">${esc(c.short||"")}</p>
      <textarea class="inp jp" id="theoryText" style="min-height:52vh">${esc(S.theory[k]||"")}</textarea>
      <div class="row" style="margin-top:14px">
        <button class="btn ghost" data-act="closeSess">Cerrar</button>
        <button class="btn" id="saveTheory">Guardar notas</button>
      </div>
    </div></div>`;
  document.body.appendChild(el);document.body.style.overflow="hidden";
  $("#saveTheory").addEventListener("click",()=>{S.theory[k]=$("#theoryText").value;save();toast("Notas guardadas");closeSession();});
}
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="japones-copia-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Copia descargada");
}

/* ---------- boot ---------- */
refreshChrome();render();
</script>
</body>
