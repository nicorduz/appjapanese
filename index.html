<style>
:root{
  --paper:#f7f5ef; --ink:#17221f; --muted:#68746f; --line:#dcdfd8; --card:#fffefb;
  --indigo:#4f46e5; --teal:#0f766e; --good:#18794e; --bad:#b42318; --warn:#b45309;
  --soft:#eef0ea; --shadow:0 14px 40px rgba(30,40,36,.10); color-scheme:light;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--paper);
  padding:0 0 calc(78px + env(safe-area-inset-bottom));
}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",ui-sans-serif,sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
ruby{ruby-position:over}rt{font-size:.5em;font-weight:600;color:#7a857f;letter-spacing:.02em}
a{color:var(--indigo)}
.wrap{width:min(640px,100%);margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper),var(--paper) 72%,transparent);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:15px}
.brand .mk{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--paper);font-size:19px;line-height:1}
.brand .mk::after{content:"語"}
.pill{font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.6);
  padding:6px 11px;border-radius:999px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.pill b{color:var(--ink)}
.view{padding-top:6px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.sec{font-size:13px;letter-spacing:.02em;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:18px}
/* HOME hero */
.hero{padding:22px 20px 20px;border-radius:24px}
.hero .lead{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.today{display:flex;align-items:baseline;gap:12px}
.today .num{font-size:60px;line-height:.9;font-weight:850;letter-spacing:-.04em}
.today .unit{font-size:14px;color:var(--muted);font-weight:600}
.hero .desc{font-size:14px;color:var(--muted);margin:12px 0 18px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;
  padding:14px 18px;font-weight:750;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  transition:transform .12s ease, box-shadow .12s ease;width:100%}
.btn:active{transform:translateY(1px)}
.btn.big{padding:16px;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.line{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:10px 13px;border-radius:11px;font-size:13.5px;width:auto}
.btn:disabled{opacity:.4;transform:none}
.row{display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px;text-align:left;
  display:flex;flex-direction:column;gap:5px;transition:transform .12s ease}
.tile:active{transform:translateY(1px)}
.tile .t{font-weight:750;font-size:14.5px}
.tile .s{font-size:12px;color:var(--muted);line-height:1.35}
.tile .jpc{font-size:20px;font-weight:700;color:var(--ink)}
.statline{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:rgba(255,255,255,.55)}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),#8b5cf6);border-radius:99px;transition:width .4s ease}
.goalrow{display:flex;justify-content:space-between;align-items:end;font-size:12.5px;color:var(--muted);margin-top:16px}
/* controls */
.label{font-size:12px;font-weight:750;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:650;
  transition:.14s ease;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"] .dot{outline:2px solid rgba(255,255,255,.5)}
.topicgrid{display:grid;gap:8px}
.topicbtn{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 13px}
.topicbtn[aria-pressed="false"]{opacity:.55}
.topicbtn .nm{font-weight:700;font-size:13.5px;line-height:1.4}
.topicbtn .nm .jp{font-size:15px}
.topicbtn .ct{font-size:12px;color:var(--muted)}
/* session */
.sess{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom))}
.sesshead{display:flex;align-items:center;gap:12px}
.sesshead .x{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;flex:none}
.sprog{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.sprog>i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.smeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sbody{flex:1;overflow:auto;display:flex;flex-direction:column;padding-top:16px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:24px 20px;display:flex;flex-direction:column}
.qtag{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;padding:6px 11px;border-radius:999px;
  background:var(--soft);font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:16px}
.qtag .dot{width:7px;height:7px;border-radius:50%}
.prompt{font-size:clamp(21px,5.3vw,28px);line-height:1.7;margin:2px 0}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:180px}
.front .big{font-size:clamp(30px,9vw,50px);font-weight:800;letter-spacing:.01em;line-height:1.25}
.front .big rt{font-size:.42em}
.front .sub{font-size:15px;color:var(--muted)}
.reveal{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;animation:fade .18s ease}
.reveal .mean{font-size:20px;font-weight:750}
.reveal .ex{margin-top:12px;font-size:15px;line-height:1.75;color:#3a4642}
.reveal .ex .tr{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.expl{margin-top:14px;font-size:14px;line-height:1.6;background:var(--soft);border-radius:12px;padding:12px 13px;animation:fade .18s ease}
.opts{display:grid;gap:9px;margin-top:20px}
.opt{display:grid;grid-template-columns:26px 1fr 22px;gap:11px;align-items:center;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 13px;font-size:16px;transition:.12s}
.opt:active{transform:translateY(1px)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.opt.correct{border-color:var(--good);background:#eaf6ef}
.opt.correct .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fbeceb}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .mk{justify-self:end;font-weight:800}
.opt.correct .mk{color:var(--good)}.opt.wrong .mk{color:var(--bad)}
.typein{margin-top:20px;width:100%;border:1px solid var(--line);border-radius:13px;padding:15px;font-size:20px;text-align:center;background:#fff}
.typein:focus{outline:2px solid var(--indigo);border-color:var(--indigo)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grade{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 6px;font-weight:750;font-size:13px;
  display:flex;flex-direction:column;gap:3px;align-items:center}
.grade small{font-size:10.5px;color:var(--muted);font-weight:600}
.grade.again{border-color:#e5b4af;color:var(--bad)}
.grade.hard{border-color:#e3c79b;color:var(--warn)}
.grade.good{border-color:#a9d3bd;color:var(--good)}
.grade.easy{border-color:#b6c2f0;color:var(--indigo)}
.sfoot{padding-top:12px}
.summary{text-align:center;padding:34px 20px}
.summary .big{font-size:54px;font-weight:850;letter-spacing:-.03em;line-height:1}
.summary .lab{color:var(--muted);font-size:13.5px;margin-top:6px}
/* lists / forms */
.field{margin-top:14px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:15px}
textarea.inp{min-height:120px;resize:vertical;line-height:1.6}
.inp:focus{outline:2px solid var(--indigo);border-color:var(--indigo)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.optedit{display:flex;gap:8px;align-items:center;margin-top:8px}
.optedit input[type=text]{flex:1}
.optedit .rm{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;flex:none;font-size:16px}
.mark{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.listitem{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);
  background:#fff;border-radius:14px;padding:13px 13px;margin-top:9px}
.listitem .txt{min-width:0}
.listitem .jpw{font-weight:700;font-size:16px}
.listitem .es{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.listitem .acts{display:flex;gap:6px;flex:none}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:650}
.iconbtn.danger{color:var(--bad);border-color:#e5b4af}
.subtabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;margin-bottom:4px}
.subtab{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;font-size:13px;color:var(--muted)}
.subtab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 14px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:650;
  z-index:80;box-shadow:var(--shadow);opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.spark{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:6px}
.spark .b{flex:1;background:var(--soft);border-radius:6px 6px 3px 3px;min-height:4px;position:relative}
.spark .b>i{position:absolute;inset:auto 0 0 0;background:linear-gradient(var(--indigo),#8b5cf6);border-radius:6px 6px 3px 3px}
.spark .cap{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.sparkrow{display:flex;gap:6px;margin-top:2px}.sparkrow>div{flex:1;text-align:center}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(247,245,239,.92);
  backdrop-filter:saturate(1.2) blur(10px);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav .wrap{display:flex;justify-content:space-between;gap:2px}
.navb{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px;color:var(--muted);font-size:10.5px;font-weight:650;border-radius:12px}
.navb svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navb[aria-current="true"]{color:var(--ink)}
.navb[aria-current="true"] svg{stroke-width:2}
.hidden{display:none!important}

<script id="seedGrammar" type="application/json">[{"id":"contrast-01","topic":"contrast","prompt":"【　　　】電車に間に合わないだろう。","options":["走るけど","走るのに","走っても"],"answers":[2],"explanation":"「ても」 expresa concesión: incluso si corro, probablemente no alcanzaré el tren.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-02","topic":"contrast","prompt":"私は東京に【　　　】、弟は京都に住んでいます。","options":["住んでいるけど","住んでいるのに","住んでいても"],"answers":[0],"explanation":"「けど」 enlaza dos hechos que contrastan: yo vivo en Tokio, pero mi hermano vive en Kioto.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-03","topic":"contrast","prompt":"こんなに条件のいい【　　　】、断らないでください。","options":["仕事だが","仕事なのに","仕事でも"],"answers":[1],"explanation":"Con un sustantivo, 「なのに」 marca un resultado contrario a lo esperable: a pesar de ser un trabajo con buenas condiciones.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-04","topic":"contrast","prompt":"【　　　】、朝ごはんはちゃんと食べなさい。","options":["寝坊したけど","寝坊したのに","寝坊しても"],"answers":[2],"explanation":"「ても」 significa “aunque/incluso si”: aunque te quedes dormido, desayuna bien.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-05","topic":"contrast","prompt":"もう夜の【　　　】、もう少し勉強しよう。","options":["12時だけど","12時なのに","12時でも"],"answers":[1],"explanation":"「12時なのに」 resalta que seguir estudiando resulta inesperado porque ya es medianoche.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-06","topic":"contrast","prompt":"あのレストラン、あまり【　　　】どうして混んでいるんだろう。","options":["おいしくなくても","おいしくないのに"],"answers":[1],"explanation":"「のに」 expresa sorpresa ante una contradicción real: no es muy rico y, aun así, está lleno.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-07","topic":"contrast","prompt":"日本中を【　　　】、京都が一番すきです。","options":["旅行したけど","旅行したのに","旅行しても"],"answers":[0],"explanation":"「けど」 presenta un contraste neutral entre haber viajado por Japón y preferir Kioto.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-08","topic":"contrast","prompt":"たとえ親に【　　　】、パイロットになりたい。","options":["反対されるけど","反対されるのに","反対されても"],"answers":[2],"explanation":"「たとえ〜ても」 forma la estructura “aunque/incluso si”.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-09","topic":"contrast","prompt":"すみません。来週の【　　　】、テーブルの予約はできますか？","options":["日曜日ですが","日曜日なのに","日曜日でも"],"answers":[0],"explanation":"「〜ですが」 introduce el tema con cortesía y suaviza la pregunta.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-10","topic":"contrast","prompt":"2時間の食べ放題ですので、いくら【　　　】、2000円です。","options":["食べるけど","食べるのに","食べても"],"answers":[2],"explanation":"「いくら〜ても」 significa “por mucho que”: comas lo que comas, cuesta 2000 yenes.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-11","topic":"contrast","prompt":"雨が降ったけど、【　　　】","options":["ピクニックに行きました。","コンビニで傘を買いました。","仕事を休めません。"],"answers":[0],"explanation":"Después de 「けど」 se espera un contraste: llovió, pero fuimos de picnic.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-12","topic":"contrast","prompt":"もう3月なのに、【　　　】","options":["暖かくなってきた。","少しも暖かくならない。","もうすぐ暖かくなるだろう。"],"answers":[1],"explanation":"En marzo se espera calor; 「のに」 introduce el hecho contrario: todavía no se ha calentado nada.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-13","topic":"contrast","prompt":"何があっても、【　　　】","options":["彼女と映画をみました。","彼女から返事がありません。","彼女と結婚するつもりです。"],"answers":[2],"explanation":"「何があっても」 significa “pase lo que pase” y combina con una decisión firme.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-14","topic":"contrast","prompt":"次の旅行のことですが、【　　　】","options":["みんなで7月に沖縄に行きませんか。","長崎に行ったことがありますか？","北海道の冬はとても寒いそうです。"],"answers":[0],"explanation":"「〜ことですが」 introduce un tema; la propuesta sobre el próximo viaje continúa ese tema.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-15","topic":"contrast","prompt":"私が話しているのに【　　　】","options":["静かにしてください。","じゃまをしないでください。","よく聞いてください。"],"answers":[1],"explanation":"「のに」 expresa molestia por una acción contraria a la situación: no interrumpas mientras estoy hablando.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-16","topic":"contrast","prompt":"毎日日本語を勉強していますが、【　　　】","options":["なかなか漢字が覚えられません。","少しだけ話すことができます。","敬語の練習をしましょう。"],"answers":[0],"explanation":"「が」 introduce el contraste entre estudiar cada día y no lograr memorizar los kanji.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-17","topic":"contrast","prompt":"たとえお金があっても、【　　　】","options":["インドに行ってみたい。","株には投資しない。","ベンツ車を買うつもりだ。"],"answers":[1],"explanation":"「たとえ〜ても」 exige una consecuencia que se mantenga pese a la condición: aunque tenga dinero, no invertiré.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"contrast-18","topic":"contrast","prompt":"どうしたの？【　　　】","options":["あまり元気がないけど。","あまり元気がないのに。","あまり元気がないので。"],"answers":[0],"explanation":"Al final de la frase, 「けど」 suaviza la observación y deja implícita la pregunta o preocupación.","source":"20260608 Respuestas de Ejercicios [GA], [KEDO], [NONI], [TEMO].docx"},{"id":"evidence1-01","topic":"evidence1","prompt":"もっと速く走れる【　　　】なりたいです。","options":["らしいに","ように","そうに","みたいに"],"answers":[1],"explanation":"「可能形＋ようになる」 expresa llegar a poder hacer algo.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-02","topic":"evidence1","prompt":"彼は力が強くて男【　　　】人です。","options":["ような","らしい","そうな"],"answers":[1],"explanation":"「男らしい」 significa varonil o propio de un hombre; funciona como adjetivo antes de 「人」.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-03","topic":"evidence1","prompt":"これはずいぶん古いものの【　　　】。きっと高かっただろう。","options":["ようだ","そうだ","らしい","みたいだ"],"answers":[0],"explanation":"「Nのようだ」 expresa una inferencia basada en lo que se observa.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-04","topic":"evidence1","prompt":"二人はまるで本当の兄弟【　　　】。","options":["ようだ","らしい","みたいだ","そうだ"],"answers":[2],"explanation":"「まるで〜みたいだ」 expresa una comparación informal: parecen hermanos de verdad.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-05","topic":"evidence1","prompt":"あの女の子は人形の【　　　】顔をしています。","options":["ような","らしい","みたいな"],"answers":[0],"explanation":"Después de 「人形の」 corresponde 「ような」: una cara parecida a la de una muñeca.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-06","topic":"evidence1","prompt":"彼女はプレゼントをもらって、うれし【　　　】顔をしています。","options":["そうな","ような","みたいな","らしい"],"answers":[0],"explanation":"La raíz de un adjetivo い más 「そうな」 describe apariencia: うれしそうな顔.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-07","topic":"evidence1","prompt":"「もうすぐ雨が【　　　】ですね。」「傘を持って行きましょう。」","options":["降るよう","降ってきそう","降るらしい"],"answers":[1],"explanation":"「降ってきそう」 indica que parece que la lluvia está a punto de empezar.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-08","topic":"evidence1","prompt":"テレビのニュースで言っていたけど、明日は雪が降る【　　　】。","options":["そうだ","ようだ","らしい","みたいだ"],"answers":[0],"explanation":"「普通形＋そうだ」 transmite información oída: lo dijeron en las noticias.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-09","topic":"evidence1","prompt":"Ａ「そこから見て、お店の前に、どのくらい人がいますか。」Ｂ「20人位いる【　　　】です。」","options":["みたい","そう","よう"],"answers":[2],"explanation":"「いるようです」 comunica una estimación visual de manera cortés.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-10","topic":"evidence1","prompt":"あの人、風邪ひいた【　　　】ね。マスクしているし、咳もしている。","options":["そうだ","ようだ","らしい","みたい"],"answers":[3],"explanation":"「みたい」 es una inferencia conversacional basada en señales visibles como la mascarilla y la tos.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-11","topic":"evidence1","prompt":"朝、山田さんから、電車が遅れていると連絡があって、今日遅刻する【　　　】よ。","options":["そうだ","ようだ","らしい","みたい"],"answers":[0],"explanation":"La información vino directamente de Yamada; 「そうだ」 funciona como estilo reportativo.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence1-12","topic":"evidence1","prompt":"あのレストランはいつも行列ができているから、どうやら料理がおいしい【　　　】。","options":["そうだ","ようだ","らしい","みたいだ"],"answers":[1],"explanation":"「どうやら〜ようだ」 expresa una conclusión razonada a partir de la fila constante.","source":"20260629 Respuestas de Ejercicios [SOU] [YOU] [MITAI] [RASHII].docx"},{"id":"evidence2-01","topic":"evidence2","prompt":"今日は朝から頭が痛くて、少し熱も【　　　】。","options":["ありそうだ","あるようだ","あるみたいだ","あるらしい"],"answers":[1,2],"explanation":"El documento acepta 「あるようだ」 y 「あるみたいだ」 como inferencias a partir de los síntomas.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-02","topic":"evidence2","prompt":"空が黒い雲でいっぱいだから、もうすぐ雨が【　　　】。","options":["降りそうだ","降るようだ","降るみたいだ","降るらしい"],"answers":[0],"explanation":"La forma de raíz verbal más 「そうだ」 indica apariencia inmediata: parece que va a llover.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-03","topic":"evidence2","prompt":"あの店はとても人気が【　　　】よ。友だちが言っていた。","options":["ありそうだ","あるようだ","あるみたいだ","あるらしい"],"answers":[3],"explanation":"「らしい」 transmite información recibida de otra persona.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-04","topic":"evidence2","prompt":"あの人は日本人の友だちが多くて、日本語も【　　　】。","options":["上手そうだ","上手なようだ","上手みたいだ","上手らしい"],"answers":[1,2],"explanation":"El documento acepta la inferencia formal 「上手なようだ」 y la conversacional 「上手みたいだ」.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-05","topic":"evidence2","prompt":"その子は【　　　】顔をしてお母さんを見ている。","options":["泣きそうな","泣くような","泣くみたいな","泣くらしい"],"answers":[0],"explanation":"「泣きそうな顔」 describe que la niña parece estar a punto de llorar.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-06","topic":"evidence2","prompt":"外がにぎやかだ。近くでお祭りをして【　　　】。","options":["いそうだ","いるようだ","いるみたいだ","いるらしい"],"answers":[1,2],"explanation":"El documento acepta 「いるようだ」 y 「いるみたいだ」 como inferencias basadas en el ruido exterior.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-07","topic":"evidence2","prompt":"この宿題の量は、一日で【　　　】ない。","options":["終わりそうに","終わるように","終わるみたいに","終わるらしく"],"answers":[0],"explanation":"La forma negativa de apariencia es 「Vます-stem＋そうにない」: no parece que vaya a terminar.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-08","topic":"evidence2","prompt":"彼は今日はあまり元気が【　　　】ね。何かあったのかな。","options":["なさそうだ","ないようだ","ないみたいだ","ないらしい"],"answers":[1,2],"explanation":"El documento acepta 「ないようだ」 y 「ないみたいだ」 como inferencias sobre su estado.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-09","topic":"evidence2","prompt":"山田さんが手を挙げている。何か【　　　】。","options":["言いたそうだ","言いたいようだ","言いたいみたいだ","言いたいらしい"],"answers":[0],"explanation":"「言いたそうだ」 describe el deseo que se percibe por su conducta.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-10","topic":"evidence2","prompt":"天気予報によると、明日は寒く【　　　】。","options":["なるそうだ","なるようだ","なるみたいだ","なるらしい"],"answers":[0,3],"explanation":"Con una fuente explícita, el documento acepta el reportativo 「そうだ」 y 「らしい」.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-11","topic":"evidence2","prompt":"あの子はお母さんにあまり似て【　　　】ね。","options":["いなさそう","いないようだ","いないみたいだ","いないらしい"],"answers":[1,2],"explanation":"El documento acepta 「いないようだ」 y 「いないみたいだ」 como inferencias visuales.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-12","topic":"evidence2","prompt":"山の上は風が強くて、とても【　　　】。","options":["寒そうだ","寒いようだ","寒いみたいだ","寒いらしい"],"answers":[3],"explanation":"Aquí el documento selecciona 「寒いらしい」 para presentar la información sobre la montaña como reportada.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-13","topic":"evidence2","prompt":"コップがテーブルから【　　　】。気をつけて。","options":["落ちそうだ","落ちるようだ","落ちるみたいだ","落ちるらしい"],"answers":[0],"explanation":"「落ちそうだ」 indica que el vaso parece estar a punto de caer.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"evidence2-14","topic":"evidence2","prompt":"台所からいいにおいがする。母が料理を【　　　】。","options":["始めそうだ","始めたようだ","始めたみたいだ","始めたらしい"],"answers":[1,2],"explanation":"El documento acepta 「始めたようだ」 y 「始めたみたいだ」 como inferencias basadas en el olor.","source":"20260702 Respuestas de Ejercicios 2 [YOU] [SOU] [MITAI] [RASHII].docx"},{"id":"time-01","topic":"time","prompt":"子どもの【　　　】、よくこの公園で遊びました。","options":["とき","ころ","場合","ごろ"],"answers":[1],"explanation":"「Nのころ」 se refiere a una etapa aproximada de la vida: cuando era niño.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-02","topic":"time","prompt":"会議の【　　　】、この資料に目を通しておいてください。","options":["前に","あとで","とき","場合"],"answers":[0],"explanation":"「Nの前に」 indica que la acción debe hacerse antes de la reunión.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-03","topic":"time","prompt":"テストでわからない問題があった【　　　】は、先生に聞いてください。","options":["とき","場合","ころ","前に"],"answers":[1],"explanation":"「場合」 presenta una condición o situación posible: en caso de que haya una pregunta difícil.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-04","topic":"time","prompt":"授業の【　　　】、先生に質問しましょう。","options":["前に","あとで","場合","ころ"],"answers":[1],"explanation":"「Nのあとで」 indica una acción posterior a la clase.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-05","topic":"time","prompt":"東京へ行った【　　　】、スカイツリーに登りました。","options":["とき","ころ","場合","前に"],"answers":[0],"explanation":"「Vたとき」 sitúa un hecho dentro de una ocasión pasada concreta.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-06","topic":"time","prompt":"寝る【　　　】、スマホを見ないようにしています。","options":["あとで","前に","場合","ころ"],"answers":[1],"explanation":"「Vる前に」 significa antes de hacer la acción.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-07","topic":"time","prompt":"日本語の勉強を始めた【　　　】は、ひらがなしか読めませんでした。","options":["とき","ころ","場合","あとで"],"answers":[1],"explanation":"「ころ」 presenta el periodo aproximado en que se empezó a estudiar.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-08","topic":"time","prompt":"宿題が終わった【　　　】、ゲームをしてもいいです。","options":["前に","あとで","とき","場合"],"answers":[1],"explanation":"「Vたあとで」 indica que jugar ocurre después de terminar la tarea.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-09","topic":"time","prompt":"体調が悪い【　　　】、薬を飲んでいます。","options":["とき","ころ","場合","ごろ"],"answers":[0],"explanation":"「とき」 señala la situación concreta en la que se toma la medicina.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-10","topic":"time","prompt":"もし、電車が遅れた【　　　】、会社に連絡してください。","options":["とき","場合","ころ","あとで"],"answers":[1],"explanation":"「もし〜場合」 formula una contingencia: en caso de retraso.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-11","topic":"time","prompt":"出かける【　　　】、天気予報をチェックしたほうがいいですよ。","options":["あとで","前に","場合","ころ"],"answers":[1],"explanation":"La comprobación ocurre antes de salir: 「出かける前に」.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-12","topic":"time","prompt":"高校を卒業した【　　　】は、まだ将来の夢がありませんでした。","options":["とき","ころ","場合","ごろ"],"answers":[1],"explanation":"「ころ」 enfoca el periodo aproximado alrededor de la graduación.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-13","topic":"time","prompt":"疲れた【　　　】は、無理せず休んでください。","options":["とき","ころ","場合","前に"],"answers":[0],"explanation":"「疲れたとき」 significa cuando estés cansado.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-14","topic":"time","prompt":"もし電車の切符をなくした【　　　】、どうしたらいいですか。","options":["とき","場合","ころ","あとで"],"answers":[1],"explanation":"「場合」 encaja con una situación hipotética que requiere instrucciones.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-15","topic":"time","prompt":"大学生の【　　　】、一度スペインを旅行しました。","options":["とき","ころ","場合","ごろ"],"answers":[1],"explanation":"「大学生のころ」 se refiere al periodo en que la persona era estudiante universitaria.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-16","topic":"time","prompt":"授業が終わった【　　　】、先生にレポートを出してください。","options":["前に","あとで","とき","場合"],"answers":[1],"explanation":"El informe se entrega después de que termine la clase: 「あとで」.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-17","topic":"time","prompt":"日本へ来た【　　　】、空港で写真を撮りました。","options": ios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"time-25","topic":"time","prompt":"こんな忙しい【 A 】に遊んでいる【 B 】ではない。","options":["A＝とき／B＝場合","A＝ころ／B＝とき","A＝場合／B＝ころ","A＝ごろ／B＝場合"],"answers":[0],"explanation":"La expresión fija es 「こんな忙しいとき」 y 「〜ている場合ではない」: no es momento de estar jugando.","source":"20260730 Respuestas de Ejercicios [TOKI][KORO][BAAI][MAE][ATO].docx"},{"id":"duration-01","topic":"duration","prompt":"雨が降らない【　　　】、買い物に行きましょう。","options":["あいだ","あいだに","うちに","途中で"],"answers":[2],"explanation":"「〜ないうちに」 significa antes de que cambie la situación: antes de que empiece a llover.","source":"20260806 Respuestas de Ejercicios [AIDA][UCHI][TOCHU].docx"},{"id":"duration-02","topic":"duration","prompt":"この映画は、【　　　】見るのをやめてしまったので、結末を知りません。","options":["途中で","途中に","あいだ","うちに"],"answers":[0],"explanation":"「途中で」 indica que se interrumpió la acción a mitad de la película.","source":"20260806 Respuestas de Ejercicios [AIDA][UCHI][TOCHU].docx"},{"id":"duration-03","topic":"duration","prompt":"スープが熱い【　　　】飲んでくださいね。","options":["あいだ","あいだに","うちに","途中で"],"answers":[2],"explanation":"「うちに」 significa mientras el estado todavía se mantiene: mientras la sopa está caliente.","source":"20260806 Respuestas de Ejercicios [AIDA][UCHI][TOCHU].docx"},{"id":"duration-04","topic":"duration","prompt":"子どもが小さい【　　　】、妻は仕事をしないで子育てをする。","options":["あいだ","あいだに","うちに","途中で"],"answers":[0],"explanation":"「あいだ」 cubre toda la duración del periodo en que los hijos son pequeños.","source":"20260806 Respuestas de Ejercicios [AIDA][UCHI][TOCHU].docx"},{"id":"duration-05","topic":"duration","prompt":"大学にいる【　　　】、留学を経験したい。","options":["あいだ","あいだに","うちに","途中で"],"answers":[2],"explanation":"「うちに」 expresa aprovechar una etapa antes de que termine: mientras esté en la universidad.","source":"20260806 Respuestas de Ejercicios [AIDA][UCHI][TOCHU].docx"},{"id":"duration-06","topic":"duration","prompt":"電車で来る【　　　】、事故があって遅れてしまいました。","options":["途中で","途中に","あいだ","うちに"],"answers":[1],"explanation":"El documento usa 「途中に」 para /* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(arr,n)=>shuffle(arr).slice(0,n);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const addDays=(str,n)=>{const p=str.split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1900);}
function allTopics(){return Object.assign({},SEED.topics,S.userTopics);}

/* merge seed + user, minus hidden */
function vocabAll(){return SEED.vocab.concat(S.userVocab).filter(v=>!S.hidden["v:"+v.id]);}
function grammarAll(){return SEED.grammar.concat(S.userGrammar).filter(q=>!S.hidden["g:"+q.id]);}
function itemsAll(){
  return vocabAll().map(v=>({key:"v:"+v.id,type:"vocab",data:v}))
    .concat(grammarAll().map(q=>({key:"g:"+q.id,type:"grammar",data:q})));
}
/* SRS partitions */
function dueReviews(){const t=today();return itemsAll().filter(it=>{const s=S.srs[it.key];return s&&s.due&&s.due<=t;});}
function newItems(){return itemsAll().filter(it=>!S.srs[it.key]);}
function dueCount(){const r=dueReviews().length;const n=Math.min(newItems().length,S.settings.newPerDay);return{rev:r,neu:n,total:r+n};}

/* ---------- SRS ---------- */
function schedule(key,g){ // g:0 again,1 hard,2 good,3 easy
  const t=today();
  let s=S.srs[key]||{ease:2.5,int:0,reps:0,ok:0,ng:0,seen:0};
  if(g===0){ s.reps=0;s.int=0;s.ease=clamp(s.ease-0.2,1.3,2.8);s.due=t;s.ng=(s.ng||0)+1; }
  else{
    if(s.reps===0) s.int=(g===3?2:1);
    else if(s.reps===1) s.int=(g===1?2:g===2?4:6);
    else{const m=g===1?1.2:(g===2?s.ease:s.ease*1.3);s.int=Math.max(1,Math.round(s.int*m));}
    s.ease=clamp(s.ease+(g===1?-0.15:g===3?0.15:0),1.3,2.8);
    s.reps++;s.due=addDays(t,s.int);s.ok=(s.ok||0)+1;
  }
  s.seen=(s.seen||0)+1;s.last=t;S.srs[key]=s;
  // stats + streak
  if(S.stats.last!==t){
    if(S.stats.last && addDays(S.stats.last,1)===t) S.stats.streak=(S.stats.streak||0)+1;
    else S.stats.streak=1;
    S.stats.last=t;S.stats.best=Math.max(S.stats.best||0,S.stats.streak);
  }
  S.stats.history[t]=(S.stats.history[t]||0)+1;
  S.stats.reviews=(S.stats.reviews||0)+1;
  save();refreshChrome();
}

afterRender.vocab=function(){
  $("#app").querySelectorAll('[data-group]').forEach(g=>{
    g.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b||b.disabled)return;
      const grp=g.dataset.group;const v=b.dataset.v;
      vocabCfg[grp]=(grp==="amount"&&v!=="all")?parseInt(v):v;
      if(grp==="dir")S.settings.dir=v,save();
      render();});
  });
};
function pickVocab(){
  let list;
  if(vocabCfg.filter==="today"){ list=dueReviews().filter(i=>i.type==="vocab").concat(newItems().filter(i=>i.type==="vocab").slice(0,S.settings.newPerDay)).map(i=>i.data); }
  else if(vocabCfg.filter==="new"){ list=newItems().filter(i=>i.type==="vocab").map(i=>i.data); }
  else if(vocabCfg.filter==="star"){ list=vocabAll().filter(v=>S.star["v:"+v.id]); }
  else if(vocabCfg.filter==="mine"){ list=S.userVocab.filter(v=>!S.hidden["v:"+v.id]); }
  else list=vocabAll();
  list=shuffle(list);
  if(vocabCfg.amount!=="all") list=list.slice(0,vocabCfg.amount);
  return list;
}

}

/* ---------- SESSION ENGINE ---------- */
let sess=null;
function rubyOf(v){ // furigana word
  if(v.reading && v.reading!==v.jp) return `<ruby>${esc(v.jp)}<rt>${esc(v.reading)}</rt></ruby>`;
  return esc(v.jp);
}
function startSession(items,mode,dir){
  if(!items||!items.length){toast("No hay tarjetas para esa selección");return;}
  sess={queue:items.map((it,i)=>({...it,_i:i})),pos:0,mode,dir:dir||"jp2es",total:items.length,
        done:0,correct:0,revealed:false,answered:false};
  document.body.style.overflow="hidden";
  paintSession();
}
function endSession(){
  const acc=sess.done?Math.round(sess.correct/sess.done*100):0;
  const total=sess.done;const wrap=document.createElement("div");
  wrap.className="sess";wrap.id="sessOverlay";
  wrap.innerHTML=`<div class="wrap" style="display:flex;flex-direction:column;height:100%">
    <div class="sesshead"><button class="x" data-act="closeSess">✕</button><div class="sprog"><i style="width:100%"></i></div><span class="smeta">Fin</span></div>
    <div class="sbody"><div class="card summary">
      <div class="big">${total}</div><div class="lab">tarjetas repasadas</div>
      <div class="statline" style="margin-top:22px">
        <div class="stat"><b>${acc}%</b><span>aciertos</span></div>
        <div class="stat"><b>${S.stats.streak||0}</b><span>racha</span></div>
        <div class="stat"><b>${dueCount().total}</b><span>quedan hoy</span></div>
      </div>
      <div style="margin-top:24px" class="row">
        <button class="btn ghost" data-act="closeSess">Terminar</button>
        <button class="btn" data-act="againSess">Seguir estudiando</button>
      </div>
    </div></div></div>`;
  mountOverlay(wrap);
}
function mountOverlay(el){const old=$("#sessOverlay");if(old)old.remove();document.body.appendChild(el);}
function closeSession(){const o=$("#sessOverlay");if(o)o.remove();document.body.style.overflow="";sess=null;render();refreshChrome();}
function paintSession(){
  if(sess.pos>=sess.queue.length){endSession();return;}
  const it=sess.queue[sess.pos];sess.revealed=false;sess.answered=false;
  const el=document.createElement("div");el.className="sess";el.id="sessOverlay";
  el.innerHTML=`<div class="wrap" style="display:flex;flex-direction:column;height:100%">
    <div class="sesshead">
      <button class="x" data-act="closeSess" aria-label="Cerrar">✕</button>
      <div class="sprog"><i style="width:${Math.round(sess.pos/sess.total*100)}%"></i></div>
      <span class="smeta">${sess.pos+1} / ${sess.total}</span>
    </div>
    <div class="sbody"><div id="qhost"></div></div>
  </div>`;
  mountOverlay(el);
  renderCard(it);
}
function starBtn(key){return `<button class="iconbtn" data-act="star" data-key="${key}" title="Favorita" style="margin-left:auto">${S.star[key]?"★":"☆"}</button>`;}
function renderCard(it){
  const host=$("#qhost");if(!host)return;
  if(it.type==="vocab") renderVocabCard(host,it);
  else renderGrammarCard(host,it);
}
/* vocab card by mode */
function renderVocabCard(host,it){
  const v=it.data;const dir=sess.mode==="type"?"jp2es":sess.dir;
  if(sess.mode==="mcq"){
    const pool=vocabAll();
    const correct = dir==="jp2es"? v.es : v.jp;
    const distr = sample(pool.filter(x=>x.id!==v.id && (dir==="jp2es"?x.es:x.jp)),3).map(x=>dir==="jp2es"?x.es:x.jp);
    const opts=shuffle([correct,...distr]);
    const promptHtml = dir==="jp2es"? `<div class="big jp">${rubyOf(v)}</div>` : `<div class="big">${esc(v.es)}</div>`;
    host.innerHTML=`<div class="qcard">
      <span class="qtag">Vocabulario · opción múltiple</span>
      <div class="front" style="min-height:120px">${promptHtml}</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt ${dir==='jp2es'?'':'jp'}" data-opt="${esc(o)}" data-correct="${o===correct}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span><span class="mk"></span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>`;
    host.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(sess.answered)return;sess.answered=true;
      const ok=b.dataset.correct==="true";
      host.querySelectorAll(".opt").forEach(x=>{x.style.pointerEvents="none";
        if(x.dataset.correct==="true"){x.classList.add("correct");x.querySelector(".mk").textContent="✓";}
        else if(x===b){x.classList.add("wrong");x.querySelector(".mk").textContent="✗";}});
      const extra = dir==="jp2es"? `<div class="reveal"><div class="ex jp">${esc(v.exJp)}<span class="tr">${esc(v.exEs)}</span></div></div>` : `<div class="reveal"><div class="mean jp">${rubyOf(v)}</div></div>`;
      $("#fb").innerHTML=extra+gradeBar(it,ok);
      bindGrades(it);
    }));
    return;
  }
  if(sess.mode==="type"){
    const answer=(v.reading&&v.reading!==v.jp)?v.reading:v.jp;
    host.innerHTML=`<div class="qcard">
      <span class="qtag">Vocabulario · escribir lectura</span>
      <div class="front" style="min-height:120px"><div class="big jp">${esc(v.jp)}</div><div class="sub">Escribe la lectura en hiragana</div></div>
      <input class="typein jp" id="typein" inputmode="kana" autocomplete="off" autocapitalize="off" placeholder="ひらがな">
      <div style="margin-top:14px"><button class="btn" data-act="checkType">Comprobar</button></div>
      <div id="fb"></div>
    </div>`;
    const inp=$("#typein");setTimeout(()=>inp&&inp.focus(),60);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doCheckType(it,answer);}});
    host._answer=answer;host._it=it;
    return;
  }
  // flip
  const front = sess.dir==="jp2es"? `<div class="big jp">${rubyOf(v)}</div>` : `<div class="big">${esc(v.es)}</div>`;
  host.innerHTML=`<div class="qcard">
    <span class="qtag">Vocabulario · tarjeta ${starBtn(it.key)}</span>
    <div class="front">${front}<div class="sub">Toca para ver la respuesta</div></div>
    <div id="back"></div>
    <div class="sfoot" id="foot"><button class="btn" data-act="flip">Mostrar respuesta</button></div>
  </div>`;
  const flip=()=>{
    if(sess.revealed)return;sess.revealed=true;
    const back = sess.dir==="jp2es"
      ? `<div class="reveal"><div class="mean">${esc(v.es)}</div>${v.exJp?`<div class="ex jp">${esc(v.exJp)}<span class="tr">${esc(v.exEs)}</span></div>`:""}</div>`
      : `<div class="reveal"><div class="mean jp">${rubyOf(v)}</div>${v.exJp?`<div class="ex jp">${esc(v.exJp)}<span class="tr">${esc(v.exEs)}</span></div>`:""}</div>`;
    $("#back").innerHTML=back;$("#foot").innerHTML=gradeBar(it,null);bindGrades(it);
  };
  host.querySelector(".front").addEventListener("click",flip);
  host.querySelector('[data-act="flip"]').addEventListener("click",flip);
}
function doCheckType(it,answer){
  if(sess.answered)return;const inp=$("#typein");if(!inp)return;
  const norm=s=>String(s).trim().replace(/\s/g,"").replace(/。|、/g,"");
  const ok=norm(inp.value)===norm(answer) || norm(inp.value)===norm(it.data.jp);
  sess.answered=true;inp.disabled=true;
  inp.style.borderColor=ok?"var(--good)":"var(--bad)";
  const v=it.data;
  $("#fb").innerHTML=`<div class="reveal"><div class="mean jp">${rubyOf(v)} <span style="color:${ok?'var(--good)':'var(--bad)'};font-size:15px">${ok?"correcto":"lectura: "+esc(answer)}</span></div><div class="ex" style="font-family:inherit">${esc(v.es)}</div>${v.exJp?`<div class="ex jp">${esc(v.exJp)}<span class="tr">${esc(v.exEs)}</span></div>`:""}</div>`+gradeBar(it,ok);
  bindGrades(it);
}
/* grammar card */
function renderGrammarCard(host,it){
  const q=it.data;const T=allTopics();const c=T[q.topic]||{};
  const opts=q._shuf||(q._shuf=shuffle(q.options.map((o,i)=>({o,i}))));
  const promptHtml=esc(q.prompt).replace(/【[\s　]*】|【[　\s]+】|___+/g,'<span style="border-bottom:2px solid var(--indigo);padding:0 26px"></span>');
  host.innerHTML=`<div class="qcard">
    <span class="qtag"><span class="dot" style="background:${c.color||'var(--muted)'}"></span>${esc(c.short||"Gramática")} · <span class="jp">${esc(c.label||q.topic)}</span></span>
    <div class="prompt jp">${promptHtml}</div>
    <div class="opts">${opts.map((it2,idx)=>`<button class="opt jp" data-idx="${it2.i}"><span class="k">${"ABCD"[idx]}</span><span>${esc(it2.o)}</span><span class="mk"></span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  host.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(sess.answered)return;sess.answered=true;
    const idx=parseInt(b.dataset.idx);const ok=q.answers.includes(idx);
    host.querySelectorAll(".opt").forEach(x=>{x.style.pointerEvents="none";const xi=parseInt(x.dataset.idx);
      if(q.answers.includes(xi)){x.classList.add("correct");x.querySelector(".mk").textContent="✓";}
      else if(x===b){x.classList.add("wrong");x.querySelector(".mk").textContent="✗";}});
    let fb="";
    if(gramCfg.feedback!==false){
      const alt=q.answers.length>1?`<div style="color:var(--muted);margin-top:6px;font-size:13px">Respuestas válidas: ${q.answers.map(i=>esc(q.options[i])).join(" / ")}</div>`:"";
      fb=`<div class="expl">${esc(q.explanation||"")}${alt}</div>`;
    }
    $("#fb").innerHTML=fb+gradeBar(it,ok);bindGrades(it);
  }));
}
/* grading */
function gradeBar(it,known){
  if(known===false) return `<div class="grades"><button class="grade again" data-g="0" style="grid-column:1/-1">Otra vez<small>volver a verla hoy</small></button></div>`;
  if(known===true) return `<div class="grades">
     <button class="grade hard" data-g="1">Difícil<small>pronto</small></button>
     <button class="grade good" data-g="2">Bien<small>normal</small></button>
     <button class="grade easy" data-g="3">Fácil<small>más tarde</small></button></div>`;
  return `<div class="grades">
     <button class="grade again" data-g="0">Otra vez<small>&lt;1d</small></button>
     <button class="grade hard" data-g="1">Difícil<small>corto</small></button>
     <button class="grade good" data-g="2">Bien<small>ok</small></button>
     <button class="grade easy" data-g="3">Fácil<small>largo</small></button></div>`;
}
function bindGrades(it){
  const host=$("#qhost");if(!host)return;
  host.querySelectorAll(".grade").forEach(b=>b.addEventListener("click",()=>{
    const g=parseInt(b.dataset.g);
    schedule(it.key,g);
    sess.done++;if(g>0)sess.correct++;
    if(g===0){const clone={...it};delete clone._shuf;sess.queue.push(clone);} // repeat today
    sess.pos++;paintSession();
  }));
}

/* ---------- ADD / MANAGE ---------- */
let addSub="vocab";
let gForm={options:["",""],correct:new Set(),topic:"__new"};
views.add=function(){
  const T=allTopics();const tkeys=Object.keys(T);
  const seg=`<div class="subtabs">
    ${[["vocab","Vocabulario"],["grammar","Gramática"],["theory","Teoría"],["manage","Gestionar"]].map(s=>`<button class="subtab" aria-selected="${addSub===s[0]}" data-asub="${s[0]}">${s[1]}</button>`).join("")}</div>`;
  if(addSub==="vocab") return seg+`
    <div class="field"><label>Palabra japonesa (kanji o kana)</label><input class="inp jp" id="f_jp" placeholder="例：勉強する"></div>
    <div class="field"><label>Lectura en hiragana (opcional)</label><input class="inp jp" id="f_read" placeholder="べんきょうする"></div>
    <div class="field"><label>Significado en español</label><input class="inp" id="f_es" placeholder="estudiar"></div>
    <div class="field"><label>Ejemplo en japonés (opcional)</label><input class="inp jp" id="f_exjp" placeholder="毎日日本語を勉強します。"></div>
    <div class="field"><label>Traducción del ejemplo (opcional)</label><input class="inp" id="f_exes" placeholder="Estudio japonés todos los días."></div>
    <div style="margin-top:18px"><button class="btn big" data-act="saveVocab">Guardar palabra</button></div>`;
  if(addSub==="grammar"){
    if(gForm.topic==="__new"&&tkeys.length&&!gForm._init){gForm.topic=tkeys[0];gForm._init=1;}
    return seg+`
    <div class="field"><label>Tema</label>
      <select class="inp" id="f_topic">${tkeys.map(k=>`<option value="${k}" ${gForm.topic===k?"selected":""}>${esc((T[k].short||k))} — ${esc(T[k].label||"")}</option>`).join("")}
      <option value="__new" ${gForm.topic==="__new"?"selected":""}>+ Crear tema nuevo…</option></select></div>
    <div id="newtopic" class="${gForm.topic==="__new"?"":"hidden"}">
      <div class="field"><label>Nombre del tema (japonés)</label><input class="inp jp" id="f_tlabel" placeholder="〜べき"></div>
      <div class="field"><label>Descripción corta</label><input class="inp" id="f_tshort" placeholder="Obligación y consejo"></div>
    </div>
    <div class="field"><label>Frase (usa ___ donde va el hueco)</label><input class="inp jp" id="f_prompt" placeholder="毎日野菜を___。"></div>
    <div class="field"><label>Opciones (marca la correcta)</label>
      <div id="optlist">${gForm.options.map((o,i)=>optRow(o,i)).join("")}</div>
      <button class="btn line sm" data-act="addOpt" style="margin-top:10px">+ Añadir opción</button></div>
    <div class="field"><label>Explicación</label><textarea class="inp" id="f_expl" placeholder="Por qué esa forma es la correcta…"></textarea></div>
    <div style="margin-top:18px"><button class="btn big" data-act="saveGrammar">Guardar pregunta</button></div>`;
  }
  if(addSub==="theory"){
    return seg+`<p class="hint" style="margin:14px 2px">Elige un tema para escribir o pegar tus reglas.</p>
    <div class="topicgrid">${tkeys.map(k=>{const c=T[k];const has=(S.theory[k]||"").trim().length>0;return `
      <button class="listitem" style="width:100%;cursor:pointer" data-act="editTheory" data-topic="${k}">
        <span class="txt"><span class="jpw jp">${esc(c.label||k)}</span><span class="es">${esc(c.short||"")}</span></span>
        <span class="iconbtn">${has?"Editar":"Añadir"}</span></button>`;}).join("")}</div>`;
  }
  // manage
  const mine=S.userVocab.filter(v=>!S.hidden["v:"+v.id]);
  const mineG=S.userGrammar.filter(q=>!S.hidden["g:"+q.id]);
  const hiddenKeys=Object.keys(S.hidden).filter(k=>S.hidden[k]);
  return seg+`
    <h2 class="sec">Mis palabras (${mine.length})</h2>
    ${mine.length?mine.map(v=>`<div class="listitem"><div class="txt"><div class="jpw jp">${esc(v.jp)}${v.reading?` <span style="font-weight:500;color:var(--muted);font-size:13px">${esc(v.reading)}</span>`:""}</div><div class="es">${esc(v.es)}</div></div>
      <div class="acts"><button class="iconbtn danger" data-act="delVocab" data-id="${v.id}">Borrar</button></div></div>`).join(""):`<p class="empty">Aún no has añadido palabras.</p>`}
    <h2 class="sec">Mis preguntas de gramática (${mineG.length})</h2>
    ${mineG.length?mineG.map(q=>`<div class="listitem"><div class="txt"><div class="jpw jp" style="font-size:14px;font-weight:600">${esc(q.prompt)}</div><div class="es">${esc((allTopics()[q.topic]||{}).short||q.topic)}</div></div>
      <div class="acts"><button class="iconbtn danger" data-act="delGrammar" data-id="${q.id}">Borrar</button></div></div>`).join(""):`<p class="empty">Aún no has añadido preguntas.</p>`}
    <h2 class="sec">Ocultas (${hiddenKeys.length})</h2>
    ${hiddenKeys.length?hiddenKeys.map(k=>`<div class="listitem"><div class="txt"><div class="es">${esc(k)}</div></div><div class="acts"><button class="iconbtn" data-act="unhide" data-key="${k}">Restaurar</button></div></div>`).join(""):`<p class="empty">Nada oculto.</p>`}`;
};
function optRow(val,i){return `<div class="optedit" data-i="${i}">
   <label class="mark"><input type="radio" name="corr" ${gForm.correct.has(i)?"checked":""} data-corr="${i}"> correcta</label>
   <input type="text" class="inp jp" data-opt="${i}" value="${esc(val)}" placeholder="opción ${i+1}">
   <button class="rm" data-act="rmOpt" data-i="${i}">✕</button></div>`;}
afterRender.add=function(){
  $("#app").querySelectorAll("[data-asub]").forEach(b=>b.addEventListener("click",()=>{addSub=b.dataset.asub;render();}));
  const sel=$("#f_topic");if(sel)sel.addEventListener("change",()=>{gForm.topic=sel.value;$("#newtopic").classList.toggle("hidden",sel.value!=="__new");});
  // keep option text synced
  const ol=$("#optlist");
  if(ol){
    ol.addEventListener("input",e=>{const t=e.target;if(t.dataset.opt!=null)gForm.options[+t.dataset.opt]=t.value;});
    ol.addEventListener("change",e=>{const t=e.target;if(t.dataset.corr!=null){gForm.correct=new Set([+t.dataset.corr]);}});
  }
};

/* ---------- STATS / SETTINGS ---------- */
views.stats=function(){
  const t=today();const hist=S.stats.history;
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(t,-i));
  const max=Math.max(1,...days.map(d=>hist[d]||0));
  const learned=Object.values(S.srs).filter(s=>s.reps>=1).length;
  const tomorrow=addDays(t,1);
  const dueTom=itemsAll().filter(it=>{const s=S.srs[it.key];return s&&s.due===tomorrow;}).length;
  const wd=["D","L","M","M","J","V","S"];
  return `
  <div class="statline" style="margin-top:8px">
    <div class="stat"><b>${S.stats.reviews||0}</b><span>repasos totales</span></div>
    <div class="stat"><b>${S.stats.streak||0}</b><span>racha actual</span></div>
    <div class="stat"><b>${S.stats.best||0}</b><span>mejor racha</span></div>
  </div>
  <div class="statline">
    <div class="stat"><b>${learned}</b><span>tarjetas aprendidas</span></div>
    <div class="stat"><b>${dueCount().total}</b><span>pendientes hoy</span></div>
    <div class="stat"><b>${dueTom}</b><span>para mañana</span></div>
  </div>
  <h2 class="sec">Últimos 7 días</h2>
  <div class="card pad">
    <div class="spark">${days.map(d=>{const v=hist[d]||0;const h=Math.round(v/max*100);return `<div class="b"><i style="height:${v?Math.max(6,h):0}%"></i></div>`;}).join("")}</div>
    <div class="sparkrow">${days.map(d=>{const dd=new Date(d);return `<div>${wd[dd.getDay()]}<div style="color:var(--ink);font-weight:700;font-size:12px">${hist[d]||0}</div></div>`;}).join("")}</div>
  </div>
  <h2 class="sec">Ajustes de estudio</h2>
  <div class="card pad">
    <div class="field" style="margin-top:0"><label>Meta diaria de repasos</label><input class="inp" id="s_goal" type="number" min="5" max="200" value="${S.settings.dailyGoal}"></div>
    <div class="field"><label>Palabras nuevas por día</label><input class="inp" id="s_new" type="number" min="0" max="100" value="${S.settings.newPerDay}"></div>
    <div style="margin-top:14px"><button class="btn" data-act="saveSettings">Guardar ajustes</button></div>
  </div>
  <h2 class="sec">Copia de seguridad</h2>
  <div class="card pad">
    <p class="hint" style="margin-top:0">Tus datos viven solo en este teléfono. Exporta una copia para no perderla o para pasarla a otro dispositivo.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn line" data-act="export">Exportar copia</button>
      <button class="btn line" data-act="importBtn">Importar copia</button>
    </div>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </div>
  <h2 class="sec">Zona de riesgo</h2>
  <div class="card pad">
    <div class="row">
      <button class="btn line" data-act="resetSrs" style="border-color:#e3c79b;color:var(--warn)">Reiniciar progreso</button>
      <button class="btn line danger" data-act="wipe" style="border-color:#e5b4af;color:var(--bad)">Borrar todo</button>
    </div>
    <p class="hint">“Reiniciar progreso” borra el repaso espaciado pero conserva tu vocabulario y gramática. “Borrar todo” elimina absolutamente todo.</p>
  </div>
  <p class="empty" style="padding:22px 10px 4px">語 · app personal de estudio · v1</p>`;
};
afterRender.stats=function(){
  const f=$("#importFile");
  if(f)f.addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();
    r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj!=="object")throw 0;
      S=Object.assign(structuredClone(DEFAULT),obj);
      for(const k in DEFAULT)if(S[k]==null)S[k]=structuredClone(DEFAULT[k]);
      save();toast("Copia importada");go("home");}catch(err){toast("Archivo no válido");}};
    r.readAsText(file);});
};

/* ---------- global actions ---------- */
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest(".navb");if(b)go(b.dataset.nav);});
document.body.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  switch(act){
    case "studyToday":{const r=dueReviews();const n=newItems().slice(0,S.settings.newPerDay);
      const items=shuffle(r.concat(n));if(!items.length){toast("Nada pendiente. ¡Bien!");break;}
      // vocab -> flip, grammar -> its mcq; mixed handled per-card by type
      startSession(items,"flip",S.settings.dir);break;}
    case "studyAhead":{const items=shuffle(itemsAll()).slice(0,20);startSession(items,"flip",S.settings.dir);break;}
    case "quick-vocab":{const items=shuffle(vocabAll()).slice(0,20).map(v=>({key:"v:"+v.id,type:"vocab",data:v}));startSession(items,"flip",S.settings.dir);break;}
    case "quick-grammar":{go("grammar");break;}
    case "quick-new":{const items=newItems().filter(i=>i.type==="vocab").slice(0,10);if(!items.length){toast("No quedan palabras nuevas");break;}startSession(items,"flip",S.settings.dir);break;}
    case "quick-type":{const items=shuffle(vocabAll().filter(v=>v.reading&&v.reading!==v.jp)).slice(0,15).map(v=>({key:"v:"+v.id,type:"vocab",data:v}));startSession(items,"type","jp2es");break;}
    case "startVocab":{const list=pickVocab().map(v=>({key:"v:"+v.id,type:"vocab",data:v}));startSession(list,vocabCfg.mode,vocabCfg.dir);break;}
    case "startGrammar":{if(!gramCfg.topics.size){toast("Elige al menos un tema");break;}const list=pickGrammar().map(q=>({key:"g:"+q.id,type:"grammar",data:q}));startSession(list,"mcq");break;}
    case "gTopAll":{const keys=Object.keys(allTopics());gramCfg.topics=(gramCfg.topics.size===keys.length)?new Set():new Set(keys);render();break;}
    case "toggleFb":{gramCfg.feedback=!gramCfg.feedback;render();break;}
    case "closeSess":closeSession();break;
    case "againSess":{closeSessionSilent();
      if(currentNav==="grammar"){const list=pickGrammar().map(q=>({key:"g:"+q.id,type:"grammar",data:q}));startSession(list,"mcq");}
      else{const list=pickVocab().map(v=>({key:"v:"+v.id,type:"vocab",data:v}));startSession(list,vocabCfg.mode,vocabCfg.dir);}break;}
    case "flip":break;
    case "checkType":{const host=$("#qhost");doCheckType(host._it,host._answer);break;}
    case "star":{const k=a.dataset.key;if(S.star[k])delete S.star[k];else S.star[k]=1;save();a.textContent=S.star[k]?"★":"☆";break;}
    case "saveVocab":saveVocab();break;
    case "addOpt":{gForm.options.push("");render();break;}
    case "rmOpt":{const i=+a.dataset.i;gForm.options.splice(i,1);const ns=new Set();gForm.correct.forEach(c=>{if(c<i)ns.add(c);else if(c>i)ns.add(c-1);});gForm.correct=ns;render();break;}
    case "saveGrammar":saveGrammar();break;
    case "editTheory":openTheory(a.dataset.topic);break;
    case "delVocab":{if(confirm("¿Borrar esta palabra?")){S.userVocab=S.userVocab.filter(v=>v.id!==a.dataset.id);delete S.srs["v:"+a.dataset.id];save();render();toast("Palabra borrada");}break;}
    case "delGrammar":{if(confirm("¿Borrar esta pregunta?")){S.userGrammar=S.userGrammar.filter(q=>q.id!==a.dataset.id);delete S.srs["g:"+a.dataset.id];save();render();toast("Pregunta borrada");}break;}
    case "unhide":{delete S.hidden[a.dataset.key];save();render();break;}
    case "saveSettings":{const g=parseInt($("#s_goal").value)||20;const n=parseInt($("#s_new").value);S.settings.dailyGoal=clamp(g,1,500);S.settings.newPerDay=clamp(isNaN(n)?15:n,0,200);save();toast("Ajustes guardados");go("home");break;}
    case "export":doExport();break;
    case "importBtn":$("#importFile").click();break;
    case "resetSrs":{if(confirm("¿Reiniciar todo el progreso de repaso? Tu vocabulario y gramática se conservan.")){S.srs={};S.stats={streak:0,best:0,last:null,reviews:0,history:{}};save();toast("Progreso reiniciado");go("home");}break;}
    case "wipe":{if(confirm("Esto borra TODO (progreso, palabras y gramática que añadiste). ¿Seguro?")){localStorage.removeItem(KEY);S=structuredClone(DEFAULT);save();toast("Todo borrado");go("home");}break;}
  }
});
function closeSessionSilent(){const o=$("#sessOverlay");if(o)o.remove();sess=null;}

function saveVocab(){
  const jp=$("#f_jp").value.trim();const es=$("#f_es").value.trim();
  if(!jp||!es){toast("Escribe al menos la palabra y su significado");return;}
  const v={id:"u"+Date.now(),jp,reading:$("#f_read").value.trim(),es,exJp:$("#f_exjp").value.trim(),exEs:$("#f_exes").value.trim()};
  S.userVocab.push(v);save();toast("Palabra añadida");
  ["f_jp","f_read","f_es","f_exjp","f_exes"].forEach(id=>{const el=$("#"+id);if(el)el.value="";});
  $("#f_jp").focus();
}
function saveGrammar(){
  let topic=$("#f_topic").value;
  const prompt=$("#f_prompt").value.trim();
  const opts=gForm.options.map(o=>o.trim()).filter(Boolean);
  if(topic==="__new"){
    const lab=$("#f_tlabel").value.trim();const sh=$("#f_tshort").value.trim();
    if(!lab){toast("Ponle nombre al tema nuevo");return;}
    topic="u"+Date.now().toString(36);
    const palette=["#4f46e5","#0f766e","#c2410c","#be123c","#7c3aed","#0891b2","#b45309","#15803d"];
    S.userTopics[topic]={label:lab,short:sh||lab,color:palette[Object.keys(S.userTopics).length%palette.length]};
  }
  if(!prompt){toast("Escribe la frase");return;}
  if(opts.length<2){toast("Añade al menos dos opciones");return;}
  // recompute correct index against filtered opts
  const correctVals=[...gForm.correct].map(i=>gForm.options[i]).filter(v=>v&&v.trim());
  const answers=opts.map((o,i)=>correctVals.includes(o)?i:-1).filter(i=>i>=0);
  if(!answers.length){toast("Marca la opción correcta");return;}
  const q={id:"u"+Date.now(),topic,prompt:prompt.replace(/___+/g,"【　　　】"),options:opts,answers,explanation:$("#f_expl").value.trim(),source:"añadido por mí"};
  S.userGrammar.push(q);save();toast("Pregunta añadida");
  gForm={options:["",""],correct:new Set(),topic:topic,_init:1};
  render();
}
function openTheory(k){
  const T=allTopics();const c=T[k]||{};
  const el=document.createElement("div");el.className="sess";el.id="sessOverlay";
  el.innerHTML=`<div class="wrap" style="display:flex;flex-direction:column;height:100%">
    <div class="sesshead"><button class="x" data-act="closeSess">✕</button>
      <div style="flex:1;font-weight:800" class="jp">${esc(c.label||k)}</div></div>
    <div class="sbody">
      <p class="hint" style="margin:0 2px 8px">${esc(c.short||"")}</p>
      <textarea class="inp jp" id="theoryText" style="min-height:52vh">${esc(S.theory[k]||"")}</textarea>
      <div class="row" style="margin-top:14px">
        <button class="btn ghost" data-act="closeSess">Cerrar</button>
        <button class="btn" id="saveTheory">Guardar notas</button>
      </div>
    </div></div>`;
  document.body.appendChild(el);document.body.style.overflow="hidden";
  $("#saveTheory").addEventListener("click",()=>{S.theory[k]=$("#theoryText").value;save();toast("Notas guardadas");closeSession();});
}
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="japones-copia-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Copia descargada");
}

refreshChrome();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
